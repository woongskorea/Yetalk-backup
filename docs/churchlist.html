<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width,initial-scale=1.0,viewport-fit=cover">

    <meta
            name="theme-color"
            content="#ffffff">

    <title>우리교회 | 예톡</title>


    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;
        }

        body{
            min-width:320px;
            min-height:100vh;
            background:#edf3fb;
            color:#222;
        }

        button,
        input{
            font:inherit;
        }

        button{
            border:0;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
        }

        .hidden{
            display:none!important;
        }



        /*==================================================
        HEADER
        ==================================================*/

        .header{

            position:sticky;
            top:0;
            z-index:100;

            display:grid;
            grid-template-columns:40px 1fr 40px;

            align-items:center;

            height:55px;

            padding:0 10px;

            background:#fff;

            border-bottom:1px solid #e4eaee;

            box-shadow:0 2px 7px rgba(0,0,0,.06);

        }

        .back,
        .home{

            display:flex;
            align-items:center;
            justify-content:center;

            width:36px;
            height:36px;

            border:1px solid #dfe5e9;
            border-radius:50%;

            background:#fff;

            box-shadow:0 2px 5px rgba(0,0,0,.06);

        }

        .back{
            color:#18354d;
            font-size:21px;
            font-weight:900;
        }

        .home{
            font-size:19px;
        }

        .back:active,
        .home:active{
            transform:scale(.96);
            background:#f1f5f7;
        }

        .title{

            overflow:hidden;

            color:#168645;

            font-size:18px;
            font-weight:950;

            letter-spacing:-.5px;

            text-align:center;
            text-overflow:ellipsis;
            white-space:nowrap;

        }



        /*==================================================
        PAGE CONTAINER
        ==================================================*/

        .container{

            width:100%;
            max-width:700px;

            margin:auto;

            padding:
                12px
                10px
                calc(80px + env(safe-area-inset-bottom));

        }



        /*==================================================
        TOP 2 TABS
        ==================================================*/

        .mode-tabs{

            display:grid;
            grid-template-columns:1fr 1fr;

            gap:6px;

            margin-bottom:13px;
            padding:4px;

            border:1px solid #dbe4ea;
            border-radius:15px;

            background:#fff;

            box-shadow:0 3px 9px rgba(20,45,70,.05);

        }

        .mode-tab{

            height:46px;

            border-radius:11px;

            background:#f2f5f7;
            color:#65727a;

            font-size:15px;
            font-weight:950;

        }

        .mode-tab.active{

            background:#168645;
            color:#fff;

            box-shadow:0 3px 8px rgba(20,134,61,.20);

        }

        .mode-tab.invite-tab.active{
            background:#d97706;
            color:#fff;
            box-shadow:0 3px 8px rgba(217,119,6,.20);
        }



        /*==================================================
        NO MAIN CHURCH
        ==================================================*/

        .no-church-card{

            margin-bottom:12px;
            padding:16px 14px;

            border:1px solid #d8e8dd;
            border-radius:17px;

            background:#fff;

            text-align:center;

            box-shadow:0 3px 10px rgba(0,0,0,.05);

        }

        .no-church-title{

            color:#25372b;

            font-size:20px;
            font-weight:950;

            letter-spacing:-.5px;

        }

        .no-church-text{

            margin-top:5px;

            color:#65746a;

            font-size:14px;
            font-weight:800;

        }



        /*==================================================
        PRIMARY CHURCH (대표 본교회 카드)
        ==================================================*/

        .my-church-card{

            position:relative;
            overflow:hidden;

            min-height:112px;

            margin-bottom:14px;
            padding:17px 18px;

            border:1.5px solid #a3d9b4;
            border-radius:18px;

            background:
                linear-gradient(
                    135deg,
                    #f0fcf3,
                    #ffffff 65%,
                    #e8f8ed
                );

            box-shadow:0 6px 16px rgba(38,87,51,.12);

            cursor:pointer;

        }

        .my-church-card::after{

            content:"⛪";

            position:absolute;

            right:16px;
            top:14px;

            font-size:48px;

            opacity:.10;

            pointer-events:none;

        }

        .my-church-label{

            color:#168645;

            font-size:13.5px;
            font-weight:950;

        }

        .my-church-name{

            margin-top:5px;

            color:#163a23;

            font-size:23px;
            font-weight:950;

            letter-spacing:-.6px;

        }

        .my-church-address{

            margin-top:4px;

            color:#6b7770;

            font-size:13.5px;
            font-weight:750;

        }

        .my-church-bottom{

            display:flex;

            align-items:center;
            justify-content:space-between;

            gap:10px;

            margin-top:10px;

        }

        .my-church-role{

            display:inline-flex;
            align-items:center;

            min-height:26px;

            padding:4px 10px;

            border-radius:999px;

            background:#e3f5e9;
            color:#168645;

            font-size:11.5px;
            font-weight:900;

        }

        .my-church-go{

            color:#168645;

            font-size:13.5px;
            font-weight:950;

        }



        /*==================================================
        SECTION TITLE
        ==================================================*/

        .section-title{

            display:flex;

            align-items:center;
            justify-content:space-between;

            gap:8px;

            margin:14px 4px 8px;

        }

        .section-title strong{

            font-size:17px;
            font-weight:950;
            color:#2d3748;

        }

        .count{

            color:#89929a;

            font-size:13px;
            font-weight:850;

        }



        /*==================================================
        OTHER JOINED CHURCHES
        ==================================================*/

        .joined-list{

            display:flex;
            flex-direction:column;

            gap:8px;

            margin-bottom:12px;

        }

        .joined-card{

            display:flex;

            align-items:center;

            gap:10px;

            padding:12px 14px;

            border-radius:15px;

            border:1px solid #e2e8f0;

            background:#fff;

            box-shadow:0 2px 7px rgba(0,0,0,.05);

            cursor:pointer;

        }

        .joined-card:active{
            transform:scale(.99);
        }

        .star-btn{

            display:flex;

            align-items:center;
            justify-content:center;

            flex:0 0 auto;

            width:38px;
            height:38px;

            border-radius:50%;

            background:#f1f5f9;

            font-size:20px;

        }

        .joined-info{

            flex:1;
            min-width:0;

        }

        .joined-name{

            overflow:hidden;

            color:#1e293b;

            font-size:16.5px;
            font-weight:950;

            text-overflow:ellipsis;
            white-space:nowrap;

        }

        .joined-address{

            overflow:hidden;

            margin-top:2px;

            color:#64748b;

            font-size:12px;

            text-overflow:ellipsis;
            white-space:nowrap;

        }

        .badge{

            display:inline-block;

            margin-top:4px;

            padding:2px 7px;

            border-radius:999px;

            background:#f1f5f9;
            color:#475569;

            font-size:10.5px;
            font-weight:900;

        }

        .badge.owner{

            background:#ffe4e6;
            color:#e11d48;

        }

        .arrow{

            color:#94a3b8;

            font-size:22px;

        }



        /*==================================================
        SEARCH & CREATE ACTION BUTTONS
        ==================================================*/

        .church-actions{

            display:grid;
            grid-template-columns:1fr 1fr;

            gap:8px;

            margin-top:10px;
            margin-bottom:14px;

        }

        .action-toggle-btn{

            display:flex;

            align-items:center;
            justify-content:center;

            min-height:50px;

            border:1px solid #cbd5e1;

            border-radius:14px;

            background:#fff;
            color:#334155;

            font-size:15px;
            font-weight:900;

            box-shadow:0 2px 6px rgba(0,0,0,.04);

        }

        .action-toggle-btn.active{

            border-color:#168645;
            background:#f0fdf4;
            color:#168645;

        }



        /*==================================================
        SEARCH PANEL
        ==================================================*/

        .search-panel{

            margin-bottom:14px;
            padding:15px;

            border:1px solid #d1fae5;
            border-radius:18px;

            background:#fff;

            box-shadow:0 4px 12px rgba(22,134,69,.06);

        }

        .search-panel-title{

            color:#166534;

            font-size:17px;
            font-weight:950;

        }

        .search-box{

            display:flex;

            gap:7px;

            margin-top:10px;

        }

        .search-input{

            flex:1;
            min-width:0;

            height:48px;

            padding:0 13px;

            border:1.5px solid #cbd5e1;
            border-radius:12px;

            background:#fff;

            font-size:15px;

            outline:none;

        }

        .search-input:focus{

            border-color:#168645;

        }

        .search-btn{

            flex:0 0 74px;

            height:48px;

            border-radius:12px;

            background:#168645;
            color:#fff;

            font-size:15px;
            font-weight:950;

        }

        .list{

            display:flex;
            flex-direction:column;

            gap:8px;

            margin-top:10px;

        }

        .card{

            display:flex;

            align-items:center;

            gap:10px;

            padding:12px;

            border:1px solid #edf0f2;
            border-radius:14px;

            background:#fff;

            cursor:pointer;

        }

        .search-empty{

            margin-top:10px;
            padding:16px;

            border-radius:14px;

            background:#f8fafc;

            color:#64748b;

            font-size:13px;
            font-weight:750;

            text-align:center;

        }



        /*==================================================
        CREATE CHURCH PANEL
        ==================================================*/

        .create-church-card{

            margin-bottom:14px;
            padding:17px 15px;

            border:1px solid #fed7aa;
            border-radius:18px;

            background:#fff;

            box-shadow:0 4px 12px rgba(234,88,12,.06);

        }

        .create-title{

            color:#9a3412;

            font-size:18px;
            font-weight:950;

        }

        .create-form{

            display:flex;
            flex-direction:column;

            gap:9px;

            margin-top:12px;

        }

        .form-field{

            display:flex;
            flex-direction:column;

            gap:4px;

        }

        .form-label{

            color:#475569;

            font-size:14px;
            font-weight:900;

        }

        .form-input{

            width:100%;
            height:47px;

            padding:0 13px;

            border:1.5px solid #cbd5e1;
            border-radius:11px;

            background:#f8fafc;

            font-size:15px;

            outline:none;

        }

        .form-input:focus{

            border-color:#ea580c;
            background:#fff;

        }

        .create-submit-btn{

            width:100%;
            height:52px;

            margin-top:12px;

            border-radius:13px;

            background:#168645;
            color:#fff;

            font-size:16.5px;
            font-weight:950;

        }



        /*==================================================
        INVITE TAB SECTION
        ==================================================*/

        .invite-section-card{

            padding:20px 16px;

            border:1px solid #fde68a;
            border-radius:20px;

            background:
                linear-gradient(
                    135deg,
                    #fffbeb,
                    #ffffff
                );

            box-shadow:0 4px 14px rgba(217,119,6,.08);

        }

        .invite-title{

            color:#92400e;

            font-size:20px;
            font-weight:950;

        }

        .invite-text{

            margin-top:7px;

            color:#78350f;

            font-size:14px;
            font-weight:650;

            line-height:1.6;

        }

        .invite-buttons{

            display:grid;
            grid-template-columns:1fr 1fr;

            gap:8px;

            margin-top:16px;

        }

        .invite-btn{

            min-height:52px;

            border-radius:13px;

            font-size:14.5px;
            font-weight:950;

        }

        .invite-btn.copy{

            border:1.5px solid #cbd5e1;

            background:#fff;
            color:#334155;

        }

        .invite-btn.kakao{

            background:#fee500;
            color:#191919;

        }



        /*==================================================
        POPUP
        ==================================================*/

        .popup{

            display:none;

            position:fixed;

            inset:0;
            z-index:1000;

            align-items:center;
            justify-content:center;

            padding:18px;

            background:rgba(0,0,0,.5);

        }

        .popup.show{
            display:flex;
        }

        .popup-box{

            width:100%;
            max-width:400px;

            padding:22px 18px;

            border-radius:20px;

            background:#fff;

        }

        .popup-title{

            text-align:center;

            font-size:19px;
            font-weight:950;

        }

        .popup-target{

            margin-top:12px;
            padding:12px;

            border-radius:12px;

            background:#f0fdf4;

            text-align:center;

        }

        .popup-target strong{
            font-size:17px;
            color:#166534;
        }

        .popup-buttons{

            display:flex;

            gap:8px;

            margin-top:16px;

        }

        .popup-buttons button{

            flex:1;

            height:46px;

            border-radius:12px;

            font-size:14px;
            font-weight:950;

        }

        .cancel{
            background:#f1f5f9;
            color:#475569;
        }

        .confirm{
            background:#168645;
            color:#fff;
        }



        /*==================================================
        TOAST
        ==================================================*/

        .toast{

            position:fixed;

            left:50%;
            bottom:28px;

            z-index:2000;

            transform:
                translateX(-50%)
                translateY(20px);

            max-width:calc(100% - 40px);

            padding:10px 16px;

            border-radius:999px;

            background:rgba(15,23,42,.92);
            color:#fff;

            font-size:12.5px;
            font-weight:800;

            text-align:center;

            opacity:0;
            pointer-events:none;

            transition:.2s ease;

        }

        .toast.show{

            opacity:1;

            transform:
                translateX(-50%)
                translateY(0);

        }

    </style>

</head>


<body>


<!-- HEADER -->
<header class="header">

    <button id="backBtn" class="back" type="button" aria-label="뒤로가기">←</button>

    <div class="title">우리교회 관리 · 검색</div>

    <button id="homeBtn" class="home" type="button" aria-label="홈으로">🏠</button>

</header>



<main class="container">


    <!-- TOP 2 TABS -->
    <div class="mode-tabs">

        <button id="churchTab" class="mode-tab active" type="button">
            ⛪ 우리교회 검색
        </button>

        <button id="inviteTab" class="mode-tab invite-tab" type="button">
            💬 친구 · 목사님 초청
        </button>

    </div>



    <!--==================================================
    1. 우리교회 검색 & 본교회 화면
    ==================================================-->

    <section id="churchMode">


        <!-- 등록된 본교회 없을 때 -->
        <div id="noChurchCard" class="no-church-card hidden">

            <div class="no-church-title">
                아직 등록된 본 교회가 없습니다.
            </div>

            <div class="no-church-text">
                아래에서 교회를 검색하거나 새로 등록해 주세요.
            </div>

        </div>



        <!-- 1) 대표 본교회 카드 (중복 없이 이것만 크게 표시) -->
        <div id="myChurchCard" class="my-church-card hidden">

            <div id="myChurchLabel" class="my-church-label">
                ⭐ 성도님의 본교회
            </div>

            <div id="myChurchName" class="my-church-name">
                예톡행복한교회
            </div>

            <div id="myChurchAddress" class="my-church-address">
                부산광역시 동구 좌천동
            </div>

            <div class="my-church-bottom">

                <span id="myChurchRole" class="my-church-role">
                    개설관리자
                </span>

                <span class="my-church-go">
                    교회홈 바로가기 ›
                </span>

            </div>

        </div>



        <!-- 2) 내가 가입/개설한 다른 교회 목록 (본교회 제외 다른 교회들만 나열) -->
        <section id="joinedChurchArea" class="hidden">

            <div class="section-title">

                <strong>
                    내가 등록 · 가입한 다른 교회
                </strong>

                <span id="joinedChurchCount" class="count">
                    0곳
                </span>

            </div>

            <div id="joinedChurchList" class="joined-list">
            </div>

        </section>



        <!-- 3) 검색 / 등록 액션 토글 버튼 2개 -->
        <div class="church-actions">

            <button id="toggleSearchBtn" class="action-toggle-btn" type="button">
                🔍 전체 교회 검색
            </button>

            <button id="toggleCreateBtn" class="action-toggle-btn" type="button">
                ＋ 새 교회 만들기
            </button>

        </div>



        <!-- 4) 교회 검색 패널 -->
        <section id="churchSearchPanel" class="search-panel hidden">

            <div class="search-panel-title">
                🔍 등록된 교회 검색
            </div>

            <div class="search-box">

                <input
                        id="churchSearchInput"
                        class="search-input"
                        type="text"
                        placeholder="교회명 또는 지역 (비우고 검색 시 전체)"
                        autocomplete="off">

                <button id="churchSearchBtn" class="search-btn" type="button">
                    검색
                </button>

            </div>

            <div id="searchResultList" class="list">
            </div>

            <div id="churchEmpty" class="search-empty hidden">
                찾으시는 교회가 없습니다.
            </div>

        </section>



        <!-- 5) 교회 만들기 폼 -->
        <section id="createChurchPanel" class="create-church-card hidden">

            <div class="create-title">
                ＋ 새 교회 앱홈페이지 무료등록
            </div>

            <form id="createChurchForm" class="create-form" autocomplete="off">

                <label class="form-field">
                    <span class="form-label">교회 이름 *</span>
                    <input id="newChurchName" class="form-input" type="text" placeholder="예: 예톡행복한교회" required>
                </label>

                <label class="form-field">
                    <span class="form-label">담임목사 성함 *</span>
                    <input id="newPastorName" class="form-input" type="text" placeholder="예: 홍길동 목사" required>
                </label>

                <label class="form-field">
                    <span class="form-label">주소 *</span>
                    <input id="newChurchAddress" class="form-input" type="text" placeholder="예: 부산광역시 동구 좌천동" required>
                </label>

                <label class="form-field">
                    <span class="form-label">전화번호 *</span>
                    <input id="newChurchPhone" class="form-input" type="tel" placeholder="예: 051-123-4567" required>
                </label>

                <label class="form-field">
                    <span class="form-label">교단 *</span>
                    <input id="newChurchDenomination" class="form-input" type="text" placeholder="예: 기독교대한감리회" required>
                </label>

                <button id="createChurchSubmitBtn" class="create-submit-btn" type="button">
                    교회 무료등록 완료
                </button>

            </form>

        </section>


    </section>



    <!--==================================================
    2. 친구 · 목사님 초청 화면
    ==================================================-->

    <section id="inviteMode" class="hidden">

        <article class="invite-section-card">

            <div class="invite-title">
                💬 목사님 & 성도 초청하기
            </div>

            <p class="invite-text">
                예톡 무료 교회 앱홈페이지를 담임목사님과 교우분들께 소개할 수 있습니다.<br>
                성도 소통, 온라인 주보, 예배영상, 헌금안내를 한곳에서 간편하게 시작하세요.
            </p>

            <div class="invite-buttons">

                <button id="copyInviteBtn" class="invite-btn copy" type="button">
                    📋 소개문 복사
                </button>

                <button id="kakaoInviteBtn" class="invite-btn kakao" type="button">
                    💬 카톡으로 초청
                </button>

            </div>

        </article>

    </section>


</main>



<!-- 가입 팝업 -->
<div id="joinPopup" class="popup">
    <div class="popup-box">
        <div class="popup-title">이 교회에 가입하시겠습니까?</div>
        <div class="popup-target">
            <strong id="joinChurchName"></strong>
            <span id="joinChurchAddress" style="display:block;margin-top:3px;font-size:12px;color:#64748b;"></span>
        </div>
        <div class="popup-buttons">
            <button id="joinCancelBtn" class="cancel" type="button">취소</button>
            <button id="joinConfirmBtn" class="confirm" type="button">가입하기</button>
        </div>
    </div>
</div>

<!-- 토스트 -->
<div id="toast" class="toast"></div>



<script type="module">

    import{
        db,
        collection,
        getDocs,
        doc,
        setDoc,
        serverTimestamp
    }from"./firebase.js";


    const PRIMARY_CHURCH_STORAGE_KEY = "yetalkMyChurchId";
    const $ = id => document.getElementById(id);


    const dom={
        backBtn:$("backBtn"),
        homeBtn:$("homeBtn"),
        churchTab:$("churchTab"),
        inviteTab:$("inviteTab"),
        churchMode:$("churchMode"),
        inviteMode:$("inviteMode"),
        noChurchCard:$("noChurchCard"),
        myChurchCard:$("myChurchCard"),
        myChurchLabel:$("myChurchLabel"),
        myChurchName:$("myChurchName"),
        myChurchAddress:$("myChurchAddress"),
        myChurchRole:$("myChurchRole"),
        joinedChurchArea:$("joinedChurchArea"),
        joinedChurchCount:$("joinedChurchCount"),
        joinedChurchList:$("joinedChurchList"),
        toggleSearchBtn:$("toggleSearchBtn"),
        toggleCreateBtn:$("toggleCreateBtn"),
        churchSearchPanel:$("churchSearchPanel"),
        churchSearchInput:$("churchSearchInput"),
        churchSearchBtn:$("churchSearchBtn"),
        searchResultList:$("searchResultList"),
        churchEmpty:$("churchEmpty"),
        createChurchPanel:$("createChurchPanel"),
        newChurchName:$("newChurchName"),
        newPastorName:$("newPastorName"),
        newChurchAddress:$("newChurchAddress"),
        newChurchPhone:$("newChurchPhone"),
        newChurchDenomination:$("newChurchDenomination"),
        createChurchSubmitBtn:$("createChurchSubmitBtn"),
        copyInviteBtn:$("copyInviteBtn"),
        kakaoInviteBtn:$("kakaoInviteBtn"),
        joinPopup:$("joinPopup"),
        joinChurchName:$("joinChurchName"),
        joinChurchAddress:$("joinChurchAddress"),
        joinCancelBtn:$("joinCancelBtn"),
        joinConfirmBtn:$("joinConfirmBtn"),
        toast:$("toast")
    };


    let churches=[];
    let joinedChurchMemberships=[];
    let selectedChurch=null;
    let toastTimer=null;


    function clean(v){ return String(v ?? "").trim(); }
    function normalize(v){ return clean(v).toLowerCase().replace(/\s+/g,"").replace(/[.,\-_/]/g,""); }
    function esc(v){ const div=document.createElement("div"); div.textContent=clean(v); return div.innerHTML; }

    function showToast(message){
        if(!dom.toast) return;
        dom.toast.textContent = clean(message);
        dom.toast.classList.add("show");
        clearTimeout(toastTimer);
        toastTimer = setTimeout(()=>{ dom.toast.classList.remove("show"); }, 2200);
    }


    function getLoginUser(){
        const keys=["loginUser", "currentUser", "yetalkUser"];
        for(const k of keys){
            try{
                const s = localStorage.getItem(k);
                if(s) {
                    const p = JSON.parse(s);
                    if(p && typeof p==="object") return p;
                }
            }catch(e){}
        }
        return null;
    }

    const loginUser = getLoginUser();
    function getMemberNo(){ return clean(loginUser?.memberNo || loginUser?.uid || loginUser?.userId || loginUser?.id); }

    function getDisplayName(){
        let name = clean(loginUser?.displayName || loginUser?.name || loginUser?.nickname || "최예톡");
        if(name === "촤웅식" || name === "최웅식") name = "최예톡";
        return name;
    }

    function isSuperAdminUser(){
        const m = getMemberNo();
        const n = getDisplayName();
        const r = clean(loginUser?.role || loginUser?.grade).toLowerCase();
        return (
            m === "qcvh4iWVXJChBGUuwVK1" ||
            n === "최예톡" ||
            n === "최웅식" ||
            r === "yetalkadmin" ||
            loginUser?.isAdmin === true
        );
    }

    function isYetalkLounge(churchId="", churchName=""){
        const id = clean(churchId).toLowerCase();
        const name = normalize(churchName);
        return (id==="yetalk-lounge" || id==="yetalklounge" || name==="예톡라운지" || name==="예톡라운지교회");
    }


    /*==================================================
    TAB SWITCH
    ==================================================*/
    function setTab(tab){
        const isChurch = tab === "church";
        dom.churchTab.classList.toggle("active", isChurch);
        dom.inviteTab.classList.toggle("active", !isChurch);
        dom.churchMode.classList.toggle("hidden", !isChurch);
        dom.inviteMode.classList.toggle("hidden", isChurch);
    }


    /*==================================================
    LOAD CHURCHES
    ==================================================*/
    async function loadChurches(){
        try{
            const snapshot = await getDocs(collection(db, "churches"));
            churches = [];

            snapshot.forEach(item => {
                const data = item.data() || {};
                const churchName = data.churchName || data.name || "";
                if(isYetalkLounge(item.id, churchName) || data.status === "deleted") return;

                churches.push({
                    churchId: item.id,
                    name: churchName,
                    denomination: data.denomination || "",
                    pastor: data.pastorName || data.pastor || "",
                    address: data.address || "",
                    phone: data.phone || "",
                    ownerMemberNo: clean(data.ownerMemberNo || data.createdByMemberNo),
                    ownerName: clean(data.ownerName || data.createdByName)
                });
            });

            await loadJoinedMemberships();
            validatePrimary();
            renderHome();

        }catch(e){
            console.error("교회 로드 실패:", e);
        }
    }


    /*==================================================
    LOAD MEMBERSHIPS
    ==================================================*/
    async function loadJoinedMemberships(){
        const memberNo = getMemberNo();
        const userName = getDisplayName();
        const map = new Map();

        if(memberNo){
            try{
                const snap = await getDocs(collection(db, "users", memberNo, "churches"));
                snap.forEach(item => {
                    const d = item.data() || {};
                    const id = clean(d.churchId || item.id);
                    const nm = clean(d.churchName || d.name);
                    if(isYetalkLounge(id, nm) || clean(d.status).toLowerCase()==="deleted") return;

                    map.set(id, {
                        churchId: id,
                        churchName: nm,
                        address: clean(d.address),
                        role: clean(d.role) || "associate",
                        roleName: clean(d.roleName) || "교인",
                        isOwner: d.isOwner === true || d.role === "owner"
                    });
                });
            }catch(e){}
        }

        churches.forEach(c => {
            const isMine = (
                (memberNo && c.ownerMemberNo === memberNo) ||
                (userName && (c.ownerName === userName || (isSuperAdminUser() && (c.ownerName === "최예톡" || c.ownerName === "최웅식" || c.ownerName === "촤웅식"))))
            );

            if(isMine && !map.has(c.churchId)){
                map.set(c.churchId, {
                    churchId: c.churchId,
                    churchName: c.name,
                    address: c.address,
                    role: "owner",
                    roleName: "개설관리자",
                    isOwner: true
                });
            }
        });

        joinedChurchMemberships = Array.from(map.values());
    }


    function validatePrimary(){
        let primaryId = clean(localStorage.getItem(PRIMARY_CHURCH_STORAGE_KEY));

        if(!primaryId || !joinedChurchMemberships.some(c => c.churchId === primaryId)){
            const happy = joinedChurchMemberships.find(c => c.churchId === "fAKyQftAh3qPnsuRPSVz");
            primaryId = happy ? happy.churchId : (joinedChurchMemberships[0]?.churchId || "");
            if(primaryId){
                localStorage.setItem(PRIMARY_CHURCH_STORAGE_KEY, primaryId);
                localStorage.setItem("currentChurchId", primaryId);
            }
        }
    }


    /*==================================================
    RENDER HOME
    ==================================================*/
    function renderHome(){
        const primaryId = clean(localStorage.getItem(PRIMARY_CHURCH_STORAGE_KEY));
        const primaryChurch = joinedChurchMemberships.find(m => m.churchId === primaryId) || joinedChurchMemberships[0];

        if(primaryChurch){
            dom.noChurchCard.classList.add("hidden");
            dom.myChurchCard.classList.remove("hidden");

            dom.myChurchLabel.textContent = `⭐ ${getDisplayName()}님의 본교회`;
            dom.myChurchName.textContent = primaryChurch.churchName;
            dom.myChurchAddress.textContent = primaryChurch.address || "주소 정보 없음";
            dom.myChurchRole.textContent = primaryChurch.isOwner ? "개설관리자" : (primaryChurch.roleName || "교인");
            dom.myChurchCard.onclick = () => openChurch(primaryChurch.churchId);
        } else {
            dom.noChurchCard.classList.remove("hidden");
            dom.myChurchCard.classList.add("hidden");
        }

        const otherChurches = joinedChurchMemberships.filter(m => m.churchId !== (primaryChurch?.churchId));

        if(otherChurches.length > 0){
            dom.joinedChurchArea.classList.remove("hidden");
            dom.joinedChurchCount.textContent = `${otherChurches.length}곳`;
            dom.joinedChurchList.innerHTML = "";

            otherChurches.forEach(item => {
                const card = document.createElement("div");
                card.className = "joined-card";
                card.innerHTML = `
                    <button class="star-btn" type="button" title="본교회로 변경">☆</button>
                    <div class="joined-info">
                        <div class="joined-name">${esc(item.churchName)}</div>
                        <div class="joined-address">${esc(item.address || "주소 정보 없음")}</div>
                        <span class="badge ${item.isOwner ? 'owner' : ''}">
                            ${esc(item.isOwner ? '개설관리자' : item.roleName)}
                        </span>
                    </div>
                    <span class="arrow">›</span>
                `;

                card.onclick = () => openChurch(item.churchId);
                card.querySelector(".star-btn").onclick = (e) => {
                    e.stopPropagation();
                    setPrimaryChurch(item);
                };
                dom.joinedChurchList.appendChild(card);
            });
        } else {
            dom.joinedChurchArea.classList.add("hidden");
        }
    }


    function setPrimaryChurch(church){
        localStorage.setItem(PRIMARY_CHURCH_STORAGE_KEY, church.churchId);
        localStorage.setItem("currentChurchId", church.churchId);
        localStorage.setItem("yetalkMyChurchName", church.churchName);
        renderHome();
        showToast(`[${church.churchName}] 본교회로 설정되었습니다.`);
    }


    function searchChurch(){
        const key = normalize(dom.churchSearchInput.value);
        const result = churches.filter(c => {
            if(!key) return true;
            return normalize(`${c.name} ${c.address} ${c.denomination} ${c.pastor}`).includes(key);
        });

        dom.searchResultList.innerHTML = "";
        dom.churchEmpty.classList.toggle("hidden", result.length > 0);

        result.forEach(c => {
            const joined = joinedChurchMemberships.some(m => m.churchId === c.churchId);
            const card = document.createElement("div");
            card.className = "card";
            card.innerHTML = `
                <div style="font-size:24px;flex-shrink:0;">${joined ? '✓' : '⛪'}</div>
                <div style="flex:1;min-width:0;">
                    <div style="font-weight:950;font-size:16px;">${esc(c.name)}</div>
                    <div style="font-size:12px;color:#64748b;margin-top:2px;">${esc(c.address || "주소 정보 없음")}</div>
                </div>
                <span class="badge ${joined ? '' : 'owner'}">${joined ? '가입중' : '가입하기'}</span>
            `;
            card.onclick = () => {
                if(joined) openChurch(c.churchId);
                else openJoinPopup(c);
            };
            dom.searchResultList.appendChild(card);
        });
    }


    function openJoinPopup(c){
        selectedChurch = c;
        dom.joinChurchName.textContent = c.name;
        dom.joinChurchAddress.textContent = c.address || "";
        dom.joinPopup.classList.add("show");
    }


    async function joinChurch(){
        if(!selectedChurch) return;
        const c = selectedChurch;
        const memberNo = getMemberNo();
        const userName = getDisplayName();

        if(!memberNo){
            showToast("로그인 정보가 없습니다.");
            return;
        }

        const data = {
            churchId: c.churchId,
            churchName: c.name,
            address: c.address || "",
            denomination: c.denomination || "",
            memberNo: memberNo,
            name: userName,
            displayName: userName,
            role: "associate",
            roleName: "준회원",
            status: "active",
            isOwner: false,
            isChurchAdmin: false
        };

        try{
            await setDoc(doc(db, "churches", c.churchId, "members", memberNo), { ...data, joinedAt: serverTimestamp() }, { merge:true });
            await setDoc(doc(db, "users", memberNo, "churches", c.churchId), { ...data, joinedAt: serverTimestamp() }, { merge:true });

            joinedChurchMemberships.push(data);
            dom.joinPopup.classList.remove("show");
            renderHome();
            showToast(`${c.name}에 가입되었습니다.`);
            setTimeout(() => openChurch(c.churchId), 300);
        }catch(e){
            alert("가입 중 오류가 발생했습니다.");
        }
    }


    /*==================================================
    CREATE CHURCH
    ==================================================*/
    async function createChurch(){
        const memberNo = getMemberNo();
        const userName = getDisplayName();

        if(!isSuperAdminUser()){
            const owned = joinedChurchMemberships.filter(m => m.isOwner === true);
            if(owned.length >= 1){
                alert("일반 회원은 교회를 1개만 개설할 수 있습니다.");
                return;
            }
        }

        const churchName = clean(dom.newChurchName.value);
        const pastorName = clean(dom.newPastorName.value);
        const address = clean(dom.newChurchAddress.value);
        const phone = clean(dom.newChurchPhone.value);
        const denomination = clean(dom.newChurchDenomination.value);

        if(!churchName || !pastorName || !address || !phone || !denomination){
            alert("모든 필수 항목을 입력해 주세요.");
            return;
        }

        if(!confirm(`[${churchName}] 교회를 새로 등록하시겠습니까?`)) return;

        dom.createChurchSubmitBtn.disabled = true;
        dom.createChurchSubmitBtn.textContent = "등록 중...";

        try{
            const churchRef = doc(collection(db, "churches"));
            const newId = churchRef.id;

            const cData = {
                churchId: newId,
                churchName: churchName,
                name: churchName,
                pastorName: pastorName,
                pastor: pastorName,
                address: address,
                phone: phone,
                denomination: denomination,
                status: "active",
                createdByMemberNo: memberNo,
                createdByName: userName,
                ownerMemberNo: memberNo,
                ownerName: userName,
                isOwner: true,
                createdAt: serverTimestamp(),
                updatedAt: serverTimestamp()
            };

            await setDoc(churchRef, cData);

            const mData = {
                churchId: newId,
                churchName: churchName,
                address: address,
                denomination: denomination,
                memberNo: memberNo,
                name: userName,
                displayName: userName,
                role: "owner",
                roleName: "개설관리자",
                isOwner: true,
                isChurchAdmin: true,
                status: "active"
            };

            await setDoc(doc(db, "churches", newId, "members", memberNo), { ...mData, joinedAt: serverTimestamp() });
            await setDoc(doc(db, "users", memberNo, "churches", newId), { ...mData, joinedAt: serverTimestamp() });

            alert("교회 무료등록 및 앱홈페이지 제작 완료");

            // 🌟 [수정 완료] 폴더 없이 다이렉트로 단층 호출
            location.href = `https://appassets.androidplatform.net/assets/churchmain.html?churchId=${encodeURIComponent(newId)}&edit=1`;

        }catch(err){
            alert("등록 실패: " + err.message);
        }finally{
            dom.createChurchSubmitBtn.disabled = false;
            dom.createChurchSubmitBtn.textContent = "교회 무료등록 완료";
        }
    }


    function openChurch(id){
        if(!id || isYetalkLounge(id)) return;
        localStorage.setItem("currentChurchId", id);

        // 🌟 [수정 완료] 폴더 없이 다이렉트로 단층 호출
        location.href = `https://appassets.androidplatform.net/assets/churchmain.html?churchId=${encodeURIComponent(id)}`;
    }


    /*==================================================
    초청 기능
    ==================================================*/
    function copyInvite(){
        const msg = `목사님, 우리교회도 예톡 무료 교회 앱홈페이지를 사용해 보세요!\n공지, 주보, 예배영상, 헌금안내를 한곳에서 간편하게 운영할 수 있습니다.\n\n예톡 앱에서 [우리교회]를 확인해 주세요.`;
        navigator.clipboard.writeText(msg).then(() => showToast("초청문구가 복사되었습니다. 카톡에 붙여넣으세요."));
    }

    function shareKakao(){
        const msg = `목사님, 우리교회도 예톡 무료 교회 앱홈페이지를 사용해 보세요!\n공지, 주보, 예배영상, 헌금안내를 한곳에서 간편하게 운영할 수 있습니다.`;
        if(navigator.share) navigator.share({ title: "예톡 교회홈 초청", text: msg });
        else copyInvite();
    }


    /*==================================================
    뒤로가기 처리
    ==================================================*/
    function handleGoBack() {
        if (window.history.length > 1 && document.referrer) {
            window.history.back();
        } else {
            window.location.href = "https://appassets.androidplatform.net/assets/index.html";
        }
    }


    /*==================================================
    이벤트 바인딩 & 초기화
    ==================================================*/
    function bindEvents(){
        dom.backBtn.onclick = (e) => {
            e.preventDefault();
            handleGoBack();
        };

        dom.homeBtn.onclick = (e) => {
            e.preventDefault();
            location.href = "https://appassets.androidplatform.net/assets/index.html";
        };

        dom.churchTab.onclick = () => setTab("church");
        dom.inviteTab.onclick = () => setTab("invite");

        dom.toggleSearchBtn.onclick = () => {
            dom.churchSearchPanel.classList.toggle("hidden");
            dom.createChurchPanel.classList.add("hidden");
            dom.toggleSearchBtn.classList.toggle("active");
            dom.toggleCreateBtn.classList.remove("active");
            if(!dom.churchSearchPanel.classList.contains("hidden")) searchChurch();
        };

        dom.toggleCreateBtn.onclick = () => {
            dom.createChurchPanel.classList.toggle("hidden");
            dom.churchSearchPanel.classList.add("hidden");
            dom.toggleCreateBtn.classList.toggle("active");
            dom.toggleSearchBtn.classList.remove("active");
        };

        dom.churchSearchBtn.onclick = searchChurch;
        dom.churchSearchInput.onkeydown = (e) => { if(e.key === "Enter") { e.preventDefault(); searchChurch(); } };

        dom.createChurchSubmitBtn.onclick = createChurch;

        dom.copyInviteBtn.onclick = copyInvite;
        dom.kakaoInviteBtn.onclick = shareKakao;

        dom.joinCancelBtn.onclick = () => dom.joinPopup.classList.remove("show");
        dom.joinConfirmBtn.onclick = joinChurch;
    }

    document.addEventListener("DOMContentLoaded", async () => {
        bindEvents();
        await loadChurches();
    });

</script>

</body>
</html>
