<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width,initial-scale=1.0,viewport-fit=cover">

    <meta
            name="theme-color"
            content="#ffffff">

    <title>기도모임 만들기 | 예톡</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Pretendard","Noto Sans KR",Arial,sans-serif;
        }

        body{
            min-width:320px;
            min-height:100vh;
            background:#eef3f8;
            color:#222;
        }

        button,
        input,
        textarea{
            font:inherit;
        }

        button{
            border:0;
            cursor:pointer;
            -webkit-tap-highlight-color:transparent;
        }


        /*==================================================
        HEADER
        ==================================================*/

        .header{
            position:sticky;
            top:0;
            z-index:99999;

            display:flex;
            align-items:center;
            justify-content:space-between;

            width:100%;
            height:60px;

            padding:0 10px;

            background:#fff;

            border-bottom:1px solid #e4e9ee;

            box-shadow:
                0 2px 8px rgba(0,0,0,.07);

            pointer-events:auto;
        }

        .back-btn,
        .home-btn{
            position:relative;
            z-index:100000;

            display:flex;
            align-items:center;
            justify-content:center;

            flex:0 0 auto;

            width:40px;
            height:40px;

            border:1px solid #dfe5e9;
            border-radius:50%;

            background:#fff;

            color:#263746;

            box-shadow:
                0 2px 6px rgba(0,0,0,.06);

            pointer-events:auto;

            touch-action:manipulation;
        }

        .back-btn{
            font-size:24px;
            font-weight:950;
        }

        .home-btn{
            font-size:20px;
        }

        .back-btn:active,
        .home-btn:active{
            background:#f0f4f7;
            transform:scale(.96);
        }

        .header-space{
            flex:1;
            height:100%;
            pointer-events:none;
        }


        /*==================================================
        WRAP
        ==================================================*/

        .wrap{
            width:100%;
            max-width:700px;

            margin:0 auto;

            padding:
                14px
                11px
                40px;
        }


        /*==================================================
        GUIDE
        ==================================================*/

        .guide{
            margin-bottom:13px;

            padding:16px 15px;

            border:1px solid #e1d7ec;
            border-radius:16px;

            background:
                linear-gradient(
                    135deg,
                    #f7f1fc,
                    #ffffff
                );

            box-shadow:
                0 3px 10px rgba(80,45,110,.05);
        }

        .guide-title{
            color:#63358f;

            font-size:20px;
            font-weight:950;

            line-height:1.35;
        }

        .guide-text{
            margin-top:7px;

            color:#62666a;

            font-size:13px;
            font-weight:700;

            line-height:1.65;
        }


        /*==================================================
        CHURCH CARD
        ==================================================*/

        .church-card{
            margin-bottom:13px;

            padding:14px 15px;

            border:1px solid #dce6df;
            border-radius:15px;

            background:#fff;

            box-shadow:
                0 2px 8px rgba(0,0,0,.05);
        }

        .church-label{
            color:#7a8380;

            font-size:11px;
            font-weight:850;
        }

        .church-name{
            margin-top:4px;

            color:#14863d;

            font-size:18px;
            font-weight:950;
        }

        .church-help{
            margin-top:5px;

            color:#81898d;

            font-size:11px;
            font-weight:650;

            line-height:1.5;
        }


        /*==================================================
        FORM CARD
        ==================================================*/

        .form-card{
            padding:17px 14px;

            border:1px solid #e0e5ea;
            border-radius:17px;

            background:#fff;

            box-shadow:
                0 3px 11px rgba(20,40,65,.06);
        }

        .field{
            margin-top:14px;
        }

        .field:first-child{
            margin-top:0;
        }

        .label{
            display:flex;
            align-items:center;
            gap:4px;

            margin-bottom:6px;

            color:#222;

            font-size:14px;
            font-weight:900;
        }

        .required{
            color:#d7192d;
        }

        .optional{
            color:#8c9399;

            font-size:11px;
            font-weight:700;
        }

        .input,
        .textarea{
            width:100%;

            border:1px solid #d9e0e6;
            border-radius:12px;

            background:#fff;

            color:#222;

            font-size:15px;
            font-weight:650;

            outline:none;
        }

        .input{
            height:48px;
            padding:0 12px;
        }

        .textarea{
            min-height:90px;

            padding:11px 12px;

            line-height:1.6;

            resize:vertical;
        }

        .input:focus,
        .textarea:focus{
            border-color:#70439e;

            box-shadow:
                0 0 0 3px rgba(112,67,158,.09);
        }

        .readonly{
            background:#f4f6f7;
            color:#60686e;
        }


        /*==================================================
        TYPE
        ==================================================*/

        .type-box{
            display:grid;

            grid-template-columns:
                repeat(2,1fr);

            gap:8px;
        }

        .type-btn{
            min-height:48px;

            padding:8px;

            border:1px solid #dddfe5;
            border-radius:12px;

            background:#f5f6f8;

            color:#60666b;

            font-size:14px;
            font-weight:900;
        }

        .type-btn.active{
            border-color:#70439e;

            background:#70439e;

            color:#fff;

            box-shadow:
                0 3px 9px rgba(112,67,158,.20);
        }


        /*==================================================
        NOTICE
        ==================================================*/

        .notice{
            margin-top:13px;

            padding:13px 14px;

            border:1px solid #e1d5ec;
            border-radius:13px;

            background:#f8f2fc;

            color:#674084;

            font-size:12px;
            font-weight:750;

            line-height:1.65;
        }

        .limit-notice{
            margin-top:10px;

            padding:12px 14px;

            border:1px solid #efd9ac;
            border-radius:13px;

            background:#fff8e9;

            color:#85551c;

            font-size:12px;
            font-weight:750;

            line-height:1.65;
        }


        /*==================================================
        BUTTON
        ==================================================*/

        .create-btn{
            display:flex;

            align-items:center;
            justify-content:center;

            width:100%;
            height:54px;

            margin-top:15px;

            border-radius:14px;

            background:
                linear-gradient(
                    135deg,
                    #7546a3,
                    #61338d
                );

            color:#fff;

            font-size:17px;
            font-weight:950;

            box-shadow:
                0 5px 14px rgba(100,55,145,.22);
        }

        .create-btn:active{
            transform:scale(.99);
        }

        .create-btn:disabled{
            cursor:default;
            opacity:.55;
        }


        /*==================================================
        BLOCKED
        ==================================================*/

        .blocked{
            display:none;

            margin-bottom:13px;

            padding:20px 15px;

            border:1px solid #f0d1d1;
            border-radius:16px;

            background:#fff;

            text-align:center;
        }

        .blocked-icon{
            font-size:37px;
        }

        .blocked-title{
            margin-top:8px;

            color:#b03131;

            font-size:18px;
            font-weight:950;
        }

        .blocked-text{
            margin-top:7px;

            color:#70777c;

            font-size:14px;
            font-weight:700;

            line-height:1.65;
        }

        .blocked-btn{
            width:100%;
            height:47px;

            margin-top:13px;

            border-radius:12px;

            background:#14863d;

            color:#fff;

            font-size:15px;
            font-weight:950;
        }

        .blocked-btn:active{
            transform:scale(.99);
            background:#107334;
        }


        /*==================================================
        MOBILE
        ==================================================*/

        @media(max-width:380px){

            .wrap{
                padding-left:7px;
                padding-right:7px;
            }

        }

    </style>

</head>


<body>


<!--==================================================
HEADER
==================================================-->

<header class="header">

    <button
            id="backBtn"
            class="back-btn"
            type="button"
            onclick="window.location.href='smalllist.html'"
            aria-label="뒤로가기">

        ←

    </button>


    <div class="header-space"></div>


    <button
            id="homeBtn"
            class="home-btn"
            type="button"
            onclick="window.location.href='index.html'"
            aria-label="예톡 홈">

        🏠

    </button>

</header>


<main class="wrap">


    <!--==================================================
    GUIDE
    ==================================================-->

    <section class="guide">

        <div class="guide-title">

            🙏 함께 기도하는 모임을 만듭니다

        </div>

        <div class="guide-text">

            예톡 회원들이 함께 참여하여
            채팅하고 음성으로 기도할 수 있는
            기도모임입니다.

        </div>

    </section>



    <!--==================================================
    BLOCKED
    ==================================================-->

    <section
            id="blockedBox"
            class="blocked">

        <div class="blocked-icon">

            ⛪

        </div>

        <div class="blocked-title">

            먼저 본교회를 등록해주세요

        </div>

        <div class="blocked-text">

            기도모임 가입은 누구나 가능하지만
            기도모임을 직접 개설하려면
            먼저 본교회가 등록되어 있어야 합니다.

        </div>

        <button
                id="churchBtn"
                class="blocked-btn"
                type="button"
                onclick="window.location.href='churchlist.html'">

            우리교회 등록하기

        </button>

    </section>



    <!--==================================================
    CHURCH
    ==================================================-->

    <section
            id="churchCard"
            class="church-card">

        <div class="church-label">

            ⛪ 나의 본교회

        </div>

        <div
                id="churchName"
                class="church-name">

            -

        </div>

        <div class="church-help">

            기도모임은 현재 등록된 본교회를
            기준으로 개설됩니다.

        </div>

    </section>



    <!--==================================================
    FORM
    ==================================================-->

    <section
            id="formCard"
            class="form-card">


        <div class="field">

            <label
                    class="label"
                    for="roomName">

                기도모임 이름

                <span class="required">*</span>

            </label>

            <input
                    id="roomName"
                    class="input"
                    type="text"
                    maxlength="40"
                    placeholder="예: 새벽 중보기도모임">

        </div>



        <div class="field">

            <label class="label">

                기도모임 형태

            </label>

            <div class="type-box">

                <button
                        id="typePrayer"
                        class="type-btn active"
                        type="button">

                    🙏 기도모임

                </button>

                <button
                        id="typeIntercession"
                        class="type-btn"
                        type="button">

                    ❤️ 중보기도

                </button>

            </div>

        </div>



        <div class="field">

            <label
                    class="label"
                    for="leaderName">

                모임장

                <span class="required">*</span>

            </label>

            <input
                    id="leaderName"
                    class="input readonly"
                    type="text"
                    maxlength="30"
                    readonly>

        </div>



        <div class="field">

            <label
                    class="label"
                    for="description">

                모임 소개

                <span class="optional">
                    (선택)
                </span>

            </label>

            <textarea
                    id="description"
                    class="textarea"
                    maxlength="200"
                    placeholder="기도모임을 간단하게 소개해주세요."></textarea>

        </div>



        <div class="notice">

            🙏 기도모임에서는
            채팅과 음성기도 기능을 함께 사용할 수 있습니다.
            별도의 기도모임 홈페이지는 만들지 않습니다.

        </div>


        <div class="limit-notice">

            ※ 기도모임 가입 수에는 제한이 없습니다.<br>
            ※ 본인이 직접 개설할 수 있는 기도모임은
            <strong>최대 2개</strong>입니다.

        </div>


        <button
                id="createBtn"
                class="create-btn"
                type="button">

            ＋ 기도모임 만들기

        </button>


    </section>


</main>


<script type="module">

    import{

        db,

        collection,
        addDoc,
        getDocs,

        query,
        where,

        doc,
        setDoc,

        serverTimestamp

    }from"./firebase.js";


    /*==================================================
    ELEMENT
    ==================================================*/

    const blockedBox=
        document.getElementById(
            "blockedBox"
        );

    const churchCard=
        document.getElementById(
            "churchCard"
        );

    const churchName=
        document.getElementById(
            "churchName"
        );

    const formCard=
        document.getElementById(
            "formCard"
        );

    const roomName=
        document.getElementById(
            "roomName"
        );

    const leaderName=
        document.getElementById(
            "leaderName"
        );

    const description=
        document.getElementById(
            "description"
        );

    const createBtn=
        document.getElementById(
            "createBtn"
        );

    const typePrayer=
        document.getElementById(
            "typePrayer"
        );

    const typeIntercession=
        document.getElementById(
            "typeIntercession"
        );


    /*==================================================
    STATE
    ==================================================*/

    let roomType=
        "prayer";

    let myChurchId=
        "";

    let myChurchName=
        "";

    let ownedRoomCount=
        0;


    /*==================================================
    COMMON
    ==================================================*/

    function clean(value){

        return String(
            value ?? ""
        ).trim();

    }


    function getLoginUser(){

        try{

            return JSON.parse(

                localStorage.getItem(
                    "loginUser"
                ) || "null"

            );

        }
        catch(error){

            console.warn(
                "로그인 정보 읽기 오류:",
                error
            );

            return null;

        }

    }


    const loginUser=
        getLoginUser();


    function getMemberNo(){

        return clean(

            loginUser?.memberNo ||

            loginUser?.uid ||

            loginUser?.userId ||

            loginUser?.id

        );

    }


    /*==================================================
    TYPE
    ==================================================*/

    function setRoomType(type){

        roomType=
            type;


        typePrayer.classList.toggle(
            "active",
            type==="prayer"
        );


        typeIntercession.classList.toggle(
            "active",
            type==="intercession"
        );

    }


    typePrayer.addEventListener(

        "click",

        ()=>setRoomType(
            "prayer"
        )

    );


    typeIntercession.addEventListener(

        "click",

        ()=>setRoomType(
            "intercession"
        )

    );


    /*==================================================
    LOAD CHURCH
    ==================================================*/

    function loadMyChurch(){

        myChurchId=
            clean(

                localStorage.getItem(
                    "yetalkMyChurchId"
                ) ||

                localStorage.getItem(
                    "currentChurchId"
                )

            );


        myChurchName=
            clean(

                localStorage.getItem(
                    "yetalkMyChurchName"
                )

            );


        if(
            myChurchId==="yetalk-lounge" ||
            myChurchId==="yetalkLounge" ||
            myChurchId==="yetalklounge"
        ){

            myChurchId="";
            myChurchName="";

        }


        if(
            !myChurchId
        ){

            blockedBox.style.display=
                "block";

            churchCard.style.display=
                "none";

            formCard.style.display=
                "none";

            return false;

        }


        blockedBox.style.display=
            "none";

        churchCard.style.display=
            "block";

        formCard.style.display=
            "block";


        churchName.textContent=

            myChurchName ||

            "등록된 본교회";


        return true;

    }


    /*==================================================
    LOAD USER
    ==================================================*/

    function loadUser(){

        if(!loginUser){

            alert(
                "먼저 예톡에 로그인해주세요."
            );


            window.location.href=
                "login.html";


            return false;

        }


        leaderName.value=

            clean(
                loginUser.displayName
            ) ||

            clean(
                loginUser.name
            );


        return true;

    }


    /*==================================================
    COUNT OWNED ROOMS
    ==================================================*/

    async function loadOwnedRoomCount(){

        const memberNo=
            getMemberNo();


        if(!memberNo){

            ownedRoomCount=0;

            return;

        }


        try{

            const roomQuery=
                query(

                    collection(
                        db,
                        "prayerRooms"
                    ),

                    where(
                        "ownerMemberNo",
                        "==",
                        memberNo
                    )

                );


            const snapshot=
                await getDocs(
                    roomQuery
                );


            ownedRoomCount=0;


            snapshot.forEach(

                item=>{

                    const data=
                        item.data();


                    if(
                        clean(
                            data.status
                        ).toLowerCase()
                        !==
                        "deleted"
                    ){

                        ownedRoomCount++;

                    }

                }

            );


            if(
                ownedRoomCount>=2
            ){

                createBtn.disabled=
                    true;

                createBtn.textContent=
                    "기도모임 2개 개설 완료";

            }

        }
        catch(error){

            console.error(
                "기도모임 개설 수 확인 오류:",
                error
            );

        }

    }


    /*==================================================
    VALIDATE
    ==================================================*/

    function validate(){

        if(
            !myChurchId
        ){

            alert(
                "기도모임을 만들려면 먼저 본교회를 등록해주세요."
            );

            return false;

        }


        if(
            ownedRoomCount>=2
        ){

            alert(
                "본인이 개설할 수 있는 기도모임은 최대 2개입니다."
            );

            return false;

        }


        if(
            !clean(
                roomName.value
            )
        ){

            alert(
                "기도모임 이름을 입력해주세요."
            );

            roomName.focus();

            return false;

        }


        if(
            !getMemberNo()
        ){

            alert(
                "로그인 회원정보를 확인할 수 없습니다."
            );

            return false;

        }


        return true;

    }


    /*==================================================
    CREATE ROOM
    ==================================================*/

    async function createPrayerRoom(){

        if(
            !validate()
        ){

            return;

        }


        createBtn.disabled=
            true;

        createBtn.textContent=
            "기도모임 개설 중...";


        try{

            const memberNo=
                getMemberNo();


            const ownerName=

                clean(
                    loginUser?.displayName
                ) ||

                clean(
                    loginUser?.name
                );


            const roomData={

                roomName:
                    clean(
                        roomName.value
                    ),

                name:
                    clean(
                        roomName.value
                    ),

                roomType:
                    roomType,

                description:
                    clean(
                        description.value
                    ),

                churchId:
                    myChurchId,

                churchName:
                    myChurchName,

                ownerMemberNo:
                    memberNo,

                createdByMemberNo:
                    memberNo,

                ownerYetalkId:
                    clean(
                        loginUser?.yetalkId
                    ),

                ownerName:
                    ownerName,

                createdByName:
                    ownerName,

                status:
                    "active",

                roomMode:
                    "voicePrayer",

                allowChat:
                    true,

                allowVoice:
                    true,

                maxSpeakers:
                    12,

                maxMembers:
                    12,

                memberCount:
                    1,

                createdAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            /*==================================================
            FIRESTORE ROOM
            ==================================================*/

            const roomRef=
                await addDoc(

                    collection(
                        db,
                        "prayerRooms"
                    ),

                    roomData

                );


            const roomId=
                roomRef.id;


            /*==================================================
            OWNER MEMBER
            ==================================================*/

            const memberData={

                roomId:
                    roomId,

                roomName:
                    roomData.roomName,

                memberNo:
                    memberNo,

                yetalkId:
                    roomData.ownerYetalkId,

                name:
                    ownerName,

                displayName:
                    ownerName,

                role:
                    "owner",

                roleName:
                    "방장",

                status:
                    "active",

                isOwner:
                    true,

                isRoomAdmin:
                    true,

                joinedAt:
                    serverTimestamp(),

                updatedAt:
                    serverTimestamp()

            };


            await setDoc(

                doc(
                    db,
                    "prayerRooms",
                    roomId,
                    "members",
                    memberNo
                ),

                memberData

            );


            /*==================================================
            USER ROOM
            ==================================================*/

            await setDoc(

                doc(
                    db,
                    "users",
                    memberNo,
                    "prayerRooms",
                    roomId
                ),

                memberData

            );


            /*==================================================
            LOCAL MEMBERSHIP
            ==================================================*/

            let joinedIds=[];


            try{

                const saved=
                    JSON.parse(

                        localStorage.getItem(
                            "yetalkPrayerRoomMemberships"
                        ) || "[]"

                    );


                if(
                    Array.isArray(
                        saved
                    )
                ){

                    joinedIds=
                        saved;

                }

            }
            catch(error){

                joinedIds=[];

            }


            if(
                !joinedIds.includes(
                    roomId
                )
            ){

                joinedIds.push(
                    roomId
                );

            }


            localStorage.setItem(

                "yetalkPrayerRoomMemberships",

                JSON.stringify(
                    joinedIds
                )

            );


            localStorage.setItem(

                "currentPrayerRoomId",

                roomId

            );


            /*==================================================
            COMPLETE
            ==================================================*/

            alert(
                "기도모임이 개설되었습니다."
            );


            window.location.href=
                "smalllist.html";

        }
        catch(error){

            console.error(
                "기도모임 개설 오류:",
                error
            );


            alert(
                "기도모임 개설 중 오류가 발생했습니다.\n잠시 후 다시 시도해주세요."
            );


            createBtn.disabled=
                false;

            createBtn.textContent=
                "＋ 기도모임 만들기";

        }

    }


    /*==================================================
    CREATE CLICK
    ==================================================*/

    createBtn.addEventListener(

        "click",

        createPrayerRoom

    );


    /*==================================================

    roomName.addEventListener(

        event=>{

            if(
                event.key==="Enter"
            ){

                event.preventDefault();

                description.focus();
