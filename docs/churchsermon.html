<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>예톡 - 예배영상</title>
    <link rel="stylesheet" href="common.css">
    <style>
        .page-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
            padding-bottom: 120px;
            box-sizing: border-box;
        }
        .sermon-hero {
            background: linear-gradient(135deg, #0369a1 0%, #075cab 100%);
            color: #ffffff;
            padding: 24px 20px;
            text-align: center;
        }
        .sermon-title { font-size: 21px; font-weight: 900; margin-bottom: 6px; }
        .sermon-subtitle { font-size: 13px; font-weight: 700; opacity: 0.95; }

        .content-box {
            padding: 20px 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        .sermon-card {
            background: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px;
        }
        .sermon-video-box {
            width: 100%;
            height: 200px;
            background: #0f172a;
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ffffff;
            font-size: 14px;
            font-weight: 800;
            margin-bottom: 12px;
        }
        .sermon-info-title {
            font-size: 15px;
            font-weight: 900;
            color: #0f172a;
            margin-bottom: 4px;
        }
        .sermon-info-date {
            font-size: 12px;
            font-weight: 700;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="page-container">
    <div class="sermon-hero">
        <h1 class="sermon-title">주일 및 예배 영상</h1>
        <p class="sermon-subtitle">은혜로운 말씀과 찬양을 언제 어디서나 시청하세요.</p>
    </div>

    <div class="content-box">
        <div class="sermon-card">
            <div class="sermon-video-box">▶ 이번 주 주일 대예배 영상 플레이어</div>
            <div class="sermon-info-title">"하나님의 크신 사랑과 은혜"</div>
            <div class="sermon-info-date">요한복음 3:16 · 담임목사</div>
        </div>

        <div class="sermon-card">
            <div class="sermon-video-box" style="background:#334155;">▶ 지난 수요기도회 말씀 영상</div>
            <div class="sermon-info-title">"기도로 승리하는 삶"</div>
            <div class="sermon-info-date">에베소서 6:18 · 담당교역자</div>
        </div>
    </div>
</div>

<script src="common.js"></script>
<script src="church_bottom_bar.js"></script>
</body>
</html>
