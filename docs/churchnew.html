<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>예톡 - 회원가입 및 맞춤형 홈페이지 무료제작</title>
    <link rel="stylesheet" href="index.css">
    <style>
        body {
            background-color: #f8fafc !important;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #1e293b;
        }
        .page-container {
            max-width: 480px;
            margin: 0 auto;
            min-height: 100vh;
            background: #ffffff;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.06);
            padding-bottom: 140px;
            box-sizing: border-box;
        }
        .sub-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
            background: #ffffff;
            border-bottom: 1px solid #f1f5f9;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .back-btn {
            background: none;
            border: none;
            font-size: 24px;
            font-weight: 900;
            cursor: pointer;
            color: #0f172a;
        }
        .home-icon-btn {
            background: none;
            border: none;
            cursor: pointer;
            font-size: 20px;
        }

        /* 🌟 상단 통합 버튼 스타일 (요청하신 부분) */
        .top-unified-title-box {
            margin: 12px 16px 4px;
            background: #075cab;
            color: #ffffff;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            font-size: 17px;
            font-weight: 900;
            box-shadow: 0 4px 12px rgba(7,92,171,0.25);
        }

        /* 🌟 아이콘을 없애고 글자를 또렷하게 만든 4단 탭 메뉴 */
        .type-tab-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            padding: 10px 16px 6px;
            background: #ffffff;
        }
        .type-tab-btn {
            padding: 11px 4px;
            border: 2px solid #cbd5e1;
            border-radius: 10px;
            background: #f8fafc;
            color: #475569;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
            white-space: nowrap;
        }
        .type-tab-btn.active {
            background: #0f172a;
            border-color: #0f172a;
            color: #ffffff;
            box-shadow: 0 3px 10px rgba(15,23,42,0.2);
        }

        /* 🌟 특별한 혜택 안내 한줄 버튼 */
        .benefit-banner-btn {
            margin: 8px 16px 4px;
            padding: 11px 14px;
            background: linear-gradient(135deg, #fef3c7 0%, #fde68a 100%);
            border: 1.5px solid #f59e0b;
            border-radius: 10px;
            color: #92400e;
            font-size: 13px;
            font-weight: 900;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 2px 6px rgba(245,158,11,0.15);
            transition: 0.2s;
        }
        .benefit-banner-btn:active { opacity: 0.8; }

        .guide-box {
            margin: 10px 16px;
            padding: 12px 14px;
            background: #f1f5f9;
            border-radius: 12px;
            font-size: 13px;
            line-height: 1.5;
            color: #334155;
            font-weight: 700;
        }

        .form-section {
            margin: 14px 16px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.02);
        }
        .section-title {
            font-size: 16px;
            font-weight: 900;
            color: #075cab;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-label {
            font-size: 13px;
            font-weight: 800;
            color: #475569;
            margin-bottom: 5px;
            display: block;
        }
        .input-field {
            width: 100%;
            padding: 11px 12px;
            border: 1px solid #cbd5e1;
            border-radius: 10px;
            font-size: 15px;
            background: #f8fafc;
            box-sizing: border-box;
            outline: none;
            color: #0f172a;
        }
        .input-field:focus {
            border-color: #075cab;
            background: #ffffff;
        }

        /* 숍 업종 펼침 그리드 */
        .shop-category-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 6px;
            margin-top: 6px;
            margin-bottom: 12px;
        }
        .shop-cat-btn {
            padding: 8px 4px;
            border: 1.5px solid #cbd5e1;
            border-radius: 8px;
            background: #f1f5f9;
            color: #334155;
            font-size: 12px;
            font-weight: 800;
            cursor: pointer;
            text-align: center;
            transition: 0.2s;
        }
        .shop-cat-btn.selected {
            background: #ea580c;
            border-color: #ea580c;
            color: #ffffff;
            box-shadow: 0 2px 8px rgba(234,88,12,0.3);
        }

        .bottom-action-dock {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 480px;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            z-index: 200;
            box-sizing: border-box;
            padding: 10px 16px 12px;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .create-submit-btn {
            width: 100%;
            height: 48px;
            background: #16a34a;
            color: #ffffff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(22,163,74,0.3);
            transition: 0.2s;
        }
        .create-submit-btn:active { background: #15803d; }

        .admob-large-box {
            width: 100%;
            height: 80px;
            background: #f1f5f9;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #64748b;
            font-size: 12.5px;
            font-weight: 800;
            border: 1px dashed #cbd5e1;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="page-container">

    <header class="sub-header">
        <button class="back-btn" type="button" onclick="history.back()">←</button>
        <span style="font-size: 16px; font-weight: 900;" id="headerSubTitle">예톡 서비스 센터</span>
        <button class="home-icon-btn" type="button" onclick="goToIndex()">🏠</button>
    </header>

    <!-- 상단 통합 버튼 타이틀 -->
    <div class="top-unified-title-box">
        👤 예톡 통합 회원가입 및 무료 홈 제작
    </div>

    <!-- 4단 탭 (아이콘 제거, 글자 또렷하게) -->
    <div class="type-tab-container">
        <button class="type-tab-btn active" type="button" id="tabJoin" onclick="switchCreateMode('join')">회원가입</button>
        <button class="type-tab-btn" type="button" id="tabChurch" onclick="switchCreateMode('church')">교회제작</button>
        <button class="type-tab-btn" type="button" id="tabClinic" onclick="switchCreateMode('clinic')">의원제작</button>
        <button class="type-tab-btn" type="button" id="tabShop" onclick="switchCreateMode('shop')">숍제작</button>
    </div>

    <!-- 🌟 특별한 혜택 안내 한줄 버튼 (클릭 시 안심 안내 팝업) -->
    <div class="benefit-banner-btn" onclick="showBenefitPopup()">
        ✨ [특별 혜택] 가입 후 일정 기간 후 결제되기 전 자동 비활성화되니 안심하고 제작하세요!
    </div>

    <div class="guide-box" id="guideTextBox">
        먼저 회원가입을 해두시면, 나중에 홈 제작 시 입력하신 정보가 자동으로 연동됩니다.
    </div>

    <!-- 입력 폼 영역 -->
    <div class="form-section">
        <div class="section-title" id="sectionTitleText">👤 회원 기본정보</div>

        <div class="input-group">
            <label class="input-label" id="labelName">이름(성함) *</label>
            <input type="text" class="input-field" id="inputName" placeholder="예: 최주은">
        </div>

        <div class="input-group" id="groupIdField">
            <label class="input-label">아이디 (본인 이름 자동입력, 수정 가능) *</label>
            <input type="text" class="input-field" id="inputId" placeholder="아이디를 입력하세요">
        </div>

        <div class="input-group" id="groupPassword">
            <label class="input-label">비밀번호 (4자리 이상) *</label>
            <input type="password" class="input-field" id="inputPassword" placeholder="비밀번호 4자리 이상 입력">
        </div>

        <div class="input-group">
            <label class="input-label" id="labelLeader">휴대전화번호 *</label>
            <input type="tel" class="input-field" id="inputLeader" placeholder="010-0000-0000">
        </div>

        <!-- 숍 업종 선택 영역 -->
        <div class="input-group" id="groupShopCategories" style="display: none;">
            <label class="input-label">숍 업종 선택 (카테고리) *</label>
            <div class="shop-category-grid">
                <button type="button" class="shop-cat-btn selected" onclick="selectShopCategory(this, '커피숍/카페')">커피숍/카페</button>
                <button type="button" class="shop-cat-btn" onclick="selectShopCategory(this, '일반음식점/식당')">일반음식점</button>
                <button type="button" class="shop-cat-btn" onclick="selectShopCategory(this, '인테리어/시공')">인테리어</button>
                <button type="button" class="shop-cat-btn" onclick="selectShopCategory(this, '뷰티/헤어/네일')">뷰티/헤어</button>
                <button type="button" class="shop-cat-btn" onclick="`건강/의료용품`" onclick="selectShopCategory(this, '건강/의료용품')">건강/용품</button>
                <button type="button" class="shop-cat-btn" onclick="selectShopCategory(this, '기타 일반상점')">기타상점</button>
            </div>
        </div>

        <div class="input-group" id="groupAddress">
            <label class="input-label" id="labelAddress">소속 주소지 (구 까지만) *</label>
            <input type="text" class="input-field" id="inputAddress" placeholder="예: 서울시 강남구">
        </div>
    </div>

    <!-- 하단 도크 -->
    <div class="bottom-action-dock">
        <button class="create-submit-btn" id="submitCreateBtn" type="button" onclick="executeAction()">+ 예톡 회원가입 완료</button>
        <div class="admob-large-box">
            Google AdMob 프리미엄 확장형 배너 (80px)
        </div>
    </div>

</div>

<script>
    let currentMode = 'join';
    let selectedShopCategoryName = '커피숍/카페';

    function goToIndex() {
        location.href = "https://appassets.androidplatform.net/assets/index.html";
    }

    // 혜택 안내 팝업 함수
    function showBenefitPopup() {
        alert("✨ [예톡 안심 서비스 안내]\n\n가입 후 무료 체험 기간이 지나 결제되기 전에는 자동으로 비활성화되므로, 비용 청구 걱정 없이 안심하고 마음껏 홈페이지를 제작하고 테스트해 보실 수 있습니다!");
    }

    document.addEventListener("DOMContentLoaded", () => {
        const nameInput = document.getElementById("inputName");
        const idInput = document.getElementById("inputId");

        if (nameInput && idInput) {
            nameInput.addEventListener("input", () => {
                if (currentMode === 'join') {
                    idInput.value = nameInput.value;
                }
            });
        }
    });

    function selectShopCategory(btn, categoryName) {
        document.querySelectorAll('.shop-cat-btn').forEach(b => b.classList.remove('selected'));
        btn.classList.add('selected');
        selectedShopCategoryName = categoryName;
    }

    function switchCreateMode(mode) {
        currentMode = mode;

        document.getElementById("tabJoin").classList.remove("active");
        document.getElementById("tabChurch").classList.remove("active");
        document.getElementById("tabClinic").classList.remove("active");
        document.getElementById("tabShop").classList.remove("active");

        const headerSubTitle = document.getElementById("headerSubTitle");
        const guideTextBox = document.getElementById("guideTextBox");
        const sectionTitleText = document.getElementById("sectionTitleText");
        const labelName = document.getElementById("labelName");
        const inputName = document.getElementById("inputName");
        const groupIdField = document.getElementById("groupIdField");
        const groupPassword = document.getElementById("groupPassword");
        const labelLeader = document.getElementById("labelLeader");
        const inputLeader = document.getElementById("inputLeader");
        const groupShopCategories = document.getElementById("groupShopCategories");
        const groupAddress = document.getElementById("groupAddress");
        const inputAddress = document.getElementById("inputAddress");
        const submitCreateBtn = document.getElementById("submitCreateBtn");

        const savedPhone = localStorage.getItem("yetalkSavedPhone") || "";

        if (mode === 'join') {
            document.getElementById("tabJoin").classList.add("active");
            headerSubTitle.textContent = "예톡 회원가입 센터";
            guideTextBox.textContent = "먼저 회원가입을 해두시면, 나중에 홈 제작 시 입력하신 정보가 자동으로 연동됩니다.";
            sectionTitleText.textContent = "👤 회원 기본정보";
            labelName.textContent = "이름(성함) *";
            inputName.placeholder = "예: 최주은";
            groupIdField.style.display = "block";
            groupPassword.style.display = "block";
            labelLeader.textContent = "휴대전화번호 *";
            inputLeader.placeholder = "010-0000-0000";
            groupShopCategories.style.display = "none";
            groupAddress.style.display = "block";
            document.getElementById("labelAddress").textContent = "거주 지역 (구 까지만) *";
            inputAddress.placeholder = "예: 서울시 강남구";
            submitCreateBtn.textContent = "+ 예톡 회원가입 완료";
            submitCreateBtn.style.background = "#075cab";
        }
        else {
            if (savedPhone) {
                inputLeader.value = savedPhone;
            }

            groupIdField.style.display = "none";
            groupPassword.style.display = "none";
            groupAddress.style.display = "block";

            if (mode === 'church') {
                document.getElementById("tabChurch").classList.add("active");
                headerSubTitle.textContent = "교회 홈페이지 제작";
                guideTextBox.textContent = "회원 가입 정보가 자동 연동되었습니다. 교회명과 구 단위 주소만 입력하세요.";
                sectionTitleText.textContent = "🟢 교회 상세정보";
                labelName.textContent = "교회명 *";
                inputName.placeholder = "예: 예톡행복한교회";
                labelLeader.textContent = "교회 대표전화번호 (자동연동) *";
                document.getElementById("labelAddress").textContent = "교회 위치 (구 까지만) *";
                inputAddress.placeholder = "예: 서울시 마포구";
                groupShopCategories.style.display = "none";
                submitCreateBtn.textContent = "+ 교회 홈페이지 만들기";
                submitCreateBtn.style.background = "#16a34a";
            }
            else if (mode === 'clinic') {
                document.getElementById("tabClinic").classList.add("active");
                headerSubTitle.textContent = "의원 홈페이지 제작";
                guideTextBox.textContent = "회원 가입 정보가 자동 연동되었습니다. 병원명과 진료과목을 입력해 주세요.";
                sectionTitleText.textContent = "🔵 의원 상세정보";
                labelName.textContent = "의원/병원명 *";
                inputName.placeholder = "예: 행복내과피부과의원";
                labelLeader.textContent = "원장실 연락처 (자동연동) *";
                document.getElementById("labelAddress").textContent = "병원 위치 (구 까지만) *";
                inputAddress.placeholder = "예: 서울시 서초구";
                groupShopCategories.style.display = "none";
                submitCreateBtn.textContent = "+ 의원 홈페이지 만들기";
                submitCreateBtn.style.background = "#0284c7";
            }
            else if (mode === 'shop') {
                document.getElementById("tabShop").classList.add("active");
                headerSubTitle.textContent = "숍 홈페이지 제작";
                guideTextBox.textContent = "원하시는 업종을 터치하여 선택하신 후, 매장명과 구 단위 위치를 입력하세요.";
                sectionTitleText.textContent = "🟠 숍(매장) 업종 및 상세정보";
                labelName.textContent = "상호명(매장 이름) *";
                inputName.placeholder = "예: 예톡프리미엄숍";
                labelLeader.textContent = "매장 연락처 (자동연동) *";
                document.getElementById("labelAddress").textContent = "매장 위치 (구 까지만) *";
                inputAddress.placeholder = "예: 서울시 송파구";
                groupShopCategories.style.display = "block";
                submitCreateBtn.textContent = "+ 숍 홈페이지 만들기";
                submitCreateBtn.style.background = "#ea580c";
            }
        }
    }

    function executeAction() {
        const name = document.getElementById("inputName").value.trim();
        const phone = document.getElementById("inputLeader").value.trim();
        const password = document.getElementById("inputPassword").value.trim();

        if(!name || !phone) {
            alert("필수 입력 항목(이름 및 연락처)을 채워주세요.");
            return;
        }

        if(currentMode === 'join') {
            if(password.length < 4) {
                alert("비밀번호는 4자리 이상으로 입력해 주세요.");
                return;
            }
            localStorage.setItem("yetalkSavedUserName", name);
            localStorage.setItem("yetalkSavedPhone", phone);
            alert(name + "님, 회원가입이 완료되었습니다! 이제 상단의 [교회/의원/숍제작]을 누르시면 정보가 연동됩니다.");
        } else {
            alert(name + " 홈페이지 개설 신청이 정상 접수되었습니다!");
        }
    }
</script>

</body>
</html>
