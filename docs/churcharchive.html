<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>말씀과 보물창고 | 예톡행복한교회</title>
    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="church_theme.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px) + 38px, 42px);
            --header-base-h: 52px;
            --header-h: calc(var(--header-base-h) + var(--safe-top));
            --bottom-bar-h: 154px;
            --primary: #1d4ed8;
            --primary-amber: #d97706;
            --border-line: #cbd5e1;
            --text-dark: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; overflow: hidden;
            background: #0f172a; font-family: "Pretendard", -apple-system, sans-serif;
        }

        .archive-app-shell {
            width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto;
            display: flex; flex-direction: column; position: relative; background: #ffffff;
        }

        /* 1. 상단 헤더 */
        .archive-header {
            height: var(--header-h); background: #ffffff; border-bottom: 1.5px solid var(--border-line);
            display: flex; justify-content: space-between; align-items: center; padding: var(--safe-top) 14px 0 14px;
            flex-shrink: 0; z-index: 100;
        }
        .btn-header-back {
            background: none; border: none; font-size: 26px; font-weight: 900;
            color: #334155; cursor: pointer; line-height: 1; padding: 4px;
        }
        .archive-header-title { font-size: 16.5px; font-weight: 950; color: var(--text-dark); display: flex; align-items: center; gap: 5px; }

        .dual-admin-btn-group {
            display: inline-flex; align-items: center; background: #dc2626; border-radius: 9999px;
            padding: 2px; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
        }
        .btn-admin-room {
            background: transparent; border: none; color: #ffffff; font-size: 11px; font-weight: 900;
            padding: 4px 8px; cursor: pointer; border-right: 1px solid rgba(255, 255, 255, 0.35);
        }
        .btn-admin-edit {
            background: transparent; color: #fef08a; border: none;
            font-size: 11px; font-weight: 900; padding: 4px 8px; cursor: pointer;
        }

        /* 2. 🌟 가로 2줄 동그라미(알약) 탭 바 */
        .archive-nav-tabs {
            background: #fffbeb; border-bottom: 1.5px solid #fef3c7;
            display: flex; flex-direction: column; gap: 6px;
            padding: 8px 10px; flex-shrink: 0; z-index: 90;
        }
        .archive-tab-row {
            display: flex; gap: 5px; overflow-x: auto; white-space: nowrap; scrollbar-width: none;
        }
        .archive-tab-row::-webkit-scrollbar { display: none; }
        .arc-tab-chip {
            background: #ffffff; border: 1.2px solid #fde68a; color: #92400e;
            font-size: 11.5px; font-weight: 850; padding: 5px 11px; border-radius: 16px;
            cursor: pointer; flex-shrink: 0; transition: all 0.15s;
        }
        .arc-tab-chip:active { transform: scale(0.96); }
        .arc-tab-chip.active {
            background: var(--primary-amber) !important; color: #ffffff !important; border-color: var(--primary-amber) !important;
            font-weight: 900; box-shadow: 0 2px 6px rgba(217, 119, 6, 0.35);
        }

        /* 3. 본문 뷰포트 */
        .archive-scroll-viewport {
            flex: 1; overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding: 12px 14px 100px 14px;
            display: flex; flex-direction: column; justify-content: flex-start;
        }

        .page-title-box {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1.5px solid #e2e8f0; padding-bottom: 8px; flex-shrink: 0;
        }
        .page-main-title { font-size: 16px; font-weight: 950; color: #0f172a; display: flex; align-items: center; gap: 6px; }

        /* 🌟 [사용자 요청] 진짜 게시판 한 줄 리스트 (Image 4 스타일) */
        .arc-item-list {
            display: flex; flex-direction: column; gap: 0; flex: 1; margin: 8px 0;
            background: #ffffff; border: 1.5px solid #cbd5e1; border-radius: 12px;
            overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,0.05);
        }
        .arc-list-row {
            display: flex; align-items: center; justify-content: space-between; gap: 8px;
            padding: 12px 14px; border-bottom: 1px solid #f1f5f9; cursor: pointer;
            transition: background 0.15s ease;
        }
        .arc-list-row:last-child { border-bottom: none; }
        .arc-list-row:hover, .arc-list-row:active { background: #f8fafc; }
        .arc-row-left {
            display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; overflow: hidden;
        }
        .arc-row-date {
            font-size: 11px; font-weight: 850; color: #64748b; font-family: -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f1f5f9; padding: 2px 6px; border-radius: 4px; flex-shrink: 0;
        }
        .arc-row-title {
            font-size: 13.5px; font-weight: 850; color: #0f172a; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis; flex: 1;
        }
        .arc-row-right {
            display: flex; align-items: center; gap: 6px; flex-shrink: 0; font-size: 13px;
        }
        .arc-row-icon {
            font-size: 13px; color: #0284c7;
        }

        /* 🌟 하단 페이징 바 [이전] [1 / N] [다음] */
        .arc-pagination-bar {
            display: flex; align-items: center; justify-content: space-between;
            background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 10px;
            padding: 6px 10px; flex-shrink: 0; margin-top: 4px;
        }
        .btn-arc-page {
            background: #ffffff; border: 1px solid #cbd5e1; border-radius: 8px;
            padding: 6px 14px; font-size: 12px; font-weight: 900; color: #334155;
            cursor: pointer; transition: 0.15s;
        }
        .btn-arc-page:active { background: #e2e8f0; }
        .btn-arc-page:disabled { opacity: 0.4; cursor: not-allowed; }
        .arc-page-info { font-size: 12.5px; font-weight: 900; color: #0f172a; }

        /* 본문 스크롤 영역 하단 패딩 */

        /* 상세 보기 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8);
            z-index: 9000; align-items: center; justify-content: center; padding: 10px;
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            background: #ffffff; width: 100%; max-width: 490px; height: 90vh;
            border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .modal-body-scroll { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }

        /* 🌟 인쇄 전용 스타일 (성도들이 나눔지, 가정예배문을 깨끗하게 인쇄할 수 있도록 최적화) */
        @media print {
            body, html { background: #ffffff !important; color: #000000 !important; overflow: visible !important; height: auto !important; }
            .archive-header, .archive-nav-tabs, .archive-scroll-viewport, .yetalk-toast, .dual-admin-btn-group, .fixed-action-subbar, .church-fixed-footer-nav, .btn-arc-page, .modal-overlay:not(#modalArchiveDetail), .admob-fixed-footer {
                display: none !important;
            }
            #modalArchiveDetail {
                display: block !important; position: static !important; background: transparent !important; padding: 0 !important;
            }
            #modalArchiveDetail .modal-card {
                border: none !important; box-shadow: none !important; max-width: 100% !important; height: auto !important; padding: 0 !important;
            }
            #modalArchiveDetail button { display: none !important; }
        }

        body[data-theme="white"] { background: #fbf9f4 !important; color: #0f172a !important; }
        body[data-theme="white"] .archive-app-shell { background: #fbf9f4 !important; }
        body[data-theme="white"] .archive-header { background: #ffffff !important; border-bottom: 1.5px solid #cbd5e1 !important; }
        body[data-theme="white"] .archive-header-title { color: #0f172a !important; font-weight: 950 !important; }
        body[data-theme="white"] .archive-nav-tabs { background: #ffffff !important; border-bottom: 1.5px solid #cbd5e1 !important; }
        body[data-theme="white"] .arc-tab-chip { background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #334155 !important; font-weight: 850 !important; }
        body[data-theme="white"] .arc-tab-chip.active { background: #d97706 !important; color: #ffffff !important; border-color: #d97706 !important; font-weight: 950 !important; }
        body[data-theme="white"] .page-title-box { border-bottom: 1.5px solid #cbd5e1 !important; }
        body[data-theme="white"] .page-main-title { color: #0f172a !important; font-weight: 950 !important; }
        body[data-theme="white"] .arc-item-card { background: #ffffff !important; border-color: #cbd5e1 !important; box-shadow: 0 2px 8px rgba(0,0,0,0.04) !important; }
        body[data-theme="white"] .arc-item-title { color: #0f172a !important; font-weight: 900 !important; }
        body[data-theme="white"] .arc-item-content { color: #475569 !important; }
        body[data-theme="white"] .arc-pagination-bar { background: #ffffff !important; border-color: #cbd5e1 !important; }
        body[data-theme="white"] .arc-page-info { color: #0f172a !important; }

        /* 🌟 [사용자 요청] 컴퓨터(PC) 환경: 애드몹 전면 숨김 */
        @media (min-width: 768px) {
            .archive-detail-admob-box,
            .admob-fixed-footer,
            [class*="admob"],
            [id*="admob"] {
                display: none !important;
                height: 0 !important;
                overflow: hidden !important;
            }
        }
    </style>
    <script>
        (function() {
            const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
            document.documentElement.setAttribute('data-theme', savedTheme);
        })();
    </script>
</head>
<body>

<div class="archive-app-shell">

    <!-- 1. 상단 헤더 -->
    <header class="archive-header">
        <button type="button" class="btn-header-back" onclick="goBackToMain()" aria-label="뒤로가기">‹</button>
        <div class="archive-header-title">
            <span>🎁</span> <strong>보물창고</strong>
        </div>
        <div class="dual-admin-btn-group">
            <button type="button" class="btn-admin-room" onclick="location.href='churchadmin.html'" title="교회 관리실">◀ 관리실</button>
            <button type="button" class="btn-admin-edit" onclick="openArchiveUploadModal()" title="보물자료 및 나눔지 올리기">자료올리기 ▶</button>
        </div>
    </header>

    <!-- 2. 🌟 가로 2줄 긴 동그라미(알약) 탭 바 (요청 8대 분류 + 전체) -->
    <nav class="archive-nav-tabs" id="archiveTabs">
        <!-- 1행 -->
        <div class="archive-tab-row">
            <button type="button" class="arc-tab-chip active" data-cat="all">📋 전체 보관함</button>
            <button type="button" class="arc-tab-chip" data-cat="주일예배">✝️ 주일예배</button>
            <button type="button" class="arc-tab-chip" data-cat="마을(셀,목장)나눔지">📑 마을나눔지</button>
            <button type="button" class="arc-tab-chip" data-cat="가정예배문">🏡 가정예배문</button>
        </div>
        <!-- 2행 -->
        <div class="archive-tab-row">
            <button type="button" class="arc-tab-chip" data-cat="수요예배">📖 수요예배</button>
            <button type="button" class="arc-tab-chip" data-cat="금요기도회">🔥 금요기도회</button>
            <button type="button" class="arc-tab-chip" data-cat="특별예배">✨ 특별예배</button>
            <button type="button" class="arc-tab-chip" data-cat="행사사진첩">📷 행사사진첩</button>
            <button type="button" class="arc-tab-chip" data-cat="목사님의 예수동행">🕊️ 목사님 말씀</button>
        </div>
    </nav>

    <!-- 3. 본문 뷰포트 -->
    <main class="archive-scroll-viewport" id="archiveViewport">

        <section id="sec_arc_page1">
            <div class="page-title-box">
                <span class="page-main-title" id="dispCurrentCatTitle">📋 전체 보물자료 목록</span>
                <small style="font-size:11.5px; color:#64748b;" id="txtCatCount">0건</small>
            </div>

            <!-- 🌟 한 번에 4개씩 노출되는 자료 리스트 -->
            <div class="arc-item-list" id="arcItemList"></div>

            <!-- 🌟 이전 / 1 / N / 다음 페이징 컨트롤 -->
            <div class="arc-pagination-bar">
                <button type="button" class="btn-arc-page" id="btnPagePrev" onclick="changeArchivePage(-1)">◀ 이전</button>
                <span class="arc-page-info" id="txtPageInfo">1 / 1</span>
                <button type="button" class="btn-arc-page" id="btnPageNext" onclick="changeArchivePage(1)">다음 ▶</button>
            </div>
        </section>

    </main>

    <!-- 자료 상세 보기 모달 -->
    <div class="modal-overlay" id="modalArchiveDetail">
        <div class="modal-card" id="arcDetailModalCard">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #e2e8f0; padding-bottom:8px;">
                <span id="arcDetailBadge" class="arc-cat-tag">분류</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <button type="button" onclick="deleteCurrentArchiveRecord()" style="background:#fee2e2; border:1px solid #fca5a5; color:#dc2626; border-radius:8px; font-size:12px; font-weight:900; padding:4px 10px; cursor:pointer;" title="자료 삭제">🗑️ 삭제</button>
                    <button type="button" style="background:none; border:none; font-size:22px; cursor:pointer; color:#64748b;" onclick="closeModal('modalArchiveDetail')">×</button>
                </div>
            </div>
            <div class="modal-body-scroll" id="arcDetailModalBody">
                <h1 style="font-size:17px; font-weight:950; color:#0f172a; line-height:1.35;" id="arcDetailTitle"></h1>
                <div style="font-size:11.5px; color:#94a3b8; font-weight:700;" id="arcDetailDate"></div>

                <!-- 🌟 주일예배 영상 등 유튜브 플레이어 박스 (화면 꽉 채움) -->
                <div id="arcDetailYtBox" style="display:none; width:100%; border-radius:12px; overflow:hidden; margin-bottom:8px; background:#000;"></div>

                <img id="arcDetailImg" style="width:100%; border-radius:8px; display:none;" alt="첨부자료">
                <div id="arcDetailFileBox" style="display:none; background:#f0f9ff; border:1px solid #bae6fd; padding:10px; border-radius:8px;">
                    <a href="javascript:void(0)" id="arcDetailFileLink" style="font-size:12.5px; font-weight:900; color:#0284c7; text-decoration:underline;">첨부 문서 다운로드</a>
                </div>
                <div style="font-size:14px; line-height:1.8; color:#1e293b; white-space:pre-line;" id="arcDetailContent"></div>

                <!-- 🌟 [사용자 요청] 겹치는 중복 애드몹 제거: 기존 하단 애드몹만 유지 -->
                <div class="archive-detail-admob-box" style="display:none !important;"></div>
            </div>

            <!-- 🌟 [사용자 요청] 영상 예배 전용 액션 버튼: [◀ 닫기], [🔍 화면확대], [🔒 화면고정], [🗑️ 삭제] -->
            <div id="arcVideoActionFooter" style="display:none; justify-content:space-between; align-items:center; gap:8px; border-top:1.5px solid #e2e8f0; padding-top:10px;">
                <button type="button" class="btn-arc-page" style="flex:1; background:#f1f5f9; color:#0f172a; border:1px solid #cbd5e1; font-weight:900; padding:10px 4px; border-radius:10px; font-size:13px; cursor:pointer;" onclick="closeModal('modalArchiveDetail')">
                    ◀ 닫기
                </button>
                <button type="button" class="btn-arc-page" style="flex:1; background:#0284c7; color:#ffffff; border:none; font-weight:950; padding:10px 4px; border-radius:10px; font-size:13px; cursor:pointer; box-shadow:0 2px 6px rgba(2,132,199,0.35);" onclick="toggleArchiveVideoFullscreen()">
                    🔍 화면확대
                </button>
                <button type="button" class="btn-arc-page" id="btnArcScreenLock" style="flex:1; background:#1e293b; color:#fde047; border:none; font-weight:950; padding:10px 4px; border-radius:10px; font-size:13px; cursor:pointer; box-shadow:0 2px 6px rgba(0,0,0,0.2);" onclick="toggleArchiveScreenLock()">
                    🔒 화면고정
                </button>
                <button type="button" class="btn-arc-page" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; font-weight:900; padding:10px 10px; border-radius:10px; font-size:13px; cursor:pointer;" onclick="deleteCurrentArchiveRecord()">
                    🗑️ 삭제
                </button>
            </div>

            <!-- 🌟 일반 문서/나눔지 인쇄 및 삭제/닫기 버튼 바 -->
            <div id="arcDocActionFooter" style="display:flex; justify-content:space-between; align-items:center; border-top:1px solid #e2e8f0; padding-top:8px;">
                <button type="button" class="btn-arc-page" style="background:#0284c7; color:white; border:none; font-weight:950; padding:8px 16px; border-radius:8px; box-shadow:0 2px 6px rgba(2,132,199,0.35);" onclick="window.print()">🖨️ 인쇄하기 (성도용 출력)</button>
                <div style="display:flex; gap:6px;">
                    <button type="button" class="btn-arc-page" style="background:#fee2e2; color:#dc2626; border:1px solid #fca5a5; font-weight:900;" onclick="deleteCurrentArchiveRecord()">🗑️ 삭제</button>
                    <button type="button" class="btn-arc-page" onclick="closeModal('modalArchiveDetail')">닫기</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 🌟 관리자 자료 올리기 모달 (주일예배 영상, 소모임 나눔지, 가정예배문, 사진/파일 등) -->
    <div class="modal-overlay" id="modalArchiveUpload">
        <div class="modal-card" style="max-height:88vh; overflow-y:auto;">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #e2e8f0; padding-bottom:8px;">
                <strong style="color:#d97706; font-size:16px;">🎁 보물자료 / 나눔지 올리기</strong>
                <button type="button" style="background:none; border:none; font-size:22px; cursor:pointer;" onclick="closeModal('modalArchiveUpload')">×</button>
            </div>
            <div class="modal-body-scroll" style="display:flex; flex-direction:column; gap:10px;">
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">1. 자료 분류 선택</label>
                    <select id="inpArcUploadCat" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px; font-weight:750; background:#f8fafc;">
                        <option value="주일예배">✝️ 주일예배 (영상 보관)</option>
                        <option value="마을(셀,목장)나눔지" selected>📑 마을(소모임) 나눔지</option>
                        <option value="가정예배문">🏡 가정예배문</option>
                        <option value="수요예배">📖 수요예배</option>
                        <option value="금요기도회">🔥 금요기도회</option>
                        <option value="특별예배">✨ 특별예배</option>
                        <option value="행사사진첩">📷 행사사진첩</option>
                        <option value="목사님의 예수동행">🕊️ 목사님의 예수동행</option>
                    </select>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">2. 자료 제목 (필수)</label>
                    <input type="text" id="inpArcUploadTitle" placeholder="예: 10월 3주차 소모임 나눔지, 주일 대예배 말씀" style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px; font-weight:750;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">3. 유튜브 영상 주소 (주일예배 영상 등 선택)</label>
                    <input type="text" id="inpArcUploadYt" placeholder="https://youtube.com/watch?v=... 또는 youtu.be/..." style="width:100%; padding:8px 10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13px;">
                </div>
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">4. 사진 / 이미지 첨부 (선택)</label>
                    <input type="file" id="inpArcUploadImgFile" accept="image/*" style="font-size:12px;" onchange="handleArchiveUploadPhoto(event)">
                    <div id="arcUploadPhotoPreviewBox" style="display:none; margin-top:6px; max-height:140px; border-radius:8px; overflow:hidden;">
                        <img id="arcUploadPhotoPreviewImg" style="width:100%; max-height:140px; object-fit:contain;" alt="미리보기">
                    </div>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">5. 문서 / 인쇄용 파일 첨부 (PDF, HWP, DOC 등)</label>
                    <input type="file" id="inpArcUploadDocFile" style="font-size:12px;" onchange="handleArchiveUploadDoc(event)">
                    <span id="arcUploadDocBadge" style="display:none; font-size:11.5px; color:#0284c7; font-weight:800; margin-top:4px;"></span>
                </div>
                <div>
                    <label style="font-size:12px; font-weight:850; color:#334155; display:block; margin-bottom:3px;">6. 상세 내용 및 성도 나눔 본문</label>
                    <textarea id="inpArcUploadContent" placeholder="성도들이 읽고 인쇄할 수 있는 나눔 본문 또는 순서지 내용을 작성하세요." style="width:100%; min-height:120px; padding:10px; border-radius:8px; border:1px solid #cbd5e1; font-size:13.5px; line-height:1.6; font-family:inherit; resize:vertical;"></textarea>
                </div>
            </div>
            <div style="display:flex; justify-content:flex-end; gap:8px; border-top:1px solid #e2e8f0; padding-top:8px;">
                <button type="button" class="btn-arc-page" onclick="closeModal('modalArchiveUpload')">취소</button>
                <button type="button" class="btn-arc-page" style="background:#d97706; color:white; border:none; font-weight:900;" onclick="submitArchiveUpload()">보물자료 등록 완료</button>
            </div>
        </div>
    </div>

    <div class="yetalk-toast" id="yetalkToast"></div>

</div>

<script>
    const ARCHIVE_STORAGE_KEY = "yetalk_church_archive_records";
    const ITEMS_PER_PAGE = 12; // 🌟 진짜 게시판 1줄 리스트에 맞춰 12개씩 노출

    let fullArchiveList = [];
    let currentCategory = "all";
    let currentPage = 1;
    let uploadPhotoData = null;
    let uploadFileData = null;
    let uploadFileName = null;

    const DEFAULT_ARCHIVE_SEEDS = [
        { id: "a1", category: "주일예배", title: "하나님의 사랑과 성도의 사명 (주일 대예배 실황)", content: "독생자를 주신 십자가의 확실한 사랑을 기억하며 세상 속에서 빛과 소금의 사명을 다합시다.\n\n[말씀 요약]\n1. 십자가의 참된 사랑을 날마다 기억하기\n2. 세상 속에서 화평케 하는 자로 서기\n3. 사랑의 공동체로 세상을 섬기기\n\n성도님들의 삶의 현장 속에 풍성한 은혜와 평강이 넘쳐나기를 기도합니다.", date: "2026-09-20", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", img: null },
        { id: "a2", category: "마을(셀,목장)나눔지", title: "9월 3주차 사랑방 소모임 나눔지 (성도 인쇄용)", content: "한 주간 염려 대신 주님을 신뢰하고 승리했던 감사 제목을 서로 나누어 봅시다.\n\n[모임 진행 순서]\n1. 마음 열기 찬송: '내게 있는 향유 옥합'\n2. 말씀 나눔: 이번 주 주일 설교를 듣고 결단한 점\n3. 삶의 나눔: 한 주간 주님의 손길을 경험한 감사 제목 2가지\n4. 중보 기도: 마을 식구들의 건강과 일터, 전도 대상자를 위한 합심기도\n\n(하단 '인쇄하기' 버튼을 누르면 A4 종이로 즉시 출력할 수 있습니다)", date: "2026-09-20", img: null },
        { id: "a3", category: "가정예배문", title: "믿음의 명문 가정을 세우는 가정예배 순서지", content: "가족이 함께 둘러앉아 찬양하고 한 주간 서로를 축복하는 은혜로운 가정예배 순서지입니다.\n\n■ 묵도 : 다함께 조용히 기도\n■ 찬송 : 559장 (사철에 봄바람 불어 잇고)\n■ 신앙고백 : 사도신경\n■ 성경봉독 : 시편 128편 1~6절\n■ 말씀나눔 : 여호와를 경외하는 가정의 복\n■ 가족나눔 : 이번 주 가족들에게 고마웠던 점 이야기하기\n■ 축복과 기도 : 부모가 자녀의 머리에 손을 얹고 축복 기도\n■ 주기도문 : 다함께", date: "2026-09-18", img: null },
        { id: "a4", category: "수요예배", title: "수요 성경 강해: 믿음의 반석 위에 서라", content: "비가 내리고 바람이 불어도 결코 무너지지 않는 든든한 반석 위에 집을 지은 지혜로운 성도가 됩시다.", date: "2026-09-16", img: null },
        { id: "a5", category: "금요기도회", title: "성령의 불길로 타오르는 심야 치유 기도회", content: "상한 마음을 치유하시고 육신의 연약함을 만지시는 주님의 강력한 손길을 사모합시다.", date: "2026-09-14", img: null },
        { id: "a6", category: "특별예배", title: "온세대 연합 찬양 축제 및 헌신예배", content: "어린아이부터 어르신까지 온 세대가 한목소리로 찬양하며 하나님께 영광을 돌립니다.", date: "2026-09-12", img: null },
        { id: "a7", category: "행사사진첩", title: "가을맞이 성도 체육대회 및 교제 한마당", content: "맑고 푸른 하늘 아래 온 성도가 하나 되어 기쁨과 웃음으로 사랑을 나누었습니다.", date: "2026-09-10", img: null },
        { id: "a8", category: "목사님의 예수동행", title: "오늘 하루, 주님과 함께 걷는 감사 일기", content: "“내가 너희를 고아와 같이 버려두지 아니하고 너희에게로 오리라 (요 14:18)” 늘 곁에 계신 주님을 의식하며 걸읍시다.", date: "2026-09-08", img: null }
    ];

    document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
        document.body.setAttribute('data-theme', savedTheme);

        loadArchiveData();
        initCategoryTabs();
        renderCurrentCategoryView();
    });

    function loadArchiveData() {
        let stored = [];
        try {
            stored = JSON.parse(localStorage.getItem(ARCHIVE_STORAGE_KEY)) || [];
        } catch(e) { stored = []; }

        // 🌟 [사용자 요청] 테스트로 입력되었던 한 글자('가') 및 빈 제목 자료 자동 필터링 & 정리
        stored = stored.filter(item => item && item.title && item.title.trim() !== "가" && item.title.trim() !== "");
        try { localStorage.setItem(ARCHIVE_STORAGE_KEY, JSON.stringify(stored)); } catch(e){}

        const merged = [...stored];
        DEFAULT_ARCHIVE_SEEDS.forEach(seed => {
            if (!merged.some(m => m.title === seed.title)) {
                merged.push(seed);
            }
        });
        fullArchiveList = merged;
    }

    function initCategoryTabs() {
        const chips = document.querySelectorAll(".arc-tab-chip");
        chips.forEach(chip => {
            chip.addEventListener("click", () => {
                chips.forEach(c => c.classList.remove("active"));
                chip.classList.add("active");
                currentCategory = chip.dataset.cat;
                currentPage = 1;
                renderCurrentCategoryView();
                document.getElementById("archiveViewport").scrollTo({ top: 0, behavior: 'smooth' });
            });
        });
    }

    function getFilteredList() {
        if (currentCategory === "all") return fullArchiveList;
        return fullArchiveList.filter(item => {
            const cat = item.category || "";
            return cat.includes(currentCategory) || currentCategory.includes(cat);
        });
    }

    function renderCurrentCategoryView() {
        const container = document.getElementById("arcItemList");
        container.innerHTML = "";

        const filtered = getFilteredList();
        const totalItems = filtered.length;
        const totalPages = Math.max(1, Math.ceil(totalItems / ITEMS_PER_PAGE));

        if (currentPage > totalPages) currentPage = totalPages;

        document.getElementById("dispCurrentCatTitle").innerText = currentCategory === "all" ? "📋 전체 보물자료 목록" : `📁 [${currentCategory}] 보관 목록`;
        document.getElementById("txtCatCount").innerText = `${totalItems}건`;
        document.getElementById("txtPageInfo").innerText = `${currentPage} / ${totalPages}`;

        document.getElementById("btnPagePrev").disabled = (currentPage <= 1);
        document.getElementById("btnPageNext").disabled = (currentPage >= totalPages);

        const startIdx = (currentPage - 1) * ITEMS_PER_PAGE;
        const pagedItems = filtered.slice(startIdx, startIdx + ITEMS_PER_PAGE);

        if (pagedItems.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:45px 10px; color:#94a3b8; font-size:13px; font-weight:800;">등록된 보물자료가 없습니다.</div>`;
            return;
        }

        pagedItems.forEach(item => {
            const row = document.createElement("div");
            row.className = "arc-list-row";
            row.onclick = () => openArchiveDetailModal(item.id || item.title);

            const catLabel = item.category || "보물창고";
            const dateClean = (item.date || "최근").replace(/-/g, "");
            const mediaIcon = item.yt ? "🎬" : (item.fileData ? "💾" : (item.img ? "📷" : "📑"));

            row.innerHTML = `
                <div class="arc-row-left">
                    <span class="arc-row-date">${dateClean}</span>
                    <strong class="arc-row-title">${escapeHtml(item.title)}</strong>
                </div>
                <div class="arc-row-right">
                    <span class="arc-row-icon">${mediaIcon}</span>
                    <span style="font-size:12px; color:#cbd5e1;">›</span>
                </div>
            `;
            container.appendChild(row);
        });
    }

    function changeArchivePage(delta) {
        const filtered = getFilteredList();
        const totalPages = Math.max(1, Math.ceil(filtered.length / ITEMS_PER_PAGE));
        const newPage = currentPage + delta;
        if (newPage >= 1 && newPage <= totalPages) {
            currentPage = newPage;
            renderCurrentCategoryView();
            document.getElementById("archiveViewport").scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function extractYoutubeVideoId(url) {
        if (!url) return null;
        const regExp = /(?:youtu\.be\/|youtube\.com\/(?:embed\/|v\/|watch\?v=|watch\?.+&v=))([\w-]{11})/;
        const match = url.match(regExp);
        return match ? match[1] : null;
    }

    let currentDetailRecord = null;

    function openArchiveDetailModal(idOrTitle) {
        const item = fullArchiveList.find(a => (a.id && a.id === idOrTitle) || a.title === idOrTitle);
        if (!item) return;
        currentDetailRecord = item;

        document.getElementById("arcDetailTitle").innerText = item.title;
        document.getElementById("arcDetailDate").innerText = `${item.date || '최근'} · ${item.source || '예톡행복한교회'}`;
        document.getElementById("arcDetailContent").innerText = item.content;
        document.getElementById("arcDetailBadge").innerText = item.category || "보물자료";

        const ytBox = document.getElementById("arcDetailYtBox");
        const videoId = extractYoutubeVideoId(item.yt || "");
        const contentEl = document.getElementById("arcDetailContent");
        const videoFooter = document.getElementById("arcVideoActionFooter");
        const docFooter = document.getElementById("arcDocActionFooter");

        if (videoId) {
            ytBox.style.display = "block";
            ytBox.style.height = "56vh";
            ytBox.innerHTML = `<iframe id="arcDetailIframe" width="100%" height="100%" src="https://www.youtube.com/embed/${videoId}?autoplay=1&enablejsapi=1&playsinline=1" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; fullscreen" allowfullscreen style="width:100%; height:100%; border-radius:12px; border:none;"></iframe>`;
            // 🌟 [사용자 요청] 영상 예배는 본문 텍스트 숨김 (영상만 꽉 채움)
            contentEl.style.display = "none";
            videoFooter.style.display = "flex";
            docFooter.style.display = "none";
        } else {
            ytBox.style.display = "none";
            ytBox.innerHTML = "";
            contentEl.style.display = "block";
            videoFooter.style.display = "none";
            docFooter.style.display = "flex";
        }

        const imgEl = document.getElementById("arcDetailImg");
        const fileBox = document.getElementById("arcDetailFileBox");
        const fileLink = document.getElementById("arcDetailFileLink");

        if (item.img && !videoId) {
            imgEl.src = item.img;
            imgEl.style.display = "block";
        } else {
            imgEl.style.display = "none";
        }

        if (item.fileName && item.fileData) {
            fileBox.style.display = "block";
            fileLink.innerText = `📄 ${item.fileName} 다운로드`;
            fileLink.onclick = () => {
                const a = document.createElement("a");
                a.href = item.fileData; a.download = item.fileName;
                document.body.appendChild(a); a.click(); document.body.removeChild(a);
            };
        } else {
            fileBox.style.display = "none";
        }

        document.getElementById("modalArchiveDetail").classList.add("open");
    }

    // 🌟 [사용자 요청] 보물창고 자료 삭제 기능
    function deleteCurrentArchiveRecord() {
        if (!currentDetailRecord) return;
        const confirmMsg = `[${currentDetailRecord.title}] 자료를 보물창고에서 완전히 삭제하시겠습니까?`;
        if (!confirm(confirmMsg)) return;

        const targetId = currentDetailRecord.id;
        const targetTitle = currentDetailRecord.title;

        fullArchiveList = fullArchiveList.filter(item => {
            if (targetId && item.id) return item.id !== targetId;
            return item.title !== targetTitle;
        });

        try {
            let stored = JSON.parse(localStorage.getItem(ARCHIVE_STORAGE_KEY)) || [];
            stored = stored.filter(item => {
                if (targetId && item.id) return item.id !== targetId;
                return item.title !== targetTitle;
            });
            localStorage.setItem(ARCHIVE_STORAGE_KEY, JSON.stringify(stored));
        } catch(e) {
            console.error(e);
        }

        closeModal("modalArchiveDetail");
        currentDetailRecord = null;
        renderCurrentCategoryView();
        showToast("🗑️ 보물자료가 성공적으로 삭제되었습니다.");
    }

    // 🌟 [사용자 요청] 영상 확대
    function toggleArchiveVideoFullscreen() {
        const iframe = document.getElementById("arcDetailIframe") || document.getElementById("arcDetailYtBox");
        if (!iframe) return;
        if (!document.fullscreenElement) {
            if (iframe.requestFullscreen) {
                iframe.requestFullscreen();
            } else if (iframe.webkitRequestFullscreen) {
                iframe.webkitRequestFullscreen();
            }
            showToast("🔍 영상을 전체화면으로 확대합니다.");
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    // 🌟 [사용자 요청] 영상 화면고정 (화면 꺼짐 방지)
    let arcWakeLock = null;
    async function toggleArchiveScreenLock() {
        const btn = document.getElementById("btnArcScreenLock");
        if (arcWakeLock !== null) {
            try {
                await arcWakeLock.release();
                arcWakeLock = null;
                if (btn) btn.innerHTML = "🔓 화면고정 해제";
                showToast("화면 꺼짐 방지(화면고정)가 해제되었습니다.");
            } catch(e){}
        } else {
            try {
                if ('wakeLock' in navigator) {
                    arcWakeLock = await navigator.wakeLock.request('screen');
                    if (btn) btn.innerHTML = "🔒 화면고정 ON";
                    showToast("🔒 예배 시청 중 화면 꺼짐이 방지(고정)되었습니다.");
                } else {
                    if (btn) btn.innerHTML = "🔒 화면고정 ON";
                    showToast("🔒 영상 화면이 고정되었습니다.");
                }
            } catch(e) {
                if (btn) btn.innerHTML = "🔒 화면고정 ON";
                showToast("🔒 영상 화면이 고정되었습니다.");
            }
        }
    }

    function escapeHtml(str) {
        if (!str) return "";
        return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function openArchiveUploadModal() {
        document.getElementById("inpArcUploadTitle").value = "";
        document.getElementById("inpArcUploadYt").value = "";
        document.getElementById("inpArcUploadContent").value = "";
        document.getElementById("inpArcUploadImgFile").value = "";
        document.getElementById("inpArcUploadDocFile").value = "";
        document.getElementById("arcUploadPhotoPreviewBox").style.display = "none";
        document.getElementById("arcUploadPhotoPreviewImg").src = "";
        document.getElementById("arcUploadDocBadge").style.display = "none";
        document.getElementById("arcUploadDocBadge").innerText = "";
        uploadPhotoData = null;
        uploadFileData = null;
        uploadFileName = null;
        document.getElementById("modalArchiveUpload").classList.add("open");
    }

    function handleArchiveUploadPhoto(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadPhotoData = e.target.result;
            const previewBox = document.getElementById("arcUploadPhotoPreviewBox");
            const previewImg = document.getElementById("arcUploadPhotoPreviewImg");
            previewImg.src = uploadPhotoData;
            previewBox.style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    function handleArchiveUploadDoc(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;
        uploadFileName = file.name;
        const reader = new FileReader();
        reader.onload = function(e) {
            uploadFileData = e.target.result;
            const badge = document.getElementById("arcUploadDocBadge");
            badge.innerText = `📎 ${uploadFileName} (${(file.size / 1024).toFixed(1)} KB)`;
            badge.style.display = "block";
        };
        reader.readAsDataURL(file);
    }

    function submitArchiveUpload() {
        const cat = document.getElementById("inpArcUploadCat").value;
        const title = document.getElementById("inpArcUploadTitle").value.trim();
        const yt = document.getElementById("inpArcUploadYt").value.trim();
        const content = document.getElementById("inpArcUploadContent").value.trim();

        if (!title) {
            alert("자료 제목을 입력해 주세요.");
            return;
        }

        const now = new Date();
        const dateStr = now.toISOString().split("T")[0];

        const newRecord = {
            id: "arc_" + Date.now(),
            category: cat,
            title: title,
            content: content || "등록된 본문 내용이 없습니다.",
            date: dateStr,
            source: "예톡행복한교회",
            yt: yt || null,
            img: uploadPhotoData || null,
            fileName: uploadFileName || null,
            fileData: uploadFileData || null
        };

        fullArchiveList.unshift(newRecord);
        try {
            let stored = [];
            try { stored = JSON.parse(localStorage.getItem(ARCHIVE_STORAGE_KEY)) || []; } catch(e){}
            stored.unshift(newRecord);
            localStorage.setItem(ARCHIVE_STORAGE_KEY, JSON.stringify(stored));
        } catch(e) {
            console.error(e);
        }

        closeModal("modalArchiveUpload");
        showToast("🎁 보물자료가 성공적으로 등록되었습니다!");
        
        currentPage = 1;
        renderCurrentCategoryView();
    }

    function closeModal(id) {
        const el = document.getElementById(id);
        if (el) el.classList.remove("open");
        if (id === "modalArchiveDetail") {
            const ytBox = document.getElementById("arcDetailYtBox");
            if (ytBox) {
                ytBox.innerHTML = "";
                ytBox.style.display = "none";
            }
        }
    }

    function showToast(msg) {
        const t = document.getElementById("yetalkToast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    function goBackToMain() {
        sessionStorage.setItem("church_last_active_card_idx", "10");
        location.href = "churchmain.html?card=10";
    }
</script>

<script src="church_bottom_bar.js"></script>
</body>
</html>
