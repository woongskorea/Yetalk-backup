<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>예톡 로그인</title>

    <link rel="stylesheet"
          href="common.css">

    <style>

        body{

        background:#edf3fb;

        display:flex;

        justify-content:center;

        align-items:center;

        height:100vh;

        padding:20px;

        }

        .loginBox{

        width:100%;

        max-width:420px;

        background:#fff;

        border-radius:20px;

        padding:30px 25px;

        box-shadow:0 10px 25px rgba(0,0,0,.12);

        }

        .logo{

        text-align:center;

        font-size:34px;

        font-weight:900;

        color:#2e8b57;

        margin-bottom:10px;

        }

        .sub{

        text-align:center;

        font-size:14px;

        color:#666;

        margin-bottom:30px;

        }

        label{

        display:block;

        margin-bottom:8px;

        font-weight:700;

        }

        input{

        width:100%;

        height:48px;

        padding:0 15px;

        font-size:16px;

        border:1px solid #ddd;

        border-radius:12px;

        margin-bottom:18px;

        outline:none;

        }

        input:focus{

        border-color:#2e8b57;

        }

        button{

        width:100%;

        height:50px;

        border:none;

        border-radius:12px;

        font-size:17px;

        font-weight:700;

        cursor:pointer;

        }

        #loginBtn{

        background:#2e8b57;

        color:#fff;

        margin-bottom:12px;

        }

        #joinBtn{

        background:#f2f2f2;

        color:#333;

        }

    </style>

</head>

<body>

<div class="loginBox">

    <div class="logo">

        예톡

    </div>

    <div class="sub">

        이름과 비밀번호만 입력하세요.

    </div>

    <label>

        이름

    </label>

    <input

            id="userName"

            type="text"

            autocomplete="username"

            placeholder="이름">

    <label>

        비밀번호

    </label>

    <input

            id="password"

            type="password"

            autocomplete="current-password"

            placeholder="비밀번호">

    <button id="loginBtn">

        로그인

    </button>

    <button id="joinBtn">

        회원가입

    </button>

</div>

<script type="module"
        src="login.js"></script>

</body>

</html>
