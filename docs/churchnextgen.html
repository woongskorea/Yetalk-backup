<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>다음세대 - 예톡행복한교회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@500;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="church_theme.css">
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px) + 38px, 42px);
            --header-h: calc(48px + var(--safe-top));
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #090e1a; font-family: "Pretendard", -apple-system, sans-serif;
            color: #ffffff; display: flex; justify-content: center; min-height: 100vh;
        }

        .nextgen-shell {
            width: 100%; max-width: 480px; min-height: 100vh; background: #0b1325;
            display: flex; flex-direction: column; position: relative; border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;
            padding-bottom: 160px;
        }

        /* 🌟 [사용자 요청] 최상단 한 줄 심플 헤더: < 다음세대 */
        .lobby-header-singleline {
            height: var(--header-h); background: #0f172a; border-bottom: 1.5px solid #1e293b;
            display: flex; align-items: center; justify-content: flex-start;
            padding: var(--safe-top) 12px 6px 12px; position: sticky; top: 0; z-index: 100; gap: 8px;
        }
        .btn-header-back {
            background: none; border: none; color: #38bdf8; font-size: 26px; font-weight: 900;
            cursor: pointer; padding: 2px 4px; line-height: 1; flex-shrink: 0;
        }
        .header-title {
            font-size: 16.5px; font-weight: 950; color: #ffffff; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
        }

        .main-scroll-content {
            flex: 1; padding: 12px 14px; display: flex; flex-direction: column; gap: 10px;
        }

        /* 방 카드 리스트 */
        .room-grid-list { display: flex; flex-direction: column; gap: 8px; }
        .room-card {
            background: #111a2f; border: 1.5px solid #1e293b; border-radius: 12px;
            padding: 12px 14px; display: flex; justify-content: space-between; align-items: center;
            cursor: pointer; transition: all 0.15s ease;
        }
        .room-card:active { transform: scale(0.99); }

        .room-card.leader-active {
            background: linear-gradient(135deg, #102447, #132f5e);
            border: 2px solid #38bdf8; box-shadow: 0 0 12px rgba(56, 189, 248, 0.35);
        }
        .room-info-col { display: flex; flex-direction: column; gap: 3px; }
        .room-name-title { font-size: 14.5px; font-weight: 950; color: #ffffff; }
        .room-leader-tag { font-size: 11.5px; font-weight: 800; color: #94a3b8; }
        .room-card.leader-active .room-name-title { color: #facc15; }
        .room-card.leader-active .room-leader-tag { color: #38bdf8; }

        .room-action-wrap { display: flex; align-items: center; gap: 8px; }
        .btn-room-edit-gear {
            background: rgba(255, 255, 255, 0.08); border: 1px solid #475569; color: #cbd5e1;
            padding: 4px 8px; border-radius: 6px; font-size: 11px; font-weight: 800; cursor: pointer;
        }

        /* + 부서 추가 버튼 */
        .btn-add-room {
            width: 100%; height: 42px; background: #16233b; border: 1.5px dashed #38bdf8;
            border-radius: 10px; color: #38bdf8; font-size: 13px; font-weight: 950;
            display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
            margin-bottom: 35px;
        }
        .btn-add-room:active { background: #1f3154; }

        /* 하단 고정 100 애드몹 (정규 100 대형 배너 규격) */
        .bottom-fixed-admob-footer {
            position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
            width: 100%; max-width: 480px; height: 130px; background: #0b1326;
            border-top: 1.5px solid #1e3a5f; display: flex; flex-direction: column;
            align-items: center; justify-content: center; gap: 4px; z-index: 150;
            padding-bottom: max(env(safe-area-inset-bottom, 0px), 8px); box-sizing: border-box;
        }
        .admob-banner-100-slot {
            width: 320px; max-width: calc(100% - 24px); height: 100px;
            background: #0f172a; border: 1.2px solid #1e3a5f; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
        }

        /* 방 편집 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 500; align-items: center; justify-content: center; padding: 14px; backdrop-filter: blur(6px);
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            width: 100%; max-width: 420px; background: #0f172a; border: 2px solid #38bdf8;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .modal-input {
            width: 100%; background: #162238; border: 1.5px solid #334155; border-radius: 8px;
            padding: 9px 10px; color: white; font-size: 13.5px; font-weight: 700; outline: none;
        }
    </style>
</head>
<body>

<div class="nextgen-shell">
    <!-- 🌟 [사용자 요청] 최상단 한 줄 헤더: < 다음세대 -->
    <header class="lobby-header-singleline">
        <button type="button" class="btn-header-back" onclick="goToChurchHome()">‹</button>
        <strong class="header-title" id="dispNextgenHeaderTitle">다음세대 (청년·청소년·어린이)</strong>
    </header>

    <!-- 메인 스크롤 콘텐츠: 복잡한 2층 탭/설명박스 없이 5대 부서 카드 바로 노출 -->
    <main class="main-scroll-content">
        <!-- 🌟 [사용자 요청] 다음세대 (열린청년교회, 청소년교회, 어린이부, 유치부, 유아부) 5대 기본 부서 카드 리스트 -->
        <div class="room-grid-list" id="roomListContainer"></div>

        <!-- + 부서 추가 버튼 -->
        <button type="button" class="btn-add-room" onclick="openAddRoomModal()">
            <span>➕</span> <span id="btnAddRoomText">새 다음세대 부서 추가하기</span>
        </button>
    </main>

    <!-- 🌟 [사용자 요청] 하단 고정 100 애드몹 (정규 100 대형 배너 규격 300 × 100) -->
    <aside class="bottom-fixed-admob-footer">
        <div style="font-size:9.5px; color:#64748b; font-weight:850; letter-spacing:0.5px;">
            <span>AD</span> • <span>Google AdMob 공식 스폰서 슬롯 (300 × 100)</span>
        </div>
        <div class="admob-banner-100-slot">
            <strong style="color:#38bdf8; font-size:14px; font-weight:950;">Google AdMob (300 × 100 / Large Banner)</strong>
            <span style="color:#facc15; font-size:11px; font-weight:800;">다음세대 청년·청소년·어린이 사역 공식 후원 슬롯</span>
        </div>
    </aside>
</div>

<!-- 부서 정보 및 방장 등록/수정 모달 -->
<div class="modal-overlay" id="roomEditModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:6px;">
            <strong style="color:#38bdf8; font-size:15px;" id="modalRoomEditTitle">부서 정보 및 담당자(방장) 등록</strong>
            <button type="button" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="closeModal('roomEditModal')">✕</button>
        </div>
        <div>
            <label style="font-size:11px; color:#facc15; font-weight:800; display:block; margin-bottom:2px;">부서 이름</label>
            <input type="text" class="modal-input" id="inpRoomName">
        </div>
        <div>
            <label style="font-size:11px; color:#facc15; font-weight:800; display:block; margin-bottom:2px;" id="lblLeaderName">담당 교역자 / 부장교사(방장) 성함</label>
            <input type="text" class="modal-input" id="inpLeaderName" placeholder="입력 시 눈에 띄게 활성화되며 베스트글에 랭크됩니다">
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
            <button type="button" style="background:#334155; color:white; border:none; padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer;" onclick="closeModal('roomEditModal')">취소</button>
            <button type="button" style="background:#0284c7; color:white; border:none; padding:7px 16px; border-radius:6px; font-size:12px; font-weight:900; cursor:pointer;" onclick="saveRoomData()">저장</button>
        </div>
    </div>
</div>

<script>
    const FOUR_VERSES = [
        { c: "1/4", t: "“마땅히 행할 길을 아이에게 가르치라 그리하면 늙어도 그것을 떠나지 아니하리라 (잠 22:6)”" },
        { c: "2/4", t: "“너는 청년의 때에 너의 창조주를 기억하라 곧 곤고한 날이 이르기 전에 (전 12:1)”" },
        { c: "3/4", t: "“어린 아이들이 내게 오는 것을 용납하고 금하지 말라 하나님의 나라가 이런 자의 것이니라 (막 10:14)”" },
        { c: "4/4", t: "“주의 청년들이 새벽 이슬 같은 주의 권능의 날에 주께 즐거이 헌신하는도다 (시 110:3)”" }
    ];

    let nextgenRooms = [];
    let editingRoomId = null;

    // 🌟 [사용자 요청] 다음세대 (열린청년교회, 청소년교회, 어린이부, 유치부, 유아부) 5대 기본 부서 완벽 등록
    const DEFAULT_NEXTGEN_ROOMS = [
        { id: "ng_1", name: "열린청년교회", cat: "youth", leader: "청년교회 담당교역자" },
        { id: "ng_2", name: "청소년교회", cat: "youth", leader: "청소년교회 지도교사" },
        { id: "ng_3", name: "어린이부", cat: "kids", leader: "어린이부 부장" },
        { id: "ng_4", name: "유치부", cat: "kids", leader: "유치부 담당교사" },
        { id: "ng_5", name: "유아부", cat: "kids", leader: "유아부 교사" }
    ];

    function initPage() {
        const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
        document.body.setAttribute('data-theme', savedTheme);

        const saved = localStorage.getItem("yetalk_nextgen_rooms_list_v2");
        if (saved) {
            try { nextgenRooms = JSON.parse(saved); } catch(e) { nextgenRooms = DEFAULT_NEXTGEN_ROOMS; }
        } else {
            nextgenRooms = DEFAULT_NEXTGEN_ROOMS;
            localStorage.setItem("yetalk_nextgen_rooms_list_v2", JSON.stringify(nextgenRooms));
        }

        renderRooms();
    }

    function renderRooms() {
        const container = document.getElementById("roomListContainer");
        container.innerHTML = "";

        nextgenRooms.forEach(r => {
            const hasLeader = r.leader && r.leader.trim() !== "";
            const leaderText = hasLeader ? `👤 담당/방장: ${r.leader}` : `⚠️ 방장 미등록 (등록 시 활성화)`;

            const card = document.createElement("div");
            card.className = `room-card ${hasLeader ? 'leader-active' : ''}`;
            card.onclick = () => enterRoomBoard(r);

            card.innerHTML = `
                <div class="room-info-col">
                    <span class="room-name-title">${r.name}</span>
                    <span class="room-leader-tag">${leaderText}</span>
                </div>
                <div class="room-action-wrap">
                    <button type="button" class="btn-room-edit-gear" onclick="event.stopPropagation(); openEditRoomModal('${r.id}')">✏️ 설정</button>
                    <span style="color:#38bdf8; font-size:13px; font-weight:900;">입장 ▸</span>
                </div>
            `;
            container.appendChild(card);
        });
    }

    function enterRoomBoard(room) {
        sessionStorage.setItem("nextgen_board_room_id", room.id);
        sessionStorage.setItem("nextgen_board_room_name", room.name);
        sessionStorage.setItem("nextgen_board_leader", room.leader || "");
        sessionStorage.setItem("churchnextgen_active_dept", room.name);
        location.href = "churchnextgen_board.html";
    }

    function openEditRoomModal(roomId) {
        editingRoomId = roomId;
        const room = nextgenRooms.find(r => r.id === roomId);
        if (!room) return;

        document.getElementById("modalRoomEditTitle").innerText = `[${room.name}] 부서 정보 수정`;
        document.getElementById("inpRoomName").value = room.name;
        document.getElementById("inpLeaderName").value = room.leader || "";
        openModal("roomEditModal");
    }

    function openAddRoomModal() {
        editingRoomId = null;
        document.getElementById("modalRoomEditTitle").innerText = "새 다음세대 부서 개설";
        document.getElementById("inpRoomName").value = "";
        document.getElementById("inpLeaderName").value = "";
        openModal("roomEditModal");
    }

    function saveRoomData() {
        const name = document.getElementById("inpRoomName").value.trim();
        const leader = document.getElementById("inpLeaderName").value.trim();
        if (!name) { alert("부서 이름을 입력해주세요."); return; }

        if (editingRoomId) {
            const r = nextgenRooms.find(item => item.id === editingRoomId);
            if (r) { r.name = name; r.leader = leader; }
        } else {
            const newId = "ng_" + Date.now();
            nextgenRooms.push({ id: newId, name: name, leader: leader, cat: "general" });
        }

        localStorage.setItem("yetalk_nextgen_rooms_list_v2", JSON.stringify(nextgenRooms));
        closeModal("roomEditModal");
        renderRooms();
    }

    let verseIdx = 0;
    function startVerseCycle() {
        setInterval(() => {
            verseIdx = (verseIdx + 1) % FOUR_VERSES.length;
            const cur = FOUR_VERSES[verseIdx];
            document.getElementById("verseCycleCount").innerText = `✝ 다음세대 축복의 말씀 (${cur.c})`;
            document.getElementById("verseCycleText").innerText = cur.t;
        }, 5000);
    }

    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }

    function goToChurchHome() {
        sessionStorage.setItem("church_last_active_card_idx", "8");
        location.href = "churchmain.html?card=8";
    }

    document.addEventListener("DOMContentLoaded", initPage);
</script>

</body>
</html>
