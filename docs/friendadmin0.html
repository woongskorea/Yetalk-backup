<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>친구관리</title>

    <link rel="stylesheet" href="common.css">

    <style>

        /*========================================
        FRIEND ADMIN
        ========================================*/

        .friendAdmin{

        padding:16px;

        }

        .summary{

        background:#fff;
        border-radius:18px;
        padding:18px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        margin-bottom:18px;

        }

        .summaryTitle{

        font-size:22px;
        font-weight:900;
        color:#14863d;
        margin-bottom:15px;

        }

        .summaryRow{

        display:flex;
        justify-content:space-between;
        padding:8px 0;
        font-size:18px;
        font-weight:700;

        }

        .card{

        background:#fff;
        border-radius:18px;
        padding:18px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);
        margin-bottom:18px;

        }

        .cardTitle{

        font-size:20px;
        font-weight:900;
        color:#14863d;
        margin-bottom:14px;

        }

        .list{

        display:flex;
        justify-content:space-between;
        padding:10px 0;
        font-size:17px;
        cursor:pointer;

        }

        .listName{

        font-weight:700;

        }

        .listRoom{

        color:#666;

        }

        .empty{

        text-align:center;
        color:#999;
        padding:15px;

        }

    </style>

</head>

<body>

<div class="header">

    <div class="back"
         onclick="history.back()">

        ←

    </div>

    <div class="title">

        친구관리

    </div>

</div>

<div class="friendAdmin">


    <div class="summary">

        <div class="summaryTitle">

            👥 내가 초대한 사람

        </div>

        <div class="summaryRow">

            <span>전체</span>

            <span id="inviteCount">0명</span>

        </div>

        <div class="summaryRow">

            <span>교회방</span>

            <span id="churchCount">0개</span>

        </div>

        <div class="summaryRow">

            <span>소모임</span>

            <span id="smallCount">0개</span>

        </div>

        <div class="summaryRow">

            <span>예톡회원</span>

            <span id="memberCount">0명</span>

        </div>

        <div class="summaryRow">

            <span>🩷 사랑받는 자</span>

            <span id="loveCount">0명</span>

        </div>

    </div>



    <div class="card">

        <div class="cardTitle">

            ⛪ 교회방 개설자

        </div>

        <div id="churchList">

            <div class="empty">

                개설한 교회방이 없습니다.

            </div>

        </div>

    </div>



    <div class="card">

        <div class="cardTitle">

            👥 소모임방 개설자

        </div>

        <div id="smallList">

            <div class="empty">

                개설한 소모임이 없습니다.

            </div>

        </div>

    </div>


</div>

<script src="friendadmin.js"></script>

</body>

</html>
