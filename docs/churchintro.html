<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>예톡행복한교회 소개</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="church_theme.css">
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px) + 20px, 24px);
            --header-h: calc(48px + var(--safe-top));
            --tab-h: 46px;
            --admob-h: max(env(safe-area-inset-bottom, 0px) + 95px, 102px);
            --view-h: calc(100dvh - var(--header-h) - var(--tab-h) - var(--admob-h));
            --primary: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; background: #060b14;
            font-family: "Pretendard", -apple-system, sans-serif; color: #ffffff;
            overflow: hidden;
        }

        .intro-shell {
            width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto;
            background: #0b1120; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9); overflow: hidden;
        }

        /* 1층 헤더 */
        .intro-header {
            height: var(--header-h); background: #0f172a; border-bottom: 1.5px solid #1e3a5f;
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 14px 8px 14px; flex-shrink: 0; z-index: 100;
        }
        .header-left-box { display: flex; align-items: center; gap: 8px; }
        .btn-back {
            background: none; border: none; font-size: 22px; font-weight: 900;
            color: #38bdf8; cursor: pointer; padding: 2px 4px; line-height: 1;
        }
        .header-title-text { font-size: 18px; font-weight: 950; color: #ffffff; letter-spacing: -0.3px; }

        .dual-admin-btn-group { display: flex; align-items: center; gap: 6px; }
        .btn-admin-room {
            background: #1e3a5f; border: 1.2px solid #0284c7; color: #38bdf8;
            border-radius: 8px; font-size: 11.5px; font-weight: 900; padding: 5px 9px; cursor: pointer;
        }
        .btn-admin-edit {
            background: linear-gradient(135deg, #dc2626, #b91c1c); border: 1.2px solid #ef4444; color: #ffffff;
            border-radius: 8px; font-size: 11.5px; font-weight: 900; padding: 5px 9px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.35);
        }

        /* 2층 가로 롤링 칩 메뉴 */
        .intro-tabs {
            height: var(--tab-h); background: #0c1424; border-bottom: 1.5px solid #1e293b;
            display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; align-items: center;
            flex-shrink: 0; z-index: 99; scrollbar-width: none;
        }
        .intro-tabs::-webkit-scrollbar { display: none; }
        .intro-tab {
            background: #1a263c; border: 1px solid #334155; color: #94a3b8; font-size: 13px;
            font-weight: 850; padding: 6px 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
            flex-shrink: 0; transition: all 0.2s;
        }
        .intro-tab.active {
            background: linear-gradient(135deg, #0284c7, #0ea5e9); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45); font-weight: 950;
        }

        /* 3층 메인 세로 스냅 뷰포트 (한 칸씩 정확히 탁! 탁! 스냅) */
        .intro-viewport {
            flex: 1; height: var(--view-h); overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; position: relative; padding: 8px 12px 60px 12px;
        }
        .intro-viewport::-webkit-scrollbar { display: none; }

        .snap-page-section {
            width: 100%; min-height: calc(var(--view-h) - 16px);
            scroll-snap-align: start; scroll-snap-stop: always;
            overflow-y: auto; background: #111a2e; border: 1.5px solid #1e3a5f;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column;
            gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 14px;
        }
        .snap-page-section:last-child {
            margin-bottom: 85px; /* 🌟 마지막 교회역사 카드가 끝까지 시원하게 스크롤되도록 여백 확보 */
        }
        .snap-page-section::-webkit-scrollbar { width: 3px; }
        .snap-page-section::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .section-header-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.3); padding-bottom: 10px;
        }
        .badge-pill {
            font-size: 11.5px; font-weight: 950; color: #facc15;
            background: rgba(250, 204, 21, 0.12); border: 1px solid rgba(250, 204, 21, 0.35);
            padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px;
        }
        .article-main-title {
            font-size: 21px; font-weight: 950; color: #ffffff; line-height: 1.35; letter-spacing: -0.4px;
        }

        .article-text-body {
            font-size: 16px; line-height: 1.8; color: #e2e8f0; word-break: keep-all; white-space: pre-line;
            font-weight: 600;
        }

        .bullet-point-line {
            display: flex; align-items: flex-start; gap: 8px; font-size: 15.5px; font-weight: 700;
            line-height: 1.7; color: #cbd5e1; margin-bottom: 5px;
        }
        .bullet-point-line::before {
            content: "•"; color: #38bdf8; font-weight: 950; font-size: 18px; line-height: 1.2;
        }

        /* 첨부 사진 뷰 */
        .attached-photo-wrap {
            width: 100%; border-radius: 12px; overflow: hidden;
            border: 1px solid #1e3a5f; margin: 4px 0; background: #0c1322;
        }
        .attached-photo-wrap img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

        /* 🌟 [사용자 요청] 담임목사 / 부목사 / 전도사 / 선교사: 1페이지 컴팩트 레이아웃 */
        .hero-leader-card {
            width: 100%; display: flex; flex-direction: column; gap: 8px;
        }
        .hero-leader-img-box {
            width: 100%; height: 150px; max-height: 150px; border-radius: 12px; overflow: hidden;
            border: 1.5px solid #1e3a5f; background: #0c1322; box-shadow: 0 4px 16px rgba(0,0,0,0.35);
            flex-shrink: 0;
        }
        .hero-leader-img-box img {
            width: 100%; height: 100%; max-height: 150px; object-fit: cover; object-position: top center; display: block;
        }
        .hero-leader-name { font-size: 20px; font-weight: 950; color: #ffffff; letter-spacing: -0.4px; white-space: nowrap !important; }
        .hero-leader-role { font-size: 13px; font-weight: 850; color: #38bdf8; margin-top: 1px; }
        .hero-greeting-box {
            background: rgba(15, 23, 42, 0.65); border: 1.2px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px; padding: 10px 12px; font-size: 13.5px; line-height: 1.6;
            color: #e2e8f0; white-space: pre-line; word-break: keep-all; font-weight: 600;
            max-height: 150px; overflow-y: auto;
        }
        .hero-greeting-box::-webkit-scrollbar { width: 3px; }
        .hero-greeting-box::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        /* 🌟 담임목사 전용: 1페이지 전면 사진 & 2페이지 소개글 레이아웃 */
        .pastor-fullscreen-photo-card {
            width: 100%; height: calc(var(--view-h) - 80px);
            display: flex; flex-direction: column; gap: 8px; justify-content: space-between;
        }
        .pastor-hero-img-box {
            width: 100%; flex: 1; min-height: 240px; border-radius: 14px; overflow: hidden;
            border: 1.5px solid #38bdf8; background: #0c1322; box-shadow: 0 6px 24px rgba(0,0,0,0.45);
        }
        .pastor-hero-img-box img {
            width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block;
        }
        .pastor-page-flow-hint {
            background: rgba(2, 132, 199, 0.15); border: 1px dashed #38bdf8; border-radius: 8px;
            padding: 8px 10px; text-align: center; font-size: 12px; font-weight: 850; color: #38bdf8;
        }

        .pastor-intro-fullpage-card {
            width: 100%; height: calc(var(--view-h) - 80px);
            display: flex; flex-direction: column; gap: 8px; justify-content: space-between;
        }
        .pastor-greeting-scrollbox {
            flex: 1; min-height: 0; max-height: calc(var(--view-h) - 150px); overflow-y: auto;
            background: rgba(15, 23, 42, 0.75); border: 1.5px solid rgba(56, 189, 248, 0.35);
            border-radius: 14px; padding: 16px 14px; box-shadow: 0 4px 16px rgba(0,0,0,0.3);
        }
        .pastor-greeting-scrollbox::-webkit-scrollbar { width: 3px; }
        .pastor-greeting-scrollbox::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        /* 🌟 [사용자 요청] 부목사 / 전도사 / 선교사: 얼굴과 글을 한페이지에 완결하는 컴팩트 레이아웃 */
        .compact-leader-card {
            width: 100%; height: calc(var(--view-h) - 30px); max-height: calc(var(--view-h) - 30px);
            display: flex; flex-direction: column; gap: 8px; overflow: hidden; justify-content: space-between;
        }
        .compact-profile-top-row {
            display: flex; gap: 10px; align-items: center; flex-shrink: 0;
            background: #0c1322; border: 1.2px solid #1e3a5f; border-radius: 12px; padding: 8px 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }
        .compact-avatar-box {
            width: 82px; height: 98px; border-radius: 10px; overflow: hidden;
            border: 1.5px solid #38bdf8; background: #1e293b; flex-shrink: 0;
        }
        .compact-avatar-box img {
            width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block;
        }
        .compact-profile-meta {
            flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px;
        }
        .compact-leader-name {
            font-size: 19px; font-weight: 950; color: #ffffff; white-space: nowrap !important;
            overflow: hidden; text-overflow: ellipsis; letter-spacing: -0.3px; line-height: 1.25;
        }
        .compact-leader-role {
            font-size: 12px; font-weight: 850; color: #38bdf8; line-height: 1.3;
        }
        .compact-greeting-scrollbox {
            flex: 1; min-height: 0; max-height: calc(var(--view-h) - 195px); overflow-y: auto;
            background: rgba(15, 23, 42, 0.65); border: 1.2px solid rgba(56, 189, 248, 0.25);
            border-radius: 12px; padding: 10px 12px; font-size: 13px; line-height: 1.6;
            color: #e2e8f0; font-weight: 600; word-break: keep-all;
        }
        .compact-greeting-scrollbox::-webkit-scrollbar { width: 3px; }
        .compact-greeting-scrollbox::-webkit-scrollbar-thumb { background: #38bdf8; border-radius: 3px; }

        /* 🌟 카드 상단 헤더 우측 및 하단 액션 버튼 그룹 (수정, 추가, 삭제를 한눈에 즉시 클릭) */
        .leader-top-btn-group {
            display: flex; align-items: center; gap: 4px; flex-shrink: 0;
        }
        .btn-action-pill {
            border: none; border-radius: 8px; font-size: 11px; font-weight: 900;
            padding: 5px 8px; cursor: pointer; white-space: nowrap;
            display: inline-flex; align-items: center; gap: 2px;
            transition: transform 0.1s, opacity 0.15s;
        }
        .btn-action-pill:active { transform: scale(0.95); }
        .btn-action-pill.edit { background: #0284c7; color: #ffffff; border: 1px solid #38bdf8; }
        .btn-action-pill.add { background: #059669; color: #ffffff; border: 1px solid #34d399; }
        .btn-action-pill.delete { background: #dc2626; color: #ffffff; border: 1px solid #f87171; }

        .leader-bottom-btn-group {
            display: flex; gap: 6px; margin-top: 4px; width: 100%;
        }
        .btn-leader-action {
            flex: 1; border: none; border-radius: 8px; font-size: 11.5px; font-weight: 850;
            padding: 7px 6px; cursor: pointer; display: inline-flex; align-items: center;
            justify-content: center; gap: 3px; white-space: nowrap; transition: opacity 0.15s;
        }
        .btn-leader-action:active { opacity: 0.8; }
        .btn-leader-action.edit { background: #1e3a5f; color: #38bdf8; border: 1px solid #0284c7; }
        .btn-leader-action.add { background: #064e3b; color: #34d399; border: 1px solid #059669; }
        .btn-leader-action.delete { background: #450a0a; color: #f87171; border: 1px solid #dc2626; flex: 0.55; }

        /* 🌟 [사용자 요청] 간사는 한페이지에 두명씩 */
        .secretary-pair-grid {
            display: flex; flex-direction: column; gap: 12px; margin-top: 6px;
        }
        .secretary-card {
            display: flex; align-items: flex-start; gap: 12px; background: #0c1322;
            border: 1.2px solid #1e3a5f; border-radius: 14px; padding: 12px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.3);
        }
        .secretary-avatar {
            width: 76px; height: 76px; border-radius: 12px; object-fit: cover;
            object-position: top; border: 1.2px solid #38bdf8; flex-shrink: 0; background: #1e293b;
        }
        .secretary-info { flex: 1; display: flex; flex-direction: column; gap: 3px; }
        .secretary-name { font-size: 16px; font-weight: 950; color: #ffffff; }
        .secretary-role { font-size: 12px; font-weight: 850; color: #38bdf8; }
        .secretary-desc { font-size: 12.5px; color: #cbd5e1; line-height: 1.5; white-space: pre-line; font-weight: 600; }

        /* 교회역사 타임라인 */
        .clean-timeline-box {
            display: flex; flex-direction: column; gap: 12px; position: relative;
            padding-left: 14px; border-left: 2px solid #0284c7; margin-top: 4px;
        }
        .clean-timeline-row { position: relative; display: flex; flex-direction: column; gap: 2px; }
        .clean-timeline-row::before {
            content: ""; position: absolute; left: -19px; top: 4px;
            width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px #38bdf8;
        }
        .clean-timeline-year { font-size: 14.5px; font-weight: 950; color: #fde047; }
        .clean-timeline-text { font-size: 14.5px; font-weight: 700; color: #f1f5f9; line-height: 1.55; }

        /* 4층 하단 고정: 5개 메뉴 제거 후 100 애드몹만 고정 */
        .bottom-fixed-admob-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: var(--admob-h); background: #080d1a; border-top: 1.5px solid #1e3a5f;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 6px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
        }
        .admob-safety-bar {
            font-size: 9.5px; color: #64748b; font-weight: 850; letter-spacing: 0.5px;
            margin-bottom: 2px; display: flex; align-items: center; gap: 4px;
        }
        .admob-display-slot {
            width: calc(100% - 20px); max-width: 400px; height: 75px;
            background: #0b1326; border: 1.2px solid #1e293b; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8); gap: 2px;
        }

        /* 🌟 [사용자 요청] 컴퓨터(PC) 환경: 애드몹 전면 숨김 및 소개 화면 전체 확장 */
        @media (min-width: 768px) {
            :root {
                --admob-h: 0px !important;
                --view-h: calc(100dvh - var(--header-h) - var(--tab-h)) !important;
            }
            .bottom-fixed-admob-footer,
            .admob-safety-bar,
            .admob-display-slot,
            [class*="admob"],
            [id*="admob"] {
                display: none !important;
                height: 0 !important;
                overflow: hidden !important;
            }
        }

        /* 관리자 수정 모달 (넓고 편안한 작성 환경) */
        .edit-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 10000; align-items: center; justify-content: center; padding: 14px;
            backdrop-filter: blur(6px);
        }
        .edit-modal-overlay.show { display: flex; }
        .edit-modal-card {
            width: 100%; max-width: 500px; background: #0f172a; border: 2px solid #38bdf8;
            border-radius: 16px; padding: 22px 18px; color: #f8fafc; display: flex;
            flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; text-align: left;
        }
        .m-lbl { font-size: 12px; font-weight: 850; color: #facc15; display: block; margin-bottom: 2px; }
        .m-input {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 9px 12px; font-size: 14px; color: #ffffff; outline: none; font-family: inherit;
        }
        .m-textarea {
            width: 100%; min-height: 280px; height: 320px; background: #1e293b; border: 1.5px solid #334155;
            border-radius: 8px; padding: 14px; font-size: 15px; color: #ffffff; outline: none;
            line-height: 1.7; resize: vertical; font-family: inherit;
        }
        .m-textarea:focus, .m-input:focus { border-color: #38bdf8; }

        @media (min-width: 1024px) {
            .intro-shell { max-width: 1240px !important; }
            .snap-page-section { max-width: 1100px; margin-left: auto; margin-right: auto; padding: 26px 30px; }
            .attached-photo-wrap img { max-height: 480px; }
            .clean-leader-grid { grid-template-columns: repeat(4, 1fr); gap: 14px; }
        }

        body[data-theme="white"] { background: #fbf9f4 !important; color: #1e293b !important; }
        body[data-theme="white"] .intro-shell { background: #fbf9f4 !important; }
        body[data-theme="white"] .intro-header { background: #ffffff !important; border-bottom: 1.5px solid #e2e8f0 !important; }
        body[data-theme="white"] .header-title-text { color: #0f172a !important; }
        body[data-theme="white"] .intro-tabs { background: #ffffff !important; border-bottom: 1.5px solid #e2e8f0 !important; }
        body[data-theme="white"] .intro-tab { background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #475569 !important; }
        body[data-theme="white"] .intro-tab.active { background: #0284c7 !important; border-color: #0284c7 !important; color: #ffffff !important; }
        body[data-theme="white"] .snap-page-section { background: #ffffff !important; border-color: #e2e8f0 !important; box-shadow: 0 4px 20px rgba(0,0,0,0.06) !important; }
        body[data-theme="white"] .article-main-title { color: #0f172a !important; }
        body[data-theme="white"] .article-text-body { color: #1e293b !important; }
        body[data-theme="white"] .bullet-point-line { color: #334155 !important; }
        body[data-theme="white"] .clean-leader-card { background: #f8fafc !important; border-color: #e2e8f0 !important; }
        body[data-theme="white"] .clean-leader-name { color: #0f172a !important; }
        body[data-theme="white"] .clean-leader-desc { color: #64748b !important; }
        body[data-theme="white"] .hero-leader-img-box { border-color: #cbd5e1 !important; background: #f1f5f9 !important; }
        body[data-theme="white"] .hero-leader-name { color: #0f172a !important; }
        body[data-theme="white"] .hero-greeting-box { background: #f8fafc !important; border-color: #e2e8f0 !important; color: #1e293b !important; }
        body[data-theme="white"] .pastor-hero-img-box { border-color: #cbd5e1 !important; background: #f1f5f9 !important; }
        body[data-theme="white"] .pastor-page-flow-hint { background: #e0f2fe !important; border-color: #7dd3fc !important; color: #0284c7 !important; }
        body[data-theme="white"] .pastor-greeting-scrollbox { background: #f8fafc !important; border-color: #cbd5e1 !important; color: #1e293b !important; }
        body[data-theme="white"] .compact-profile-top-row { background: #f8fafc !important; border-color: #cbd5e1 !important; }
        body[data-theme="white"] .compact-avatar-box { border-color: #cbd5e1 !important; background: #e2e8f0 !important; }
        body[data-theme="white"] .compact-leader-name { color: #0f172a !important; }
        body[data-theme="white"] .compact-greeting-scrollbox { background: #f8fafc !important; border-color: #e2e8f0 !important; color: #1e293b !important; }
        body[data-theme="white"] .secretary-card { background: #f8fafc !important; border-color: #e2e8f0 !important; }
        body[data-theme="white"] .secretary-name { color: #0f172a !important; }
        body[data-theme="white"] .secretary-desc { color: #334155 !important; }
        body[data-theme="white"] .clean-timeline-year { color: #0369a1 !important; }
        body[data-theme="white"] .clean-timeline-text { color: #1e293b !important; }
        body[data-theme="white"] .btn-leader-action.edit { background: #e0f2fe !important; color: #0284c7 !important; border-color: #7dd3fc !important; }
        body[data-theme="white"] .btn-leader-action.add { background: #d1fae5 !important; color: #059669 !important; border-color: #6ee7b7 !important; }

    function renderFormattedBody(rawText, isHistory) {
        if (!rawText) return "";
        const lines = rawText.split("\n");
        let formatted = "";
        let timelineRows = "";
        let hasTimeline = false;

        lines.forEach(line => {
            const tr = line.trim();
            if (!tr) return;

            const timelineMatch = tr.match(/^(?:[•\-\*]\s*)?((?:19|20)\d{2}년?)\s*[:：\-]\s*(.+)$/);
            if (isHistory && timelineMatch) {
                hasTimeline = true;
                timelineRows += `
                    <div class="clean-timeline-row">
                        <span class="clean-timeline-year">${timelineMatch[1]}</span>
                        <span class="clean-timeline-text">${timelineMatch[2]}</span>
                    </div>
                `;
            } else if (tr.startsWith("•") || tr.startsWith("-") || tr.startsWith("*")) {
                formatted += `<div class="bullet-point-line">${tr.replace(/^[•\-\*]\s*/, '')}</div>`;
            } else {
                formatted += `<p class="article-text-body" style="margin-bottom:8px;">${tr}</p>`;
            }
        });

        if (isHistory && hasTimeline) {
            formatted += `<div class="clean-timeline-box" style="margin-top:10px;">${timelineRows}</div>`;
        }
        return formatted;
    }

    // 🌟 화면 중앙과 가장 가까운 카드를 정밀 감지하여 8대 가로 칩 메뉴와 1:1 오차 없이 동기화!
    // (충돌을 일으키던 touchend scrollToSection 수동 개입을 배제하여 안정적인 정지 보장!)
    function setupScrollObserver() {
        const vp = document.getElementById("introViewport");
        if (!vp) return;
        let timer = null;

        vp.addEventListener("scroll", () => {
            if (isProgrammaticIntroScroll) return;
            clearTimeout(timer);
            timer = setTimeout(() => {
                if (isProgrammaticIntroScroll) return;
                const sections = vp.querySelectorAll(".snap-page-section");
                const vpRect = vp.getBoundingClientRect();
                const vpCenter = vpRect.top + vpRect.height / 2;
                let closestSec = null;
                let minDiff = Infinity;

                sections.forEach(sec => {
                    const rect = sec.getBoundingClientRect();
                    const secCenter = rect.top + rect.height / 2;
                    const diff = Math.abs(secCenter - vpCenter);
                    if (diff < minDiff) {
                        minDiff = diff;
                        closestSec = sec;
                    }
                });

                if (closestSec) {
                    const tabIdx = parseInt(closestSec.dataset.tabIndex, 10);
                    if (!isNaN(tabIdx) && tabIdx !== currentActiveTabIdx) {
                        currentActiveTabIdx = tabIdx;
                        updateTabNavUI(tabIdx);
                    }
                }
            }, 60);
        }, { passive: true });
    }

    function updateTabNavUI(tabIdx) {
        document.querySelectorAll(".intro-tab").forEach((tab, i) => {
            const match = (i === tabIdx);
            tab.classList.toggle("active", match);
            if (match) tab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        });
    }

    function scrollToTab(tabIdx) {
        currentActiveTabIdx = tabIdx;
        updateTabNavUI(tabIdx);
        const vp = document.getElementById("introViewport");
        if (!vp) return;
        const target = vp.querySelector(`.snap-page-section[data-tab-index="${tabIdx}"]`);
        if (target) {
            isProgrammaticIntroScroll = true;
            vp.scrollTo({ top: target.offsetTop, behavior: "smooth" });
            setTimeout(() => { isProgrammaticIntroScroll = false; }, 420);
        }
    }

    function handleGeneralImgFile(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                let w = img.width, h = img.height;
                if (w > 1400) { h = Math.round((h * 1400) / w); w = 1400; }
                canvas.width = w; canvas.height = h;
                canvas.getContext("2d").drawImage(img, 0, 0, w, h);
                const base64 = canvas.toDataURL("image/jpeg", 0.9);
                document.getElementById("inpGeneralImg").value = base64;
                const thumb = document.getElementById("prevGeneralImgThumb");
                thumb.src = base64;
                thumb.style.display = "block";

                showToast("📷 사진이 선택되었습니다. [저장하기]를 누르세요.");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

        setTimeout(() => t.classList.remove("show"), 2200);
    }

    // 🌟 뒤로가기 시 스마트폰 바탕화면 종료 방지 -> 교회 메인 홈(churchmain.html) 해당 메뉴로 즉시 복귀
    function goBackToChurchHome() {
        sessionStorage.setItem('church_last_active_card_idx', '0');
        location.href = 'churchmain.html?card=0';
    }

    // 안드로이드 하드웨어 / 제스처 백키 전용 핸들러 (MainActivity.kt 연동)
    window.handleAppBackPress = function() {
        if (document.getElementById("generalPageEditModal")?.classList.contains("show")) {
            closeModal("generalPageEditModal");
            return true;
        }
        if (document.getElementById("servantEditModal")?.classList.contains("show")) {
            closeModal("servantEditModal");
            return true;
        }
        goBackToChurchHome();
        return true;
    };

    document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
        document.body.setAttribute('data-theme', savedTheme);

        const churchName = localStorage.getItem("yetalkChurchName") || localStorage.getItem("yetalkUserStoreName") || "예톡행복한교회";
        const titleEl = document.getElementById("introHeaderTitle");
        if (titleEl) titleEl.innerText = `${churchName} 소개`;

        loadSections();
    });
</script>
</body>
</html>
