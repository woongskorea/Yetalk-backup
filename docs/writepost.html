<!DOCTYPE html>

<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width,initial-scale=1.0">

    <title>글쓰기</title>

    <link
            rel="stylesheet"
            href="common.css">

    <style>

        /*==================================
        WRITE POST
        ==================================*/

        .writeWrap{

        padding:16px;

        padding-bottom:90px;

        }

        .writeBox{

        width:100%;

        min-height:420px;

        padding:18px;

        border:none;

        outline:none;

        resize:none;

        font-size:17px;

        line-height:1.8;

        background:#ffffff;

        border-radius:18px;

        box-shadow:0 2px 8px rgba(0,0,0,.08);

        }

        .guide{

        margin-top:12px;

        font-size:13px;

        color:#888;

        line-height:1.6;

        }

    </style>

</head>

<body>

<div class="container">

    <!--=========================
    HEADER
    ==========================-->

    <header class="header">

        <div

                class="backBtn"

                onclick="history.back()">

            ←

        </div>

        <div class="roomInfo">

            <div class="roomTitle">

                글쓰기

            </div>

            <div class="roomState">

                첫 줄은 제목으로 표시됩니다.

            </div>

        </div>

        <button

                class="saveBtn"

                onclick="savePost()">

            등록

        </button>

    </header>

    <div class="writeWrap">

<textarea

        id="postText"

        class="writeBox"

        placeholder="내용을 입력하세요.

첫 줄은 자동으로 제목이 됩니다.">

</textarea>

        <div class="guide">

            첫 줄은 제목으로 표시되고,

            둘째 줄부터는 내용으로 표시됩니다.

        </div>
    </div>

    <!--==================================
    하단 등록
    ===================================-->

    <div class="writeBottom">

        <button

                class="postBtn"

                onclick="savePost()">

            등록하기

        </button>

    </div>

    <script>

        const postText=

        document.getElementById(

        "postText"

        );

        postText.focus();

        /* 카카오톡처럼 자동 높이 */

        postText.addEventListener(

        "input",

        function(){

        this.style.height="auto";

        this.style.height=

        this.scrollHeight+"px";

        }

        );

    </script>
</div>

<script src="chatfree.js"></script>

<script>

    /*=========================
    글쓰기 시작
    =========================*/

    window.onload=function(){

    document.getElementById(

    "postText"

    ).focus();

    };

</script>

</body>

</html>
