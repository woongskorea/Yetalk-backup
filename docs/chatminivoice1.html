<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#000000">
    <title>성전기도방 | 예톡</title>
    <link rel="stylesheet" href="chatminivoice1.css">
</head>
<body>

<div id="miniVoicePage" class="mini-voice-page">

    <!-- 상단 헤더 -->
    <header class="mini-header">
        <button id="miniBackBtn" class="mini-back-btn" type="button" aria-label="뒤로가기">←</button>
        <div class="mini-header-title-box">
            <strong id="miniRoomTitle" class="mini-room-title">소율성막기도방</strong>
        </div>
        <button id="participantCountBtn" class="participant-count-btn" type="button">
            <span class="participant-count-icon">👥</span>
            <span id="participantCount">12명</span>
        </button>
    </header>

    <!-- 방장 전용 컨트롤 바 (방장일 때만 활성화) -->
    <div id="miniHostBar" class="mini-host-bar hidden">
        <button id="hostVoiceToggleBtn" class="btn-host-ctrl" type="button">방장 마이크 켜기</button>
        <button id="allVoiceOffBtn" class="btn-host-ctrl warn" type="button">전체 음성 끄기</button>
        <button id="roomLockBtn" class="btn-host-ctrl" type="button">입장 닫기</button>
    </div>

    <!-- 간단 안내 -->
    <section class="mini-guide">
        <span id="guideTextNotice">방장 지목 또는 손들기 승인 시 1명씩만 발언 가능합니다.</span>
        <span>✋ 손들기는 노란색으로 표시됩니다.</span>
    </section>

    <!-- 참여자 3 × 3 그리드 (최대 9명 노출) -->
    <section id="participantGrid" class="participant-grid"></section>

    <!-- 구분선 -->
    <div class="mini-divider"></div>

    <!-- 채팅 영역 (카톡형 스크롤) -->
    <main id="miniChatArea" class="mini-chat-area">
        <div class="chat-date" id="chatDateHeader">2026년 성전기도방</div>
        <div id="chatMessageListContainer" style="display:flex; flex-direction:column; gap:10px;"></div>
    </main>

    <!-- 하단 입력창 -->
    <footer class="mini-input-bar">
        <button id="miniPlusBtn" class="mini-plus-btn" type="button" aria-label="추가 메뉴">＋</button>
        <textarea id="miniChatInput" class="mini-chat-input" rows="1" maxlength="500" placeholder="기도문 또는 메시지를 입력하세요..."></textarea>
        <button id="raiseHandBtn" class="raise-hand-btn" type="button">
            <span class="raise-hand-icon">✋</span>
            <span class="raise-hand-text" id="raiseHandText">손들기</span>
        </button>
        <button id="miniSendBtn" class="mini-send-btn" type="button">전송</button>
    </footer>

    <!-- 전체 참여자 목록 모달 (상단 참여 인원 터치 시) -->
    <div id="participantOverlay" class="participant-overlay hidden">
        <section class="participant-modal">
            <div class="participant-modal-header">
                <strong>전체 참여자 명단</strong>
                <button id="participantCloseBtn" class="participant-close-btn" type="button" aria-label="닫기">×</button>
            </div>
            <div id="participantAllList" class="participant-all-list"></div>
        </section>
    </div>

    <!-- 간단 추가 메뉴 (+ 버튼 클릭 시) -->
    <div id="miniExtraMenu" class="mini-extra-menu hidden">
        <button type="button" class="mini-extra-item" id="btnMenuPrayer">
            <span>🙏</span>
            <span>합심기도</span>
        </button>
        <button type="button" class="mini-extra-item" id="btnMenuYoutube">
            <span>▶</span>
            <span>기도 BGM</span>
        </button>
        <button type="button" class="mini-extra-item" id="btnMenuSave">
            <span>💾</span>
            <span>기도문 저장</span>
        </button>
        <button type="button" class="mini-extra-item" id="btnMenuClose">
            <span>×</span>
            <span>닫기</span>
        </button>
    </div>

    <!-- 합심기도 모달 -->
    <div id="jointPrayerOverlay" class="participant-overlay hidden">
        <section class="participant-modal">
            <div class="participant-modal-header">
                <strong>🙏 오늘의 합심기도 제목</strong>
                <button id="jointPrayerCloseBtn" class="participant-close-btn" type="button">×</button>
            </div>
            <div style="padding:14px; display:flex; flex-direction:column; gap:10px;">
                <div id="miniPrayerTopicList" style="display:flex; flex-direction:column; gap:8px; font-size:13px; line-height:1.6; color:#f8fafc;">
                    <div>1. 나라와 민족의 복음 평화를 위하여</div>
                    <div>2. 성도들의 가정과 환우 치유 회복을 위하여</div>
                    <div>3. 다음세대 신앙 부흥과 선교 사역을 위하여</div>
                </div>
            </div>
        </section>
    </div>

    <!-- 숨겨진 오디오 컨테이너 -->
    <div id="miniRemoteAudioArea" style="display:none;"></div>

    <!-- 토스트 -->
    <div id="miniVoiceToast" class="mini-voice-toast"></div>

</div>

<!-- JavaScript -->
<script type="module" src="chatminivoice1.js"></script>

</body>
</html>
