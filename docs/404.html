<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예톡 (Yetalk) 페이지 이동</title>
    <script>
        (function() {
            var path = window.location.pathname || "";
            var search = window.location.search || "";
            var hash = window.location.hash || "";
            
            // /assets/churchinvite.html -> /churchinvite.html
            // /assets/churchmain.html -> /churchmain.html
            // /assets/index.html -> /index.html
            if (path.indexOf("/assets/") === 0) {
                var cleanPath = path.substring(7); // remove "/assets"
                window.location.replace(window.location.origin + cleanPath + search + hash);
                return;
            }
            
            // 기타 모든 미발견 경로는 예톡 홈으로 안전 이동
            window.location.replace(window.location.origin + "/index.html" + search + hash);
        })();
    </script>
</head>
<body style="font-family:sans-serif; text-align:center; padding:40px 20px;">
    <h2>잠시만 기다려 주세요...</h2>
    <p>예톡 페이지로 이동 중입니다.</p>
</body>
</html>
