<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>교회 공지알림</title>
    <link rel="stylesheet" href="../common.css">
    <link rel="stylesheet" href="churchchatnotice.css">
    <script>
        (function() {
            const getChurchId = () => localStorage.getItem("yetalkMyChurchId") || localStorage.getItem("currentChurchId") || "yetalk-church";
            const savedTheme = localStorage.getItem("yetalkChurchTheme_" + getChurchId()) || localStorage.getItem("yetalkThemeColor") || "blue";
            document.documentElement.className = "theme-" + savedTheme;
        })();
    </script>
    <style>
        .fullScreenEditor {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #ffffff; z-index: 99999;
            display: flex; flex-direction: column;
        }
        /* ⭐ 상태바(시간/배터리/카메라구멍)와 겹치지 않도록 상단 여백(40px) 추가 */
        .editorHeader {
            display: flex; justify-content: space-between; align-items: center;
            padding: 40px 16px 16px 16px;
            border-bottom: 1px solid #e2e8f0; background: #fff;
        }
        .editorHeader button { font-size: 16px; font-weight: 800; background: none; border: none; cursor: pointer; }
        .editorHeader .btn-cancel { color: #64748b; font-size: 17px; }
        .editorHeader .btn-submit { color: var(--primary); font-size: 17px; }
        .editorTitle { font-size: 18px; font-weight: 900; color: #111827; }

        .editorBody { flex: 1; display: flex; flex-direction: column; overflow-y: auto; background: #fff; }

        .editorCategory { padding: 16px 16px 8px 16px; }
        .editorCategory select { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 15px; font-weight: 800; color: var(--primary); background: #f8fafc; outline: none; }

        .editorToolbar {
            padding: 0 16px 12px 16px; border-bottom: 1px solid #e2e8f0; background: #fff;
            display: flex; gap: 10px; align-items: center;
        }
        .editorToolbar button {
            padding: 8px 14px; border: 1px solid #cbd5e1; border-radius: 8px;
            background: #f8fafc; font-size: 14px; font-weight: 800; color: #334155; cursor: pointer; display: flex; align-items: center; gap: 4px;
        }
        #attachPreviewText { flex: 1; font-size: 13.5px; color: var(--primary); font-weight: 800; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .editorTextarea {
            flex: 1; width: 100%; padding: 20px 16px; border: none; outline: none; resize: none;
            font-size: 17px; font-weight: 700; color: #000000; line-height: 1.6;
            box-sizing: border-box; caret-color: #dc2626;
        }
        .editorTextarea::placeholder { color: #94a3b8; font-weight: 600; }
    </style>
</head>
<body style="display: flex; flex-direction: column; min-height: 100vh; margin: 0; padding-bottom: 60px;">

<!-- 메인 화면 -->
<div class="noticePage chatStylePage" style="display: flex; flex-direction: column; flex: 1; padding-bottom: 0;">
    <header class="noticeHeader">
        <button type="button" class="noticeBackBtn" onclick="location.href='../churchmain.html'" aria-label="뒤로가기">←</button>
        <div class="noticeHeaderCenter">
            <div class="noticeHeaderTitle">교회 공지알림</div>
            <div class="noticeHeaderChurch" id="noticeHeaderChurch">우리 교회</div>
        </div>
        <button type="button" class="adminStateBtn" id="adminStateBtn" onclick="toggleNoticeAdmin()">관리자 OFF</button>
    </header>

    <div id="adminWriteBox" class="hidden" style="padding: 16px 16px 0 16px;">
        <button onclick="window.openEditor()" style="width:100%; padding:14px; border-radius:12px; background:var(--primary); color:#fff; font-size:16px; font-weight:900; border:none; box-shadow:0 4px 10px rgba(0,0,0,0.15); cursor: pointer;">
            ✏️ 새 글 작성하기
        </button>
    </div>

    <section class="noticeGuide">
        <div class="noticeGuideIcon">💬</div>
        <div class="noticeGuideText">
            <strong>우리 교회 실시간 소식 공지방입니다.</strong>
            <span>박스를 누르면 전체 내용이 시원하게 펼쳐집니다.</span>
        </div>
    </section>

    <main class="noticePostList" id="noticePostList" style="flex: 1 0 auto; padding-bottom: 20px;"></main>

    <section class="noticeEmpty hidden" id="noticeEmpty">
        <div class="noticeEmptyIcon">📭</div>
        <strong>등록된 공지가 없습니다.</strong>
    </section>

    <!-- 광고영역 -->
    <div class="ad-area-box" id="adAreaBox" style="margin: 0 16px 20px 16px; background: #f8fafc; border: 1px dashed #cbd5e1; border-radius: 12px; height: 55px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 800; color: #64748b; letter-spacing: 1px;">
        광고영역
    </div>
</div>

<nav class="church-bottom-nav fixed-bottom-nav">
    <a href="src/main/assets/church/churchmain.html" class="bottom-nav-item">교회홈</a>
    <a href="src/main/assets/index.html" class="bottom-nav-item">나의홈</a>
    <a href="src/main/assets/shopping.html" class="bottom-nav-item">쇼핑</a>
    <a href="../location.html" class="bottom-nav-item">오시는길</a>
    <a href="src/main/assets/mypage.html" class="bottom-nav-item">내정보</a>
</nav>

<!-- ==================================================
⭐ 네이버 카페형 전체화면 에디터
================================================== -->
<div id="fullScreenEditor" class="fullScreenEditor hidden">
    <div class="editorHeader">
        <!-- ⭐ 직관성을 위해 ← 화살표 추가 -->
        <button type="button" class="btn-cancel" onclick="window.closeEditor()">← 취소</button>
        <span class="editorTitle">공지 작성</span>
        <button type="button" class="btn-submit" onclick="if(window.sendChatNotice) { window.sendChatNotice(); } else { alert('네트워크 연결 중입니다. 잠시 후 다시 시도해주세요.'); }">등록</button>
    </div>

    <div class="editorBody">
        <div class="editorCategory">
            <select id="chatCategorySelect">
                <option value="notice" selected>📢 공지알림</option>
                <option value="jesus">✝️ 예수동행</option>
                <option value="saint">💎 보배성도</option>
                <option value="sermon">📖 목사님 주일설교</option>
                <option value="important">📌 중요 공지</option>
                <option value="bulletin">📄 주보</option>
                <option value="event">🎈 행사/봉사</option>
            </select>
        </div>

        <div class="editorToolbar">
            <button type="button" onclick="document.getElementById('chatPhotoInput').click()">📷 사진</button>
            <button type="button" onclick="document.getElementById('chatFileInput').click()">📁 파일</button>
            <span id="attachPreviewText"></span>
            <input type="file" id="chatPhotoInput" accept="image/*" class="hidden">
            <input type="file" id="chatFileInput" class="hidden">
        </div>

        <textarea id="chatMessageInput" class="editorTextarea" placeholder="내용을 자유롭게 입력하세요. 엔터를 치면 줄이 바뀝니다." autocomplete="off"></textarea>
    </div>
</div>

<div class="noticeToast" id="noticeToast"></div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        const isManagerOn = localStorage.getItem("yetalk_chat_admin_on") === "true";
        const btn = document.getElementById("adminStateBtn");
        const adminWriteBox = document.getElementById("adminWriteBox");

        if (isManagerOn) {
            if (btn) {
                btn.textContent = "관리자 ON";
                btn.style.background = "#dc2626";
            }
            if (adminWriteBox) adminWriteBox.classList.remove("hidden");
        } else {
            if (btn) {
                btn.textContent = "관리자 OFF";
                btn.style.background = "#111827";
            }
            if (adminWriteBox) adminWriteBox.classList.add("hidden");
        }
    });

    window.toggleNoticeAdmin = function() {
        const current = localStorage.getItem("yetalk_chat_admin_on") === "true";
        localStorage.setItem("yetalk_chat_admin_on", !current);
        location.reload();
    };

    window.openEditor = function() {
        document.getElementById("fullScreenEditor").classList.remove("hidden");
        document.body.style.overflow = "hidden";
        const adBox = document.getElementById("adAreaBox");
        if (adBox) adBox.style.display = "none";
    };

    window.closeEditor = function() {
        document.getElementById("fullScreenEditor").classList.add("hidden");
        document.body.style.overflow = "";
        document.getElementById("chatMessageInput").blur();
        const adBox = document.getElementById("adAreaBox");
        if (adBox) adBox.style.display = "flex";
    };
</script>

<script type="module" src="src/main/assets/church/churchmenu/churchchatnotice.js?v=2026-editor_fixed_margin"></script>
</body>
</html>
