<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0f172a">
    <title>예수동행 릴스 이미지 공장 | 예톡</title>
    <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="src/main/assets/church/churchmain.css">
    <style>
        .church-app {
            min-height: 100vh;
            padding: 20px;
            padding-bottom: calc(120px + env(safe-area-inset-bottom));
            background: #0f172a;
            color: #ffffff;
            font-family: 'Gowun Dodum', sans-serif;
            box-sizing: border-box;
        }
        .generator-container {
            width: min(100%, 500px);
            margin: 0 auto;
        }
        .gen-header {
            text-align: center;
            margin-bottom: 24px;
        }
        .gen-header h2 {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 8px;
            background: linear-gradient(135deg, #ffffff 30%, #fed7aa 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .gen-header p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.5;
        }
        .card-box {
            background: rgba(30, 41, 59, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
        }
        label {
            font-size: 14px;
            font-weight: 900;
            color: #cbd5e1;
            display: block;
            margin-bottom: 8px;
        }
        textarea, select {
            width: 100%;
            padding: 14px;
            background: #0f172a;
            border: 2px solid #475569;
            border-radius: 12px;
            color: #ffffff;
            font-size: 15px;
            font-weight: 800;
            box-sizing: border-box;
            outline: none;
            resize: vertical;
            font-family: 'Gowun Dodum', sans-serif;
        }
        textarea { height: 110px; line-height: 1.6; }
        textarea:focus, select:focus { border-color: #ec4899; }

        .preset-buttons {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-top: 10px;
        }
        .preset-btn {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            font-size: 13px;
            font-weight: 800;
            cursor: pointer;
            transition: 0.2s;
            text-align: left;
        }
        .preset-btn:active { background: rgba(255, 255, 255, 0.2); transform: scale(0.98); }

        .action-btn {
            width: 100%;
            height: 52px;
            background: linear-gradient(135deg, #ec4899 0%, #8b5cf6 100%);
            color: #ffffff;
            border: none;
            border-radius: 14px;
            font-size: 16px;
            font-weight: 900;
            cursor: pointer;
            box-shadow: 0 6px 20px rgba(236, 72, 153, 0.4);
            margin-top: 16px;
            transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:active { transform: scale(0.98); }

        /* 미리보기 화면 (세로형 9:16 비율) */
        .preview-wrapper {
            width: min(100%, 320px);
            aspect-ratio: 9/16;
            margin: 0 auto;
            border-radius: 20px;
            overflow: hidden;
            border: 2px solid rgba(255, 255, 255, 0.3);
            background: #1e293b;
            background-size: cover;
            background-position: center;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
        }
        .preview-overlay {
            position: absolute; inset: 0;
            background: linear-gradient(180deg, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0.3) 50%, rgba(0,0,0,0.7) 100%);
        }
        .preview-text-content {
            position: relative; z-index: 2; padding: 20px;
        }

        .back-nav-btn {
            background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff;
            padding: 10px 16px; border-radius: 12px; font-size: 14px; font-weight: 900; cursor: pointer;
            margin-bottom: 20px; display: inline-flex; align-items: center; gap: 6px;
        }
    </style>
</head>

<body>
<div class="church-app">
    <div class="generator-container">

        <button class="back-nav-btn" onclick="history.back()">‹ 예수동행으로 돌아가기</button>

        <div class="gen-header">
            <h2>🎨 세로형 릴스 배경 이미지 공장</h2>
            <p>교회 묵상 카드뉴스에 딱 어울리는 세로형(9:16) 감성 배경을 쉽고 빠르게 구상하고 만들어 보세요.</p>
        </div>

        <div class="card-box">
            <label>✨ 빠른 감성 테마 선택 (클릭)</label>
            <div class="preset-buttons">
                <button class="preset-btn" onclick="setPreset('벚꽃 감성과 아침 햇살')">🌸 봄날의 벚꽃</button>
                <button class="preset-btn" onclick="setPreset('푸른 하늘과 하얀 구름')">☁️ 푸른 하늘</button>
                <button class="preset-btn" onclick="setPreset('은은한 빛과 십자가 묵상')">✨ 십자가 빛</button>
                <button class="preset-btn" onclick="setPreset('고요한 초원과 작은 교회')">⛪ 작은 교회</button>
            </div>
        </div>

        <div class="card-box">
            <label>📝 이미지 생성 프롬프트 (세로형 9:16)</label>
            <textarea id="promptInput" placeholder="원하시는 분위기를 적어주세요..."></textarea>

            <button class="action-btn" onclick="generateAiImage()">
                <span>✨</span> <span>고화질 세로형 배경 생성하기</span>
            </button>
        </div>

        <div class="card-box" style="text-align: center;">
            <label style="margin-bottom: 12px;">📱 세로형 미리보기 (9:16 릴스 비율)</label>
            <div class="preview-wrapper" id="previewBox" style="background-image: url('../../images/todayword/0.jpg');">
                <div class="preview-overlay"></div>
                <div class="preview-text-content">
                    <div style="font-size: 18px; font-weight: 900; color: #fff; text-shadow: 0 2px 5px rgba(0,0,0,0.8);">예수동행 묵상</div>
                    <div style="font-size: 13px; font-weight: 800; color: #fed7aa; margin-top: 8px;">배경 가독성 테스트</div>
                </div>
            </div>
        </div>

    </div>
</div>

<script>
    function setPreset(themeText) {
        const fullPrompt = `인스타그램 릴스 배경용 세로형(9:16) 이미지. ${themeText}. 스마트폰 화면 중앙과 위아래에 텍스트가 얹어질 수 있도록 복잡하지 않고 은은하며 여백이 넓고 차분한 미니멀 스타일, 고화질 시네마틱 감성`;
        document.getElementById("promptInput").value = fullPrompt;
    }

    // 기본값 세팅
    setPreset('따뜻한 봄날 아침 햇살과 연분홍 벚꽃');

    function generateAiImage() {
        const prompt = document.getElementById("promptInput").value;
        if(!prompt) {
            alert("프롬프트를 입력해주세요!");
            return;
        }

        // 원장님이 편하게 구글 이미지FX나 외부 생성 툴로 한 방에 연결되도록 안내 팝업 및 이동
        alert("✨ 프롬프트가 클립보드에 복사되었습니다!\n구글 이미지FX(ImageFX) 또는 생성 툴 창이 열리면 붙여넣기(Ctrl+V) 하셔서 고화질 세로형 이미지를 다운로드(0.jpg ~ 6.jpg) 하신 뒤 폴더에 넣어주세요!");

        if (navigator.clipboard) {
            navigator.clipboard.writeText(prompt);
        }

        // 구글 이미지 생성 공장 페이지로 새 창 연동
        window.open("https://labs.google/fx/tools/image-fx", "_blank");
    }
</script>

</body>
</html>
