<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, viewport-fit=cover">

    <meta
            name="theme-color"
            content="#102738">

    <title>보배성도 | 예톡</title>


    <!--==================================================
    COMMON CSS
    ==================================================-->

    <link
            rel="stylesheet"
            href="src/main/assets/common.css">


    <!--==================================================
    COMMUNITY CSS
    ==================================================-->

    <link
            rel="stylesheet"
            href="churchcommunity.css">

</head>


<body>


<main
        id="churchCommunityPage"
        class="church-community-page">


    <!--==================================================
    HEADER
    ==================================================-->

    <header class="community-header">


        <button
                id="communityBackBtn"
                class="community-back-btn"
                type="button"
                aria-label="뒤로가기">

            ‹

        </button>



        <div class="community-header-title">


            <strong
                    id="communityChurchName">

                우리교회

            </strong>


            <small>

                보배성도

            </small>


        </div>



        <button
                id="communityHomeBtn"
                class="community-home-btn"
                type="button"
                aria-label="교회홈">

            ⛪

        </button>


    </header>



    <!--==================================================
    TITLE

    설명을 길게 넣지 않고
    화면 제목만 간단히 표시
    ==================================================-->

    <section class="community-title-card">


        <div class="community-title-icon">

            💎

        </div>


        <div class="community-title-text">


            <h1>

                보배성도

            </h1>


            <p>

                서로 사랑하며 말씀 안에서 함께하는 우리교회

            </p>


        </div>


    </section>



    <!--==================================================
    ⭐ 상단 고정

    관리자가 상단고정한 내용이 있을 때만
    JS에서 hidden 제거

    공지 / 교우소식 / 훈련 / 모임자료 등
    종류에 관계없이 중요내용 배치 가능
    ==================================================-->

    <section
            id="communityPinnedSection"
            class="community-content-section community-pinned-section hidden">


        <div class="community-section-title">


            <span>

                ⭐

            </span>


            <strong>

                중요소식

            </strong>


        </div>


        <div
                id="communityPinnedList"
                class="community-content-list">

        </div>


    </section>



    <!--==================================================
    교우소식

    chatnotice에서
    교우소식으로 분류된 실제 글이 있을 때만 표시
    ==================================================-->

    <section
            id="memberNewsSection"
            class="community-content-section hidden">


        <div class="community-section-title">


            <span>

                🌷

            </span>


            <strong>

                교우소식

            </strong>


            <button
                    id="openAllMemberNewsBtn"
                    class="community-small-link"
                    type="button">

                전체보기 ›

            </button>


        </div>


        <div
                id="memberNewsList"
                class="community-content-list">

        </div>


    </section>



    <!--==================================================
    마을 · 셀 · 사랑방

    실제 등록된 자료가 있을 때만 표시

    카톡 대화방은 따로 연결하지 않음
    예톡에서는 교회가 공식 자료만 전달
    ==================================================-->

    <section
            id="cellMeetingSection"
            class="community-content-section hidden">


        <div class="community-section-title">


            <span>

                👥

            </span>


            <strong>

                마을 · 셀 · 사랑방

            </strong>


        </div>



        <!--==================================================
        이번 주 말씀나눔

        설교자료가 있을 때만 개별 카드 표시
        ==================================================-->

        <article
                id="cellSermonCard"
                class="community-post-card hidden">


            <div class="community-post-top">


                <span class="community-post-category">

                    이번 주 말씀나눔

                </span>


                <span
                        id="cellSermonDate"
                        class="community-post-date">

                </span>


            </div>


            <h2
                    id="cellSermonTitle"
                    class="community-post-title">

            </h2>


            <div
                    id="cellSermonBible"
                    class="community-post-bible">

            </div>


            <div
                    id="cellSermonSummary"
                    class="community-post-content">

            </div>


            <button
                    id="openSermonMaterialBtn"
                    class="community-outline-btn hidden"
                    type="button">

                📖 말씀자료 보기

            </button>


        </article>



        <!--==================================================
        모임자료 목록

        관리자가 올린 자료만 JS에서 카드 생성
        ==================================================-->

        <div
                id="cellMeetingGuide"
                class="community-content-list">

        </div>


    </section>



    <!--==================================================
    훈련프로그램

    모집 중 프로그램이 하나 이상 있을 때만 표시

    프로그램 이름 / 설명 / 순서 / 상단고정 여부는
    각 교회 관리자가 수정
    ==================================================-->

    <section
            id="trainingSection"
            class="community-content-section hidden">


        <div class="community-section-title">


            <span>

                📚

            </span>


            <strong>

                훈련프로그램

            </strong>


        </div>


        <div
                id="trainingProgramList"
                class="training-program-list">

        </div>


    </section>



    <!--==================================================
    내가 신청한 훈련

    신청내역이 있을 때만 표시
    ==================================================-->

    <section
            id="myTrainingSection"
            class="community-content-section hidden">


        <div class="community-section-title">


            <span>

                ✅

            </span>


            <strong>

                나의 신청

            </strong>


        </div>


        <div
                id="myTrainingApplications"
                class="community-content-list">

        </div>


    </section>



    <!--==================================================
    성도교제

    복잡한 메뉴 대신
    채팅방 진입 버튼 하나만 유지
    ==================================================-->

    <section class="community-fellowship-section">


        <button
                id="openFellowshipChatBtn"
                class="community-fellowship-btn"
                type="button">


            <span class="community-fellowship-icon">

                💬

            </span>


            <span class="community-fellowship-text">


                <strong>

                    성도교제

                </strong>


                <small>

                    우리교회 성도들과 이야기 나누기

                </small>


            </span>


            <span class="community-fellowship-arrow">

                ›

            </span>


        </button>


    </section>



</main>



<!--==================================================
훈련프로그램 신청 팝업
==================================================-->

<div
        id="trainingApplyOverlay"
        class="community-overlay hidden">


    <section class="training-apply-popup">


        <button
                id="trainingApplyCloseBtn"
                class="community-popup-close"
                type="button"
                aria-label="닫기">

            ×

        </button>



        <div class="training-popup-icon">

            📚

        </div>



        <small class="training-popup-label">

            훈련프로그램 신청

        </small>



        <h2
                id="trainingApplyProgramName">

            프로그램 신청

        </h2>



        <!--==================================================
        이름

        회원 본이름 자동 입력
        ==================================================-->

        <div class="community-form-field">


            <label for="trainingApplyName">

                이름

            </label>


            <input
                    id="trainingApplyName"
                    type="text"
                    maxlength="40"
                    placeholder="이름">


        </div>



        <!--==================================================
        연락처
        ==================================================-->

        <div class="community-form-field">


            <label for="trainingApplyPhone">

                연락처

            </label>


            <input
                    id="trainingApplyPhone"
                    type="tel"
                    maxlength="30"
                    placeholder="연락처">


        </div>



        <!--==================================================
        신청 내용
        ==================================================-->

        <div class="community-form-field">


            <label for="trainingApplyMessage">

                남기는 말씀

            </label>


            <textarea
                    id="trainingApplyMessage"
                    rows="4"
                    maxlength="500"
                    placeholder="담당자에게 전할 내용이 있으면 적어주세요."></textarea>


        </div>



        <button
                id="trainingApplySubmitBtn"
                class="community-main-btn"
                type="button">

            신청하기

        </button>


    </section>


</div>



<!--==================================================
TOAST
==================================================-->

<div
        id="communityToast"
        class="community-toast"
        role="status"
        aria-live="polite">

</div>



<!--==================================================
COMMON JS
==================================================-->

<script src="src/main/assets/common.js"></script>



<!--==================================================
COMMUNITY JS
==================================================-->

<script
        type="module"
        src="churchcommunity.js">

</script>


</body>

</html>
