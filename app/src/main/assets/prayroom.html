<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>내기도</title>

    <link rel="stylesheet"
          href="common.css">

</head>

<body>

<div class="container">

    <!--=========================
    HEADER
    ==========================-->

    <header class="header">

        <div class="topMenu">

            <div
                    class="menuOff"
                    onclick="location.href='index.html'">

                홈

            </div>

            <div
                    class="menuOn">

                내기도

            </div>

            <div
                    class="menuOff"
                    onclick="location.href='intercession.html'">

                중보기도

            </div>

            <div
                    class="menuOff"
                    onclick="location.href='mynote.html'">

                내노트

            </div>

        </div>

        <div class="topRight">

<span id="todayDate">

7월 8일

</span>

        </div>

    </header>

    <!--=========================
    YOUTUBE
    ==========================-->

    <div class="youtube">

        <iframe

                id="youtubePlayer"

                width="100%"

                height="100%"

                src=""

                title="Prayer"

                frameborder="0"

                allowfullscreen>

        </iframe>

    </div>

    <!--=========================
    기도음악
    ==========================-->

    <div class="musicRow">

        <div
                class="musicBtn"
                onclick="changeMusic('calm')">

            잔잔

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('fast')">

            빠름

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('blood')">

            보혈

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('tongue')">

            방언

        </div>

    </div>

    <!--=========================
    기도시간
    ==========================-->

    <div class="timeRow">

        <div
                class="timeBtn startBtn"
                onclick="startPrayer()">

            ▶ 시작

        </div>

        <div
                id="todayTime"
                style="
font-size:18px;
font-weight:800;
color:#14863d;">

            오늘 0분

        </div>

        <div
                class="timeBtn endBtn"
                onclick="stopPrayer()">

            ■ 종료

        </div>

    </div>

    <!--=========================
    관리자 한줄
    ==========================-->

    <div class="card mb20">

        <div
                style="
padding:16px;
font-size:17px;
font-weight:700;
line-height:1.8;">

<span
        style="color:#d60000;">

●

</span>

            <span id="masterMessage">

믿음대로 될지어다.

</span>

        </div>

    </div>
    <!--=========================
   기도제목
   ==========================-->

    <div class="section">

        <div class="sectionTitle">

            기도제목

        </div>

        <div id="prayerItems">

            <div class="prayerRow">

                <input
                        type="checkbox"
                        class="prayerCheck">

                <textarea
                        id="prayer1"
                        class="textInput autoGrow"
                        rows="1"
                        placeholder="①"></textarea>

            </div>

            <div class="prayerRow">

                <input
                        type="checkbox"
                        class="prayerCheck">

                <textarea
                        id="prayer2"
                        class="textInput autoGrow"
                        rows="1"
                        placeholder="②"></textarea>

            </div>

            <div class="prayerRow">

                <input
                        type="checkbox"
                        class="prayerCheck">

                <textarea
                        id="prayer3"
                        class="textInput autoGrow"
                        rows="1"
                        placeholder="③"></textarea>

            </div>

            <div class="prayerRow">

                <input
                        type="checkbox"
                        class="prayerCheck">

                <textarea
                        id="prayer4"
                        class="textInput autoGrow"
                        rows="1"
                        placeholder="④"></textarea>

            </div>

            <div class="prayerRow">

                <input
                        type="checkbox"
                        class="prayerCheck">

                <textarea
                        id="prayer5"
                        class="textInput autoGrow"
                        rows="1"
                        placeholder="⑤"></textarea>

            </div>

        </div>

        <div class="center mt20">

            <button
                    class="commonBtn"
                    onclick="addPrayerItem()">

                + 기도제목 추가

            </button>

        </div>

    </div>

    <!--=========================
    기도목표
    ==========================-->

    <div class="section">

        <div class="sectionTitle">

            기도목표

        </div>

        <div class="goalRow">

            <div
                    class="goalBtn activeGoal"
                    onclick="selectGoal(15,this)">

                15분

            </div>

            <div
                    class="goalBtn"
                    onclick="selectGoal(30,this)">

                30분

            </div>

            <div
                    class="goalBtn"
                    onclick="selectGoal(60,this)">

                1시간

            </div>

            <div
                    class="goalBtn"
                    onclick="showCustomGoal()">

                직접

            </div>

        </div>

    </div>

    <div
            id="customGoalBox"
            class="hidden mt10">

        <input
                id="customGoal"
                class="textInput"
                type="text"
                placeholder="예) 2시간 / 3시간">

        <div class="center mt10">

            <button
                    class="commonBtn"
                    onclick="saveCustomGoal()">

                적용

            </button>

        </div>

    </div>
    <!--=========================
    공용버튼
    ==========================-->

    <div class="section">

        <div
                style="
        display:flex;
        gap:10px;">

            <button
                    class="commonBtn"
                    style="flex:1;"
                    onclick="answerSelected()">

                응답

            </button>

            <button
                    class="commonBtn"
                    style="flex:1;
            background:#777;"
                    onclick="deleteSelected()">

                삭제

            </button>

            <button
                    class="commonBtn"
                    style="flex:1;
            background:#1f73d8;"
                    onclick="copySelected()">

                복사

            </button>

        </div>

    </div>

    <script src="prayroom.js"></script>

    <script>

        /*==========================
        기도음악
        ==========================*/

        const musicLinks={

        calm:"",
        fast:"",
        blood:"",
        tongue:""

        };

        function changeMusic(type){

        if(musicLinks[type]){

        document.getElementById("youtubePlayer").src=

        musicLinks[type];

        }

        }

        /*==========================
        직접목표
        ==========================*/



        /*==========================
        관리자 한줄
        ==========================*/

        const msg=

        localStorage.getItem("masterMessage");

        if(msg){

        document.getElementById(

        "masterMessage"

        ).innerText=msg;

        }

    </script>

</div>

</body>

</html>
