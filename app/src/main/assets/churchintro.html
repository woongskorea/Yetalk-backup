<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>예톡행복한교회 소개</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px) + 20px, 24px);
            --header-h: calc(48px + var(--safe-top));
            --tab-h: 46px;
            --admob-h: max(env(safe-area-inset-bottom, 0px) + 95px, 102px);
            --view-h: calc(100dvh - var(--header-h) - var(--tab-h) - var(--admob-h));
            --primary: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%; background: #060b14;
            font-family: "Pretendard", -apple-system, sans-serif; color: #ffffff;
            overflow: hidden;
        }

        .intro-shell {
            width: 100%; max-width: 520px; height: 100dvh; margin: 0 auto;
            background: #0b1120; display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9); overflow: hidden;
        }

        /* 1층 헤더 */
        .intro-header {
            height: var(--header-h); background: #0f172a; border-bottom: 1.5px solid #1e3a5f;
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 14px 8px 14px; flex-shrink: 0; z-index: 100;
        }
        .header-left-box { display: flex; align-items: center; gap: 8px; }
        .btn-back {
            background: none; border: none; font-size: 22px; font-weight: 900;
            color: #38bdf8; cursor: pointer; padding: 2px 4px; line-height: 1;
        }
        .header-title-text { font-size: 18px; font-weight: 950; color: #ffffff; letter-spacing: -0.3px; }

        .dual-admin-btn-group { display: flex; align-items: center; gap: 6px; }
        .btn-admin-room {
            background: #1e3a5f; border: 1.2px solid #0284c7; color: #38bdf8;
            border-radius: 8px; font-size: 11.5px; font-weight: 900; padding: 5px 9px; cursor: pointer;
        }
        .btn-admin-edit {
            background: linear-gradient(135deg, #dc2626, #b91c1c); border: 1.2px solid #ef4444; color: #ffffff;
            border-radius: 8px; font-size: 11.5px; font-weight: 900; padding: 5px 9px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(220, 38, 38, 0.35);
        }

        /* 2층 가로 롤링 칩 메뉴 */
        .intro-tabs {
            height: var(--tab-h); background: #0c1424; border-bottom: 1.5px solid #1e293b;
            display: flex; gap: 6px; overflow-x: auto; padding: 0 10px; align-items: center;
            flex-shrink: 0; z-index: 99; scrollbar-width: none;
        }
        .intro-tabs::-webkit-scrollbar { display: none; }
        .intro-tab {
            background: #1a263c; border: 1px solid #334155; color: #94a3b8; font-size: 13px;
            font-weight: 850; padding: 6px 14px; border-radius: 18px; cursor: pointer; white-space: nowrap;
            flex-shrink: 0; transition: all 0.2s;
        }
        .intro-tab.active {
            background: linear-gradient(135deg, #0284c7, #0ea5e9); color: #ffffff; border-color: #38bdf8;
            box-shadow: 0 2px 10px rgba(2, 132, 199, 0.45); font-weight: 950;
        }

        /* 3층 메인 세로 스냅 뷰포트 (한 칸씩 정확히 탁! 탁! 스냅) */
        .intro-viewport {
            flex: 1; height: var(--view-h); overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-behavior: smooth;
            -webkit-overflow-scrolling: touch; position: relative; padding: 8px 12px;
        }
        .intro-viewport::-webkit-scrollbar { display: none; }

        .snap-page-section {
            width: 100%; height: var(--view-h); min-height: var(--view-h);
            scroll-snap-align: start; scroll-snap-stop: always;
            overflow-y: auto; background: #111a2e; border: 1.5px solid #1e3a5f;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column;
            gap: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.5); margin-bottom: 14px;
        }
        .snap-page-section::-webkit-scrollbar { width: 3px; }
        .snap-page-section::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }

        .section-header-row {
            display: flex; justify-content: space-between; align-items: flex-start;
            border-bottom: 1px dashed rgba(56, 189, 248, 0.3); padding-bottom: 10px;
        }
        .badge-pill {
            font-size: 11.5px; font-weight: 950; color: #facc15;
            background: rgba(250, 204, 21, 0.12); border: 1px solid rgba(250, 204, 21, 0.35);
            padding: 3px 8px; border-radius: 6px; display: inline-block; margin-bottom: 4px;
        }
        .article-main-title {
            font-size: 21px; font-weight: 950; color: #ffffff; line-height: 1.35; letter-spacing: -0.4px;
        }

        .article-text-body {
            font-size: 16px; line-height: 1.8; color: #e2e8f0; word-break: keep-all; white-space: pre-line;
            font-weight: 600;
        }

        .bullet-point-line {
            display: flex; align-items: flex-start; gap: 8px; font-size: 15.5px; font-weight: 700;
            line-height: 1.7; color: #cbd5e1; margin-bottom: 5px;
        }
        .bullet-point-line::before {
            content: "•"; color: #38bdf8; font-weight: 950; font-size: 18px; line-height: 1.2;
        }

        /* 첨부 사진 뷰 */
        .attached-photo-wrap {
            width: 100%; border-radius: 12px; overflow: hidden;
            border: 1px solid #1e3a5f; margin: 4px 0; background: #0c1322;
        }
        .attached-photo-wrap img { width: 100%; max-height: 220px; object-fit: cover; display: block; }

        /* 섬기는 이 (리더 2열 그리드) */
        .clean-leader-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 4px;
        }
        .clean-leader-card {
            background: #0c1322; border: 1px solid #1e293b; border-radius: 12px;
            overflow: hidden; display: flex; flex-direction: column;
        }
        .clean-leader-img { width: 100%; aspect-ratio: 1 / 1; object-fit: cover; background: #1e293b; }
        .clean-leader-info { padding: 9px; display: flex; flex-direction: column; gap: 2px; }
        .clean-leader-name { font-size: 15px; font-weight: 950; color: #ffffff; }
        .clean-leader-role { font-size: 12px; font-weight: 800; color: #38bdf8; }
        .clean-leader-desc { font-size: 11.5px; color: #94a3b8; line-height: 1.4; margin-top: 2px; }

        /* 교회역사 타임라인 */
        .clean-timeline-box {
            display: flex; flex-direction: column; gap: 12px; position: relative;
            padding-left: 14px; border-left: 2px solid #0284c7; margin-top: 4px;
        }
        .clean-timeline-row { position: relative; display: flex; flex-direction: column; gap: 2px; }
        .clean-timeline-row::before {
            content: ""; position: absolute; left: -19px; top: 4px;
            width: 8px; height: 8px; border-radius: 50%; background: #38bdf8; box-shadow: 0 0 8px #38bdf8;
        }
        .clean-timeline-year { font-size: 14.5px; font-weight: 950; color: #fde047; }
        .clean-timeline-text { font-size: 14.5px; font-weight: 700; color: #f1f5f9; line-height: 1.55; }

        /* 4층 하단 고정: 5개 메뉴 제거 후 100 애드몹만 고정 */
        .bottom-fixed-admob-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: var(--admob-h); background: #080d1a; border-top: 1.5px solid #1e3a5f;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 6px; z-index: 100; box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
        }
        .admob-safety-bar {
            font-size: 9.5px; color: #64748b; font-weight: 850; letter-spacing: 0.5px;
            margin-bottom: 2px; display: flex; align-items: center; gap: 4px;
        }
        .admob-display-slot {
            width: calc(100% - 20px); max-width: 400px; height: 75px;
            background: #0b1326; border: 1.2px solid #1e293b; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8); gap: 2px;
        }

        /* 관리자 수정 모달 (넓고 편안한 작성 환경) */
        .edit-modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 10000; align-items: center; justify-content: center; padding: 14px;
            backdrop-filter: blur(6px);
        }
        .edit-modal-overlay.show { display: flex; }
        .edit-modal-card {
            width: 100%; max-width: 500px; background: #0f172a; border: 2px solid #38bdf8;
            border-radius: 16px; padding: 22px 18px; color: #f8fafc; display: flex;
            flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; text-align: left;
        }
        .m-lbl { font-size: 12px; font-weight: 850; color: #facc15; display: block; margin-bottom: 2px; }
        .m-input {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 9px 12px; font-size: 14px; color: #ffffff; outline: none; font-family: inherit;
        }
        .m-textarea {
            width: 100%; min-height: 180px; background: #1e293b; border: 1.5px solid #334155;
            border-radius: 8px; padding: 12px; font-size: 14.5px; color: #ffffff; outline: none;
            line-height: 1.65; resize: vertical; font-family: inherit;
        }
        .m-textarea:focus, .m-input:focus { border-color: #38bdf8; }

        .yetalk-toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95); color: #38bdf8; border: 1px solid #38bdf8;
            padding: 9px 18px; border-radius: 20px; font-size: 12.5px; font-weight: 900;
            z-index: 10005; opacity: 0; visibility: hidden; transition: all 0.25s ease; white-space: nowrap;
        }
        .yetalk-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="intro-shell">

    <!-- 1층 헤더 -->
    <header class="intro-header">
        <div class="header-left-box">
            <button type="button" class="btn-back" onclick="location.href='churchmain.html'" title="교회 메인으로 복귀">‹</button>
            <span class="header-title-text" id="introHeaderTitle">예톡행복한교회 소개</span>
        </div>
        <div class="dual-admin-btn-group">
            <button type="button" class="btn-admin-room" onclick="location.href='admin.html'" title="관리실 전체설정">◀ 관리실</button>
            <button type="button" class="btn-admin-edit" onclick="triggerCurrentTabEdit()" title="현재 화면 직접 수정">화면수정 ▶</button>
        </div>
    </header>

    <!-- 2층 가로 롤링 칩 메뉴 (요청 순서 100% 매칭) -->
    <nav class="intro-tabs" id="introTabNav">
        <button type="button" class="intro-tab active" onclick="scrollToSection(0)">환영인사</button>
        <button type="button" class="intro-tab" onclick="scrollToSection(1)">교회비전</button>
        <button type="button" class="intro-tab" onclick="scrollToSection(2)">섬기는 이</button>
        <button type="button" class="intro-tab" onclick="scrollToSection(3)">부서사역</button>
        <button type="button" class="intro-tab" onclick="scrollToSection(4)">파송선교사</button>
        <button type="button" class="intro-tab" onclick="scrollToSection(5)">교회역사</button>
    </nav>

    <!-- 3층 세로 스냅 뷰포트 (상단 이미지 카드 없이 바로 본문 시작) -->
    <main class="intro-viewport" id="introViewport">
        <!-- JS 동적 생성 -->
    </main>

    <!-- 4층 하단 고정: 5개 메뉴 제거 후 100 애드몹 단독 고정 -->
    <footer class="bottom-fixed-admob-footer">
        <div class="admob-safety-bar">
            <span>AD</span> • <span>Google AdMob 공식 스폰서 슬롯 (300 × 100)</span>
        </div>
        <div class="admob-display-slot">
            <strong style="color:#38bdf8; font-size:14px; font-weight:950;">Google AdMob (300x100 / Large Banner)</strong>
            <span style="color:#facc15; font-size:11.5px; font-weight:800;">선교 사역 및 미디어 영상 방송 공식 후원 슬롯</span>
        </div>
    </footer>

    <div class="yetalk-toast" id="yetalkToast"></div>
</div>

<!-- 🌟 관리자 글/사진/파일 수정 모달 -->
<div class="edit-modal-overlay" id="generalPageEditModal" onclick="closeModal('generalPageEditModal')">
    <div class="edit-modal-card" onclick="event.stopPropagation()">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #334155; padding-bottom:8px;">
            <strong style="font-size:16px; color:#38bdf8;" id="lblGeneralModalTitle">✏️ 화면 내용 및 사진 수정</strong>
            <button type="button" style="background:none; border:none; font-size:24px; color:#64748b; cursor:pointer;" onclick="closeModal('generalPageEditModal')">✕</button>
        </div>

        <div>
            <span class="m-lbl">대표 제목</span>
            <input type="text" class="m-input" id="inpGeneralTitle" placeholder="제목을 입력하세요">
        </div>

        <div>
            <span class="m-lbl">대표 사진/이미지 주소 (URL)</span>
            <input type="text" class="m-input" id="inpGeneralImg" placeholder="https://... 이미지 링크 (생략 시 미노출)">
        </div>

        <div>
            <span class="m-lbl">본문 내용 (컴퓨터와 스마트폰 모두 작성 가능 / 줄바꿈 반영)</span>
            <textarea class="m-textarea" id="inpGeneralBody" placeholder="성도님들께 전할 내용을 정성껏 작성해 주세요."></textarea>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
            <button type="button" style="padding:9px 16px; background:#334155; color:white; border:none; border-radius:8px; font-weight:800; cursor:pointer;" onclick="closeModal('generalPageEditModal')">취소</button>
            <button type="button" style="padding:9px 22px; background:linear-gradient(135deg, #0284c7, #2563eb); color:white; border:none; border-radius:8px; font-weight:950; cursor:pointer; box-shadow:0 3px 12px rgba(2,132,199,0.4);" onclick="saveGeneralPageData()">저장하기</button>
        </div>
    </div>
</div>

            bullets: [
                "동남아 필리핀: 박바울 선교사 (현지 신학교 및 교회 개척 사역)",
                "중앙아시아 키르기스스탄: 이모세 선교사 (의료 선교 및 기술 훈련)",
                "아프리카 케냐: 정에스더 선교사 (어린이 고아원 및 무료 급식 사역)"
            ]
        },
        history: {
            tabName: "교회역사",
            badge: "교회역사",
            title: "하나님의 인도하심으로 걸어온 은혜의 발자취",
            img: "",
            body: "눈물의 기도와 헌신으로 일군 하나님의 살아계신 역사입니다.",
            historyList: [
                { year: "2026년", text: "예톡 스마트 미디어 선교 플랫폼 런칭 및 글로벌 비전 선포" },
                { year: "2020년", text: "온라인 실시간 예배 시스템 구축 및 비전센터 봉헌" },
                { year: "2015년", text: "제2성전 건축 입당 감사예배 및 해외 단독 선교사 파송" },
                { year: "2008년", text: "교회 설립 10주년 기념 감사 축제 및 지역 나눔 사역 확대" },
                { year: "1998년", text: "성령의 인도하심으로 예톡행복한교회 첫 개척 예배" }
            ]
        }
    };

    let currentSectionIdx = 0;
    let churchSections = {};

    function loadSections() {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
            try { churchSections = JSON.parse(raw); } catch(e) { churchSections = DEFAULT_DATA; }
        } else {
            churchSections = DEFAULT_DATA;
        }
        renderViewport();
    }

    function renderViewport() {
        const vp = document.getElementById("introViewport");
        vp.innerHTML = "";

        TAB_KEYS.forEach((key, idx) => {
            const item = churchSections[key] || DEFAULT_DATA[key];
            const sec = document.createElement("section");
            sec.className = "snap-page-section";
            sec.id = `sec_card_${idx}`;
            sec.dataset.index = idx;

            let html = `
                <div class="section-header-row">
                    <div>
                        <span class="badge-pill">${item.badge}</span>
                        <h2 class="article-main-title">${item.title}</h2>
                    </div>
                </div>
            `;

            if (item.img && item.img.trim() !== "") {
                html += `
                    <div class="attached-photo-wrap">
                        <img src="${item.img}" alt="${item.title}">
                    </div>
                `;
            }

            html += `<p class="article-text-body">${item.body}</p>`;

            // 섬기는 이 (리더 2열 그리드)
            if (key === "servants" && item.leaders) {
                html += `<div class="clean-leader-grid">`;
                item.leaders.forEach(l => {
                    html += `
                        <div class="clean-leader-card">
                            <img class="clean-leader-img" src="${l.img}" alt="${l.name}">
                            <div class="clean-leader-info">
                                <span class="clean-leader-name">${l.name}</span>
                                <span class="clean-leader-role">${l.role}</span>
                                <span class="clean-leader-desc">${l.desc}</span>
                            </div>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // 교회역사 타임라인
            if (key === "history" && item.historyList) {
                html += `<div class="clean-timeline-box">`;
                item.historyList.forEach(h => {
                    html += `
                        <div class="clean-timeline-row">
                            <span class="clean-timeline-year">${h.year}</span>
                            <span class="clean-timeline-text">${h.text}</span>
                        </div>
                    `;
                });
                html += `</div>`;
            }

            // 불릿 포인트 리스트
            if (item.bullets && item.bullets.length > 0) {
                html += `<div style="display:flex; flex-direction:column; gap:4px; margin-top:4px;">`;
                item.bullets.forEach(b => {
                    html += `<div class="bullet-point-line">${b}</div>`;
                });
                html += `</div>`;
            }

            sec.innerHTML = html;
            vp.appendChild(sec);
        });

        setupScrollObserver();
    }

    // 한 칸씩 정확히 탁! 탁! 스크롤 연동
    function setupScrollObserver() {
        const vp = document.getElementById("introViewport");
        let timer = null;

        vp.addEventListener("scroll", () => {
            clearTimeout(timer);
            timer = setTimeout(() => {
                const h = vp.clientHeight || 1;
                const idx = Math.round(vp.scrollTop / h);
                if (idx >= 0 && idx < TAB_KEYS.length && idx !== currentSectionIdx) {
                    currentSectionIdx = idx;
                    updateTabNavUI(idx);
                }
            }, 80);
        }, { passive: true });
    }

    function updateTabNavUI(idx) {
        document.querySelectorAll(".intro-tab").forEach((tab, i) => {
            const match = (i === idx);
            tab.classList.toggle("active", match);
            if (match) tab.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        });
    }

    function scrollToSection(idx) {
        currentSectionIdx = idx;
        const target = document.getElementById(`sec_card_${idx}`);
        if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
            updateTabNavUI(idx);
        }
    }

    // 🌟 화면수정 모달 오픈
    function triggerCurrentTabEdit() {
        const key = TAB_KEYS[currentSectionIdx];
        const item = churchSections[key] || DEFAULT_DATA[key];
        document.getElementById("lblGeneralModalTitle").innerText = `✏️ [${item.badge}] 내용 및 사진 수정`;
        document.getElementById("inpGeneralTitle").value = item.title || "";
        document.getElementById("inpGeneralImg").value = item.img || "";
        document.getElementById("inpGeneralBody").value = item.body || "";
        openModal("generalPageEditModal");
    }

    function saveGeneralPageData() {
        const key = TAB_KEYS[currentSectionIdx];
        if (!churchSections[key]) churchSections[key] = { ...DEFAULT_DATA[key] };

        const title = document.getElementById("inpGeneralTitle").value.trim();
        const img = document.getElementById("inpGeneralImg").value.trim();
        const body = document.getElementById("inpGeneralBody").value.trim();

        if (!title) { alert("제목을 입력해 주세요."); return; }

        churchSections[key].title = title;
        churchSections[key].img = img;
        churchSections[key].body = body;

        localStorage.setItem(STORAGE_KEY, JSON.stringify(churchSections));
        renderViewport();
        scrollToSection(currentSectionIdx);
        closeModal("generalPageEditModal");
        showToast("✨ 수정 내용이 안전하게 저장되었습니다.");
    }

    function openModal(id) { document.getElementById(id)?.classList.add("show"); }
    function closeModal(id) { document.getElementById(id)?.classList.remove("show"); }

    function showToast(msg) {
        const t = document.getElementById("yetalkToast");
        if (!t) return;
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const churchName = localStorage.getItem("yetalkChurchName") || localStorage.getItem("yetalkUserStoreName") || "예톡행복한교회";
        const titleEl = document.getElementById("introHeaderTitle");
        if (titleEl) titleEl.innerText = `${churchName} 소개`;

        loadSections();
    });
</script>
</body>
</html>
