<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>보배성도 - 예톡행복한교회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@500;700;900&family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px) + 38px, 42px);
            --header-base-h: 52px;
            --header-h: calc(var(--header-base-h) + var(--safe-top));
            --accent-cyan: #38bdf8;
            --accent-gold: #facc15;
            --accent-red: #dc2626;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            background: #060a12;
            font-family: "Pretendard", -apple-system, sans-serif;
            color: #ffffff;
            overflow-x: hidden;
        }

        .member-shell {
            width: 100%; max-width: 480px; min-height: 100vh;
            margin: 0 auto; background: #090e1a;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            padding-bottom: 20px;
        }

        /* 1층 헤더: 세이프에리어 완벽 적용 */
        .member-header {
            height: var(--header-h); background: #0f172a;
            border-bottom: 1.5px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center;
            padding: var(--safe-top) 14px 0 14px;
            position: sticky; top: 0; z-index: 100;
        }
        .btn-header-back {
            background: none; border: none; color: #38bdf8;
            font-size: 26px; font-weight: 900; cursor: pointer; padding: 4px;
        }
        .header-title { font-size: 17.5px; font-weight: 950; color: #ffffff; }

        .dual-admin-btn-group {
            display: inline-flex; align-items: center; background: #dc2626; border-radius: 9999px;
            padding: 2px; box-shadow: 0 2px 8px rgba(220, 38, 38, 0.4);
        }
        .btn-admin-room {
            background: transparent; border: none; color: #ffffff; font-size: 11px; font-weight: 900;
            padding: 4px 8px; cursor: pointer; border-right: 1px solid rgba(255, 255, 255, 0.35);
        }
        .btn-admin-edit {
            background: transparent; color: #fef08a; border: none;
            font-size: 11px; font-weight: 900; padding: 4px 8px; cursor: pointer;
        }

        /* 상단 히어로 배너 */
        .member-hero-banner {
            padding: 20px 16px 14px 16px;
            background: linear-gradient(180deg, #111a2f 0%, #090e1a 100%);
            border-bottom: 1px solid #1e293b;
            text-align: center;
        }
        .hero-badge {
            display: inline-block; background: rgba(56, 189, 248, 0.15);
            border: 1px solid rgba(56, 189, 248, 0.4); color: #38bdf8;
            font-size: 11px; font-weight: 900; padding: 3px 10px; border-radius: 12px;
            margin-bottom: 8px;
        }
        .hero-title {
            font-size: 20px; font-weight: 950; color: #ffffff; letter-spacing: -0.5px;
        }
        .hero-sub {
            font-size: 12.5px; color: #94a3b8; margin-top: 4px; line-height: 1.5;
        }

        /* 11대 보배성도 성구 카드 리스트 */
        .member-card-list {
            padding: 14px 12px;
            display: flex; flex-direction: column; gap: 12px;
        }

        .saint-card {
            background: #111a2f; border: 1.5px solid #1e3a8a;
            border-radius: 14px; overflow: hidden;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.5);
            transition: all 0.25s ease;
            cursor: pointer;
        }
        .saint-card:active { transform: scale(0.985); }
        .saint-card.expanded {
            border-color: #38bdf8;
            box-shadow: 0 6px 20px rgba(56, 189, 248, 0.25);
        }

        .saint-card-head {
            padding: 14px; display: flex; flex-direction: column; gap: 6px;
        }
        .saint-card-top-row {
            display: flex; justify-content: space-between; align-items: center;
        }
        .saint-tag {
            font-size: 11px; font-weight: 900; color: #38bdf8;
            background: rgba(56, 189, 248, 0.12); border: 1px solid rgba(56, 189, 248, 0.35);
            padding: 2px 8px; border-radius: 6px;
        }
        .saint-arrow-indicator {
            font-size: 12px; color: #64748b; font-weight: 800; transition: transform 0.2s;
        }
        .saint-card.expanded .saint-arrow-indicator {
            transform: rotate(180deg); color: #38bdf8;
        }

        .saint-card-title {
            font-size: 16.5px; font-weight: 950; color: #ffffff;
        }
        .saint-card-verse {
            font-family: 'Nanum Myeongjo', serif;
            font-size: 14.5px; font-weight: 800; color: #fde047;
            line-height: 1.48; word-break: keep-all; margin-top: 2px;
        }

        /* 펼쳐지는 상세 묵상 & 기도 */
        .saint-card-body {
            display: none; padding: 0 14px 14px 14px;
            border-top: 1px dashed rgba(255, 255, 255, 0.1);
            margin-top: 4px; padding-top: 10px;
        }
        .saint-card.expanded .saint-card-body { display: flex; flex-direction: column; gap: 8px; }

        .saint-meditation-box {
            font-size: 13px; line-height: 1.65; color: #cbd5e1; word-break: keep-all; white-space: pre-line;
        }
        .saint-prayer-box {
            background: rgba(15, 23, 42, 0.85); border-left: 3px solid #38bdf8;
            padding: 8px 10px; border-radius: 0 8px 8px 0;
            font-size: 12px; line-height: 1.55; color: #e2e8f0; word-break: keep-all;
        }
        .prayer-label { font-weight: 900; color: #38bdf8; display: block; margin-bottom: 2px; }

        /* 수정 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.92);
            z-index: 2000000; align-items: center; justify-content: center; padding: 14px; backdrop-filter: blur(6px);
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            width: 100%; max-width: 440px; background: #0f172a; border: 2px solid #38bdf8;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px; max-height: 90vh; overflow-y: auto;
        }
        .modal-input {
            width: 100%; background: #162238; border: 1.5px solid #334155; border-radius: 8px;
            padding: 8px 10px; color: white; font-size: 13px; font-weight: 600; outline: none; font-family: inherit;
        }

        .yetalk-toast {
            position: fixed; bottom: 170px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95); color: #facc15; border: 1px solid #facc15;
            padding: 9px 18px; border-radius: 20px; font-size: 12px; font-weight: 900;
            z-index: 2000005; opacity: 0; visibility: hidden; transition: all 0.25s ease; white-space: nowrap;
        }
        .yetalk-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="member-shell">
    <!-- 1층 헤더 -->
    <header class="member-header">
        <button type="button" class="btn-header-back" onclick="goBackToMain()">‹</button>
        <strong class="header-title">보배성도 (11대 은혜 성구)</strong>
        <div class="dual-admin-btn-group">
            <button type="button" class="btn-admin-room" onclick="location.href='churchadmin.html'" title="관리실 전체설정">◀ 관리실</button>
            <button type="button" class="btn-admin-edit" onclick="openAdminModal()" title="보배성도 말씀 직접 수정">화면수정 ▶</button>
        </div>
    </header>

    <!-- 상단 히어로 배너 -->
    <div class="member-hero-banner">
        <span class="hero-badge">💎 주님의 특별한 소유</span>
        <h1 class="hero-title">보배롭고 존귀한 주의 성도</h1>
        <p class="hero-sub">카드를 터치하시면 깊은 묵상과 축복 기도가 열립니다.</p>
    </div>

    <!-- 11대 보배성도 카드 목록 -->
    <div class="member-card-list" id="memberCardList">
        <!-- JS 동적 렌더링 -->
    </div>

    <!-- 토스트 메시지 -->
    <div class="yetalk-toast" id="memberToast"></div>
</div>

<!-- 관리자 수정 모달 -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:6px;">
            <strong style="color:#facc15; font-size:15px;" id="modalMemberTitle">✏️ 보배성도 성구 수정</strong>
            <button type="button" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="closeAdminModal()">✕</button>
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">수정할 성구 번호 선택</label>
            <select id="selCardIndex" class="modal-input" onchange="loadCardIntoEditor()">
                <!-- JS 생성 -->
            </select>
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">성구 출처 및 태그 (예: 👑 벧전 2:9 택하신 족속)</label>
            <input type="text" class="modal-input" id="inpCardTag">
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">카드 대표 제목</label>
            <input type="text" class="modal-input" id="inpCardTitle">
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">성경 구절 요절</label>
            <textarea class="modal-input" id="inpCardVerse" style="min-height:55px; resize:vertical;"></textarea>
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">상세 묵상 글</label>
            <textarea class="modal-input" id="inpCardMeditation" style="min-height:75px; resize:vertical;"></textarea>
        </div>
        <div>
            <label style="font-size:11px; color:#38bdf8; font-weight:800; display:block; margin-bottom:2px;">성도를 위한 축복 기도문</label>
            <textarea class="modal-input" id="inpCardPrayer" style="min-height:65px; resize:vertical;"></textarea>
        </div>
        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
            <button type="button" style="background:#334155; color:white; border:none; padding:7px 14px; border-radius:6px; font-size:12px; cursor:pointer;" onclick="closeAdminModal()">취소</button>
            <button type="button" style="background:#dc2626; color:white; border:none; padding:7px 16px; border-radius:6px; font-size:12px; font-weight:900; cursor:pointer;" onclick="saveCardData()">저장하기</button>
        </div>
    </div>
</div>

<script>
    const STORAGE_KEY = "yetalk_church_member_cards_v31";

    const DEFAULT_SAINT_CARDS = [

        {

            prayer: "주 안에서 귀한 지체들을 만나게 하신 은혜를 찬양합니다. 서로를 뜨겁게 사랑하고 격려하며, 주님의 따뜻한 공동체를 함께 세워가게 하옵소서."

        },
        {
            tag: "🛡️ 롬 8:38-39 끊을 수 없는 사랑",
            title: "어떤 환난도 끊을 수 없는 주의 사랑",
            verse: "“내가 확신하노니 사망이나 생명이나 천사들이나 권세자들이나 현재 일이나 장래 일이나 능력이나 높음이나 깊음이나 다른 어떤 피조물이라도 우리를 우리 주 그리스도 예수 안에 있는 하나님의 사랑에서 끊을 수 없으리라”",
            meditation: "인생의 큰 시험과 위기, 고난이 닥쳐와도 주님의 손에서 우리를 빼앗을 수 있는 것은 아무것도 없습니다. 주님의 사랑은 영원히 안전합니다.",
            prayer: "변함없는 십자가 사랑으로 저를 굳게 붙들어 주시는 주님, 어떤 역경 앞에서도 흔들리지 않는 굳건한 평안을 허락하여 주옵소서."
        },
        {
            tag: "👑 빌 4:1 나의 기쁨과 면류관",
            title: "영원한 상급과 면류관이 되는 성도",
            verse: "“그러므로 나의 사랑하고 사모하는 형제들, 나의 기쁨이요 면류관인 사랑하는 자들아 이와 같이 주 안에 서라”",
            meditation: "성도는 목회자의 가장 큰 기쁨이며, 하나님 나라에서 함께 면류관을 쓸 동역자입니다. 주 안에서 서로 굳게 서서 끝까지 승리합시다.",
            prayer: "주님 안에서 함께 부름받은 성도들과 손잡고 믿음의 길을 걷습니다. 마침내 영광의 면류관을 주님 발 앞에 드리며 영원히 찬양케 하옵소서."
        }
    ];

    let saintCards = [];

    function goBackToMain() {
        sessionStorage.setItem("church_last_active_card_idx", "7");
        location.href = "churchmain.html";
    }

    function initPage() {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) {
            try { saintCards = JSON.parse(saved); } catch(e) { saintCards = DEFAULT_SAINT_CARDS; }
        } else {
            saintCards = DEFAULT_SAINT_CARDS;
            localStorage.setItem(STORAGE_KEY, JSON.stringify(saintCards));
        }
        renderCards();
    }

    function renderCards() {
        const listEl = document.getElementById("memberCardList");
        listEl.innerHTML = "";

        saintCards.forEach((c, idx) => {
            const card = document.createElement("div");
            card.className = "saint-card" + (idx === 0 ? " expanded" : "");
            card.onclick = () => {
                card.classList.toggle("expanded");
            };

            card.innerHTML = `
                <div class="saint-card-head">
                    <div class="saint-card-top-row">
                        <span class="saint-tag">${c.tag}</span>
                        <span class="saint-arrow-indicator">▼</span>
                    </div>
                    <h3 class="saint-card-title">${idx + 1}. ${c.title}</h3>
                    <div class="saint-card-verse">${c.verse}</div>
                </div>
                <div class="saint-card-body">
                    <div class="saint-meditation-box">${c.meditation}</div>
                    <div class="saint-prayer-box">
                        <span class="prayer-label">🙏 성도를 위한 축복 기도</span>
                        ${c.prayer}
                    </div>
                </div>
            `;
            listEl.appendChild(card);
        });
    }

    function openAdminModal() {
        const sel = document.getElementById("selCardIndex");
        sel.innerHTML = "";
        saintCards.forEach((c, idx) => {
            const opt = document.createElement("option");
            opt.value = idx;
            opt.innerText = `${idx + 1}번: ${c.title}`;
            sel.appendChild(opt);
        });
        loadCardIntoEditor();
        document.getElementById("adminModal").classList.add("open");
    }

    function closeAdminModal() {
        document.getElementById("adminModal").classList.remove("open");
    }

    function loadCardIntoEditor() {
        const idx = parseInt(document.getElementById("selCardIndex").value, 10) || 0;
        const c = saintCards[idx];
        if (!c) return;
        document.getElementById("inpCardTag").value = c.tag;
        document.getElementById("inpCardTitle").value = c.title;
        document.getElementById("inpCardVerse").value = c.verse;
        document.getElementById("inpCardMeditation").value = c.meditation;
        document.getElementById("inpCardPrayer").value = c.prayer;
    }

    function saveCardData() {
        const idx = parseInt(document.getElementById("selCardIndex").value, 10) || 0;
        if (!saintCards[idx]) saintCards[idx] = {};

        saintCards[idx].tag = document.getElementById("inpCardTag").value.trim();
        saintCards[idx].title = document.getElementById("inpCardTitle").value.trim();
        saintCards[idx].verse = document.getElementById("inpCardVerse").value.trim();
        saintCards[idx].meditation = document.getElementById("inpCardMeditation").value.trim();
        saintCards[idx].prayer = document.getElementById("inpCardPrayer").value.trim();

        localStorage.setItem(STORAGE_KEY, JSON.stringify(saintCards));
        renderCards();
        closeAdminModal();
        showToast("🎉 보배성도 성구 카드가 저장되었습니다!");
    }

    function showToast(msg) {
        const t = document.getElementById("memberToast");
        if (!t) return;
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    document.addEventListener("DOMContentLoaded", initPage);
</script>

<script src="church_bottom_bar.js"></script>
</body>
