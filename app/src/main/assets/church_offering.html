<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>온라인 헌금 간편결제 - 예톡행복한교회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@500;700;800;900&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #090e1a; font-family: "Pretendard", -apple-system, sans-serif;
            color: #ffffff; display: flex; justify-content: center; min-height: 100vh;
        }
        .offering-app-shell {
            width: 100%; max-width: 480px; min-height: 100vh; background: #0b1325;
            display: flex; flex-direction: column; position: relative;
            border-left: 1px solid #1e293b; border-right: 1px solid #1e293b;
            padding-bottom: 30px;
        }
        .top-header {
            padding: max(env(safe-area-inset-top, 0px) + 14px, 24px) 16px 12px 16px;
            background: #0f172a; border-bottom: 1.5px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 100;
        }
        .header-title { font-size: 16.5px; font-weight: 950; color: #facc15; display: flex; align-items: center; gap: 6px; }
        .btn-go-home {
            background: #0284c7; color: #ffffff; border: 1px solid #38bdf8;
            padding: 5px 12px; border-radius: 14px; font-size: 12px; font-weight: 900; cursor: pointer;
        }
        .content-scroll {
            flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px;
        }
        .card-box {
            background: #101c36; border: 1.5px solid #1e3a8a; border-radius: 14px;
            padding: 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .card-label { font-size: 12px; font-weight: 900; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
        .m-input {
            width: 100%; background: #162238; border: 1.5px solid #334155; border-radius: 8px;
            padding: 9px 12px; color: #ffffff; font-size: 14px; font-weight: 700; outline: none; font-family: inherit;
        }
        .m-input:focus { border-color: #38bdf8; }
        .btn-primary {
            width: 100%; height: 48px; background: linear-gradient(135deg, #0284c7, #2563eb);
            color: white; border: none; border-radius: 12px; font-size: 15px; font-weight: 950; cursor: pointer;
            box-shadow: 0 4px 14px rgba(2, 132, 199, 0.4);
        }
        .btn-primary:active { transform: scale(0.98); }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .toast-box {
            position: fixed; bottom: 170px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95); border: 1.5px solid #38bdf8; color: #ffffff;
            padding: 10px 20px; border-radius: 20px; font-size: 12.5px; font-weight: 850;
            opacity: 0; visibility: hidden; transition: all 0.25s ease; z-index: 99999;
        }
        .toast-box.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="offering-app-shell">
    <header class="top-header">
        <div class="header-title" onclick="location.href='churchmain.html'" style="cursor:pointer;">
            <span>⛪</span> <span>온라인 헌금 간편결제</span>
        </div>
        <button type="button" class="btn-go-home" onclick="location.href='churchmain.html'">교회홈</button>
    </header>

    <main class="content-scroll">
        <!-- 헌금자 출금 정보 -->
        <section class="card-box">
            <div class="card-label">
                <span>💼 헌금하시는 분 (출금 정보)</span>
                <button type="button" style="background:#0284c7; color:white; border:none; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:900; cursor:pointer;" onclick="saveGiverInfo()">내정보 저장</button>
            </div>
            <div class="grid-2">
                <input type="text" class="m-input" id="inpGiverName" placeholder="성함">
                <select id="selGiverBank" class="m-input">
                    <option value="국민은행">국민은행 (KB)</option>
                    <option value="농협은행">농협은행 (NH)</option>
                    <option value="신한은행">신한은행</option>
                    <option value="우리은행">우리은행</option>
                    <option value="하나은행">하나은행</option>
                    <option value="카카오뱅크">카카오뱅크</option>
                    <option value="토스뱅크">토스뱅크</option>
                    <option value="케이뱅크">케이뱅크</option>
                    <option value="기업은행">IBK기업은행</option>
                    <option value="SC제일은행">SC제일은행</option>
                    <option value="우체국">우체국</option>
                    <option value="새마을금고">새마을금고</option>
                    <option value="신협">신협</option>
                    <option value="수협은행">수협은행</option>
                    <option value="부산은행">부산은행</option>
                    <option value="대구은행">iM뱅크(대구)</option>
                    <option value="경남은행">경남은행</option>
                    <option value="광주은행">광주은행</option>
                    <option value="전북은행">전북은행</option>
                    <option value="제주은행">제주은행</option>
                    <option value="KDB산업은행">KDB산업은행</option>
                    <option value="산림조합">산림조합</option>
                </select>
            </div>
            <input type="text" class="m-input" id="inpGiverAcc" placeholder="출금 계좌번호 (- 없이)">
        </section>

        <!-- 교회 계좌 정보 -->
        <section class="card-box">
            <div class="card-label">
                <span style="color:#facc15;">🏛️ 받는 분 (교회 계좌)</span>
                <button type="button" style="background:#eab308; color:#0f172a; border:none; border-radius:6px; padding:2px 8px; font-size:11px; font-weight:950; cursor:pointer;" onclick="saveReceiverInfo()">저장</button>
            </div>
            <div class="grid-2">
                <input type="text" class="m-input" id="inpReceiverName" placeholder="교회명">
                <input type="text" class="m-input" id="inpReceiverBank" placeholder="은행명">
            </div>
            <div class="grid-2">
                <input type="text" class="m-input" id="inpReceiverAcc" placeholder="계좌번호">
                <input type="text" class="m-input" id="inpReceiverHolder" placeholder="예금주">
            </div>
        </section>

        <!-- 헌금 금액 -->
        <section class="card-box">
            <div class="card-label">
                <span>💰 헌금 금액 (원)</span>
            </div>
            <input type="number" class="m-input" id="inpAmount" value="50000" style="font-size:18px; color:#facc15; font-weight:950;">
        </section>

        <!-- 결제 버튼들 -->
        <button type="button" class="btn-primary" onclick="submitOffering()">
            🚀 즉시 송금 (계좌 자동복사 + 내 은행앱 열기)
        </button>

        <div class="grid-2">
            <button type="button" style="height:42px; background:#1e293b; color:#38bdf8; border:1.5px solid #38bdf8; border-radius:10px; font-size:13px; font-weight:900; cursor:pointer;" onclick="copyAccountOnly()">
                📋 계좌번호만 복사
            </button>
            <button type="button" style="height:42px; background:#1e293b; color:#facc15; border:1.5px solid #facc15; border-radius:10px; font-size:13px; font-weight:900; cursor:pointer;" onclick="openTossDirect()">
                ⚡ 토스로 바로 송금
            </button>
        </div>
    </main>
</div>

<div class="toast-box" id="toastBox"></div>

<script>
    const BANK_MAP = {
        "국민은행": { pkg: "com.kbstar.kbbank", name: "KB스타뱅킹" },
        "농협은행": { pkg: "nh.smart.banking", name: "NH스마트뱅킹" },
        "신한은행": { pkg: "com.shinhan.sbanking", name: "신한 SOL뱅크" },
        "우리은행": { pkg: "com.wooribank.smart.npib", name: "우리WON뱅킹" },
        "하나은행": { pkg: "com.kebhana.hananbank", name: "하나원큐" },
        "카카오뱅크": { pkg: "com.kakaobank.channel", name: "카카오뱅크" },
        "토스뱅크": { pkg: "viva.republica.toss", name: "토스" },
        "케이뱅크": { pkg: "com.kbankwith.smartbank", name: "케이뱅크" },
        "기업은행": { pkg: "com.ibk.neobanking", name: "i-ONE Bank" },
        "SC제일은행": { pkg: "com.scfirstbank.breeze", name: "SC제일은행" },
        "우체국": { pkg: "com.epost.psns.sbanking", name: "우체국스마트뱅킹" },
        "새마을금고": { pkg: "kr.co.kfcc.mobile", name: "MG더뱅킹" },
        "신협": { pkg: "kr.co.cu.smartbank", name: "신협ON뱅크" },
        "수협은행": { pkg: "com.suhyup.psb", name: "수협헤이뱅크" },
        "부산은행": { pkg: "com.bsbank.smartbank", name: "부산은행" },
        "대구은행": { pkg: "com.dgb.bmap", name: "iM뱅크" },
        "경남은행": { pkg: "com.knbank.maru", name: "경남은행" },
        "광주은행": { pkg: "com.kjbank.smart", name: "광주은행" },
        "전북은행": { pkg: "com.jbbank.mbs", name: "전북은행" },
        "제주은행": { pkg: "com.shinhan.jejubank", name: "제주은행" },
        "KDB산업은행": { pkg: "com.kdb.smart", name: "스마트KDB" },
        "산림조합": { pkg: "kr.co.nfcf.smartbank", name: "산림조합" }
    };

    function showToast(msg) {
        const t = document.getElementById("toastBox");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    function initOfferingData() {
        document.getElementById("inpGiverName").value = localStorage.getItem("yetalkUserName") || "김예톡";
        document.getElementById("selGiverBank").value = localStorage.getItem("yetalkGiverBank") || "국민은행";
        document.getElementById("inpGiverAcc").value = localStorage.getItem("yetalkGiverAcc") || "";

        document.getElementById("inpReceiverName").value = localStorage.getItem("yetalkChurchName") || "예톡행복한교회";
        document.getElementById("inpReceiverBank").value = localStorage.getItem("yetalkChurchBank") || "농협";
        document.getElementById("inpReceiverAcc").value = localStorage.getItem("yetalkChurchAcc") || "302-1234-5678-91";
        document.getElementById("inpReceiverHolder").value = localStorage.getItem("yetalkChurchHolder") || "예톡행복한교회";
    }

    function saveGiverInfo() {
        localStorage.setItem("yetalkUserName", document.getElementById("inpGiverName").value.trim());
        localStorage.setItem("yetalkGiverBank", document.getElementById("selGiverBank").value);
        localStorage.setItem("yetalkGiverAcc", document.getElementById("inpGiverAcc").value.trim());
        showToast("✨ 출금 정보가 저장되었습니다!");
    }

    function saveReceiverInfo() {
        localStorage.setItem("yetalkChurchName", document.getElementById("inpReceiverName").value.trim());
        localStorage.setItem("yetalkChurchBank", document.getElementById("inpReceiverBank").value.trim());
        localStorage.setItem("yetalkChurchAcc", document.getElementById("inpReceiverAcc").value.trim());
        localStorage.setItem("yetalkChurchHolder", document.getElementById("inpReceiverHolder").value.trim());
        showToast("✨ 교회 계좌 정보가 저장되었습니다!");
    }

    function copyAccountOnly() {
        const acc = document.getElementById("inpReceiverAcc").value.trim();
        const bank = document.getElementById("inpReceiverBank").value.trim();
        if (navigator.clipboard) navigator.clipboard.writeText(acc);
        showToast(`📋 [${bank} ${acc}] 계좌가 복사되었습니다!`);
    }

    function openTossDirect() {
        const acc = document.getElementById("inpReceiverAcc").value.replace(/[^0-9]/g, "");
        const bank = document.getElementById("inpReceiverBank").value.trim();
        const amount = document.getElementById("inpAmount").value.trim();

        if (navigator.clipboard) navigator.clipboard.writeText(acc);
        showToast("⚡ 토스 앱으로 안전하게 연결합니다...");

        const tossUrl = `supertoss://send?bank=${encodeURIComponent(bank)}&account=${acc}&amount=${amount}`;
        window.location.href = tossUrl;
        setTimeout(() => {
            window.location.href = "intent://#Intent;package=viva.republica.toss;end;";
        }, 800);
    }

    function submitOffering() {
        const bank = document.getElementById("inpReceiverBank").value.trim();
        const acc = document.getElementById("inpReceiverAcc").value.trim();
        const amount = document.getElementById("inpAmount").value.trim();
        const giverBank = document.getElementById("selGiverBank").value;

        if (!amount || parseInt(amount, 10) <= 0) {
            showToast("헌금 금액을 올바르게 입력해주세요.");
            return;
        }

        if (navigator.clipboard) navigator.clipboard.writeText(acc);
        showToast(`📋 [${bank} ${acc}] 계좌 복사 완료! [${giverBank}] 앱으로 연결합니다...`);

        const bankInfo = BANK_MAP[giverBank] || BANK_MAP["국민은행"];
        setTimeout(() => {
            if (bankInfo) {
                window.location.href = `intent://#Intent;package=${bankInfo.pkg};end;`;
            }
        }, 600);
    }

    document.addEventListener("DOMContentLoaded", initOfferingData);
</script>
<script src="church_bottom_bar.js"></script>
</body>
</html>
