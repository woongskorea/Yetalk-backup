<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>예배 공간 - 예톡행복한교회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="church_theme.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        :root {
            --safe-top: max(env(safe-area-inset-top, 0px), 24px);
            --header-h: calc(42px + var(--safe-top));
            --tabs-h: 38px;
            --admob-h: calc(100px + max(env(safe-area-inset-bottom, 0px), 8px));
            --view-h: calc(100dvh - var(--header-h) - var(--tabs-h) - var(--admob-h));
            --primary: #0284c7;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        html, body {
            width: 100%; height: 100%;
            background: #060b14;
            font-family: "Pretendard", -apple-system, sans-serif;
            color: #ffffff;
            overflow: hidden;
        }

        .worship-shell {
            width: 100%; max-width: 520px; height: 100dvh;
            margin: 0 auto; background: #0b1120;
            display: flex; flex-direction: column; position: relative;
            box-shadow: 0 0 40px rgba(0, 0, 0, 0.9);
            overflow: hidden;
        }

        /* 🌟 1층 헤더: 오직 깔끔한 ← 화살표만 단독 배치 (뒤로가기 글자, 타이틀, 버튼 일체 삭제) */
        .worship-header {
            height: var(--header-h);
            background: transparent;
            border: none;
            display: flex;
            align-items: center;
            justify-content: flex-start;
            padding: var(--safe-top) 12px 6px 12px;
            flex-shrink: 0;
            z-index: 100;
        }
        .btn-clean-back {
            background: rgba(15, 23, 42, 0.75);
            border: 1.2px solid rgba(255, 255, 255, 0.25);
            color: #ffffff;
            font-size: 20px;
            font-weight: 900;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            transition: all 0.15s ease;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
            line-height: 1;
        }
        .btn-clean-back:active {
            transform: scale(0.9);
            background: #0284c7;
            border-color: #38bdf8;
        }

        /* 🌟 2층 가로 롤링 칩 메뉴 (실제 6대 예배 탭 구성) */
        .worship-tabs-bar {
            height: var(--tabs-h); background: #0c1424;
            border-bottom: 1.5px solid #1e293b;
            display: flex; gap: 6px; overflow-x: auto; white-space: nowrap;
            padding: 0 10px; align-items: center; flex-shrink: 0;
            z-index: 99; scrollbar-width: none;
        }
        .worship-tabs-bar::-webkit-scrollbar { display: none; }
        .w-tab-chip {
            background: #1a263c; border: 1px solid #334155; color: #94a3b8;
            font-size: 12.5px; font-weight: 850; padding: 5px 12px; border-radius: 16px;
            cursor: pointer; flex-shrink: 0; transition: all 0.2s;
            display: inline-flex; align-items: center; gap: 4px;
        }
        .w-tab-chip.active {
            background: linear-gradient(135deg, #0284c7, #0ea5e9);
            color: #ffffff; border-color: #38bdf8; font-weight: 950;
            box-shadow: 0 2px 8px rgba(2, 132, 199, 0.45);
        }
        .live-dot-pulse {
            color: #ef4444; font-size: 11px; line-height: 1;
            animation: dotFlicker 0.8s infinite alternate;
        }
        @keyframes dotFlicker {
            from { opacity: 1; }
            to { opacity: 0.25; }
        }

        /* 3층 세로 스냅 뷰포트 */
        .worship-viewport {
            flex: 1; height: var(--view-h);
            overflow-y: scroll; scroll-snap-type: y mandatory;
            scroll-behavior: smooth; -webkit-overflow-scrolling: touch;
            position: relative;
        }
        .worship-viewport::-webkit-scrollbar { display: none; }
        .worship-viewport.locked-scroll {
            overflow-y: hidden !important; scroll-snap-type: none !important; touch-action: none !important;
        }

        .worship-touch-guard {
            display: none; position: fixed; inset: 0;
            z-index: 250000; background: rgba(0, 0, 0, 0.05);
            touch-action: none;
        }

        .worship-snap-section {
            width: 100%; min-height: var(--view-h);
            background: #0b1325;
            padding: 8px 10px 20px 10px;
            display: flex; flex-direction: column; gap: 8px;
        }
        .worship-snap-section::-webkit-scrollbar { display: none; }

        /* 영상 바로 위 예배종류 표시 */
        .worship-kind-header-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 2px 4px;
        }
        .worship-kind-badge {
            display: inline-flex; align-items: center; gap: 5px;
            font-size: 13.5px; font-weight: 850; color: #38bdf8;
        }
        .worship-live-tag {
            font-size: 10.5px; font-weight: 900; background: #dc2626; color: #fff;
            padding: 2px 7px; border-radius: 6px;
            animation: livePulse 1.2s infinite ease-in-out;
        }
        @keyframes livePulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.6; }
        }

        /* 유튜브 플레이어 박스: 100%, 150%, 200% 배율 순환 지원 */
        .yt-player-box {
            width: 100%;
            aspect-ratio: calc(16 / (9 * var(--yt-zoom, 1)));
            background: #000000; border-radius: 12px;
            overflow: hidden; border: 1.5px solid #1e3a5f;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
            flex-shrink: 0; position: relative;
            transition: aspect-ratio 0.25s ease;
        }
        .yt-player-box iframe {
            width: calc(100% * var(--yt-zoom, 1));
            height: 100%;
            border: none;
            display: block;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.25s ease;
        }
        .yt-inapp-guard-top {
            position: absolute; top: 0; left: 0; right: 0; height: 38px;
            background: transparent; z-index: 5; cursor: default;
        }

        /* 🌟 영상 바로 밑 3대 컨트롤 버튼 바: [🔍 100/150/200%] [🔒 화면고정] [🏛️ 관리실] */
        .worship-ctrl-bar-under-video {
            display: flex; justify-content: space-between; align-items: center;
            gap: 6px; padding: 4px 0 2px 0; flex-shrink: 0;
            position: relative; z-index: 260000;
        }
        .btn-worship-ctrl {
            flex: 1; height: 38px;
            background: #131f37; border: 1.2px solid rgba(56, 189, 248, 0.35);
            color: #ffffff; font-size: 12px; font-weight: 850;
            border-radius: 9px; cursor: pointer; display: inline-flex;
            align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.4);
            transition: all 0.15s ease;
            white-space: nowrap;
        }
        .btn-worship-ctrl:active {
            transform: scale(0.96); background: #0284c7;
        }
        .btn-worship-ctrl.locked {
            background: #dc2626 !important; border-color: #ef4444 !important;
            color: #ffffff !important; box-shadow: 0 0 12px rgba(239, 68, 68, 0.7) !important;
        }

        /* 🌟 재생 중 풀스크린 몰입 모드 (재생 중 메뉴 숨김, 중지 시 복구) */
        body.is-playing-mode .worship-header,
        body.is-playing-mode .worship-tabs-bar,
        body.is-playing-mode .worship-kind-header-row,
        body.is-playing-mode .sermon-info-card,
        body.is-playing-mode .past-worship-header-btn,
        body.is-playing-mode .past-worship-text-list,
        body.is-playing-mode .bottom-fixed-admob-footer {
            display: none !important;
        }
        body.is-playing-mode .worship-shell {
            background: #000000 !important;
        }
        body.is-playing-mode .worship-viewport {
            height: 100dvh !important;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        body.is-playing-mode .worship-snap-section {
            min-height: 100dvh !important;
            height: 100dvh !important;
            padding: 0 !important;
            justify-content: center;
            background: #000000 !important;
            gap: 0 !important;
        }
        body.is-playing-mode .yt-player-box {
            width: 100% !important;
            height: 100% !important;
            max-height: 100dvh !important;
            border: none !important;
            border-radius: 0 !important;
            aspect-ratio: unset !important;
        }
        body.is-playing-mode .worship-ctrl-bar-under-video {
            position: fixed;
            bottom: max(env(safe-area-inset-bottom, 0px) + 8px, 12px);
            left: 14px;
            right: 14px;
            opacity: 0.15;
            transition: opacity 0.25s ease;
            z-index: 99999;
        }
        body.is-playing-mode .worship-ctrl-bar-under-video:hover,
        body.is-playing-mode .worship-ctrl-bar-under-video:active {
            opacity: 1;
        }

        /* 풀스크린 해제 플로팅 버튼 */
        .btn-exit-fullscreen {
            display: none;
            position: fixed;
            top: max(env(safe-area-inset-top, 0px) + 10px, 14px);
            right: 14px;
            background: rgba(15, 23, 42, 0.85);
            border: 1px solid rgba(255, 255, 255, 0.35);
            color: #ffffff;
            font-size: 11.5px;
            font-weight: 850;
            padding: 5px 12px;
            border-radius: 20px;
            cursor: pointer;
            z-index: 100000;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }
        body.is-playing-mode .btn-exit-fullscreen {
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        /* 🌟 설교 핵심 카드 (글자가 너무 과하게 강조되지 않도록 단정하고 차분하게 정돈) */
        .sermon-info-card {
            background: #0e1628; border: 1px solid #1e293b; border-radius: 12px;
            padding: 14px 16px; display: flex; flex-direction: column; gap: 7px;
            box-shadow: 0 4px 14px rgba(0,0,0,0.35); flex-shrink: 0; text-align: left;
            margin-top: 2px;
        }
        .sermon-title-main {
            font-size: 16.5px; font-weight: 750; color: #f1f5f9; line-height: 1.4; word-break: keep-all;
            letter-spacing: -0.3px;
        }
        .sermon-detail-row {
            display: flex; flex-direction: column; gap: 4px;
            padding-top: 6px; border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .detail-line {
            display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; color: #94a3b8;
        }
        .detail-tag {
            color: #38bdf8; font-weight: 700; font-size: 12px; min-width: 58px; flex-shrink: 0;
        }
        .detail-val {
            color: #cbd5e1; font-weight: 600; word-break: keep-all;
        }

        /* 지난 예배 리스트 */
        .past-worship-header-btn {
            background: none; border: none; width: 100%; display: flex; align-items: center; justify-content: space-between;
            padding: 8px 4px 6px 4px; cursor: pointer; outline: none; border-bottom: 1.5px solid #1e293b;
            flex-shrink: 0; margin-top: 4px;
        }
        .past-header-left { display: flex; align-items: center; gap: 6px; font-size: 13.5px; font-weight: 850; color: #38bdf8; }
        .red-triangle { color: #ef4444; font-size: 12px; }

        .past-worship-text-list { display: none; flex-direction: column; padding: 4px 6px; margin-top: 2px; text-align: left; }
        .past-worship-text-list.open { display: flex; }
        .past-text-row {
            display: flex; justify-content: space-between; align-items: center;
            padding: 9px 4px; border-bottom: 1px dashed #1e293b; cursor: pointer;
        }
        .past-text-row:last-child { border-bottom: none; }
        .row-title { font-size: 12.5px; font-weight: 750; color: #f1f5f9; display: flex; align-items: center; gap: 6px; }
        .row-title::before { content: "•"; color: #38bdf8; font-weight: 900; }
        .row-date { font-size: 11px; color: #64748b; font-weight: 600; flex-shrink: 0; }

        /* 하단 고정 100 애드몹 */
        .bottom-fixed-admob-footer {
            position: absolute; bottom: 0; left: 0; right: 0;
            height: var(--admob-h); background: #080d1a;
            border-top: 1.5px solid #1e3a5f;
            display: flex; flex-direction: column; align-items: center; justify-content: flex-start;
            padding-top: 6px; z-index: 1000; box-shadow: 0 -4px 20px rgba(0,0,0,0.9);
        }
        .admob-safety-bar {
            font-size: 9.5px; color: #64748b; font-weight: 850; letter-spacing: 0.5px;
            margin-bottom: 2px; display: flex; align-items: center; gap: 4px;
        }
        .admob-display-slot {
            width: calc(100% - 20px); max-width: 400px; height: 75px;
            background: #0b1326; border: 1.2px solid #1e293b; border-radius: 10px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,0.8); gap: 2px;
        }

        @media (min-width: 1024px) {
            .worship-shell {
                max-width: 1240px !important;
            }
            .worship-snap-section {
                max-width: 1100px;
                margin: 0 auto;
                padding: 14px 24px 30px 24px;
            }
            .worship-kind-header-row,
            .worship-ctrl-bar-under-video,
            .sermon-info-card,
            .past-worship-header-btn,
            .past-worship-text-list {
                max-width: 1000px;
                margin-left: auto;
                margin-right: auto;
                width: 100%;
            }
            /* 🌟 모니터에서는 1.5 또는 2배 영상 크게 (예톡홈같이) */
            .yt-player-box {
                max-width: 1000px;
                margin: 0 auto;
            }
        }

        body[data-theme="white"] { background: #fbf9f4 !important; color: #1e293b !important; }
        body[data-theme="white"] .worship-shell { background: #fbf9f4 !important; }
        body[data-theme="white"] .worship-snap-section { background: #fbf9f4 !important; }
        body[data-theme="white"] .worship-tabs-bar { background: #ffffff !important; border-bottom: 1.5px solid #e2e8f0 !important; }
        body[data-theme="white"] .w-tab-chip { background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #475569 !important; }
        body[data-theme="white"] .w-tab-chip.active { background: #0284c7 !important; color: #ffffff !important; border-color: #0284c7 !important; }
        body[data-theme="white"] .sermon-info-card { background: #ffffff !important; border-color: #e2e8f0 !important; box-shadow: 0 4px 16px rgba(0,0,0,0.05) !important; }
        body[data-theme="white"] .sermon-title-text { color: #0f172a !important; }
        body[data-theme="white"] .sermon-meta-text { color: #64748b !important; }
        body[data-theme="white"] .past-worship-header-btn { background: #f1f5f9 !important; border-color: #cbd5e1 !important; color: #0f172a !important; }
        body[data-theme="white"] .past-worship-item { background: #ffffff !important; border-color: #e2e8f0 !important; }
        body[data-theme="white"] .past-item-title { color: #0f172a !important; }
        body[data-theme="white"] .btn-worship-ctrl { background: #ffffff !important; border-color: #cbd5e1 !important; color: #0f172a !important; }

        /* 🌟 관리실 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.88);
            z-index: 2000000; align-items: center; justify-content: center; padding: 14px; backdrop-filter: blur(6px);
        }
        .modal-overlay.open { display: flex; }
        .modal-card {
            width: 100%; max-width: 420px; background: #0f172a; border: 1.8px solid #38bdf8;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px;
            max-height: 90vh; overflow-y: auto; text-align: left;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }
        .modal-input {
            width: 100%; background: #162238; border: 1.2px solid #334155; border-radius: 8px;
            padding: 9px 12px; color: #ffffff; font-size: 13.5px; font-weight: 700; outline: none; font-family: inherit;
        }
        .modal-input:focus { border-color: #38bdf8; }

        .yt-url-input-wrap {
            display: flex; gap: 6px; align-items: center; position: relative;
        }
        .modal-input-yt {
            flex: 1; background: #0c1a2e !important; border: 1.5px solid #0284c7 !important;
            border-radius: 8px; padding: 9px 12px; color: #ffffff !important;
            font-size: 13.5px !important; font-weight: 750 !important; outline: none; font-family: inherit;
        }
        .modal-input-yt:focus {
            border-color: #38bdf8 !important; box-shadow: 0 0 8px rgba(56, 189, 248, 0.5) !important;
        }
        .btn-quick-paste {
            height: 38px; padding: 0 12px; background: #0284c7; color: #ffffff;
            border: 1px solid #38bdf8; border-radius: 8px; font-size: 12px; font-weight: 900;
            cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35);
        }
        .btn-quick-paste:active { transform: scale(0.95); }

        /* 예톡TV 송출 2선택 바 */
        .admin-tv-toggle-box {
            background: #141f33; border: 1px solid #1e3a5f; border-radius: 10px;
            padding: 8px 12px; display: flex; justify-content: space-between; align-items: center;
        }
        .admin-tv-title { font-size: 12.5px; font-weight: 850; color: #fde047; }
        .admin-tv-btn-group { display: flex; gap: 6px; }
        .btn-tv-opt {
            padding: 5px 14px; border-radius: 6px; font-size: 12.5px; font-weight: 900;
            border: 1px solid #475569; background: #1e293b; color: #94a3b8; cursor: pointer;
            transition: all 0.15s ease;
        }
        .btn-tv-opt.active {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border-color: #38bdf8; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
        }

        .yetalk-toast {
            position: fixed; bottom: 120px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95); color: #facc15; border: 1px solid #facc15;
            padding: 9px 18px; border-radius: 20px; font-size: 12px; font-weight: 900;
            z-index: 2000005; opacity: 0; visibility: hidden; transition: all 0.25s ease; white-space: nowrap;
        }
        .yetalk-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="worship-shell">

    <!-- 1층 헤더: 오직 깔끔한 ← 뒤로가기 화살표만 단독 배치 (사용자 요청 100% 반영) -->
    <header class="worship-header" id="worshipHeader">
        <button type="button" class="btn-clean-back" onclick="goBackToMain()" title="교회 메인으로 이동">
            ←
        </button>
    </header>

    <!-- 풀스크린 시 해제 플로팅 버튼 -->
    <button type="button" class="btn-exit-fullscreen" id="btnExitFullscreen" onclick="setPlaybackMode(false)">
        ✕ 메뉴보기
    </button>

    <!-- 2층 가로 롤링 칩 메뉴 (실제 6대 예배 탭 구성) -->
    <nav class="worship-tabs-bar" id="worshipTabsBar">
        <button type="button" class="w-tab-chip active" id="wchip_0" onclick="switchWorshipTab(0)">주일예배</button>
        <button type="button" class="w-tab-chip" id="wchip_1" onclick="switchWorshipTab(1)">수요예배</button>
        <button type="button" class="w-tab-chip" id="wchip_2" onclick="switchWorshipTab(2)">금요기도회</button>
        <button type="button" class="w-tab-chip" id="wchip_3" onclick="switchWorshipTab(3)">새벽기도회</button>
        <button type="button" class="w-tab-chip" id="wchip_4" onclick="switchWorshipTab(4)">특별예배</button>
        <button type="button" class="w-tab-chip" id="wchip_5" onclick="switchWorshipTab(5)">찬양모음</button>
    </nav>

    <!-- 3층 세로 스냅 뷰포트 -->
    <main class="worship-viewport" id="worshipViewport">
        <div class="worship-touch-guard" id="worshipTouchGuard" onclick="showLockedAlert()"></div>
    </main>

    <!-- 4층 하단 고정: 100 애드몹만 단독 고정 -->
    <footer class="bottom-fixed-admob-footer">
        <div class="admob-safety-bar">
            <span>AD</span> • <span>Google AdMob 공식 스폰서 슬롯 (300 × 100)</span>
        </div>
        <div class="admob-display-slot">
            <strong style="color:#38bdf8; font-size:14px; font-weight:950;">Google AdMob (300x100 / Large Banner)</strong>
            <span style="color:#facc15; font-size:11.5px; font-weight:800;">선교 사역 및 미디어 영상 방송 공식 후원 슬롯</span>
        </div>
    </footer>

    <div class="yetalk-toast" id="worshipToast"></div>
</div>

<!-- 🌟 [관리실 모달] 설교제목, 성경본문, 설교자, 유튜브링크, 예톡TV송출 (예/아니오) 간소화 -->
<div class="modal-overlay" id="adminModal">
    <div class="modal-card">
        <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1.5px solid #334155; padding-bottom:8px;">
            <strong style="color:#38bdf8; font-size:15.5px;" id="modalWorshipEditTitle">🏛️ 예배 정보 및 영상 관리실</strong>
            <button type="button" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="closeAdminModal()">✕</button>
        </div>

        <!-- 1. 설교 제목 -->
        <div>
            <label style="font-size:12px; color:#facc15; font-weight:850; display:block; margin-bottom:3px;">1. 설교 제목 (필수)</label>
            <input type="text" class="modal-input" id="inpTitle" placeholder="예: 주일 대예배 실황">
        </div>

        <!-- 2. 성경 본문 -->
        <div>
            <label style="font-size:12px; color:#facc15; font-weight:850; display:block; margin-bottom:3px;">2. 성경 본문 (필수)</label>
            <input type="text" class="modal-input" id="inpBible" placeholder="예: 요한복음 3장 16절 ~ 18절">
        </div>

        <!-- 3. 설교자 -->
        <div>
            <label style="font-size:12px; color:#facc15; font-weight:850; display:block; margin-bottom:3px;">3. 설교자 (필수)</label>
            <input type="text" class="modal-input" id="inpPreacher" placeholder="예: 담임목사">
        </div>

        <!-- 4. 유튜브 영상 주소 (터치 시 전체선택 & 📋 붙여넣기 지원) -->
        <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:3px;">
                <label style="font-size:12px; color:#38bdf8; font-weight:850;">유튜브 영상 주소</label>
                <span style="font-size:10.5px; color:#fde047; font-weight:800;">★ 터치 시 전체선택</span>
            </div>
            <div class="yt-url-input-wrap">
                <input type="text" class="modal-input modal-input-yt" id="inpYt"
                       placeholder="https://youtube.com/live/... 또는 youtu.be/..."
                       onfocus="handleYtInputFocus(this)"
                       onclick="handleYtInputFocus(this)">
                <button type="button" class="btn-quick-paste" onclick="quickPasteClipboardToYt()">
                    📋 붙여넣기
                </button>
            </div>
        </div>

        <!-- 5. 예톡TV 송출 (예/아니오 2개만 간단히!) -->
        <div class="admin-tv-toggle-box">
            <span class="admin-tv-title">📺 예톡TV 송출</span>
            <div class="admin-tv-btn-group">
                <button type="button" id="btnModalTvYes" class="btn-tv-opt active" onclick="setModalTvBroadcast(true)">예</button>
                <button type="button" id="btnModalTvNo" class="btn-tv-opt" onclick="setModalTvBroadcast(false)">아니오</button>
            </div>
        </div>

        <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:4px;">
            <button type="button" style="background:#334155; color:white; border:none; padding:9px 16px; border-radius:8px; font-size:13px; cursor:pointer;" onclick="closeAdminModal()">취소</button>
            <button type="button" style="background:linear-gradient(135deg, #0284c7, #2563eb); color:white; border:none; padding:9px 20px; border-radius:8px; font-size:13.5px; font-weight:950; cursor:pointer;" onclick="saveWorshipData()">저장하기</button>
        </div>
    </div>
</div>

<script>
    const SHARED_WORSHIP_KEY = "yetalk_church_worship_v42";
    const WORSHIP_KEYS = ["sunday", "wednesday", "friday", "dawn", "special", "praise"];

    const DEFAULT_DATA = {
        sunday: { tabName: "주일예배", title: "주일 대예배 실황", bible: "요한복음 3장 16절 ~ 18절", preacher: "담임목사", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true },
        wednesday: { tabName: "수요예배", title: "수요 성경강해", bible: "창세기 12장 1절 ~ 4절", preacher: "담임목사", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true },
        friday: { tabName: "금요기도회", title: "금요 성령기도회", bible: "사도행전 1장 8절", preacher: "담임목사", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true },
        dawn: { tabName: "새벽기도회", title: "오늘 새벽기도회", bible: "시편 23편 1절 ~ 6절", preacher: "교구목사", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true },
        special: { tabName: "특별예배", title: "부흥 및 헌신예배", bible: "에베소서 4장 11절 ~ 16절", preacher: "초청강사", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true },
        praise: { tabName: "찬양모음", title: "은혜로운 찬양과 경배", bible: "시편 150편 1절 ~ 6절", preacher: "할렐루야 찬양대", yt: "https://www.youtube.com/watch?v=M7lc1UVf-VE", broadcastToTv: true }
    };

    let activeWorshipIndex = 0;
    let worshipData = {};
    let isScreenLocked = false;
    let modalTvBroadcastChoice = true;
    let isPlayingMode = false;
    let ytPlayerInstance = null;

    // 🌟 화면 확대: 100%, 150%, 200% 순환 기능
    const ZOOM_FACTORS = [1.0, 1.5, 2.0];
    const ZOOM_LABELS = ["🔍 100%", "🔍 150%", "🔍 200%"];
    let currentZoomIndex = 0;

    function goBackToMain() {
        sessionStorage.setItem("church_last_active_card_idx", "1");
        location.href = "churchmain.html";
    }

    // 안드로이드 백키 대응
    window.handleAppBackPress = function() {
        if (isPlayingMode) {
            setPlaybackMode(false);
            return true;
        }
        goBackToMain();
        return true;
    };

    try {
        history.pushState({ page: "churchworship" }, "", location.href);
        window.addEventListener("popstate", function() {
            if (isPlayingMode) {
                setPlaybackMode(false);
            } else {
                goBackToMain();
            }
        });
    } catch(e) {}

    function cycleWorshipZoom(idx = activeWorshipIndex) {
        currentZoomIndex = (currentZoomIndex + 1) % ZOOM_FACTORS.length;
        applyWorshipZoom(idx);
        showToast(`🔍 화면 배율: ${ZOOM_LABELS[currentZoomIndex]}`);
    }

    function applyWorshipZoom(idx = activeWorshipIndex) {
        const factor = ZOOM_FACTORS[currentZoomIndex];
        const box = document.getElementById(`ytBox_${idx}`);
        if (box) {
            box.style.setProperty("--yt-zoom", factor);
        }
        const zoomText = document.getElementById(`zoomText_${idx}`);
        if (zoomText) {
            zoomText.innerText = ZOOM_LABELS[currentZoomIndex];
        }
    }

    function toggleScreenLock(idx = activeWorshipIndex) {
        isScreenLocked = !isScreenLocked;
        const vp = document.getElementById("worshipViewport");
        const guard = document.getElementById("worshipTouchGuard");
        const btn = document.getElementById(`btnLock_${idx}`);
        const icon = document.getElementById(`lockIcon_${idx}`);
        const text = document.getElementById(`lockText_${idx}`);

        if (btn) {
            btn.classList.toggle("locked", isScreenLocked);
            if (icon) icon.innerText = isScreenLocked ? "🔒" : "🔓";
            if (text) text.innerText = isScreenLocked ? "고정ON" : "화면고정";
        }

        if (isScreenLocked) {
            if (vp) vp.classList.add("locked-scroll");
            if (guard) guard.style.display = "block";
            showToast(`🔒 화면 보호 ON: 터치 및 스크롤이 차단되었습니다.`);
        } else {
            if (vp) vp.classList.remove("locked-scroll");
            if (guard) guard.style.display = "none";
            showToast("🔓 화면 고정이 해제되었습니다.");
        }
    }

    function showLockedAlert() {
        showToast("🔒 화면이 고정되어 있습니다. 영상 아래 [고정ON] 버튼을 눌러 해제하세요.");
    }

    /* 🌟 영상 재생 시 풀스크린 / 중지 시 메뉴 복구 */
    function setPlaybackMode(isPlaying) {
        isPlayingMode = isPlaying;
        document.body.classList.toggle("is-playing-mode", isPlaying);
        const exitBtn = document.getElementById("btnExitFullscreen");
        if (exitBtn) {
            exitBtn.style.display = isPlaying ? "inline-flex" : "none";
        }
    }

    // 유튜브 postMessage 감지 (재생 시 풀스크린, 일시정지/종료 시 복구)
    window.addEventListener("message", function(e) {
        if (!e.data) return;
        try {
            let msg = e.data;
            if (typeof msg === "string") {
                try { msg = JSON.parse(msg); } catch(err) {}
            }
            if (msg && msg.event === "onStateChange") {
                if (msg.info === 1) { // PLAYING
                    setPlaybackMode(true);
                } else if (msg.info === 2 || msg.info === 0) { // PAUSED or ENDED
                    setPlaybackMode(false);
                }
            }
        } catch(err) {}
    });

    function extractYoutubeVideoId(url) {
        if (!url) return "M7lc1UVf-VE";
        let str = url.trim();
        if (/^[a-zA-Z0-9_-]{11}$/.test(str)) return str;
        let m = str.match(/live\/([a-zA-Z0-9_-]{11})/i);
        if (m && m[1]) return m[1];
        m = str.match(/shorts\/([a-zA-Z0-9_-]{11})/i);
        if (m && m[1]) return m[1];
        m = str.match(/youtu\.be\/([a-zA-Z0-9_-]{11})/i);
        if (m && m[1]) return m[1];
        m = str.match(/[?&]v=([a-zA-Z0-9_-]{11})/i);
        if (m && m[1]) return m[1];
        m = str.match(/embed\/([a-zA-Z0-9_-]{11})/i);
        if (m && m[1]) return m[1];
        return "M7lc1UVf-VE";
    }

    function getLiveTabKey() {
        const savedType = localStorage.getItem("yetalk_church_live_service_type");
        if (savedType && WORSHIP_KEYS.includes(savedType)) return savedType;
        const now = new Date();
        const day = now.getDay();
        const hour = now.getHours();
        if (day === 0) return "sunday";
        if (day === 3) return "wednesday";
        if (day === 5) return "friday";
        if (hour >= 5 && hour < 7) return "dawn";
        return "sunday";
    }

    function renderWorshipSection(idx = activeWorshipIndex) {
        const vp = document.getElementById("worshipViewport");
        const guard = document.getElementById("worshipTouchGuard");
        vp.innerHTML = "";
        if (guard) vp.appendChild(guard);

        const key = WORSHIP_KEYS[idx];
        const item = worshipData[key] || DEFAULT_DATA[key];
        const ytId = extractYoutubeVideoId(item.yt);
        const liveKey = getLiveTabKey();
        const isLive = (key === liveKey);

        const displayBible = item.bible || (item.meta ? item.meta.split('·')[0].trim() : "요한복음 3장 16절 ~ 18절");
        const displayPreacher = item.preacher || (item.meta ? item.meta.split('·')[1]?.trim() : "담임목사") || "담임목사";

        const sec = document.createElement("section");
        sec.className = "worship-snap-section";
        sec.id = `sec_worship_${idx}`;
        sec.dataset.index = idx;

        sec.innerHTML = `
            <!-- 영상 바로 위 예배종류 표시 -->
            <div class="worship-kind-header-row">
                <div class="worship-kind-badge">
                    <span>✝️</span> <span>${item.tabName} 실황</span>
                </div>
                ${isLive ? '<span class="worship-live-tag">🔴 LIVE</span>' : ''}
            </div>

            <!-- 영상 박스 (100%, 150%, 200% 순환 확대 지원) -->
            <div class="yt-player-box" id="ytBox_${idx}">
                <iframe id="worshipIframe_${idx}"
                    src="https://www.youtube.com/embed/${ytId}?autoplay=0&controls=1&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&iv_load_policy=3&fs=0"
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
                    sandbox="allow-scripts allow-same-origin allow-presentation">
                </iframe>
                <div class="yt-inapp-guard-top" title="예톡 인앱 플레이어"></div>
            </div>

            <!-- 🌟 영상 바로 밑 3대 컨트롤 바: [🔍 100%] [🔒 화면고정] [🏛️ 관리실] -->
            <div class="worship-ctrl-bar-under-video">
                <button type="button" class="btn-worship-ctrl" id="btnZoom_${idx}" onclick="cycleWorshipZoom(${idx})">
                    <span id="zoomText_${idx}">${ZOOM_LABELS[currentZoomIndex]}</span>
                </button>
                <button type="button" class="btn-worship-ctrl ${isScreenLocked ? 'locked' : ''}" id="btnLock_${idx}" onclick="toggleScreenLock(${idx})">
                    <span id="lockIcon_${idx}">${isScreenLocked ? '🔒' : '🔓'}</span>
                    <span id="lockText_${idx}">${isScreenLocked ? '고정ON' : '화면고정'}</span>
                </button>
                <button type="button" class="btn-worship-ctrl" id="btnAdmin_${idx}" onclick="openAdminModal(${idx})">
                    <span>🏛️</span> <span>관리실</span>
                </button>
            </div>

            <!-- 설교 핵심 카드 (단정하고 눈에 편안한 서체 정돈) -->
            <div class="sermon-info-card">
                <h2 class="sermon-title-main" id="worshipTitleText_${idx}">${item.title}</h2>
                <div class="sermon-detail-row">
                    <div class="detail-line">
                        <span class="detail-tag">📖 본 문</span>
                        <span class="detail-val" id="worshipBibleText_${idx}">${displayBible}</span>
                    </div>
                    <div class="detail-line">
                        <span class="detail-tag">✝️ 설교자</span>
                        <span class="detail-val" id="worshipPreacherText_${idx}">${displayPreacher}</span>
                    </div>
                </div>
            </div>

            <!-- 지난 예배 영상 열기/닫기 -->
            <button type="button" class="past-worship-header-btn" onclick="togglePastList(${idx})">
                <div class="past-header-left">
                    <span class="red-triangle">🔻</span>
                    <span>지난 ${item.tabName} 영상보기</span>
                </div>
                <span style="font-size:11.5px; color:#64748b; font-weight:800;" id="pastToggleIndicator_${idx}">열기 ▼</span>
            </button>

            <div class="past-worship-text-list" id="pastWorshipTextList_${idx}">
                <div class="past-text-row" onclick="loadPastVideoToSection(${idx}, 'M7lc1UVf-VE', '1주 전: 하나님의 언약을 굳게 붙들라')">
                    <span class="row-title">1주 전: 하나님의 언약을 굳게 붙들라</span>
                    <span class="row-date">1주 전</span>
                </div>
                <div class="past-text-row" onclick="loadPastVideoToSection(${idx}, 'M7lc1UVf-VE', '2주 전: 광야에서 길을 내시는 주님')">
                    <span class="row-title">2주 전: 광야에서 길을 내시는 주님</span>
                    <span class="row-date">2주 전</span>
                </div>
            </div>
        `;
        vp.appendChild(sec);
        applyWorshipZoom(idx);

        // YouTube IFrame API 연결
        if (window.YT && window.YT.Player) {
            try {
                ytPlayerInstance = new YT.Player(`worshipIframe_${idx}`, {
                    events: {
                        'onStateChange': function(event) {
                            if (event.data === YT.PlayerState.PLAYING) {
                                setPlaybackMode(true);
                            } else if (event.data === YT.PlayerState.PAUSED || event.data === YT.PlayerState.ENDED) {
                                setPlaybackMode(false);
                            }
                        }
                    }
                });
            } catch(e) {}
        }
    }

    function syncTabMenuUI(idx) {
        const liveKey = getLiveTabKey();
        document.querySelectorAll(".w-tab-chip").forEach((chip, i) => {
            const isMatch = (i === idx);
            chip.classList.toggle("active", isMatch);
            const key = WORSHIP_KEYS[i];
            const item = worshipData[key] || DEFAULT_DATA[key];
            const isLive = (key === liveKey);
            chip.innerHTML = `${isLive ? '<span class="live-dot-pulse">●</span> ' : ''}${item.tabName}`;
            if (isMatch) chip.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
        });
    }

    function switchWorshipTab(index) {
        if (index < 0 || index >= WORSHIP_KEYS.length) return;
        activeWorshipIndex = index;
        syncTabMenuUI(index);
        renderWorshipSection(index);
        const vp = document.getElementById("worshipViewport");
        if (vp) vp.scrollTop = 0;
    }

    function togglePastList(idx) {
        const list = document.getElementById(`pastWorshipTextList_${idx}`);
        const indicator = document.getElementById(`pastToggleIndicator_${idx}`);
        if (!list) return;
        const isOpen = list.classList.toggle("open");
        if (indicator) indicator.innerText = isOpen ? "닫기 ▲" : "열기 ▼";
    }

    function loadPastVideoToSection(idx, ytId, title) {
        const iframe = document.getElementById(`worshipIframe_${idx}`);
        const titleEl = document.getElementById(`worshipTitleText_${idx}`);
        if (iframe) iframe.src = `https://www.youtube.com/embed/${ytId}?autoplay=1&controls=1&modestbranding=1&rel=0&playsinline=1&enablejsapi=1&fs=0`;
        if (titleEl) titleEl.innerText = title;
        const list = document.getElementById(`pastWorshipTextList_${idx}`);
        const indicator = document.getElementById(`pastToggleIndicator_${idx}`);
        if (list) list.classList.remove("open");
        if (indicator) indicator.innerText = "열기 ▼";
    }

    function handleYtInputFocus(inputEl) {
        if (!inputEl) return;
        setTimeout(() => {
            inputEl.select();
            if (typeof inputEl.setSelectionRange === "function") {
                inputEl.setSelectionRange(0, inputEl.value.length);
            }
        }, 50);
    }

    async function quickPasteClipboardToYt() {
        const input = document.getElementById("inpYt");
        if (!input) return;
        try {
            if (navigator.clipboard && navigator.clipboard.readText) {
                const clipText = await navigator.clipboard.readText();
                if (clipText && clipText.trim()) {
                    input.value = clipText.trim();
                    showToast("📋 클립보드 주소가 즉시 붙여넣기 되었습니다!");
                    input.focus();
                    handleYtInputFocus(input);
                    return;
                }
            }
        } catch(e) {}
        input.focus();
        handleYtInputFocus(input);
        showToast("주소창이 선택되었습니다. 붙여넣기를 누르세요!");
    }

    function openAdminModal(idx = activeWorshipIndex) {
        activeWorshipIndex = idx;
        const key = WORSHIP_KEYS[activeWorshipIndex];
        const item = worshipData[key] || DEFAULT_DATA[key];
        document.getElementById("modalWorshipEditTitle").innerText = `🏛️ [${item.tabName}] 관리실`;

        document.getElementById("inpTitle").value = item.title || "";
        document.getElementById("inpBible").value = item.bible || (item.meta ? item.meta.split('·')[0].trim() : "");
        document.getElementById("inpPreacher").value = item.preacher || (item.meta ? item.meta.split('·')[1]?.trim() : "") || "담임목사";

        const ytInput = document.getElementById("inpYt");
        ytInput.value = item.yt || "";

        setModalTvBroadcast(item.broadcastToTv !== false);
        document.getElementById("adminModal").classList.add("open");

        setTimeout(() => {
            ytInput.focus();
            handleYtInputFocus(ytInput);
        }, 200);
    }

    function closeAdminModal() {
        document.getElementById("adminModal").classList.remove("open");
    }

    function setModalTvBroadcast(choice) {
        modalTvBroadcastChoice = choice;
        const btnYes = document.getElementById("btnModalTvYes");
        const btnNo = document.getElementById("btnModalTvNo");
        if (choice) {
            btnYes.classList.add("active");
            btnNo.classList.remove("active");
        } else {
            btnNo.classList.add("active");
            btnYes.classList.remove("active");
        }
    }

    function saveWorshipData() {
        const key = WORSHIP_KEYS[activeWorshipIndex];
        if (!worshipData[key]) worshipData[key] = {};

        const title = document.getElementById("inpTitle").value.trim();
        const bible = document.getElementById("inpBible").value.trim();
        const preacher = document.getElementById("inpPreacher").value.trim();
        const yt = document.getElementById("inpYt").value.trim();

        if (!title) { alert("설교 제목을 입력해 주세요."); return; }
        if (!bible) { alert("성경 본문을 입력해 주세요."); return; }
        if (!preacher) { alert("설교자를 입력해 주세요."); return; }

        worshipData[key].title = title;
        worshipData[key].bible = bible;
        worshipData[key].preacher = preacher;
        worshipData[key].yt = yt;
        worshipData[key].broadcastToTv = modalTvBroadcastChoice;

        localStorage.setItem(SHARED_WORSHIP_KEY, JSON.stringify(worshipData));

        if (modalTvBroadcastChoice) {
            localStorage.setItem("yetalk_church_live_broadcast", "true");
            localStorage.setItem("yetalk_church_live_video_url", yt);
            localStorage.setItem("yetalk_church_live_video_title", title);
            localStorage.setItem("yetalk_church_live_service_type", key);
            localStorage.setItem("yetalk_church_live_worship_name", worshipData[key].tabName || title);
            pushToYetalkTvMainFeed(worshipData[key]);
            showToast("🏛️ 관리실 저장 완료! 본교회 모든 성도 예톡TV 1번 영상으로 자동 상영됩니다.");
        } else {
            localStorage.setItem("yetalk_church_live_broadcast", "false");
            removeYetalkTvMainFeed(worshipData[key]);
            showToast("🏛️ 관리실: 예배 정보가 저장되었습니다.");
        }

        renderWorshipSection(activeWorshipIndex);
        closeAdminModal();
    }

    function pushToYetalkTvMainFeed(item) {
        let feeds = [];
        try {
            feeds = JSON.parse(localStorage.getItem("yetalkSavedCustomFeeds") || "[]");
        } catch(e) {}

        const vid = extractYoutubeVideoId(item.yt);
        const churchStoreName = localStorage.getItem("yetalkChurchName") || localStorage.getItem("yetalkUserStoreName") || "예톡행복한교회";
        const userRegion = localStorage.getItem("yetalkUserRegion") || "전국";

        feeds = feeds.filter(f => f.videoId !== vid && f.id !== 'church_live_top_feed');
        const newFeed = {
            id: 'church_live_top_feed',
            videoId: vid,
            bizName: churchStoreName,
            targetUrl: "churchworship.html",
            views: 3840,
            likes: 420,
            format: '16:9',
            region: userRegion,
            badge: "🔴 실시간 LIVE"
        };
        feeds.unshift(newFeed);
        localStorage.setItem("yetalkSavedCustomFeeds", JSON.stringify(feeds));
    }

    function removeYetalkTvMainFeed(item) {
        let feeds = [];
        try {
            feeds = JSON.parse(localStorage.getItem("yetalkSavedCustomFeeds") || "[]");
        } catch(e) {}
        const vid = extractYoutubeVideoId(item.yt);
        feeds = feeds.filter(f => f.videoId !== vid && f.id !== 'church_live_top_feed');
        localStorage.setItem("yetalkSavedCustomFeeds", JSON.stringify(feeds));
    }

    function showToast(msg) {
        const t = document.getElementById("worshipToast");
        if (!t) return;
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    function parseInitialTab() {
        const params = new URLSearchParams(window.location.search);
        const tab = params.get("tab");
        if (tab) {
            const idx = WORSHIP_KEYS.indexOf(tab.toLowerCase());
            if (idx >= 0) return idx;
            const num = parseInt(tab, 10);
            if (!isNaN(num) && num >= 0 && num < WORSHIP_KEYS.length) return num;
        }
        return 0; // Default 주일예배
    }

    function initPage() {
        const saved = localStorage.getItem(SHARED_WORSHIP_KEY);
        if (saved) {
            try {
                worshipData = JSON.parse(saved);
                WORSHIP_KEYS.forEach(k => {
                    if (!worshipData[k]) worshipData[k] = DEFAULT_DATA[k];
                    if (worshipData[k].broadcastToTv === undefined) {
                        worshipData[k].broadcastToTv = true;
                    }
                });
            } catch(e) { worshipData = DEFAULT_DATA; }
        } else {
            worshipData = DEFAULT_DATA;
            localStorage.setItem(SHARED_WORSHIP_KEY, JSON.stringify(worshipData));
        }

        activeWorshipIndex = parseInitialTab();
        syncTabMenuUI(activeWorshipIndex);
        renderWorshipSection(activeWorshipIndex);
    }

    document.addEventListener("DOMContentLoaded", () => {
        const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
        document.body.setAttribute('data-theme', savedTheme);
        initPage();
    });
</script>
</body>
</html>
