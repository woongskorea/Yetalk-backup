<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>구원의 복음 - 예톡행복한교회</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="church_theme.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background: #f8fafc; font-family: "Pretendard", -apple-system, sans-serif;
            color: #0f172a; display: flex; justify-content: center; min-height: 100vh;
        }
        .gospel-shell {
            width: 100%; max-width: 480px; min-height: 100vh; background: #ffffff;
            display: flex; flex-direction: column; position: relative; border-left: 1px solid #e2e8f0; border-right: 1px solid #e2e8f0;
            padding-bottom: 40px;
        }

        /* 1. 상단 헤더 (살짝 내려서 상태표시줄과 겹치지 않게 여백 확보) */
        .gospel-header {
            height: auto;
            min-height: 60px;
            background: #ffffff;
            border-bottom: 1.5px solid #e2e8f0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: calc(env(safe-area-inset-top, 0px) + 16px) 16px 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-title-box { font-size: 16.5px; font-weight: 950; color: #0f172a; display: flex; align-items: center; gap: 4px; }
        .btn-go-home {
            background: #0284c7; color: #ffffff; border: 1px solid #0284c7;
            padding: 5px 12px; border-radius: 14px; font-size: 11.5px; font-weight: 900; cursor: pointer;
        }

        /* 🌟 [1] 구원의 복음 말씀 한 줄 고정 바 */
        .salvation-verse-bar {
            background: #eff6ff; border-bottom: 1.5px solid #bae6fd;
            padding: 10px 14px; display: flex; align-items: center; gap: 8px; flex-shrink: 0;
        }
        .salvation-tag {
            background: #0284c7; color: #ffffff; font-size: 11px; font-weight: 950;
            padding: 3px 8px; border-radius: 6px; flex-shrink: 0;
        }
        .salvation-text {
            font-family: 'Nanum Myeongjo', serif; font-size: 12.5px; font-weight: 700; color: #1e3a8a;
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; letter-spacing: -0.3px;
        }

        /* 🌟 [2] 두 개의 가로 탭 (초대글 / 초대그림) */
        .gospel-tabs-bar {
            height: 46px; background: #f8fafc; border-bottom: 1px solid #e2e8f0;
            display: flex; padding: 0 14px; gap: 8px; align-items: center; flex-shrink: 0;
        }
        .tab-btn {
            flex: 1; height: 34px; background: #ffffff; border: 1.5px solid #cbd5e1; color: #475569;
            border-radius: 8px; font-size: 13.5px; font-weight: 900; cursor: pointer; transition: all 0.2s;
        }
        .tab-btn.active {
            background: #0284c7; color: #ffffff; border-color: #0284c7;
            box-shadow: 0 2px 8px rgba(2,132,199,0.3);
        }

        .main-scroll-body {
            flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px;
        }

        /* 🌟 [3] 초대글 전체 펼침 카드 (요약 없이 통째로 보임) */
        .gospel-full-card {
            background: #ffffff; border: 1.5px solid #e2e8f0; border-radius: 14px;
            padding: 16px; display: flex; flex-direction: column; gap: 10px;
            box-shadow: 0 3px 12px rgba(0,0,0,0.05);
        }
        .card-top-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
        .card-title { font-size: 16.5px; font-weight: 950; color: #0f172a; line-height: 1.4; }
        .card-meta { font-size: 11.5px; color: #64748b; font-weight: 700; }

        .card-action-btns { display: flex; gap: 5px; flex-shrink: 0; }
        .btn-mini-act {
            background: #f1f5f9; border: 1px solid #cbd5e1; color: #475569;
            padding: 4px 8px; border-radius: 5px; font-size: 11px; font-weight: 800; cursor: pointer;
        }
        .btn-mini-act.del { color: #ef4444; border-color: #fca5a5; }

        .card-img-wrap {
            width: 100%; border-radius: 8px; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc;
        }
        .card-img-full { width: 100%; height: auto; max-height: 480px; object-fit: contain; display: block; }

        /* 글 전체가 보이는 본문 텍스트 */
        .card-content-full {
            font-size: 14px; line-height: 1.68; color: #334155; white-space: pre-line; word-break: break-all;
        }

        /* ➕ 밑으로 추가하기 버튼 (관리자/부관리자) */
        .btn-add-gospel-item {
            width: 100%; height: 44px; background: #f0f9ff; border: 1.5px dashed #0284c7;
            border-radius: 12px; color: #0284c7; font-size: 13.5px; font-weight: 950;
            display: flex; align-items: center; justify-content: center; gap: 6px; cursor: pointer;
        }
        .btn-add-gospel-item:active { background: #e0f2fe; }

        /* 하단 애드몹 배너 */
        .gospel-admob-banner {
            width: 100%; height: 95px; background: #f8fafc; border-radius: 12px;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            text-align: center; border: 1.5px dashed #cbd5e1; color: #334155; margin-top: 6px; flex-shrink: 0;
        }

        /* 작성/수정 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: #ffffff;
            z-index: 500; flex-direction: column; max-width: 480px; margin: 0 auto; height: 100dvh;
        }
        .modal-overlay.open { display: flex; }
        .modal-header {
            background: #ffffff; border-bottom: 1.5px solid #e2e8f0;
            display: flex; align-items: center; justify-content: space-between;
            padding: max(env(safe-area-inset-top, 0px) + 16px, 28px) 16px 12px 16px;
            flex-shrink: 0;
        }
        .modal-body {
            flex: 1; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;
        }
        .input-label { font-size: 11.5px; font-weight: 900; color: #0284c7; }
        .modal-input {
            width: 100%; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 8px;
            padding: 9px 10px; color: #0f172a; font-size: 14px; font-weight: 600; outline: none;
        }
        .modal-textarea {
            width: 100%; background: #f8fafc; border: 1.5px solid #cbd5e1; border-radius: 8px;
            padding: 10px; color: #0f172a; font-size: 14px; line-height: 1.6; outline: none; min-height: 220px; resize: none; font-family: inherit;
        }
    </style>
</head>
<body>

<div class="gospel-shell">
    <!-- 1. 헤더 -->
    <header class="gospel-header">
        <div class="header-title-box" onclick="location.href='churchmain.html'" style="cursor:pointer;">
            ✝ <span>구원의 복음과 초청</span>
        </div>
        <button type="button" class="btn-go-home" onclick="location.href='churchmain.html'">교회홈</button>
    </header>

    <!-- 🌟 [1] 구원의 복음 말씀 한 줄 고정 바 -->
    <section class="salvation-verse-bar" title="클릭 시 전체 말씀 보기" onclick="alert(this.querySelector('.salvation-text').innerText)">
        <span class="salvation-tag">구원의 복음</span>
        <div class="salvation-text">
            “하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라 (요 3:16)”
        </div>
    </section>

    <!-- 🌟 [2] 두 개의 가로 탭 (초대글 / 초대그림) -->
    <nav class="gospel-tabs-bar">
        <button type="button" class="tab-btn active" id="tab_text" onclick="switchGospelTab('text')">✉️ 초대글</button>
        <button type="button" class="tab-btn" id="tab_image" onclick="switchGospelTab('image')">🖼️ 초대그림</button>
    </nav>

    <main class="main-scroll-body">
        <!-- 🌟 [3] 전체가 다 펼쳐져 보이는 글/그림 목록 영역 -->
        <div id="gospelItemsContainer" style="display:flex; flex-direction:column; gap:12px;"></div>

        <!-- ➕ 밑으로 추가하기 버튼 (관리자/부관리자 추가 권한) -->
        <button type="button" class="btn-add-gospel-item" onclick="openAddGospelModal()">
            <span>➕</span> <span id="btnAddText">새 초대글 추가하기</span>
        </button>

        <!-- 하단 애드몹 배너 (320x100) -->
        <section class="gospel-admob-banner">
            <span style="font-size:11px; font-weight:900; color:#38bdf8;">Google AdMob (320x100)</span>
            <span style="font-size:12.5px; font-weight:950; color:#facc15; margin-top:2px;">복음 전파 및 영혼 구원 사역 공식 스폰서 슬롯</span>
        </section>
    </main>
</div>

<!-- 4. 등록 및 수정 모달 -->
<div class="modal-overlay" id="gospelEditModal">
    <header class="modal-header">
        <button type="button" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="closeModal('gospelEditModal')">✕</button>
        <strong style="color:white; font-size:15px;" id="modalTitle">복음 컨텐츠 작성</strong>
        <button type="button" style="background:#0284c7; color:white; border:none; padding:5px 12px; border-radius:12px; font-weight:900; font-size:12px; cursor:pointer;" onclick="saveGospelItem()">저장</button>
    </header>

    <div class="modal-body">
        <div>
            <label class="input-label">제목</label>
            <input type="text" class="modal-input" id="inpTitle" placeholder="초대글 또는 그림 제목">
        </div>

        <div>
            <label class="input-label">작성자 / 안내 부서</label>
            <input type="text" class="modal-input" id="inpAuthor" value="전도위원회 / 담임목사">
        </div>

        <div id="formContentArea">
            <label class="input-label">초대 말씀 및 본문 (전체 펼쳐짐)</label>
            <textarea class="modal-textarea" id="inpContent" placeholder="영혼을 향한 따뜻한 초청과 구원의 기쁨을 적어주세요."></textarea>
        </div>

        <div>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:4px;">
                <label class="input-label">그림/사진 첨부 (초대그림은 필수)</label>
                <button type="button" style="background:#0284c7; color:white; border:none; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:900; cursor:pointer;" onclick="document.getElementById('fileImgInput').click()">📷 사진 선택</button>
            </div>
            <input type="file" id="fileImgInput" style="display:none;" accept="image/*" onchange="handleGospelImage(this)">

            <div id="imgPreviewWrap" style="display:none; position:relative; width:100%; border:1px solid #1e293b; border-radius:8px; overflow:hidden; margin-top:4px;">
                <img id="imgPreview" style="width:100%; max-height:240px; object-fit:contain; display:block;">
                <button type="button" style="position:absolute; top:6px; right:6px; background:rgba(0,0,0,0.7); color:white; border:none; border-radius:50%; width:24px; height:24px; font-size:12px; cursor:pointer;" onclick="removeGospelImage()">✕</button>
            </div>
        </div>
    </div>
</div>

<script>
    const GOSPEL_STORAGE_KEY = "yetalk_church_gospel_records_v1";

    let currentTab = "text"; // 'text' or 'image'
    let gospelList = [];
    let editingItemId = null;
    let uploadedImgData = null;

    const DEFAULT_GOSPEL_DATA = [
        {
            id: 1,
            type: "text",
            title: "당신을 향한 하나님의 놀라운 사랑과 초청",
            author: "담임목사 / 전도위원회",
            date: "오늘",
            content: "삶의 무게와 지친 일상 속에서 참된 평안과 쉼을 찾고 계십니까?\n\n수고하고 무거운 짐 진 자들아 다 내게로 오라 내가 너희를 쉬게 하리라 (마 11:28)\n\n하나님은 당신을 결코 혼자 두지 않으십니다. 주님의 품 안에서 영원한 생명과 참된 기쁨을 함께 누리시기를 두 손 모아 간절히 축복하며 초청합니다.",
            img: null
        },
        {
            id: 2,
            type: "image",
            title: "2026 새생명 행복 축제 - 영혼 구원 초청장",
            author: "기획홍보팀",
            date: "어제",
            content: "가장 귀한 당신을 주님의 이름으로 초대합니다. 함께 오셔서 축복의 잔치를 누려보세요.",
            img: "https://images.unsplash.com/photo-1511632765486-a01980e01a18?auto=format&fit=crop&w=1200&q=85"
        }
    ];

    function initGospelPage() {
        const savedTheme = localStorage.getItem('yetalk_active_theme') || 'white';
        document.body.setAttribute('data-theme', savedTheme);

        const saved = localStorage.getItem(GOSPEL_STORAGE_KEY);
        if (saved) {
            try { gospelList = JSON.parse(saved); } catch(e) { gospelList = DEFAULT_GOSPEL_DATA; }
        } else {
            gospelList = DEFAULT_GOSPEL_DATA;
            localStorage.setItem(GOSPEL_STORAGE_KEY, JSON.stringify(gospelList));
        }
        switchGospelTab("text");
    }

    /* 탭 전환 (초대글 / 초대그림) */
    function switchGospelTab(tab) {
        currentTab = tab;
        document.getElementById("tab_text").classList.toggle("active", tab === "text");
        document.getElementById("tab_image").classList.toggle("active", tab === "image");
        document.getElementById("btnAddText").innerText = (tab === "text") ? "새 초대글 추가하기" : "새 초대그림 추가하기";
        renderGospelItems();
    }

    /* 🌟 글 전체가 시원하게 다 펼쳐져 보이는 렌더링 */
    function renderGospelItems() {
        const container = document.getElementById("gospelItemsContainer");
        container.innerHTML = "";

        const filtered = gospelList.filter(item => item.type === currentTab);

        if (filtered.length === 0) {
            container.innerHTML = `<div style="text-align:center; padding:40px 0; color:#64748b; font-size:13px;">등록된 ${currentTab === 'text' ? '초대글이' : '초대그림이'} 없습니다.<br>하단의 [+] 버튼을 눌러 추가해보세요.</div>`;
            return;
        }

        filtered.forEach(item => {
            const card = document.createElement("div");
            card.className = "gospel-full-card";

            const imgHtml = item.img ? `
                <div class="card-img-wrap">
                    <img src="${item.img}" class="card-img-full" alt="초대 이미지">
                </div>
            ` : "";

            const contentHtml = item.content ? `
                <div class="card-content-full">${item.content}</div>
            ` : "";

            card.innerHTML = `
                <div class="card-top-row">
                    <div style="flex:1;">
                        <h2 class="card-title">${item.title}</h2>
                        <div class="card-meta">${item.author} · ${item.date}</div>
                    </div>
                    <div class="card-action-btns">
                        <button type="button" class="btn-mini-act" onclick="openEditGospelModal(${item.id})">수정</button>
                        <button type="button" class="btn-mini-act del" onclick="deleteGospelItem(${item.id})">삭제</button>
                    </div>
                </div>
                ${imgHtml}
                ${contentHtml}
            `;
            container.appendChild(card);
        });
    }

    function openAddGospelModal() {
        editingItemId = null;
        uploadedImgData = null;
        document.getElementById("modalTitle").innerText = (currentTab === "text") ? "새 초대글 작성" : "새 초대그림 등록";
        document.getElementById("inpTitle").value = "";
        document.getElementById("inpAuthor").value = "전도위원회 / 담임목사";
        document.getElementById("inpContent").value = "";
        removeGospelImage();
        openModal("gospelEditModal");
    }

    function openEditGospelModal(id) {
        editingItemId = id;
        const item = gospelList.find(x => x.id === id);
        if (!item) return;

        document.getElementById("modalTitle").innerText = "컨텐츠 수정";
        document.getElementById("inpTitle").value = item.title;
        document.getElementById("inpAuthor").value = item.author;
        document.getElementById("inpContent").value = item.content || "";

        if (item.img) {
            uploadedImgData = item.img;
            document.getElementById("imgPreview").src = item.img;
            document.getElementById("imgPreviewWrap").style.display = "block";
        } else {
            removeGospelImage();
        }

        openModal("gospelEditModal");
    }

    function handleGospelImage(input) {
        const file = input.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                const MAX_WIDTH = 960;
                let w = img.width, h = img.height;
                if (w > MAX_WIDTH) { h = Math.round((h * MAX_WIDTH) / w); w = MAX_WIDTH; }
                canvas.width = w; canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);

                uploadedImgData = canvas.toDataURL("image/jpeg", 0.85);
                document.getElementById("imgPreview").src = uploadedImgData;
                document.getElementById("imgPreviewWrap").style.display = "block";
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function removeGospelImage() {
        uploadedImgData = null;
        document.getElementById("imgPreviewWrap").style.display = "none";
        document.getElementById("fileImgInput").value = "";
    }

    function saveGospelItem() {
        const title = document.getElementById("inpTitle").value.trim();
        const author = document.getElementById("inpAuthor").value.trim();
        const content = document.getElementById("inpContent").value.trim();

        if (!title) { alert("제목을 입력해주세요."); return; }
        if (currentTab === "image" && !uploadedImgData) {
            alert("초대그림 탭에서는 그림/사진을 반드시 첨부해야 합니다.");
            return;
        }

        if (editingItemId) {
            const target = gospelList.find(x => x.id === editingItemId);
            if (target) {
                target.title = title;
                target.author = author;
                target.content = content;
                target.img = uploadedImgData;
            }
        } else {
            const newItem = {
                id: Date.now(),
                type: currentTab,
                title: title,
                author: author,
                date: "방금",
                content: content,
                img: uploadedImgData
            };
            gospelList.unshift(newItem);
        }

        localStorage.setItem(GOSPEL_STORAGE_KEY, JSON.stringify(gospelList));
        renderGospelItems();
        closeModal("gospelEditModal");
        alert("🎉 구원의 복음 컨텐츠가 성공적으로 저장되었습니다!");
    }

    function deleteGospelItem(id) {
        if (!confirm("이 초청 컨텐츠를 삭제하시겠습니까?")) return;
        gospelList = gospelList.filter(x => x.id !== id);
        localStorage.setItem(GOSPEL_STORAGE_KEY, JSON.stringify(gospelList));
        renderGospelItems();
    }

    function openModal(id) { document.getElementById(id).classList.add("open"); }
    function closeModal(id) { document.getElementById(id).classList.remove("open"); }

    document.addEventListener("DOMContentLoaded", initGospelPage);
</script>
<script src="church_bottom_bar.js"></script>
</body>
</html>
