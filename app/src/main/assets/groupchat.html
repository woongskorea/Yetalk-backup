<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>예톡</title>

    <style>

        *{

        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Pretendard,sans-serif;

        }

        body{

        background:#edf3fb;

        }

        .header{

        height:56px;
        background:white;
        display:flex;
        align-items:center;
        justify-content:space-between;
        padding:0 14px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);

        }

        .back{
    font-size:34px;
    font-weight:900;
    cursor:pointer;
    padding:4px 10px;
}

        .titleBox{

        flex:1;
        margin-left:12px;

        }

        .roomTitle{

        font-size:18px;
        font-weight:900;

        }

        .roomInfo{

        font-size:12px;
        color:#666;

        }

        .right{
    display:flex;
    gap:16px;
    font-size:26px;
    font-weight:900;
}

        .topTab{

        height:44px;
        background:white;
        display:flex;
        align-items:center;
        justify-content:space-around;
        border-bottom:1px solid #e7e7e7;

        }

        .tab{

        font-size:14px;
        font-weight:900;
        color:#666;
        padding:10px 0;

        }

        .tabOn{

        color:#1d57d8;
        border-bottom:3px solid #1d57d8;

        }

        .noticeBar{

        background:#fff8dc;
        padding:8px 12px;
        font-size:13px;
        font-weight:700;
        color:#a25b00;
        display:flex;
        align-items:center;

        }

        .noticeBar span{

        margin-left:6px;

        }

        .chatArea{

        padding:10px;
        padding-bottom:140px;

        }

        .card{

        background:white;
        border-radius:14px;
        padding:12px;
        margin-bottom:10px;
        box-shadow:0 2px 6px rgba(0,0,0,.08);

        }

        .writer{

        display:flex;
        align-items:center;
        margin-bottom:6px;

        }

        .profile{

        width:42px;
        height:42px;
        border-radius:50%;
        background:#dbe9ff;
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:22px;

        }

        .writerInfo{

        margin-left:10px;

        }

        .name{

        font-size:15px;
        font-weight:900;

        }

        .time{

        font-size:11px;
        color:#888;

        }

        .subject{

        margin-top:8px;
        font-size:16px;
        font-weight:900;

        }

        .content{

        margin-top:5px;
        font-size:14px;
        line-height:1.6;

        }
        .cardAction{

margin-top:12px;
display:flex;
align-items:center;
gap:16px;
font-size:13px;
font-weight:700;
color:#666;

}

.cardAction div{

cursor:pointer;

}

.youtubeCard{

margin-top:10px;
background:#f7f7f7;
border-radius:12px;
padding:10px;
display:flex;
align-items:center;
gap:10px;

}

.thumb{

width:90px;
height:55px;
background:#ddd;
border-radius:8px;

}

.youtubeInfo{

flex:1;

}

.youtubeTitle{

font-size:14px;
font-weight:900;

}

.youtubeChannel{

font-size:12px;
color:#666;
margin-top:4px;

}

.commentBox{

margin-top:12px;
padding-top:10px;
border-top:1px solid #eee;

}

.comment{

margin-top:8px;
font-size:13px;
line-height:1.5;

}

.commentName{

font-weight:900;

}

.commentInput{

margin-top:12px;
display:flex;
gap:8px;

}

.commentInput input{

flex:1;
height:36px;
border:none;
background:#edf3fb;
border-radius:18px;
padding:0 12px;
outline:none;

}

.commentInput button{

width:60px;
border:none;
border-radius:18px;
background:#1d57d8;
color:white;
font-weight:900;

}

    </style>

</head>

<body>

<div class="card">

    <div class="writer">

        <div class="profile">

            😊

        </div>

        <div class="writerInfo">

            <div class="name">

                김철수

            </div>

            <div class="time">

                5분 전

            </div>

        </div>

    </div>

    <div class="subject">

        오늘 QT가 너무 은혜였습니다.

    </div>

    <div class="content">

        오늘 말씀을 묵상하면서 큰 위로를 받았습니다.<br>

        이번 한 주도 함께 기도하며 승리합시다.

    </div>

    <div class="youtubeCard">

        <div class="thumb">

            ▶

        </div>

        <div class="youtubeInfo">

            <div class="youtubeTitle">

                주님은 나의 목자

            </div>

            <div class="youtubeChannel">

                예톡채널

            </div>

        </div>

    </div>

    <div class="cardAction">

        <div>❤️ 12</div>

        <div>👍 8</div>

        <div>🙏 21</div>

        <div>💬 6</div>

        <div>📋 복사</div>

        <div>📤 공유</div>

    </div>

    <div class="commentBox">

        <div class="comment">

<span class="commentName">

😊 박집사

</span>

            아멘입니다.

        </div>

        <div class="comment">

<span class="commentName">

😊 이영희

</span>

            감사합니다.

        </div>

        <div class="commentInput">

            <input
                    placeholder="댓글쓰기">

            <button>

                등록

            </button>

        </div>

    </div>

</div>
<div class="bottomBar">

    <div class="emojiScroll">

        <div class="emojiBtn">🙏 기도하겠습니다</div>

        <div class="emojiBtn">🙏 기도 부탁드릴게요</div>

        <div class="emojiBtn">🙌 할렐루야</div>

        <div class="emojiBtn">❤️ 사랑합니다</div>

        <div class="emojiBtn">😊 반갑습니다</div>

        <div class="emojiBtn">👍 아멘</div>

        <div class="emojiBtn">🌸 감사합니다</div>

        <div class="emojiBtn">🎉 축복합니다</div>

        <div class="emojiBtn">📖 말씀 감사합니다</div>

    </div>

    <div class="inputBar">

        <button class="plusBtn">

            ＋

        </button>

        <input
                class="chatInput"
                placeholder="메시지를 입력하세요">

        <button class="sendBtn">

            전송

        </button>

    </div>

</div>

<style>

    .bottomBar{

    position:fixed;
    left:0;
    right:0;
    bottom:0;
    background:white;
    padding:8px;
    box-shadow:0 -2px 8px rgba(0,0,0,.08);

    }

    .emojiScroll{

    display:flex;
    overflow-x:auto;
    gap:8px;
    padding-bottom:8px;

    }

    .emojiBtn{

    white-space:nowrap;
    padding:7px 12px;
    background:#edf3fb;
    border-radius:18px;
    font-size:13px;
    font-weight:700;
    cursor:pointer;

    }

    .inputBar{

    display:flex;
    gap:8px;

    }

    .plusBtn{
    width:48px;
    height:48px;
    border-radius:50%;
    font-size:32px;
    font-weight:900;
}

    .chatInput{

    flex:1;
    height:42px;
    border:none;
    border-radius:22px;
    padding:0 14px;
    background:#edf3fb;
    outline:none;
    font-size:15px;

    }

    .sendBtn{

    width:70px;
    border:none;
    border-radius:22px;
    background:#1d57d8;
    color:white;
    font-weight:900;

    }

</style>

<script>

    // 게시글 길게 누르면 메뉴

    document.querySelectorAll(".card").forEach(card=>{

    card.addEventListener("contextmenu",function(e){

    e.preventDefault();

    alert(
    "💬 댓글\n\n📋 복사\n\n📤 공유\n\n▶ 유튜브 링크\n\n✏ 수정(작성자)\n\n🗑 삭제(작성자)"
    );

    });

    });

</script>

</body>

</html>
