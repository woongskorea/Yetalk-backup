<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>중보기도</title>

    <link rel="stylesheet"
          href="common.css">

</head>

<body>

<div class="container">

    <!--=========================
    HEADER
    ==========================-->

    <header class="header">

        <div class="topMenu">

            <div
                    class="menuOff"
                    onclick="location.href='../index.html'">

                홈

            </div>

            <div
                    class="menuOff"
                    onclick="location.href='myprayer.html'">

                내기도

            </div>

            <div
                    class="menuOn">

                중보기도

            </div>

            <div
                    class="menuOff"
                    onclick="location.href='mynote.html'">

                내노트

            </div>

        </div>

        <div class="topRight">

<span id="todayDate">

7월 8일

</span>

        </div>

    </header>

    <!--=========================
    YOUTUBE
    ==========================-->

    <div class="youtube">

        <iframe

                id="youtubePlayer"

                width="100%"

                height="100%"

                src=""

                title="Prayer"

                frameborder="0"

                allowfullscreen>

        </iframe>

    </div>

    <!--=========================
    기도음악
    ==========================-->

    <div class="musicRow">

        <div
                class="musicBtn"
                onclick="changeMusic('calm')">

            잔잔

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('fast')">

            빠름

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('blood')">

            보혈

        </div>

        <div
                class="musicBtn"
                onclick="changeMusic('tongue')">

            방언

        </div>

    </div>

    <!--=========================
    기도시간
    ==========================-->

    <div class="timeRow">

        <div
                class="timeBtn startBtn"
                onclick="startPrayer()">

            ▶ 시작

        </div>

        <div
                id="todayTime"
                style="
font-size:18px;
font-weight:800;
color:#14863d;">

            오늘 0분

        </div>

        <div
                class="timeBtn endBtn"
                onclick="stopPrayer()">

            ■ 종료

        </div>

    </div>

    <!--=========================
    관리자 한줄
    ==========================-->

    <div class="card mb20">

        <div
                style="
padding:16px;
font-size:17px;
font-weight:700;
line-height:1.8;">

<span
        style="color:#d60000;">

●

</span>

            <span id="masterMessage">

믿음대로 될지어다.

</span>

        </div>

    </div>
    <!--=========================
   중보기도
   ==========================-->

    <div class="section">

        <div class="sectionTitle">

            중보기도

        </div>

        <div id="intercessionList">

            <!-- JS에서 자동 생성 -->

        </div>

    </div>

    <!--=========================
    삭제
    ==========================-->

    <div class="section">

        <button
                class="saveBtn"
                style="background:#777;"
                onclick="deleteSelectedIntercession()">

            삭제

        </button>

    </div>
    <!--=========================
    SCRIPT
    ==========================-->

    <script src="intercession.js"></script>

    <script>

        /*==========================
        기도음악
        ==========================*/

        const musicLinks={

        calm:"",
        fast:"",
        blood:"",
        tongue:""

        };

        function changeMusic(type){

            if(musicLinks[type]){

                document.getElementById(

                "youtubePlayer"

                ).src=musicLinks[type];

            }

        }

        /*==========================
        관리자 한줄
        ==========================*/

        const msg=

        localStorage.getItem(

        "masterMessage"

        );

        if(msg){

        document.getElementById(

        "masterMessage"

        ).innerText=msg;

        }

        /*==========================
        오늘 날짜
        ==========================*/

        const today=new Date();

        document.getElementById(

        "todayDate"

        ).innerText=

        (today.getMonth()+1)

        +"월 "

        +today.getDate()

        +"일";

    </script>

</div>

</body>

</html>
