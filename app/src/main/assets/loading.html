<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        html,body{
            margin:0;
            width:100%;
            height:100%;
            overflow:hidden;
            background:#000;
        }

        #screen{
            position:fixed;
            inset:0;
            background:center center;
            background-size:cover;
            background-repeat:no-repeat;
            transition:opacity .4s;
            opacity:1;
        }
    </style>
</head>

<body>

<div id="screen"></div>

<script>

    const screen=document.getElementById("screen");

    // 첫 화면
   screen.style.backgroundImage="url('images/logo/yetalkfamily.jpg')";

    // 0.8초 후 메인 로고
    setTimeout(()=>{

        screen.style.opacity=0;

        setTimeout(()=>{

            screen.style.background="#ffffff";
            screen.style.backgroundImage="url('images/logo/yetalkmain.png')";
            screen.style.backgroundSize="contain";
            screen.style.opacity=1;

        },350);

    },800);


    // 1.7초 후 인덱스로
    setTimeout(()=>{

        location.href="index.html";

    },1700);

</script>

</body>
</html>
