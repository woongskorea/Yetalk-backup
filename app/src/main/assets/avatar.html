<!DOCTYPE html>
<html lang="ko">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>캐릭터 선택</title>

    <style>

        *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Pretendard,sans-serif;
        }

        body{

        background:#eef3fb;

        }

        .header{

        height:58px;
        background:white;
        display:flex;
        align-items:center;
        padding:0 12px;
        box-shadow:0 2px 8px rgba(0,0,0,.08);

        }

        .back{

        font-size:34px;
        font-weight:900;
        cursor:pointer;

        }

        .title{

        flex:1;
        text-align:center;
        font-size:20px;
        font-weight:900;
        color:#1d57d8;

        }

        .blank{

        width:34px;

        }

        .preview{

        margin:18px auto;
        width:180px;
        height:180px;
        background:white;
        border-radius:24px;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 3px 10px rgba(0,0,0,.08);

        }

        .preview img{

        width:150px;
        height:150px;
        object-fit:contain;

        }

        .text{

        text-align:center;
        font-size:18px;
        font-weight:900;
        margin-top:10px;

        }

        .sub{

        text-align:center;
        font-size:13px;
        color:#666;
        margin-top:5px;

        }

        .list{

        display:grid;
        grid-template-columns:repeat(4,1fr);
        gap:12px;
        padding:18px;

        }

        .item{

        background:white;
        border-radius:16px;
        padding:8px;
        display:flex;
        align-items:center;
        justify-content:center;
        box-shadow:0 2px 6px rgba(0,0,0,.08);
        cursor:pointer;

        }

        .item img{

        width:64px;
        height:64px;
        object-fit:contain;

        }

        .item.on{

        border:3px solid #1d57d8;

        }
