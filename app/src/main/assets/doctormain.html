<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>아름다운의원</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&family=Pretendard:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #0284c7;
            --accent-cyan: #38bdf8;
            --header-h: 52px;
            --menu-h: 44px;
            --view-h: calc(100dvh - 96px);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        html, body {
            width: 100%; height: 100%; background: #000000;
            font-family: "Pretendard", -apple-system, sans-serif; color: #ffffff;
            overflow: hidden;
        }

        .doctor-shell {
            width: 100%; max-width: 480px; height: 100dvh; margin: 0 auto;
            display: flex; flex-direction: column; position: relative; background: #090d16;
        }

        /* 1층 헤더 */
        .doctor-fixed-header {
            height: var(--header-h); background: #0f172a; border-bottom: 1.5px solid #1e293b;
            display: flex; justify-content: space-between; align-items: center; padding: 0 14px;
            flex-shrink: 0; z-index: 9999;
        }
        .header-left-box { display: flex; align-items: center; gap: 8px; }

        /* 🌟 [개선 1] 영상 보던 자리로 즉시 복귀하는 뒤로가기 버튼 */
        .btn-header-back {
            background: none; border: none; font-size: 20px; font-weight: 900;
            color: #38bdf8; cursor: pointer; padding: 2px 4px; line-height: 1;
            display: flex; align-items: center; justify-content: center;
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.6);
        }

        .doctor-header-title { font-size: 16.5px; font-weight: 950; color: #ffffff; letter-spacing: -0.3px; }

        .header-right-box { display: flex; align-items: center; gap: 6px; }

        /* 🌟 [개선 2] 의원 전용 콘트롤룸(doctoradmin.html) 직행 버튼 */
        .btn-admin-toggle {
            background: #0284c7; color: #ffffff; border: 1px solid #38bdf8; border-radius: 10px;
            font-size: 11px; font-weight: 900; padding: 5px 8px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(2, 132, 199, 0.4);
        }

        .btn-yetalk-tv {
            background: linear-gradient(135deg, #0284c7, #2563eb); color: #ffffff;
            border: 1px solid #38bdf8; border-radius: 10px; font-size: 11px; font-weight: 900;
            padding: 5px 9px; cursor: pointer; display: flex; align-items: center; gap: 3px;
        }

        /* 2층 가로 메뉴 칩 바 */
        .doctor-nav-bar {
            height: var(--menu-h); background: #0f172a; border-bottom: 1px solid #1e293b;
            display: flex; gap: 6px; overflow-x: auto; white-space: nowrap;
            padding: 0 10px; align-items: center; flex-shrink: 0; z-index: 9998;
            scrollbar-width: none;
        }
        .doctor-nav-bar::-webkit-scrollbar { display: none; }
        .d-nav-chip {
            background: #1e293b; border: 1px solid #334155; color: #94a3b8;
            font-size: 12px; font-weight: 800; padding: 5px 12px; border-radius: 14px;
            cursor: pointer; flex-shrink: 0; transition: all 0.15s;
        }
        .d-nav-chip.active { background: #0284c7; color: white; border-color: #38bdf8; font-weight: 900; box-shadow: 0 2px 6px rgba(2, 132, 199, 0.35); }

        /* 3층 메인 세로 스냅 쇼츠 뷰포트 */
        .doctor-scroll-viewport {
            flex: 1; height: var(--view-h); overflow-y: scroll;
            scroll-snap-type: y mandatory; scroll-behavior: smooth; position: relative;
            -webkit-overflow-scrolling: touch;
        }
        .doctor-scroll-viewport::-webkit-scrollbar { display: none; }

        .snap-card-section {
            width: 100%; height: var(--view-h); min-height: var(--view-h);
            scroll-snap-align: start; scroll-snap-stop: always;
            position: relative; display: flex; flex-direction: column;
            justify-content: space-between; overflow: hidden; cursor: pointer;
            border-bottom: 2px solid #000000;
        }

        /* 🌟 [개선 3] 2K 초고화질 맑은 화면 복원 (밝기 0.92, 칠흑 먹구름 필터 제거) */
        .card-bg-img {
            position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: top center;
            filter: brightness(0.92) contrast(1.03); z-index: 1; transition: opacity 0.5s ease-in-out;
        }
        .card-gradient-overlay {
            position: absolute; inset: 0; z-index: 2;
            background: linear-gradient(180deg, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.0) 40%, rgba(0,0,0,0.45) 100%);
        }

        .image-top-right-bar {
            position: absolute; top: 14px; right: 14px; z-index: 25;
            display: flex; gap: 6px;
        }
        .btn-top-edit {
            background: #dc2626; color: white; border: 1px solid rgba(255,255,255,0.3); border-radius: 14px;
            font-size: 11px; font-weight: 900; padding: 4px 10px; cursor: pointer;
            box-shadow: 0 2px 6px rgba(220,38,38,0.4);
        }
        .btn-top-detail {
            background: #0284c7; color: white; border: 1.5px solid #38bdf8; border-radius: 14px;
            font-size: 12px; font-weight: 900; padding: 4px 12px; cursor: pointer;
            box-shadow: 0 2px 8px rgba(0,0,0,0.4);
        }

        .card-top-content {
            position: relative; z-index: 10; padding: 22px 18px 0 18px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .card-category-badge {
            align-self: flex-start; font-size: 11px; font-weight: 900;
            padding: 3px 8px; border-radius: 10px; background: rgba(15, 23, 42, 0.75);
            border: 1px solid #38bdf8; color: #38bdf8; box-shadow: 0 2px 6px rgba(0,0,0,0.5);
        }
        .card-title-main {
            font-size: 24px; font-weight: 950; line-height: 1.35; color: #ffffff;
            word-break: keep-all; text-shadow: 0 2px 4px rgba(0,0,0,0.9), 0 4px 14px rgba(0,0,0,0.8);
        }

        .card-bottom-content {
            position: relative; z-index: 10; padding: 0 18px 28px 18px;
            display: flex; flex-direction: column; gap: 6px;
        }
        .card-verse-highlight {
            font-size: 14.5px; font-weight: 900; color: #fef08a;
            text-shadow: 0 2px 4px rgba(0,0,0,0.95), 0 3px 10px rgba(0,0,0,0.85); line-height: 1.4;
        }
        .card-body-text {
            font-size: 13px; line-height: 1.6; color: #ffffff; word-break: keep-all;
            text-shadow: 0 1px 3px rgba(0,0,0,0.95), 0 2px 8px rgba(0,0,0,0.8);
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
        }

        /* 슬라이드 닷 인디케이터 */
        .slide-dots {
            position: absolute; bottom: 8px; left: 50%; transform: translateX(-50%);
            display: flex; gap: 5px; z-index: 15;
        }
        .dot { width: 6px; height: 6px; border-radius: 50%; background: rgba(255,255,255,0.4); transition: all 0.2s; }
        .dot.active { background: #38bdf8; width: 14px; border-radius: 3px; }

        /* 바닥창 */
        .final-footer-snap-card {
            width: 100%; height: var(--view-h); min-height: var(--view-h);
            scroll-snap-align: start; scroll-snap-stop: always;
            background: #090d16; position: relative; display: flex; flex-direction: column;
            align-items: center; justify-content: center; padding: 24px 16px; text-align: center;
        }
        .admob-mrec-box {
            width: 300px; height: 230px; background: #131d31; border: 1.5px dashed #facc15;
            border-radius: 14px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
            box-shadow: 0 4px 18px rgba(0,0,0,0.6);
        }
        .doctor-health-box {
            width: 100%; max-width: 320px; background: #0c1c38; border: 1.5px solid #38bdf8;
            border-radius: 12px; padding: 12px 14px; margin-top: 14px;
        }
        .btn-back-to-first {
            width: 100%; max-width: 320px; height: 42px; background: #1e293b; color: #ffffff;
            border: 1px solid #475569; border-radius: 21px; font-size: 13px; font-weight: 900; cursor: pointer; margin-top: 14px;
        }

        /* 수정 모달 */
        .modal-overlay {
            display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.85);
            z-index: 20000; align-items: center; justify-content: center; padding: 12px;
            backdrop-filter: blur(4px);
        }
        .modal-overlay.show { display: flex; }
        .modal-card {
            width: 100%; max-width: 440px; background: #131d31; border: 1.5px solid #38bdf8;
            border-radius: 16px; padding: 18px 16px; display: flex; flex-direction: column; gap: 10px;
        }
        .m-input {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 8px 10px; color: #ffffff; font-size: 13px; outline: none;
        }
        .m-textarea {
            width: 100%; background: #1e293b; border: 1px solid #334155; border-radius: 8px;
            padding: 8px 10px; color: #ffffff; font-size: 13px; outline: none; min-height: 70px; resize: vertical;
        }

        .yetalk-toast {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
            background: rgba(15, 23, 42, 0.95); color: white; padding: 9px 18px; border-radius: 20px;
            font-size: 12px; font-weight: 800; z-index: 20005; opacity: 0; visibility: hidden;
            transition: all 0.25s ease; white-space: nowrap;
        }
        .yetalk-toast.show { opacity: 1; visibility: visible; transform: translateX(-50%) translateY(0); }
    </style>
</head>
<body>

<div class="doctor-shell">
    <!-- 1층 헤더 -->
    <header class="doctor-fixed-header">
        <div class="header-left-box">
            <!-- 🌟 [◀] 터치 시 보던 영상 자리로 즉시 복귀 -->
            <button type="button" class="btn-header-back" onclick="window.history.back()" title="보던 영상 자리로 복귀">◀</button>
            <div class="doctor-header-title">아름다운의원</div>
        </div>
        <div class="header-right-box">
            <!-- 🌟 의원 관리실 직행 -->
            <button type="button" class="btn-admin-toggle" onclick="location.href='doctoradmin.html'">⚙️ 관리실</button>
            <button type="button" class="btn-yetalk-tv" onclick="location.href='index.html'">
                <span>📺</span> 예톡TV
            </button>
        </div>
    </header>

    <!-- 2층 가로 네비 바 -->
    <nav class="doctor-nav-bar" id="doctorNavBar">
        <button type="button" class="d-nav-chip active" id="dchip_0" onclick="scrollToCard(0)">의원소개</button>
        <button type="button" class="d-nav-chip" id="dchip_1" onclick="scrollToCard(1)">시술소개</button>
        <button type="button" class="d-nav-chip" id="dchip_2" onclick="scrollToCard(2)">예약문의</button>
        <button type="button" class="d-nav-chip" id="dchip_3" onclick="scrollToCard(3)">공지알림</button>
        <button type="button" class="d-nav-chip" id="dchip_4" onclick="scrollToCard(4)">시술·진료전후</button>
        <button type="button" class="d-nav-chip" id="dchip_5" onclick="scrollToCard(5)">오시는길</button>
        <button type="button" class="d-nav-chip" id="dchip_6" onclick="scrollToCard(6)">원장칼럼·후원</button>
    </nav>

    <!-- 3층 세로 스냅 피드 -->
    <main class="doctor-scroll-viewport" id="doctorViewport"></main>

    <!-- 관리자 수정 모달 -->
    <div class="modal-overlay" id="doctorMainEditModal">
        <div class="modal-card">
            <div style="display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid #334155; padding-bottom:6px;">
                <strong style="color:#38bdf8; font-size:15px;" id="modalCardTitleLabel">✏️ 첫 페이지(의원소개) 사진·내용 수정</strong>
                <button type="button" style="background:none; border:none; color:#94a3b8; font-size:22px; cursor:pointer;" onclick="closeDoctorMainEditModal()">✕</button>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; background:#1e293b; padding:8px 10px; border-radius:8px;">
                <span style="font-size:12px; color:#cbd5e1; font-weight:800;">대표 배경 사진</span>
                <div style="display:flex; align-items:center; gap:8px;">
                    <img id="prevFirstCardImg" style="width:48px; height:36px; object-fit:cover; border-radius:4px; border:1px solid #38bdf8;" src="" alt="미리보기">
                    <label for="firstCardFileInput" style="background:#0284c7; color:white; font-size:11px; font-weight:900; padding:6px 10px; border-radius:6px; cursor:pointer;">📷 사진 변경</label>
                    <input type="file" id="firstCardFileInput" accept="image/*" style="display:none;" onchange="handleFirstCardFile(event)">
                </div>
            </div>

            <div>
                <label style="font-size:11px; color:#facc15; font-weight:800; display:block; margin-bottom:2px;">메인 제목</label>
                <input type="text" class="m-input" id="inpCardTitle">
            </div>

            <div>
                <label style="font-size:11px; color:#facc15; font-weight:800; display:block; margin-bottom:2px;">진료 철학 / 핵심 슬로건</label>
                <input type="text" class="m-input" id="inpCardVerse">
            </div>

            <div>
                <label style="font-size:11px; color:#facc15; font-weight:800; display:block; margin-bottom:2px;">의원 소개 본문</label>
                <textarea class="m-textarea" id="inpCardBody"></textarea>
            </div>

            <div style="display:flex; justify-content:flex-end; gap:8px; margin-top:6px;">
                <button type="button" style="background:#334155; color:white; border:none; padding:8px 14px; border-radius:6px; font-size:12px; cursor:pointer;" onclick="closeDoctorMainEditModal()">취소</button>
                <button type="button" style="background:#dc2626; color:white; border:none; padding:8px 18px; border-radius:6px; font-size:12px; font-weight:900; cursor:pointer;" onclick="saveFirstCardData()">저장하기</button>
            </div>
        </div>
    </div>

    <div class="yetalk-toast" id="yetalkToast"></div>
</div>

<script>
    // 🌟 1600px 2K 초고화질 슬라이드 데이터
    const SLIDE_DATA = {
        0: [
            { title: "자연스러운 아름다움의 시작", verse: "“정직한 진료, 환자 중심의 맞춤 케어”", body: "진료원장: 전문 의료진 1:1 전담\n풍부한 임상경험을 바탕으로 건강하고 당당한 자신감을 선물합니다.", img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=90" },
            { title: "첨단 레이저 & 항노화 클리닉", verse: "“피부 깊은 곳부터 채우는 재생 에너지”", body: "자가진피 재생, 색소 클리어 토닝, 고주파 탄력 리프팅 시스템 완비.", img: "https://images.unsplash.com/photo-1516549655169-df83a0774514?auto=format&fit=crop&w=1600&q=90" },
            { title: "1인 1실 프라이빗 케어룸", verse: "“편안하고 쾌적한 힐링 진료 공간”", body: "감염 관리와 프라이버시 보호를 최우선으로 하는 맞춤형 원내 시설입니다.", img: "https://images.unsplash.com/photo-1629909613654-28e377c37b09?auto=format&fit=crop&w=1600&q=90" },
            { title: "면역 & 웰빙 의학 수액센터", verse: "“만성 피로를 회복하는 맞춤 영양 처방”", body: "항산화 주사, 활력 수액, 신체 밸런스 회복을 위한 웰빙 프로그램.", img: "https://images.unsplash.com/photo-1584515979956-d9f6e5d09982?auto=format&fit=crop&w=1600&q=90" },
            { title: "정품·정량 정직한 원칙", verse: "“신뢰를 바탕으로 함께하는 든든한 주치의”", body: "검증된 정품 장비와 안전한 시술 원칙으로 부작용 걱정을 덜어드립니다.", img: "https://images.unsplash.com/photo-1579684385127-1ef15d508118?auto=format&fit=crop&w=1600&q=90" }
        ],
        1: [
            { title: "자가진피 재생술", verse: "“꺼진 주름과 흉터를 피부 스스로 채우다”", body: "인위적 이물질 없이 자가 콜라겐 생성을 유도하는 프리미엄 안티에이징.", img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1600&q=90" },
            { title: "듀얼 색소 레이저 토닝", verse: "“기미, 잡티, 색소침착을 맑고 깨끗하게”", body: "피부 손상을 최소화하고 멜라닌 색소만을 정밀 타겟팅하는 첨단 토닝.", img: "https://images.unsplash.com/photo-1512290903672-d798546722f4?auto=format&fit=crop&w=1600&q=90" },
            { title: "탄력 모노실 리프팅", verse: "“처진 턱선과 피부 결을 탄탄하게 고정”", body: "의료용 특수실로 콜라겐 그물망을 형성하여 처짐 없는 턱선 완성.", img: "https://images.unsplash.com/photo-1576091160550-2173dba999ef?auto=format&fit=crop&w=1600&q=90" },
            { title: "MTS 모공·흉터 재생", verse: "“미세 자극을 통한 피부 턴오버 주기 정상화”", body: "넓어진 모공과 울퉁불퉁한 피부결을 매끄러운 도자기 피부로 케어.", img: "https://images.unsplash.com/photo-1506126613408-eca07ce68773?auto=format&fit=crop&w=1600&q=90" },
            { title: "카복시 & 보디 체형관리", verse: "“군살과 셀룰라이트를 매끄럽게 정리”", body: "국소 부위 순환 개선과 지방 분해를 돕는 바디 밸런스 클리닉.", img: "https://images.unsplash.com/photo-1518611012118-696072aa579a?auto=format&fit=crop&w=1600&q=90" }
        ],
        2: [
            { title: "피로 없는 비대면 간편 예약", verse: "“불필요한 긴 대화 없이 원하는 시간에 쏙”", body: "원하는 진료 과목과 희망 일시만 선택하시면 빠르게 예약 확정 안내를 드립니다.", img: "https://images.unsplash.com/photo-1576091160399-112ba8d25d1d?auto=format&fit=crop&w=1600&q=90" },
            { title: "대기 시간 최소화 시스템", verse: "“환자분의 소중한 시간을 존중합니다”", body: "사전 예약 환자 우선 배정으로 쾌적한 1:1 맞춤 진료를 진행합니다.", img: "https://images.unsplash.com/photo-1586773860418-d37222d8fce3?auto=format&fit=crop&w=1600&q=90" },
            { title: "원클릭 예약 상태 확인", verse: "“신청 / 확정 / 변경 안내를 앱에서 바로”", body: "예약 접수 후 원내 데스크에서 실시간으로 확인하여 확정 메시지를 전송합니다.", img: "https://images.unsplash.com/photo-1454165804606-c3d57bc86b40?auto=format&fit=crop&w=1600&q=90" },
            { title: "당일 진료 상담 예약 안내", verse: "“급한 피부 고민도 꼼꼼하게 상담”", body: "전화 연결 없이 앱으로 손쉽게 빈자리를 확인하고 방문하세요.", img: "https://images.unsplash.com/photo-1504813184591-01572f98c85f?auto=format&fit=crop&w=1600&q=90" },
            { title: "모바일 예약 바로가기", verse: "“터치 한 번으로 시작하는 프리미엄 진료”", body: "상세보기를 터치하여 예약 접수 창으로 즉시 이동합니다.", img: "https://images.unsplash.com/photo-1584515933487-779824d29309?auto=format&fit=crop&w=1600&q=90" }
        ]
    };

    const STATIC_SECTIONS = [
        {
            id: 3, cat: "공지알림", title: "가을맞이 피부 탄력 특별 클리닉 안내",
            verse: "“건조한 환절기, 피부 속보습을 채우는 맞춤 처방”",
            body: "계절 변화로 지친 피부를 위한 항산화 수액 및 보습 재생 프로그램 일정 안내입니다.",
            img: "https://images.unsplash.com/photo-1512290903672-d798546722f4?auto=format&fit=crop&w=1600&q=90",
            link: "doctornotice.html"
        },
        {
            id: 4, cat: "시술·진료전후", title: "실제 시술 전후 비교 & 영상제작소",
            verse: "“결과로 증명하는 아름다운의원의 시술 케이스”",
            body: "자가진피 및 모노실 리프팅 전후 임상 사진과 예톡TV 송출 숏폼 영상을 감상하세요.",
            img: "https://images.unsplash.com/photo-1522337360788-8b13dee7a37e?auto=format&fit=crop&w=1600&q=90",
            link: "doctorbeforeafter.html"
        },
        {
            id: 5, cat: "오시는길", title: "아름다운의원 진료안내 & 위치안내",
            verse: "“서울 강남구 테헤란로 123 (역삼역 도보 3분)”",
            body: "월~금 09:30~18:30 / 토 09:30~13:00 (일요일·공휴일 휴진) / 주차 완비",
            img: "https://images.unsplash.com/photo-1519494026892-80bbd2d6fd0d?auto=format&fit=crop&w=1600&q=90",
            link: "doctorlocation.html"
        }
    ];

    let currentSlideIdx = { 0: 0, 1: 0, 2: 0 };
    let slideTimers = {};

    function renderDoctorView() {
        const vp = document.getElementById("doctorViewport");
        vp.innerHTML = "";

        const topThree = [
            { id: 0, cat: "의원소개", link: "doctorintro.html" },
            { id: 1, cat: "시술소개", link: "doctorbeauty.html" },
            { id: 2, cat: "예약문의", link: "doctorreserve.html" }
        ];

        topThree.forEach(sec => {
            const card = document.createElement("section");
            card.className = "snap-card-section";
            card.id = `section_card_${sec.id}`;
            card.dataset.index = sec.id;
            card.onclick = () => location.href = sec.link;

            const slides = SLIDE_DATA[sec.id];
            const initial = slides[0];

            card.innerHTML = `
                <img class="card-bg-img" id="slide_img_${sec.id}" src="${initial.img}" alt="${sec.cat}">
                <div class="card-gradient-overlay"></div>

                <div class="image-top-right-bar" onclick="event.stopPropagation();">
                    ${sec.id === 0 ? `<button type="button" class="btn-top-edit" onclick="openDoctorMainEditModal()">수정 ▶</button>` : ''}
                    <button type="button" class="btn-top-detail" onclick="location.href='${sec.link}'">상세보기 ❯</button>
                </div>

                <div class="card-top-content">
                    <span class="card-category-badge">${sec.cat}</span>
                    <h2 class="card-title-main" id="slide_title_${sec.id}">${initial.title}</h2>
                </div>

                <div class="card-bottom-content">
                    <div class="card-verse-highlight" id="slide_verse_${sec.id}">${initial.verse}</div>
                    <div class="card-body-text" id="slide_body_${sec.id}">${initial.body}</div>
                </div>

                <div class="slide-dots" id="dots_${sec.id}">
                    ${slides.map((_, i) => `<div class="dot ${i === 0 ? 'active' : ''}"></div>`).join('')}
                </div>
            `;
            vp.appendChild(card);
            start2SecSlide(sec.id);
        });

        STATIC_SECTIONS.forEach(sec => {
            const card = document.createElement("section");
            card.className = "snap-card-section";
            card.id = `section_card_${sec.id}`;
            card.dataset.index = sec.id;
            card.onclick = () => location.href = sec.link;

            card.innerHTML = `
                <img class="card-bg-img" src="${sec.img}" alt="${sec.cat}">
                <div class="card-gradient-overlay"></div>

                <div class="image-top-right-bar" onclick="event.stopPropagation();">
                    <button type="button" class="btn-top-detail" onclick="location.href='${sec.link}'">상세보기 ❯</button>
                </div>

                <div class="card-top-content">
                    <span class="card-category-badge">${sec.cat}</span>
                    <h2 class="card-title-main">${sec.title}</h2>
                </div>

                <div class="card-bottom-content">
                    <div class="card-verse-highlight">${sec.verse}</div>
                    <div class="card-body-text">${sec.body}</div>
                </div>
            `;
            vp.appendChild(card);
        });

        // 7번째 바닥창
        const footer = document.createElement("section");
        footer.className = "final-footer-snap-card";
        footer.id = `section_card_6`;
        footer.dataset.index = 6;

        footer.innerHTML = `
            <div style="font-size:13.5px; font-weight:900; color:#38bdf8; margin-bottom:8px;">💎 아름다운의원 공식 스폰서 슬롯</div>
            <div class="admob-mrec-box">
                <span style="font-size:30px;">🎁</span>
                <strong style="font-size:15px; color:#38bdf8;">Google AdMob (300x250)</strong>
                <span style="font-size:11px; color:#e2e8f0;">지역 맞춤형 공식 프리미엄 배너</span>
                <span style="font-size:9.5px; color:#94a3b8;">SPONSORED AD</span>
            </div>

            <div class="doctor-health-box">
                <div style="font-size:11.5px; font-weight:900; color:#facc15; margin-bottom:3px;">🩺 원장님의 건강 한마디</div>
                <div style="font-size:13px; color:#ffffff; line-height:1.55;">
                    “피부의 탄력은 충분한 수분 섭취와 바른 수면에서 시작됩니다. 무리한 자극보다 매일의 작은 습관을 가꾸어보세요.”
                </div>
            </div>

            <button type="button" class="btn-back-to-first" onclick="scrollToCard(0)">
                ⌃ 첫 화면(의원소개)으로 가기
            </button>
        `;
        vp.appendChild(footer);
    }

    // 🌟 가로 메뉴 실시간 1:1 자동 연동 옵저버
    function setupDoctorObserver() {
        const sections = document.querySelectorAll(".snap-card-section, .final-footer-snap-card");
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    const idx = parseInt(entry.target.dataset.index, 10);
                    if (!isNaN(idx)) {
                        updateTabChips(idx);
                    }
                }
            });
        }, {
            root: document.getElementById("doctorViewport"),
            threshold: 0.6
        });

        sections.forEach(sec => observer.observe(sec));
    }

    function start2SecSlide(id) {
        if (slideTimers[id]) clearInterval(slideTimers[id]);
        const slides = SLIDE_DATA[id];
        slideTimers[id] = setInterval(() => {
            currentSlideIdx[id] = (currentSlideIdx[id] + 1) % slides.length;
            const cur = slides[currentSlideIdx[id]];

            const imgEl = document.getElementById(`slide_img_${id}`);
            const titleEl = document.getElementById(`slide_title_${id}`);
            const verseEl = document.getElementById(`slide_verse_${id}`);
            const bodyEl = document.getElementById(`slide_body_${id}`);
            const dotsEl = document.getElementById(`dots_${id}`);

            if (imgEl) imgEl.src = cur.img;
            if (titleEl) titleEl.innerText = cur.title;
            if (verseEl) verseEl.innerText = cur.verse;
            if (bodyEl) bodyEl.innerText = cur.body;

            if (dotsEl) {
                const dots = dotsEl.querySelectorAll(".dot");
                dots.forEach((d, i) => d.classList.toggle("active", i === currentSlideIdx[id]));
            }
        }, 2000);
    }

    function scrollToCard(index) {
        const target = document.getElementById(`section_card_${index}`);
        if (target) {
            target.scrollIntoView({ behavior: "smooth", block: "start" });
        }
    }

    function updateTabChips(activeIdx) {
        const chips = document.querySelectorAll(".d-nav-chip");
        chips.forEach((c, i) => {
            const isMatch = (i === activeIdx);
            c.classList.toggle("active", isMatch);
            if (isMatch) {
                c.scrollIntoView({ behavior: "smooth", inline: "center", block: "nearest" });
            }
        });
    }

    // 관리자 수정 모달 제어
    let tempFirstImgBase64 = "";
    function openDoctorMainEditModal() {
        const curSlide = SLIDE_DATA[0][0];
        document.getElementById("inpCardTitle").value = curSlide.title;
        document.getElementById("inpCardVerse").value = curSlide.verse;
        document.getElementById("inpCardBody").value = curSlide.body;
        tempFirstImgBase64 = curSlide.img;
        document.getElementById("prevFirstCardImg").src = tempFirstImgBase64;

        document.getElementById("doctorMainEditModal").classList.add("show");
    }

    function closeDoctorMainEditModal() {
        document.getElementById("doctorMainEditModal").classList.remove("show");
    }

    // 🌟 1600px 2K 초고화질 압축 처리
    function handleFirstCardFile(event) {
        const file = event.target.files && event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            const img = new Image();
            img.onload = function() {
                const canvas = document.createElement("canvas");
                let w = img.width, h = img.height;
                const maxW = 1600;
                if (w > maxW) {
                    h = Math.round((h * maxW) / w);
                    w = maxW;
                }
                canvas.width = w;
                canvas.height = h;
                const ctx = canvas.getContext("2d");
                ctx.drawImage(img, 0, 0, w, h);

                tempFirstImgBase64 = canvas.toDataURL("image/jpeg", 0.92);
                document.getElementById("prevFirstCardImg").src = tempFirstImgBase64;
                showToast("📷 2K 고화질 사진이 준비되었습니다. [저장하기]를 누르세요.");
            };
            img.src = e.target.result;
        };
        reader.readAsDataURL(file);
    }

    function saveFirstCardData() {
        const newTitle = document.getElementById("inpCardTitle").value.trim();
        const newVerse = document.getElementById("inpCardVerse").value.trim();
        const newBody = document.getElementById("inpCardBody").value.trim();

        if (newTitle) SLIDE_DATA[0][0].title = newTitle;
        if (newVerse) SLIDE_DATA[0][0].verse = newVerse;
        if (newBody) SLIDE_DATA[0][0].body = newBody;
        if (tempFirstImgBase64) SLIDE_DATA[0][0].img = tempFirstImgBase64;

        localStorage.setItem("yetalk_doctormain_2k_v2", JSON.stringify(SLIDE_DATA[0][0]));
        renderDoctorView();
        setupDoctorObserver();
        closeDoctorMainEditModal();
        showToast("🎉 의원 메인 내용과 고화질 사진이 영구 저장되었습니다!");
    }

    function loadCustomSavedData() {
        const saved = localStorage.getItem("yetalk_doctormain_2k_v2");
        if (saved) {
            const data = JSON.parse(saved);
            SLIDE_DATA[0][0].title = data.title || SLIDE_DATA[0][0].title;
            SLIDE_DATA[0][0].verse = data.verse || SLIDE_DATA[0][0].verse;
            SLIDE_DATA[0][0].body = data.body || SLIDE_DATA[0][0].body;
            SLIDE_DATA[0][0].img = data.img || SLIDE_DATA[0][0].img;
        }
    }

    function showToast(msg) {
        const t = document.getElementById("yetalkToast");
        t.innerText = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 2200);
    }

    function applyCustomClinicName() {
        const customStore = localStorage.getItem("yetalkDoctorName") || "예톡아름다운의원";
        const titleEl = document.querySelector(".doctor-header-title");
        if (titleEl) titleEl.innerText = customStore;
    }

    document.addEventListener("DOMContentLoaded", () => {
        applyCustomClinicName();
        loadCustomSavedData();
        renderDoctorView();
        setupDoctorObserver();
    });
</script>
