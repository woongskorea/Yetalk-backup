html,body{

body{

/* 상단 */
/* 컨트롤바 */

gap:8px;

overflow-x:auto;

border-bottom:
1px solid rgba(0,0,0,0.04);

}

.ctrl{

padding:8px 9px;

border-radius:18px;

background:#f3f6fb;

font-size:12px;

font-weight:1000;

white-space:nowrap;

cursor:pointer;

}

.ctrl.blue{

background:#e8f1ff;

color:#2f80ed;

}

.ctrl.red{

background:#ffeaea;

color:#d93c3c;

}

.ctrl.green{

background:#eaf8ee;

color:#27a85d;

}

.menu-bar{

height:50px;

background:white;

display:flex;

border-bottom:
1px solid rgba(0,0,0,0.05);

}

.menu{

flex:1;

display:flex;

align-items:center;

justify-content:center;

font-size:16px;

font-weight:1000;

color:#555;

cursor:pointer;

}

.active{

color:#2f80ed;

border-bottom:
2px solid #2f80ed;

}

/* 채팅 */

.chat-area{

flex:1;

overflow-y:auto;

-webkit-overflow-scrolling:touch;

padding:12px 10px 120px;

background:#b8c7d9;

}

/* 날짜 */

.date{

font-size:12px;

font-weight:1000;

color:#666;

margin-bottom:18px;
}

.notice-chat{

background:#fff8dc;

padding:10px 14px;

border-radius:16px;

font-size:13px;

font-weight:1000;

color:#7a5a00;

margin-bottom:16px;

line-height:1.5;

}


/* 메시지 */

.msg-row{

display:flex;

margin-bottom:8px;
}

.left-msg{
justify-content:flex-start;
}

.right-msg{
justify-content:flex-end;
}

/* 프로필 */

.msg-profile{

width:34px;
height:34px;

border-radius:12px;

overflow:hidden;

margin-right:6px;

flex-shrink:0;
}

.msg-profile img{

width:100%;
height:100%;

object-fit:cover;
}

/* 내용 */

.msg-wrap{
max-width:96%;
}

/* 이름 */

.msg-name{

font-size:13px;

font-weight:900;

color:#666;

margin-bottom:4px;
}

/* 말풍선 */

.msg{

background:transparent;

padding:3px 4px;

border-radius:0px;

font-size:16px;

font-weight:700;

line-height:1.6;

color:#222;

box-shadow:none;

position:relative;
}

/* 큰이모티콘 */

.big-emoji{

font-size:58px;

background:none !important;

box-shadow:none !important;

padding:0 !important;
}

/* 리액션 팝업 */

.react-popup{

position:absolute;

top:-132px;
left:0;

background:white;

border-radius:24px;

padding:10px;

display:none;

flex-wrap:wrap;

gap:8px;

box-shadow:
0 4px 16px rgba(0,0,0,0.12);

z-index:999;

max-width:340px;
}

/* 기본 */

.react-popup span{

background:#f7f9fd;

padding:6px 10px;

border-radius:16px;

font-size:18px;

font-weight:1000;

cursor:pointer;
}

/* 글 리액션 */

.txt-react{

background:#edf3ff !important;

border-radius:20px;

padding:6px 11px !important;

font-size:12px !important;

font-weight:1000;

color:#2f5fd1;

border:
1px solid #d7e5ff;
}

.reply-btn{

background:#fff6dc !important;

border:1px solid #ffe49a;

color:#8a5a00;

font-size:13px !important;

font-weight:1000;

padding:7px 12px !important;

border-radius:18px;

}

/* 실제 리액션 */

.reaction-area{

display:flex;

flex-wrap:wrap;

gap:6px;

margin-top:8px;
}

.reaction-badge{

background:white;

border:
1px solid #dde7ff;

border-radius:14px;

padding:3px 8px;

font-size:12px;

font-weight:1000;

color:#2f5fd1;

display:flex;

align-items:center;

gap:4px;
}

/* 입력창 */

.input-wrap{

position:fixed;

left:0;
right:0;
bottom:0;

height:60px;

background:
rgba(255,255,255,0.98);

backdrop-filter:blur(10px);

border-top:
1px solid rgba(0,0,0,0.05);

display:flex;

align-items:center;

padding:0 10px;

gap:8px;

z-index:100;
}

/* + 버튼 */

.plus-btn{

width:40px;
height:40px;

border-radius:14px;

background:#f2f0ff;

display:flex;
align-items:center;
justify-content:center;

font-size:32px;

font-weight:1000;

color:#7a4cff;

cursor:pointer;

flex-shrink:0;
}

/* 입력 */

.chat-input{

flex:1;

height:40px;

border:none;

outline:none;

border-radius:20px;

background:#f3f6fb;

padding:0 14px;

font-size:14px;

font-weight:1000;
}

/* 보내기 */

.send{

padding:10px 12px;

min-width:58px;

text-align:center;

border-radius:14px;

background:#2f80ed;

color:white;

font-size:12px;

font-weight:1000;

cursor:pointer;
}

/* 이모티콘창 */

.emoji-panel{

position:fixed;

left:0;
right:0;
bottom:60px;

background:
rgba(255,255,255,0.98);

backdrop-filter:blur(14px);

padding:14px 12px 20px;

display:none;

z-index:999;

border-top-left-radius:26px;
border-top-right-radius:26px;

box-shadow:
0 -6px 20px rgba(0,0,0,0.10);

max-height:340px;

overflow-y:auto;
}

.emoji-panel.show{
display:block;
}

/* 메뉴 */

.emoji-main{

display:flex !important;

flex-direction:row !important;

flex-wrap:nowrap !important;

gap:6px;

padding:4px 2px;

/* 메뉴 박스 */

.menu-box{

height:52px;

border-radius:14px;

align-items:center;
justify-content:center;

/* 내용 */

.emoji-content{

display:flex;

gap:10px;

/* 일반 */

.item{

background:#f8fbff;

padding:10px 14px;

border-radius:18px;

font-size:14px;

font-weight:1000;

cursor:pointer;

line-height:1.5;

/* 큰이모티콘 */

.big-item{

.pray-guide{

font-weight:1000;

line-height:1.6;

color:#7a5a00;

text-align:center;

.pray-room{

.pray-user{

cursor:pointer;

align-items:center;

justify-content:center;

gap:3px;

.voice-user-on{

function addOtherMessage(name,text){

const chat =
document.getElementById('chatArea');

const row =
document.createElement('div');

row.className =
'msg-row left-msg';

row.innerHTML = `

<div class="msg-profile">

<img src="https://randomuser.me/api/portraits/women/68.jpg">

</div>

<div class="msg-wrap">

<div class="msg-name">
${name}
</div>

<div class="msg"

oncontextmenu="
showReaction(event);
return false;
">

${reactionHTML()}

${text}

<div class="reaction-area"></div>

</div>

</div>

`;

chat.appendChild(row);

/* 메시지 제한 */

if(chat.children.length > 200){

chat.removeChild(chat.children[0]);

}

scrollBottom();

}

/* 메시지 */

const chat=
document.getElementById('chatArea');

const row =
document.createElement('div');

row.className =
'msg-row left-msg';

row.innerHTML = `

<div class="msg-profile">

/* 보내기 */

function sendMessage(){

const input=
document.getElementById('chatInput');

if(input.value.trim()===''){
return;
}

addMyMessage(input.value);

input.value='';

}

/* 스크롤 */

function scrollBottom(){

const chat=
document.getElementById('chatArea');

chat.scrollTop=
chat.scrollHeight;

}

/* 팝업 */

function showReaction(e){

document
.querySelectorAll('.react-popup')
.forEach(p=>p.style.display='none');

const popup=
e.currentTarget
.querySelector('.react-popup');

popup.style.display='flex';

}

/* 리액션 클릭 */

document.addEventListener('click',function(e){

if(e.target.closest('.react-popup span')){

/* 현재 메시지 */

const msgBox =
e.target.closest('.msg');

const row =
e.target.closest('.msg-row');

const popup =
e.target.closest('.react-popup');

/* 실제 메시지 텍스트 추출 */

let text='';

msgBox.childNodes.forEach(node=>{

if(node.nodeType===3){

text += node.textContent;

}

});

text = text.trim();

/* 답글 */

if(e.target.classList.contains('reply-btn')){

let name='';

const nameEl =
row.querySelector('.msg-name');

if(nameEl){

name=nameEl.innerText;

}else{

name='상대방';

}

const input =
document.getElementById('chatInput');

input.value =
'↪ '+name+' : ';

input.focus();

popup.style.display='none';

return;

}

/* 복사 */

if(e.target.classList.contains('copy-btn')){

navigator.clipboard
.writeText(text);

alert('복사 완료 😊');

popup.style.display='none';

return;

}

/* 알림톡 */

if(e.target.classList.contains('alert-btn')){

const audio =
new Audio(
'https://actions.google.com/sounds/v1/alarms/digital_watch_alarm_long.ogg'
);

audio.play();

alert('띠링~ 알림 전송 😊');

popup.style.display='none';

return;

}

/* 나에게 */

if(e.target.classList.contains('me-btn')){

addMyMessage(
'📌 나에게 저장\n'+text
);

popup.style.display='none';

return;

}

/* 삭제 */

if(e.target.classList.contains('delete-btn')){

if(confirm('메시지를 삭제할까요?')){

row.remove();

}

return;

}

/* 일반 리액션 */

const value=e.target.innerText;

const area=
msgBox.querySelector('.reaction-area');

let found=false;

area
.querySelectorAll('.reaction-badge')
.forEach(badge=>{

const emoji=
badge.querySelector('.emoji');

const count=
badge.querySelector('.count');

if(emoji.innerText===value){

count.innerText=
parseInt(count.innerText)+1;

found=true;

}

});

if(!found){

const badge=
document.createElement('div');

badge.className='reaction-badge';

badge.innerHTML=`

<span class="emoji">
${value}
</span>

<span class="count">
1
</span>

`;

area.appendChild(badge);

}

popup.style.display='none';

}

});

/* 바깥 클릭 */

document.addEventListener('click',function(e){

if(!e.target.closest('.msg')){

document
.querySelectorAll('.react-popup')
.forEach(p=>p.style.display='none');

}

});

/* 시작 */

window.onload=()=>{

allVoiceMode();

addOtherMessage(
'김지혜',
'할렐루야 반원님들 사랑하고 축복합니다. 😊'
);

addOtherMessage(
'박수연',
'오늘 날씨 너무 좋네요 🌿'
);

addMyMessage(
'저 참석 가능합니다 👍'
);

};

function addMyMessage(text){

const chat =
document.getElementById('chatArea');

const row =
document.createElement('div');

row.className =
'msg-row left-msg';

row.innerHTML = `

<div class="msg-profile">

<img src="https://randomuser.me/api/portraits/men/32.jpg">

</div>

<div class="msg-wrap">

<div class="msg-name">
나
</div>

<div class="msg">
${text}
</div>

</div>

`;

chat.appendChild(row);

scrollBottom();

}


function toggleVoice(el){

if(el.innerText==='방장'){
return;
}

if(leaderMode){
return;
}




const users =
document.querySelectorAll('.pray-user');

let onCount = 0;

users.forEach(user=>{

if(user.classList.contains('voice-user-on')){
onCount++;
}

});

if(el.classList.contains('voice-user-on')){

el.classList.remove('voice-user-on');

}else{

if(onCount >= 10){

alert('최대 10명까지 음성 ON 😊');

return;

}

el.classList.add('voice-user-on');

}

}




let leaderMode = false;

function allVoiceMode(){

leaderMode = false;

/* 버튼 표시 */

document.getElementById("freeBtn").style.background="#ffe5e5";
document.getElementById("freeBtn").style.color="#d92b2b";

document.getElementById("leaderBtn").style.background="#dddddd";
document.getElementById("leaderBtn").style.color="#777";

}

function leaderVoiceMode(){

leaderMode = true;

/* 버튼 표시 */

document.getElementById("leaderBtn").style.background="#e7ffe7";
document.getElementById("leaderBtn").style.color="#1f9c4b";

document.getElementById("freeBtn").style.background="#dddddd";
document.getElementById("freeBtn").style.color="#777";

/* 회원 전원 음소거 */

const users =
document.querySelectorAll('.pray-user');

users.forEach(user=>{

if(user.innerText !== '방장'){

user.classList.remove('voice-user-on');

}

});

}





/* 예배시작 */
function startWorship(){

const btn =
document.getElementById('worshipBtn');

btn.innerHTML='🔴 예배중';

btn.style.background='#ffe5e5';

btn.style.color='#d92b2b';

alert('기도예배를 시작합니다 😊');

}


</script>
