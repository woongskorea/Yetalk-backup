<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>오늘의 한마디</title>

    <style>
        body {
            margin: 0; padding: 0; background: #f4f7f6; font-family: "Pretendard", sans-serif;
            display: flex; justify-content: center; align-items: center; height: 100dvh;
        }

        .card {
            width: 90%; max-width: 420px; background: white; border-radius: 24px;
            box-shadow: 0 12px 35px rgba(0,0,0,.08); overflow: hidden; text-align: center;
        }

        /* ⭐ 상단 배경 이미지 영역 */
        .card-header-img {
            width: 100%; height: 170px; background-color: #e2e8f0;
            background-size: cover; background-position: center;
            transition: background-image 0.3s ease-in-out;
        }

        .card-body {
            padding: 25px 25px 35px;
        }

        .logo { width: 110px; margin-bottom: 20px; }

        .title { font-size: 21px; font-weight: 900; line-height: 1.5; color: #146b34; word-break: keep-all; }

        .text { margin-top: 18px; font-size: 16.5px; font-weight: 600; line-height: 1.7; color: #4b5563; word-break: keep-all; }

        button {
            width: 100%; height: 56px; border: none; border-radius: 16px;
            background: #14873d; color: white; font-size: 18.5px; font-weight: 900;
            cursor: pointer; margin-top: 25px; box-shadow: 0 4px 12px rgba(20, 135, 61, 0.25); transition: 0.2s;
        }
        button:hover { background: #0d6e2f; }
        button:active { transform: scale(0.96); }

        .general-mode .title { color: #0284c7; }
        .general-mode button { background: #0284c7; box-shadow: 0 4px 12px rgba(2, 132, 199, 0.25); }
        .general-mode button:hover { background: #0369a1; }
    </style>
</head>

<body>

<div class="card" id="mainCard">
    <!-- 무작위 풍경 이미지가 들어갈 곳 -->
    <div class="card-header-img" id="headerImage"></div>

    <div class="card-body">
        <img src="images/logo/yetalklogo.png" class="logo" alt="로고" onerror="this.src='https://via.placeholder.com/110x35?text=Logo'">

        <div class="title" id="welcomeTitle"></div>
        <div class="text" id="welcomeText"></div>

        <button id="todayBtn"></button>
    </div>
</div>

<script>
    const todayword = [
        { id:1, category:"salvation", title:"구원", order:1, text:`누구든지 주의 이름을 부르는 자는 구원을 받으리라.\n(로마서 10:13)` },
        { id:2, category:"salvation", title:"구원", order:2, text:`하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라.\n(요한복음 3:16)` },
        { id:3, category:"salvation", title:"구원", order:3, text:`다른 이로써는 구원을 받을 수 없나니 천하 사람 중에 구원을 받을 만한 다른 이름을 우리에게 주신 일이 없음이라.\n(사도행전 4:12)` },
        { id:4, category:"salvation", title:"구원", order:4, text:`너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라.\n(에베소서 2:8)` },
        { id:5, category:"salvation", title:"구원", order:5, text:`영접하는 자 곧 그 이름을 믿는 자들에게는 하나님의 자녀가 되는 권세를 주셨으니.\n(요한복음 1:12)` },
        { id:6, category:"salvation", title:"구원", order:6, text:`내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라.\n(요한복음 5:24)` },
        { id:7, category:"salvation", title:"구원", order:7, text:`하나님이 우리에게 영생을 주신 것과 이 생명이 그의 아들 안에 있는 것이니 아들이 있는 자에게는 생명이 있고 하나님의 아들이 없는 자에게는 생명이 없느니라.\n(요한일서 5:11-12)` },
        { id:8, category:"repentance", title:"회개", order:1, text:`회개하고 복음을 믿으라.\n(마가복음 1:15)` },
        { id:9, category:"repentance", title:"회개", order:2, text:`너희가 회개하지 아니하면 다 이와 같이 망하리라.\n(누가복음 13:3)` },
        { id:10, category:"repentance", title:"회개", order:3, text:`그런즉 너희가 회개하고 돌이켜 너희 죄 없이 함을 받으라 이같이 하면 새롭게 되는 날이 주 앞으로부터 이를 것이요.\n(사도행전 3:19)` },
        { id:11, category:"repentance", title:"회개", order:4, text:`만일 우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗하게 하실 것이요.\n(요한일서 1:9)` },
        { id:12, category:"repentance", title:"회개", order:5, text:`악인은 그의 길을, 불의한 자는 그의 생각을 버리고 여호와께로 돌아오라 그리하면 그가 긍휼히 여기시리라 우리 하나님께로 돌아오라 그가 너그럽게 용서하시리라.\n(이사야 55:7)` },
        { id:13, category:"repentance", title:"회개", order:6, text:`하나님의 뜻대로 하는 근심은 후회할 것이 없는 구원에 이르게 하는 회개를 이루는 것이요 세상 근심은 사망을 이루는 것이니라.\n(고린도후서 7:10)` },
        { id:14, category:"repentance", title:"회개", order:7, text:`내 이름으로 일컫는 내 백성이 그들의 악한 길에서 떠나 스스로 낮추고 기도하여 내 얼굴을 찾으면 내가 하늘에서 듣고 그들의 죄를 사하고 그들의 땅을 고칠지라.\n(역대하 7:14)` },
        { id:15, category:"faith", title:"믿음", order:1, text:`믿음은 바라는 것들의 실상이요 보이지 않는 것들의 증거니.\n(히브리서 11:1)` },
        { id:16, category:"faith", title:"믿음", order:2, text:`예수께서 이르시되 할 수 있거든이 무슨 말이냐 믿는 자에게는 능히 하지 못할 일이 없느니라.\n(마가복음 9:23)` },
        { id:17, category:"faith", title:"믿음", order:3, text:`예수께서 이르시되 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고.\n(요한복음 11:25)` },
        { id:18, category:"faith", title:"믿음", order:4, text:`의인은 믿음으로 말미암아 살리라.\n(로마서 1:17)` },
        { id:19, category:"faith", title:"믿음", order:5, text:`너희가 겨자씨 한 알만 한 믿음이 있어도 이 산을 명하여 여기서 저기로 옮겨지라 하면 옮겨질 것이요 또 너희가 못할 것이 없으리라.\n(마태복음 17:20)` },
        { id:20, category:"faith", title:"믿음", order:6, text:`믿음이 없이는 하나님을 기쁘시게 하지 못하나니 하나님께 나아가는 자는 반드시 그가 계신 것과 또한 그가 자기를 찾는 자들에게 상 주시는 이심을 믿어야 할지니라.\n(히브리서 11:6)` },
        { id:21, category:"faith", title:"믿음", order:7, text:`그러므로 믿음은 들음에서 나며 들음은 그리스도의 말씀으로 말미암았느니라.\n(로마서 10:17)` },
        { id:22, category:"love", title:"사랑", order:1, text:`하나님은 사랑이시라 사랑 안에 거하는 자는 하나님 안에 거하고 하나님도 그의 안에 거하시느니라.\n(요한일서 4:16)` },
        { id:23, category:"love", title:"사랑", order:2, text:`새 계명을 너희에게 주노니 서로 사랑하라 내가 너희를 사랑한 것 같이 너희도 서로 사랑하라.\n(요한복음 13:34)` },
        { id:24, category:"love", title:"사랑", order:3, text:`네 이웃을 네 자신 같이 사랑하라 하신 것이라.\n(마태복음 22:39)` },
        { id:25, category:"love", title:"사랑", order:4, text:`사랑은 오래 참고 사랑은 온유하며 시기하지 아니하며 사랑은 자랑하지 아니하며 교만하지 아니하며.\n(고린도전서 13:4)` },
        { id:26, category:"love", title:"사랑", order:5, text:`무엇보다도 뜨겁게 서로 사랑할지니 사랑은 허다한 죄를 덮느니라.\n(베드로전서 4:8)` },
        { id:27, category:"love", title:"사랑", order:6, text:`우리가 사랑함은 그가 먼저 우리를 사랑하셨음이라.\n(요한일서 4:19)` },
        { id:28, category:"love", title:"사랑", order:7, text:`사랑하는 자들아 우리가 서로 사랑하자 사랑은 하나님께 속한 것이니 사랑하는 자마다 하나님으로부터 나서 하나님을 알고.\n(요한일서 4:7)` },
        { id:29, category:"obedience", title:"순종", order:1, text:`순종이 제사보다 낫고 듣는 것이 숫양의 기름보다 나으니.\n(사무엘상 15:22)` },
        { id:30, category:"obedience", title:"순종", order:2, text:`너희가 나를 사랑하면 나의 계명을 지키리라.\n(요한복음 14:15)` },
        { id:31, category:"obedience", title:"순종", order:3, text:`너희는 말씀을 행하는 자가 되고 듣기만 하여 자신을 속이는 자가 되지 말라.\n(야고보서 1:22)` },
        { id:32, category:"obedience", title:"순종", order:4, text:`예수께서 이르시되 오히려 하나님의 말씀을 듣고 지키는 자가 복이 있느니라.\n(누가복음 11:28)` },
        { id:33, category:"obedience", title:"순종", order:5, text:`그가 아들이시면서도 받으신 고난으로 순종함을 배워서.\n(히브리서 5:8)` },
        { id:34, category:"obedience", title:"순종", order:6, text:`너희가 즐겨 순종하면 땅의 아름다운 소산을 먹을 것이요.\n(이사야 1:19)` },
        { id:35, category:"obedience", title:"순종", order:7, text:`오직 여호와의 목소리를 청종하여 내가 오늘 너희에게 명령하는 그의 모든 명령을 지켜 행하면 네 하나님 여호와께서 너를 세계 모든 민족 위에 뛰어나게 하실 것이라.\n(신명기 28:1)` },
        { id:36, category:"prayer", title:"기도", order:1, text:`쉬지 말고 기도하라.\n(데살로니가전서 5:17)` },
        { id:37, category:"prayer", title:"기도", order:2, text:`아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라.\n(빌립보서 4:6)` },
        { id:38, category:"prayer", title:"기도", order:3, text:`그러므로 내가 너희에게 말한다. 무엇이든지 기도하고 구하는 것은 받은 줄로 믿으라. 그리하면 너희에게 그대로 되리라.\n(마가복음 11:24)` },
        { id:39, category:"prayer", title:"기도", order:4, text:`너는 내게 부르짖으라. 내가 네게 응답하겠고 네가 알지 못하는 크고 은밀한 일을 네게 보이리라.\n(예레미야 33:3)` },
        { id:40, category:"prayer", title:"기도", order:5, text:`너희가 내 안에 거하고 내 말이 너희 안에 거하면 무엇이든지 원하는 대로 구하라. 그리하면 이루리라.\n(요한복음 15:7)` },
        { id:41, category:"prayer", title:"기도", order:6, text:`의인의 간구는 역사하는 힘이 큼이니라.\n(야고보서 5:16)` },
        { id:42, category:"prayer", title:"기도", order:7, text:`기도를 계속하고 기도에 감사함으로 깨어 있으라.\n(골로새서 4:2)` },
        { id:43, category:"thanksgiving", title:"감사", order:1, text:`범사에 감사하라 이것이 그리스도 예수 안에서 너희를 향하신 하나님의 뜻이니라.\n(데살로니가전서 5:18)` },
        { id:44, category:"thanksgiving", title:"감사", order:2, text:`감사함으로 그의 문에 들어가며 찬송함으로 그의 궁정에 들어가서 그에게 감사하며 그의 이름을 송축할지어다.\n(시편 100:4)` },
        { id:45, category:"thanksgiving", title:"감사", order:3, text:`여호와께 감사하라 그는 선하시며 그의 인자하심이 영원함이로다.\n(시편 107:1)` },
        { id:46, category:"thanksgiving", title:"감사", order:4, text:`항상 우리 주 예수 그리스도의 이름으로 하나님 아버지께 감사하며.\n(에베소서 5:20)` },
        { id:47, category:"thanksgiving", title:"감사", order:5, text:`그리스도의 평강이 너희 마음을 주장하게 하라 너희는 평강을 위하여 한 몸으로 부르심을 받았나니 너희는 또한 감사하는 자가 되라.\n(골로새서 3:15)` },
        { id:48, category:"thanksgiving", title:"감사", order:6, text:`감사함을 하나님께 제사로 드리는 자가 나를 영화롭게 하나니 그의 행위를 옳게 하는 자에게 내가 하나님의 구원을 보이리라.\n(시편 50:23)` },
        { id:49, category:"thanksgiving", title:"감사", order:7, text:`여호와께 감사하라 그는 선하시며 그 인자하심이 영원함이로다.\n(역대상 16:34)` },
        { id:57, category:"holyspirit", title:"성령", order:1, text:`오직 성령이 너희에게 임하시면 너희가 권능을 받고 예루살렘과 온 유대와 사마리아와 땅 끝까지 이르러 내 증인이 되리라 하시니라.\n(사도행전 1:8)` },
        { id:58, category:"holyspirit", title:"성령", order:2, text:`보혜사 곧 아버지께서 내 이름으로 보내실 성령 그가 너희에게 모든 것을 가르치고 내가 너희에게 말한 모든 것을 생각나게 하리라.\n(요한복음 14:26)` },
        { id:59, category:"holyspirit", title:"성령", order:3, text:`성령을 근심하게 하지 말라 그 안에서 너희가 구원의 날까지 인치심을 받았느니라.\n(에베소서 4:30)` },
        { id:60, category:"holyspirit", title:"성령", order:4, text:`너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희 자신의 것이 아니라.\n(고린도전서 6:19)` },
        { id:61, category:"holyspirit", title:"성령", order:5, text:`성령의 열매는 사랑과 희락과 화평과 오래 참음과 자비와 양선과 충성과 온유와 절제니 이같은 것을 금지할 법이 없느니라.\n(갈라디아서 5:22-23)` },
        { id:62, category:"holyspirit", title:"성령", order:6, text:`만일 우리가 성령으로 살면 또한 성령으로 행할지니.\n(갈라디아서 5:25)` },
        { id:63, category:"holyspirit", title:"성령", order:7, text:`주의 영이 계신 곳에는 자유가 있느니라.\n(고린도후서 3:17)` },
        { id:64, category:"heaven", title:"천국", order:1, text:`회개하라 천국이 가까이 왔느니라.\n(마태복음 4:17)` },
        { id:65, category:"heaven", title:"천국", order:2, text:`하나님이 그들을 위하여 한 성을 예비하셨느니라.\n(히브리서 11:16)` },
        { id:66, category:"heaven", title:"천국", order:3, text:`내 아버지 집에 거할 곳이 많도다 그렇지 않으면 너희에게 일렀으리라 내가 너희를 위하여 거처를 예비하러 가노니.\n(요한복음 14:2)` },
        { id:67, category:"heaven", title:"천국", order:4, text:`의인들은 자기 아버지 나라에서 해와 같이 빛나리라 귀 있는 자는 들으라.\n(마태복음 13:43)` },
        { id:68, category:"heaven", title:"천국", order:5, text:`또 내가 새 하늘과 새 땅을 보니 처음 하늘과 처음 땅이 없어졌고 바다도 다시 있지 않더라.\n(요한계시록 21:1)` },
        { id:69, category:"heaven", title:"천국", order:6, text:`하나님이 그들의 눈에서 모든 눈물을 씻어 주시니 다시는 사망이 없고 애통하는 것이나 곡하는 것이나 아픈 것이 다시 있지 아니하리니 처음 것들이 다 지나갔음이러라.\n(요한계시록 21:4)` },
        { id:70, category:"heaven", title:"천국", order:7, text:`내가 곧 오리니 네가 가진 것을 굳게 잡아 아무도 네 면류관을 빼앗지 못하게 하라.\n(요한계시록 3:11)` },
        { id:71, category:"fearofgod", title:"경외", order:1, text:`여호와를 경외하는 것이 지혜의 근본이요 거룩하신 자를 아는 것이 명철이니라.\n(잠언 9:10)` },
        { id:72, category:"fearofgod", title:"경외", order:2, text:`여호와를 경외하는 것은 악을 미워하는 것이라 나는 교만과 거만과 악한 행실과 패역한 입을 미워하느니라.\n(잠언 8:13)` },
        { id:73, category:"fearofgod", title:"경외", order:3, text:`여호와를 경외하는 자에게는 견고한 의뢰가 있나니 그의 자녀들에게 피난처가 있으리라.\n(잠언 14:26)` },
        { id:74, category:"fearofgod", title:"경외", order:4, text:`여호와를 경외하는 것은 사람으로 생명에 이르게 하는 것이니 곧 족하게 지내고 재앙을 만나지 아니하리라.\n(잠언 19:23)` },
        { id:75, category:"fearofgod", title:"경외", order:5, text:`여호와를 경외하는 자 곧 그의 계명을 크게 즐거워하는 자는 복이 있도다.\n(시편 112:1)` },
        { id:76, category:"fearofgod", title:"경외", order:6, text:`여호와를 경외하는 자들에게는 부족함이 없도다.\n(시편 34:9)` },
        { id:77, category:"fearofgod", title:"경외", order:7, text:`여호와께서 자기를 경외하는 자들과 그의 인자하심을 바라는 자들을 살피사.\n(시편 33:18)` },
        { id:78, category:"wisdom", title:"지혜", order:1, text:`너희 중에 누구든지 지혜가 부족하거든 모든 사람에게 후히 주시고 꾸짖지 아니하시는 하나님께 구하라 그리하면 주시리라.\n(야고보서 1:5)` },
        { id:79, category:"wisdom", title:"지혜", order:2, text:`여호와를 경외하는 것이 지혜의 근본이요 거룩하신 자를 아는 것이 명철이니라.\n(잠언 9:10)` },
        { id:80, category:"wisdom", title:"지혜", order:3, text:`대저 여호와는 지혜를 주시며 지식과 명철을 그 입에서 내심이며.\n(잠언 2:6)` },
        { id:81, category:"wisdom", title:"지혜", order:4, text:`너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라.\n(잠언 3:6)` },
        { id:82, category:"wisdom", title:"지혜", order:5, text:`지혜로운 자는 강하고 지식 있는 자는 힘을 더하나니.\n(잠언 24:5)` },
        { id:83, category:"wisdom", title:"지혜", order:6, text:`지혜가 제일이니 지혜를 얻으라 네가 얻은 모든 것을 가지고 명철을 얻을지니라.\n(잠언 4:7)` },
        { id:84, category:"wisdom", title:"지혜", order:7, text:`너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라.\n(잠언 3:5)` },
        { id:92, category:"holiness", title:"거룩", order:1, text:`오직 너희를 부르신 거룩한 이처럼 너희도 모든 행실에 거룩한 자가 되라.\n(베드로전서 1:15)` },
        { id:93, category:"holiness", title:"거룩", order:2, text:`기록되었으되 내가 거룩하니 너희도 거룩할지어다 하셨느니라.\n(베드로전서 1:16)` },
        { id:94, category:"holiness", title:"거룩", order:3, text:`하나님의 뜻은 이것이니 너희의 거룩함이라 곧 음란을 버리고.\n(데살로니가전서 4:3)` },
        { id:95, category:"holiness", title:"거룩", order:4, text:`모든 사람과 더불어 화평함과 거룩함을 따르라 이것이 없이는 아무도 주를 보지 못하리라.\n(히브리서 12:14)` },
        { id:96, category:"holiness", title:"거룩", order:5, text:`너희 몸은 너희가 하나님께로부터 받은 바 너희 가운데 계신 성령의 전인 줄을 알지 못하느냐 너희는 너희 자신의 것이 아니라.\n(고린도전서 6:19)` },
        { id:97, category:"holiness", title:"거룩", order:6, text:`하나님이 우리를 부르심은 부정하게 하심이 아니요 거룩하게 하심이니.\n(데살로니가전서 4:7)` },
        { id:98, category:"holiness", title:"거룩", order:7, text:`평강의 하나님이 친히 너희를 온전히 거룩하게 하시고 또 너희의 온 영과 혼과 몸이 우리 주 예수 그리스도께서 강림하실 때에 흠 없게 보전되기를 원하노라.\n(데살로니가전서 5:23)` },
        { id:99, category:"sin", title:"죄", order:1, text:`모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니.\n(로마서 3:23)` },
        { id:100, category:"sin", title:"죄", order:2, text:`죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라.\n(로마서 6:23)` },
        { id:101, category:"sin", title:"죄", order:3, text:`만일 우리가 죄가 없다고 말하면 스스로 속이고 또 진리가 우리 속에 있지 아니할 것이요.\n(요한일서 1:8)` },
        { id:102, category:"sin", title:"죄", order:4, text:`무릇 죄를 짓는 자마다 불법을 행하나니 죄는 불법이라.\n(요한일서 3:4)` },
        { id:103, category:"sin", title:"죄", order:5, text:`선을 행할 줄 알고도 행하지 아니하는 자에게는 죄니라.\n(야고보서 4:17)` },
        { id:104, category:"sin", title:"죄", order:6, text:`만일 우리가 우리 죄를 자백하면 그는 미쁘시고 의로우사 우리 죄를 사하시며 우리를 모든 불의에서 깨끗하게 하실 것이요.\n(요한일서 1:9)` },
        { id:105, category:"sin", title:"죄", order:7, text:`여호와의 눈은 어디서든지 악인과 선인을 감찰하시느니라.\n(잠언 15:3)` },
        { id:106, category:"judgment", title:"심판", order:1, text:`한 번 죽는 것은 사람에게 정해진 것이요 그 후에는 심판이 있으리니.\n(히브리서 9:27)` },
        { id:107, category:"judgment", title:"심판", order:2, text:`우리 각 사람이 자기 일을 하나님께 직고하리라.\n(로마서 14:12)` },
        { id:108, category:"judgment", title:"심판", order:3, text:`이는 하나님이 정하신 사람으로 하여금 천하를 공의로 심판할 날을 작정하시고 이에 그를 죽은 자 가운데서 다시 살리신 것으로 모든 사람에게 믿을 만한 증거를 주셨음이니라.\n(사도행전 17:31)` },
        { id:109, category:"judgment", title:"심판", order:4, text:`인자가 아버지의 영광으로 그 천사들과 함께 오리니 그 때에 각 사람이 행한 대로 갚으리라.\n(마태복음 16:27)` },
        { id:110, category:"judgment", title:"심판", order:5, text:`또 내가 크고 흰 보좌와 그 위에 앉으신 이를 보니 땅과 하늘이 그 앞에서 피하여 간 데 없더라.\n(요한계시록 20:11)` },
        { id:111, category:"judgment", title:"심판", order:6, text:`또 내가 보니 죽은 자들이 큰 자나 작은 자나 그 보좌 앞에 서 있는데 책들이 펴 있고 또 다른 책이 펴졌으니 곧 생명책이라 죽은 자들이 자기 행위를 따라 책들에 기록된 대로 심판을 받으니.\n(요한계시록 20:12)` },
        { id:112, category:"judgment", title:"심판", order:7, text:`사망과 음부도 불못에 던져지니 이것은 둘째 사망 곧 불못이라.\n(요한계시록 20:14)` },
        { id:113, category:"hell", title:"지옥", order:1, text:`만일 네 손이 너를 범죄하게 하거든 찍어 버리라 장애인으로 영생에 들어가는 것이 두 손을 가지고 지옥 곧 꺼지지 않는 불에 들어가는 것보다 나으니라.\n(마가복음 9:43)` },
        { id:114, category:"hell", title:"지옥", order:2, text:`거기는 구더기도 죽지 않고 불도 꺼지지 아니하느니라.\n(마가복음 9:48)` },
        { id:115, category:"hell", title:"지옥", order:3, text:`몸은 죽여도 영혼은 능히 죽이지 못하는 자들을 두려워하지 말고 오직 몸과 영혼을 능히 지옥에 멸하실 수 있는 이를 두려워하라.\n(마태복음 10:28)` },
        { id:116, category:"hell", title:"지옥", order:4, text:`누구든지 '미련한 놈'이라 하는 자는 지옥 불에 들어가게 되리라.\n(마태복음 5:22)` },
        { id:117, category:"hell", title:"지옥", order:5, text:`또 사망과 음부도 불못에 던져지니 이것은 둘째 사망 곧 불못이라.\n(요한계시록 20:14)` },
        { id:118, category:"hell", title:"지옥", order:6, text:`누구든지 생명책에 기록되지 못한 자는 불못에 던져지더라.\n(요한계시록 20:15)` },
        { id:119, category:"hell", title:"지옥", order:7, text:`그들은 영원한 형벌에, 의인들은 영생에 들어가리라 하시니라.\n(마태복음 25:46)` },
        { id:120, category:"warning", title:"경고", order:1, text:`좁은 문으로 들어가라 멸망으로 인도하는 문은 크고 그 길이 넓어 그리로 들어가는 자가 많고.\n(마태복음 7:13)` },
        { id:121, category:"warning", title:"경고", order:2, text:`생명으로 인도하는 문은 좁고 길이 협착하여 찾는 자가 적음이라.\n(마태복음 7:14)` },
        { id:122, category:"warning", title:"경고", order:3, text:`너희는 스스로 조심하라 그렇지 않으면 방탕함과 술취함과 생활의 염려로 마음이 둔하여지고 뜻밖에 그 날이 덫과 같이 너희에게 임하리라.\n(누가복음 21:34)` },
        { id:123, category:"warning", title:"경고", order:4, text:`선 줄로 생각하는 자는 넘어질까 조심하라.\n(고린도전서 10:12)` },
        { id:124, category:"warning", title:"경고", order:5, text:`깨어 있으라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니.\n(베드로전서 5:8)` },
        { id:125, category:"warning", title:"경고", order:6, text:`너희는 세상의 소금이니 소금이 만일 그 맛을 잃으면 무엇으로 짜게 하리요 후에는 아무 쓸 데 없어 다만 밖에 버려져 사람에게 밟힐 뿐이니라.\n(마태복음 5:13)` },
        { id:126, category:"warning", title:"경고", order:7, text:`그러므로 깨어 있으라 어느 날에 너희 주가 임할는지 너희가 알지 못함이니라.\n(마태복음 24:42)` },
        { id:127, category:"secondcoming", title:"재림", order:1, text:`그 때에 인자의 징조가 하늘에서 보이겠고 그 때에 땅의 모든 족속들이 통곡하며 그들이 인자가 구름을 타고 능력과 큰 영광으로 오는 것을 보리라.\n(마태복음 24:30)` },
        { id:128, category:"secondcoming", title:"재림", order:2, text:`그러므로 깨어 있으라 어느 날에 너희 주가 임할는지 너희가 알지 못함이니라.\n(마태복음 24:42)` },
        { id:129, category:"secondcoming", title:"재림", order:3, text:`이르되 갈릴리 사람들아 어찌하여 서서 하늘을 쳐다보느냐 너희 가운데서 하늘로 올려지신 이 예수는 하늘로 가심을 본 그대로 오시리라 하였느니라.\n(사도행전 1:11)` },
        { id:130, category:"secondcoming", title:"재림", order:4, text:`주께서 호령과 천사장의 소리와 하나님의 나팔 소리로 친히 하늘로부터 강림하시리니 그리스도 안에서 죽은 자들이 먼저 일어나고.\n(데살로니가전서 4:16)` },
        { id:131, category:"secondcoming", title:"재림", order:5, text:`그 후에 우리 살아 남은 자들도 그들과 함께 구름 속으로 끌어 올려 공중에서 주를 영접하게 하시리니 그리하여 우리가 항상 주와 함께 있으리라.\n(데살로니가전서 4:17)` },
        { id:132, category:"secondcoming", title:"재림", order:6, text:`볼지어다 내가 속히 오리니 내가 줄 상이 내게 있어 각 사람에게 그가 행한 대로 갚아 주리라.\n(요한계시록 22:12)` },
        { id:133, category:"secondcoming", title:"재림", order:7, text:`이것들을 증언하신 이가 이르시되 내가 진실로 속히 오리라 하시거늘 아멘 주 예수여 오시옵소서.\n(요한계시록 22:20)` },
        { id:134, category:"devil", title:"마귀", order:1, text:`근신하라 깨어라 너희 대적 마귀가 우는 사자 같이 두루 다니며 삼킬 자를 찾나니.\n(베드로전서 5:8)` },
        { id:135, category:"devil", title:"마귀", order:2, text:`마귀를 대적하라 그리하면 너희를 피하리라.\n(야고보서 4:7)` },
        { id:136, category:"devil", title:"마귀", order:3, text:`도둑이 오는 것은 도둑질하고 죽이고 멸망시키려는 것뿐이요 내가 온 것은 양으로 생명을 얻게 하고 더 풍성히 얻게 하려는 것이라.\n(요한복음 10:10)` },
        { id:137, category:"devil", title:"마귀", order:4, text:`이는 하나님의 아들이 나타나신 것은 마귀의 일을 멸하려 하심이라.\n(요한일서 3:8)` },
        { id:138, category:"devil", title:"마귀", order:5, text:`마귀에게 틈을 주지 말라.\n(에베소서 4:27)` },
        { id:139, category:"devil", title:"마귀", order:6, text:`우리의 씨름은 혈과 육을 상대하는 것이 아니요 통치자들과 권세들과 이 어둠의 세상 주관자들과 하늘에 있는 악의 영들을 상대함이라.\n(에베소서 6:12)` },
        { id:140, category:"devil", title:"마귀", order:7, text:`평강의 하나님께서 속히 사탄을 너희 발 아래에서 상하게 하시리라 우리 주 예수의 은혜가 너희에게 있을지어다.\n(로마서 16:20)` },
        { id:141, category:"temptation", title:"시험", order:1, text:`사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당하지 못할 시험 당함을 허락하지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라.\n(고린도전서 10:13)` },
        { id:142, category:"temptation", title:"시험", order:2, text:`내 형제들아 너희가 여러 가지 시험을 당하거든 온전히 기쁘게 여기라 이는 너희 믿음의 시련이 인내를 만들어 내는 줄 너희가 앎이라.\n(야고보서 1:2-3)` },
        { id:143, category:"temptation", title:"시험", order:3, text:`여호와를 의뢰하는 자는 시온 산이 흔들리지 아니하고 영원히 있음 같도다.\n(시편 125:1)` },
        { id:144, category:"temptation", title:"시험", order:4, text:`여호와께서 이르시되 네가 물 가운데로 지날 때에 내가 너와 함께 할 것이라 강을 건널 때에 물이 너를 침몰하지 못할 것이며 네가 불 가운데로 지날 때에 타지도 아니할 것이요 불꽃이 너를 사르지도 못하리니.\n(이사야 43:2)` },
        { id:145, category:"temptation", title:"시험", order:5, text:`시험에 들지 않게 깨어 기도하라 마음에는 원이로되 육신이 약하도다 하시고.\n(마태복음 26:41)` },
        { id:146, category:"temptation", title:"시험", order:6, text:`주께서 경건한 자는 시험에서 건지실 줄 아시고 불의한 자는 형벌 아래에 두어 심판 날까지 지키시며.\n(베드로후서 2:9)` },
        { id:147, category:"temptation", title:"시험", order:7, text:`사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당하지 못할 시험 당함을 허락하지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라.\n(고린도전서 10:13)` },
        { id:148, category:"fear", title:"두려움", order:1, text:`두려워하지 말라 내가 너와 함께 함이라 놀라지 말라 나는 네 하나님이 됨이라 내가 너를 굳세게 하리라 참으로 너를 도와 주리라 참으로 나의 의로운 오른손으로 너를 붙들리라.\n(이사야 41:10)` },
        { id:149, category:"fear", title:"두려움", order:2, text:`내가 여호와께 간구하매 내게 응답하시고 내 모든 두려움에서 나를 건지셨도다.\n(시편 34:4)` },
        { id:150, category:"fear", title:"두려움", order:3, text:`내가 두려워하는 날에는 내가 주를 의지하리이다.\n(시편 56:3)` },
        { id:151, category:"fear", title:"두려움", order:4, text:`평안을 너희에게 끼치노니 곧 나의 평안을 너희에게 주노라 내가 너희에게 주는 것은 세상이 주는 것과 같지 아니하니라 너희는 마음에 근심하지도 말고 두려워하지도 말라.\n(요한복음 14:27)` },
        { id:152, category:"fear", title:"두려움", order:5, text:`하나님이 우리에게 주신 것은 두려워하는 마음이 아니요 오직 능력과 사랑과 절제하는 마음이니.\n(디모데후서 1:7)` },
        { id:153, category:"fear", title:"두려움", order:6, text:`주께서 내 곁에 서서 나에게 힘을 주심은 나로 말미암아 선포된 말씀이 온전히 전파되어 모든 이방인이 듣게 하려 하심이니 내가 사자의 입에서 건짐을 받았느니라.\n(디모데후서 4:17)` },
        { id:154, category:"fear", title:"두려움", order:7, text:`내가 사망의 음침한 골짜기로 다닐지라도 해를 두려워하지 않을 것은 주께서 나와 함께 하심이라 주의 지팡이와 막대기가 나를 안위하시나이다.\n(시편 23:4)` },
        { id:155, category:"worry", title:"염려", order:1, text:`너희는 아무 것도 염려하지 말고 다만 모든 일에 기도와 간구로, 너희 구할 것을 감사함으로 하나님께 아뢰라. 그리하면 모든 지각에 뛰어난 하나님의 평강이 그리스도 예수 안에서 너희 마음과 생각을 지키시리라.\n(빌립보서 4:6-7)` },
        { id:156, category:"worry", title:"염려", order:2, text:`너희 염려를 다 주께 맡기라 이는 그가 너희를 돌보심이라.\n(베드로전서 5:7)` },
        { id:157, category:"worry", title:"염려", order:3, text:`그러므로 내가 너희에게 이르노니 목숨을 위하여 무엇을 먹을까 무엇을 마실까 몸을 위하여 무엇을 입을까 염려하지 말라 목숨이 음식보다 중하지 아니하며 몸이 의복보다 중하지 아니하냐.\n(마태복음 6:25)` },
        { id:158, category:"worry", title:"염려", order:4, text:`공중의 새를 보라 심지도 않고 거두지도 않고 창고에 모아들이지도 아니하되 너희 하늘 아버지께서 기르시나니 너희는 이것들보다 귀하지 아니하냐.\n(마태복음 6:26)` },
        { id:159, category:"worry", title:"염려", order:5, text:`너는 마음을 다하여 여호와를 신뢰하고 네 명철을 의지하지 말라 너는 범사에 그를 인정하라 그리하면 네 길을 지도하시리라.\n(잠언 3:5-6)` },
        { id:160, category:"worry", title:"염려", order:6, text:`너의 짐을 여호와께 맡기라 그가 너를 붙드시고 의인의 요동함을 영원히 허락하지 아니하시리로다.\n(시편 55:22)` },
        { id:161, category:"worry", title:"염려", order:7, text:`두려워하지 말며 놀라지 말라 내가 너를 구속하였고 내가 너를 지명하여 불렀나니 너는 내 것이라.\n(이사야 43:1)` },
        { id:162, category: "wealth", title: "재물", order: 1, text: `네 재물과 네 소산물의 처음 익은 열매로 여호와를 공경하라 그리하면 네 창고가 가득히 차고 네 포도즙 틀에 새 포도즙이 넘치리라.\n(잠언 3:9-10)` },
        { id:163, category: "wealth", title: "재물", order: 2, text: `정함이 없는 재물에 소망을 두지 말고 오직 우리에게 모든 것을 후히 주사 누리게 하시는 하나님께 두며 선을 행하고 선한 사업을 많이 하고 나누어 주기를 좋아하며 너그러운 자가 되게 하라.\n(디모데전서 6:17-18)` },
        { id:164, category: "wealth", title: "재물", order: 3, text: `부하려 하는 자들은 시험과 올무와 여러 가지 어리석고 해로운 욕심에 떨어지나니 곧 사람으로 파멸과 멸망에 빠지게 하는 것이라 돈을 사랑함이 일만 악의 뿌리가 되나니 이것을 탐내는 자들은 미혹을 받아 믿음에서 떠나 많은 근심으로써 자기를 찔렀도다.\n(디모데전서 6:9-10)` },
        { id:165, category: "wealth", title: "재물", order: 4, text: `너희를 위하여 보물을 땅에 쌓아 두지 말라 거기는 좀과 동록이 해하며 도둑이 구멍을 뚫고 도둑질하느니라 오직 너희를 위하여 보물을 하늘에 쌓아 두라 거기는 좀이나 동록이 해하지 못하며 도둑이 구멍을 뚫지도 못하고 도둑질도 못하느니라 네 보물 있는 그 곳에는 네 마음도 있느니라.\n(마태복음 6:19-21)` },
        { id:166, category: "wealth", title: "재물", order: 5, text: `한 사람이 두 주인을 섬기지 못할 것이니 혹 이를 미워하고 저를 사랑하거나 혹 이를 중히 여기고 저를 경히 여김이라 너희가 하나님과 재물을 겸하여 섬기지 못하느니라.\n(마태복음 6:24)` },
        { id:167, category: "wealth", title: "재물", order: 6, text: `삼가 모든 탐심을 물리치라 사람의 생명이 그 소유의 넉넉한 데 있지 아니하니라 하시고 ... 자기를 위하여 재물을 쌓아 두고 하나님께 대하여 부요하지 못한 자가 이와 같으니라.\n(누가복음 12:15-21)` },
        { id:168, category: "wealth", title: "재물", order: 7, text: `혹은 부한 체하여도 아무 것도 없는 자가 있고 스스로 가난한 체하여도 재물이 많은 자가 있느니라.\n(잠언 13:7)` },
        { id:169, category: "pride", title: "교만", order: 1, text: `교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라.\n(잠언 16:18)` },
        { id:170, category: "pride", title: "교만", order: 2, text: `사람의 마음의 교만은 멸망의 선봉이요 겸손은 존귀의 길잡이니라.\n(잠언 18:12)` },
        { id:171, category: "pride", title: "교만", order: 3, text: `여호와를 경외하는 것은 악을 미워하는 것이라 나는 교만과 거만과 악한 행실과 패역한 입을 미워하느니라.\n(잠언 8:13)` },
        { id:172, category: "pride", title: "교만", order: 4, text: `그러나 네가 마음에 이르기를 내가 하늘에 올라 하나님의 뭇 별 위에 내 자리를 높이리라 ... 그러나 이제 네가 스올 곧 구덩이 맨 밑에 떨어짐을 당하리로다.\n(이사야 14:13-15)` },
        { id:173, category: "pride", title: "교만", order: 5, text: `그러나 더욱 큰 은혜를 주시나니 그러므로 일렀으되 하나님이 교만한 자를 물리치시고 겸손한 자에게 은혜를 주신다 하였느니라.\n(야고보서 4:6)` },
        { id:174, category: "pride", title: "교만", order: 6, text: `젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라.\n(베드로전서 5:5-6)` },
        { id:175, category: "pride", title: "교만", order: 7, text: `누구든지 자기를 높이는 자는 낮아지고 누구든지 자기를 낮추는 자는 높아지리라.\n(마태복음 23:12)` },
        { id:176, category: "idolatry", title: "우상", order: 1, text: `너는 나 외에는 다른 신들을 네게 두지 말라 너를 위하여 새긴 우상을 만들지 말고 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅 아래 물 속에 있는 것의 어떤 형상도 만들지 말며 그것들에게 절하지 말며 그것들을 섬기지 말라.\n(출애굽기 20:3-5)` },
        { id:177, category: "idolatry", title: "우상", order: 2, text: `그들의 우상들은 은과 금이요 사람이 손으로 만든 것이라 입이 있어도 말하지 못하며 눈이 있어도 보지 못하며 ... 우상들을 만드는 자들과 그것을 의지하는 자들이 다 그와 같으리로다.\n(시편 115:4-8)` },
        { id:178, category: "idolatry", title: "우상", order: 3, text: `자녀들아 너희 자신을 지켜 우상에게서 멀리하라.\n(요한일서 5:21)` },
        { id:179, category: "idolatry", title: "우상", order: 4, text: `그런즉 내 사랑하는 자들아 우상 숭배하는 일을 피하라.\n(고린도전서 10:14)` },
        { id:180, category: "idolatry", title: "우상", order: 5, text: `너희도 정녕 이것을 알거니와 음행하는 자나 더러운 자나 탐하는 자 곧 우상 숭배자는 다 그리스도와 하나님의 나라에서 기업을 얻지 못하리니.\n(에베소서 5:5)` },
        { id:181, category: "idolatry", title: "우상", order: 6, text: `너희가 어떻게 우상을 버리고 하나님께로 돌아와서 살아 계시고 참되신 하나님을 섬기는지와 ... 이는 장래의 노하심에서 우리를 건지시는 예수시니라.\n(데살로니가전서 1:9-10)` },
        { id:182, category: "idolatry", title: "우상", order: 7, text: `망령되고 허탄한 신화를 버리고 경건에 이르도록 네 자신을 연단하라.\n(디모데전서 4:7)` },
        { id:183, category: "forgiveness", title: "용서", order: 1, text: `동이 서에서 먼 것 같이 우리의 죄과를 우리에게서 멀리 옮기셨으며 아버지가 자식을 긍휼히 여김 같이 여호와께서는 자기를 경외하는 자를 긍휼히 여기시나니.\n(시편 103:12-13)` },
        { id:184, category: "forgiveness", title: "용서", order: 2, text: `여호와께서 말씀하시되 오라 우리가 서로 변론하자 너희의 죄가 주홍 같을지라 눈과 같이 희어질 것이요 진홍 같이 붉을지라 양털 같이 희게 되리라.\n(이사야 1:18)` },
        { id:185, category: "forgiveness", title: "용서", order: 3, text: `주와 같은 신이 어디 있으리이까 ... 다시 우리를 불쌍히 여겨서 우리의 죄악을 발로 밟으시고 우리의 모든 죄를 깊은 바다에 던지시리이다.\n(미가 7:18-19)` },
        { id:186, category: "forgiveness", title: "용서", order: 4, text: `서로 친절하게 하며 불쌍히 여겨서 서로 용서하기를 하나님이 그리스도 안에서 너희를 용서하심과 같이 하라.\n(에베소서 4:32)` },
        { id:187, category: "forgiveness", title: "용서", order: 5, text: `누가 누구에게 불만이 있거든 서로 용납하여 피차 용서하되 주께서 너희를 용서하신 것 같이 너희도 그리하고 이 모든 것 위에 사랑을 더하라 이는 온전하게 매는 띠니라.\n(골로새서 3:13-14)` },
        { id:188, category: "forgiveness", title: "용서", order: 6, text: `그 때에 베드로가 나아와 이르되 주여 형제가 내게 죄를 범하면 몇 번이나 용서하여 주리이까 일곱 번까지 하오리이까 예수께서 이르시되 네게 이르노니 일곱 번뿐 아니라 일곱 번을 일흔 번까지라도 할지니라.\n(마태복음 18:21-22)` },
        { id:189, category: "forgiveness", title: "용서", order: 7, text: `너희가 사람의 잘못을 용서하면 너희 하늘 아버지께서도 너희 잘못을 용서하시려니와 너희가 사람의 잘못을 용서하지 아니하면 너희 아버지께서도 너희 잘못을 용서하지 아니하시리라.\n(마태복음 6:14-15)` },
        { id:190, category: "perseverance", title: "인내", order: 1, text: `너는 여호와를 기다릴지어다 강하고 담대하며 여호와를 기다릴지어다.\n(시편 27:14)` },
        { id:191, category: "perseverance", title: "인내", order: 2, text: `여호와의 구원을 바라고 잠잠히 기다림이 좋도다 사람이 젊었을 때에 멍에를 메는 것이 좋으니.\n(예레미야애가 3:26-27)` },
        { id:192, category: "perseverance", title: "인내", order: 3, text: `내 형제들아 너희가 여러 가지 시험을 당하거든 온전히 기쁘게 여기라 이는 너희 믿음의 시련이 인내를 만들어 내는 줄 너희가 앎이라 인내를 온전히 이루라.\n(야고보서 1:2-4)` },
        { id:193, category: "perseverance", title: "인내", order: 4, text: `다만 이뿐 아니라 우리가 환난 중에도 즐거워하나니 이는 환난은 인내를, 인내는 연단을, 연단은 소망을 이루는 줄 앎이로다.\n(로마서 5:3-4)` },
        { id:194, category: "perseverance", title: "인내", order: 5, text: `너희에게 인내가 필요함은 너희가 하나님의 뜻을 행한 후에 약속하신 것을 받기 위함이라.\n(히브리서 10:36)` },
        { id:195, category: "perseverance", title: "인내", order: 6, text: `우리가 선을 행하되 낙심하지 말지니 포기하지 아니하면 때가 이르매 거두리라.\n(갈라디아서 6:9)` },
        { id:196, category: "perseverance", title: "인내", order: 7, text: `보라 인내하는 자를 우리가 복되다 하나니 너희가 욥의 인내를 들었고 주께서 주신 결말을 보았거니와 주는 가장 자비하시고 긍휼히 여기시는 이시니라.\n(야고보서 5:11)` },
        { id:197, category: "suffering", title: "고난", order: 1, text: `그러나 내가 가는 길을 그가 아시나니 그가 나를 단련하신 후에는 내가 순금 같이 되어 나오리라.\n(욥기 23:10)` },
        { id:198, category: "suffering", title: "고난", order: 2, text: `고난 당한 것이 내게 유익이라 이로 말미암아 내가 주의 율례들을 배우게 되었나이다.\n(시편 119:71)` },
        { id:199, category: "suffering", title: "고난", order: 3, text: `사람이 감당할 시험 밖에는 너희가 당한 것이 없나니 오직 하나님은 미쁘사 너희가 감당하지 못할 시험 당함을 허락하지 아니하시고 시험 당할 즈음에 또한 피할 길을 내사 너희로 능히 감당하게 하시느니라.\n(고린도전서 10:13)` },
        { id:200, category: "suffering", title: "고난", order: 4, text: `생각하건대 현재의 고난은 장차 우리에게 나타날 영광과 비교할 수 없도다.\n(로마서 8:18)` },
        { id:201, category: "suffering", title: "고난", order: 5, text: `우리가 알거니와 하나님을 사랑하는 자 곧 그의 뜻대로 부르심을 입은 자들에게는 모든 것이 합력하여 선을 이루느니라.\n(로마서 8:28)` },
        { id:202, category: "suffering", title: "고난", order: 6, text: `사랑하는 자들아 너희를 연단하려고 오는 불 시험을 이상한 일 당하는 것 같이 이상히 여기지 말고 오히려 너희가 그리스도의 고난에 참여하는 것으로 즐거워하라.\n(베드로전서 4:12-13)` },
        { id:203, category: "suffering", title: "고난", order: 7, text: `그는 멸시를 받아 사람들에게 버림 받았으며 간고를 많이 겪었으며 질고를 아는 자라 ... 그는 징벌을 받아 하나님께 맞으며 고난을 당한다 하였노라.\n(이사야 53:3-4)` },
        { id:204, category: "persecution", title: "핍박", order: 1, text: `의를 위하여 박해를 받은 자는 복이 있나니 천국이 그들의 것임이라 나로 말미암아 너희를 욕하고 박해하고 거짓으로 너희를 거슬러 모든 악한 말을 할 때에는 너희에게 복이 있나니 기뻐하고 즐거워하라.\n(마태복음 5:10-12)` },
        { id:205, category: "persecution", title: "핍박", order: 2, text: `세상이 너희를 미워하면 너희보다 먼저 나를 미워한 줄을 알라 너희가 세상에 속하였으면 세상이 자기의 것을 사랑할 것이나 너희는 세상에 속한 자가 아니요 도리어 내가 너희를 세상에서 택하였기 때문에 세상이 너희를 미워하느니라.\n(요한복음 15:18-19)` },
        { id:206, category: "persecution", title: "핍박", order: 3, text: `의인이 외치매 여호와께서 들으시고 그들의 모든 환난에서 건지셨도다 여호와는 마음이 상한 자를 가까이 하시고 충심으로 통회하는 자를 구원하시는도다 의인은 고난이 많으나 여호와께서 그의 모든 고난에서 건지시는도다.\n(시편 34:17-19)` },
        { id:207, category: "persecution", title: "핍박", order: 4, text: `무릇 그리스도 예수 안에서 경건하게 살고자 하는 자는 박해를 받으리라.\n(디모데후서 3:12)` },
        { id:208, category: "persecution", title: "핍박", order: 5, text: `누가 우리를 그리스도의 사랑에서 끊으리요 환난이나 곤고나 박해나 기근이나 적신이나 위험이나 칼이랴 ... 그러나 이 모든 일에 우리를 사랑하시는 이로 말미암아 우리가 넉넉히 이기느니라.\n(로마서 8:35-37)` },
        { id:209, category: "persecution", title: "핍박", order: 6, text: `너희를 박해하는 자를 축복하라 축복하고 저주하지 말라.\n(로마서 12:14)` },
        { id:210, category: "persecution", title: "핍박", order: 7, text: `그들이 우리를 치려고 높은 벽을 쌓으며 우리를 박해할지라도 주께서 내 영혼을 아시고 환난 중에서 건지시리니 내가 여호와를 의지하고 두려워하지 아니하리로다.\n(시편 56:11)` },
        { id:211, category: "deception", title: "미혹", order: 1, text: `예수께서 대답하여 이르시되 너희가 사람의 미혹을 받지 않도록 주의하라 많은 사람이 내 이름으로 와서 이르되 내가 그리스도라 하여 많은 사람을 미혹하리라.\n(마태복음 24:4-5)` },
        { id:212, category: "deception", title: "미혹", order: 2, text: `거짓 그리스도들과 거짓 선지자들이 일어나서 이적과 기사를 행하여 할 수만 있으면 택하신 백성을 미혹하려 하리라 너희는 삼가라 내가 모든 일을 너희에게 미리 말하였노라.\n(마태복음 13:22-23)` },
        { id:213, category: "deception", title: "미혹", order: 3, text: `만물보다 거짓되고 심히 부패한 것은 마음이라 누가 능히 이를 알리요마는 나 여호와는 심장을 살피며 폐부를 시험하고 각각 그의 행위와 그의 행실대로 보응하나니.\n(예레미야 17:9-10)` },
        { id:214, category: "deception", title: "미혹", order: 4, text: `악한 자의 나타남은 사탄의 활동을 따라 모든 능력과 표적과 거짓 기적과 불의의 모든 속임으로 멸망하는 자들에게 있으리니 이는 그들이 진리의 사랑을 받지 아니하여 구원함을 받지 못함이라.\n(데살로니가후서 2:9-10)` },
        { id:215, category: "deception", title: "미혹", order: 5, text: `사랑하는 자들아 영을 다 믿지 말고 오직 영들이 하나님께 속하였나 분별하라 많은 거짓 선지자가 세상에 나왔음이라.\n(요한일서 4:1)` },
        { id:216, category: "deception", title: "미혹", order: 6, text: `도가니는 은을, 풀무는 금을 연단하거니와 여호와는 마음을 연단하시느니라 악을 행하는 자는 사악한 입술이 하는 말을 잘 듣고 거짓말을 하는 자는 악한 혀가 하는 말에 귀를 기울이느니라.\n(잠언 17:3-4)` },
        { id:217, category: "deception", title: "미혹", order: 7, text: `너희는 이 세대를 본받지 말고 오직 마음을 새롭게 함으로 변화를 받아 하나님의 선하시고 기뻐하시고 온전하신 뜻이 무엇인지 분별하도록 하라.\n(로마서 12:2)` },
        { id:218, category: "grace", title: "은혜", order: 1, text: `너희는 그 은혜에 의하여 믿음으로 말미암아 구원을 받았으니 이것은 너희에게서 난 것이 아니요 하나님의 선물이라 행위에서 난 것이 아니니 이는 누구든지 자랑하지 못하게 함이라.\n(에베소서 2:8-9)` },
        { id:219, category: "grace", title: "은혜", order: 2, text: `모든 사람이 죄를 범하였으매 하나님의 영광에 이르지 못하더니 그리스도 예수 안에 있는 속량으로 말미암아 하나님의 은혜로 값 없이 의롭다 하심을 얻은 자 되었느니라.\n(로마서 3:23-24)` },
        { id:220, category: "grace", title: "은혜", order: 3, text: `여호와는 자비로우시며 은혜로우시며 노하기를 더디 하시고 인자하심이 풍부하시도다 자주 책망하지 아니하시며 노를 영원히 품지 아니하시리로다.\n(시편 103:8-9)` },
        { id:221, category: "grace", title: "은혜", order: 4, text: `그러므로 우리는 긍휼하심을 받고 때를 따라 돕는 은혜를 얻기 위하여 은혜의 보좌 앞에 담대히 나아갈 것이니라.\n(히브리서 4:16)` },
        { id:222, category: "grace", title: "은혜", order: 5, text: `나에게 이르시기를 내 은혜가 네게 족하도다 이는 내 능력이 약한 데서 온전하여짐이라 하신지라 그러므로 도리어 크게 기뻐함으로 나의 여러 약한 것들에 대하여 자랑하리니 이는 그리스도의 능력이 내게 머물게 하려 함이라.\n(고린도후서 12:9)` },
        { id:223, category: "grace", title: "은혜", order: 6, text: `그러나 노아는 여호와께 은혜를 입었더라.\n(창세기 6:8)` },
        { id:224, category: "grace", title: "은혜", order: 7, text: `그러나 내가 나 된 것은 하나님의 은혜로 된 것이니 내게 주신 그의 은혜가 헛되지 아니하여 내가 모든 사도보다 더 많이 수고하였으나 내가 한 것이 아니요 오직 나와 함께 하신 하나님의 은혜로라.\n(고린도전서 15:10)` },
        { id:225, category: "cross", title: "십자가", order: 1, text: `십자가의 도가 멸망하는 자들에게는 미련한 것이요 구원을 받는 우리에게는 하나님의 능력이라.\n(고린도전서 1:18)` },
        { id:226, category: "cross", title: "십자가", order: 2, text: `그가 찔림은 우리의 허물 때문이요 그가 상함은 우리의 죄악 때문이라 그가 징계를 받으므로 우리는 평화를 누리고 그가 채찍에 맞으므로 우리는 나음을 받았도다.\n(이사야 53:5-6)` },
        { id:227, category: "cross", title: "십자가", order: 3, text: `내가 그리스도와 함께 십자가에 못 박혔나니 그런즉 이제는 내가 사는 것이 아니요 오직 내 안에 그리스도께서 사시는 것이라.\n(갈라디아서 2:20)` },
        { id:228, category: "cross", title: "십자가", order: 4, text: `그러나 내게는 우리 주 예수 그리스도의 십자가 외에 결코 자랑할 것이 없으니 그리스도로 말미암아 세상이 나를 대하여 십자가에 못 박히고 내가 또한 세상을 대하여 그러하니라.\n(갈라디아서 6:14)` },
        { id:229, category: "cross", title: "십자가", order: 5, text: `모세가 광야에서 뱀을 든 것 같이 인자도 들려야 하리니 이는 그를 믿는 자마다 영생을 얻게 하려 하심이니라.\n(요한복음 3:14-15)` },
        { id:230, category: "cross", title: "십자가", order: 6, text: `또 무리에게 이르시되 아무든지 나를 따라오려거든 자기를 부인하고 날마다 제 십자가를 지고 나를 따를 것이니라.\n(누가복음 9:23)` },
        { id:231, category: "cross", title: "십자가", order: 7, text: `인자가 자기 목숨을 많은 사람의 대속물로 주려 함이니라.\n(마가복음 10:45)` },
        { id:232, category: "resurrection", title: "부활", order: 1, text: `예수께서 이르시되 나는 부활이요 생명이니 나를 믿는 자는 죽어도 살겠고 무릇 살아서 나를 믿는 자는 영원히 죽지 아니하리니 이것을 네가 믿느냐.\n(요한복음 11:25-26)` },
        { id:233, category: "resurrection", title: "부활", order: 2, text: `이는 주께서 내 영혼을 스올에 버리지 아니하시며 주의 거룩한 자를 멸망시키지 않으실 것임이니라 주께서 생명의 길을 내게 보이시리니 주의 앞에는 충만한 기쁨이 있고 주의 오른쪽에는 영원한 즐거움이 있나이다.\n(시편 16:10-11)` },
        { id:234, category: "resurrection", title: "부활", order: 3, text: `그러나 이제 그리스도께서 죽은 자 가운데서 다시 살아나사 잠자는 자들의 첫 열매가 되셨도다 사망이 한 사람으로 말미암았으니 죽은 자의 부활도 한 사람으로 말미암는도다.\n(고린도전서 15:20-21)` },
        { id:235, category: "resurrection", title: "부활", order: 4, text: `우리 주 예수 그리스도의 아버지 하나님을 찬송하리로다 그의 많으신 긍휼대로 예수 그리스도를 죽은 자 가운데서 부활하게 하심으로 말미암아 우리를 거듭나게 하사 산 소망이 있게 하시며.\n(베드로전서 1:3)` },
        { id:236, category: "resurrection", title: "부활", order: 5, text: `주의 죽은 자들은 살아나고 그들의 시체들은 일어나리이다 티끌에 누운 자들아 너희는 깨어 노래하라 주의 이슬은 빛난 이슬이니 땅이 죽은 자들을 내놓으리로다.\n(이사야 26:19)` },
        { id:237, category: "resurrection", title: "부활", order: 6, text: `예수는 우리가 범죄한 것 때문에 내줌이 되고 또한 우리를 의롭다 하시기 위하여 살아나셨느니라.\n(로마서 4:25)` },
        { id:238, category: "resurrection", title: "부활", order: 7, text: `보라 내가 너희에게 비밀을 말하노니 우리가 다 잠 잘 것이 아니요 마지막 나팔에 순식간에 홀연히 다 변화되리니 나팔 소리가 나매 죽은 자들이 썩지 아니할 것으로 다시 살아나고 우리도 변화되리라.\n(고린도전서 15:51-52)` },
        { id:239, category: "eternallife", title: "영생", order: 1, text: `하나님이 세상을 이처럼 사랑하사 독생자를 주셨으니 이는 그를 믿는 자마다 멸망하지 않고 영생을 얻게 하려 하심이라.\n(요한복음 3:16)` },
        { id:240, category: "eternallife", title: "영생", order: 2, text: `내가 진실로 진실로 너희에게 이르노니 내 말을 듣고 또 나 보내신 이를 믿는 자는 영생을 얻었고 심판에 이르지 아니하나니 사망에서 생명으로 옮겼느니라.\n(요한복음 5:24)` },
        { id:241, category: "eternallife", title: "영생", order: 3, text: `땅의 티끌 가운데에서 자는 자 중에서 많은 사람이 깨어나 영생을 받는 자도 있겠고 수치를 당하여서 영원히 부끄러움을 당할 자도 있을 것이며 지혜 있는 자는 궁창의 빛과 같이 빛날 것이요 많은 사람을 옳은 데로 돌아오게 한 자는 별과 같이 영원토록 빛나리라.\n(다니엘 12:2-3)` },
        { id:242, category: "eternallife", title: "영생", order: 4, text: `영생은 곧 유일하신 참 하나님과 그가 보내신 자 예수 그리스도를 아는 것이니이다.\n(요한복음 17:3)` },
        { id:243, category: "eternallife", title: "영생", order: 5, text: `죄의 삯은 사망이요 하나님의 은사는 그리스도 예수 우리 주 안에 있는 영생이니라.\n(로마서 6:23)` },
        { id:244, category: "eternallife", title: "영생", order: 6, text: `헐몬의 이슬이 시온의 산들에 내림 같도다 거기서 여호와께서 복을 명령하셨나니 곧 영생이로다.\n(시편 133:3)` },
        { id:245, category: "eternallife", title: "영생", order: 7, text: `또 증거는 이것이니 하나님이 우리에게 영생을 주신 것과 이 생명이 그의 아들 안에 있는 그것이니라 아들이 있는 자에게는 생명이 있고 하나님의 아들이 없는 자에게는 생명이 없느니라 내가 하나님의 아들의 이름을 믿는 너희에게 이것을 쓴 것은 너희로 하여금 너희에게 영생이 있음을 알게 하려 함이라.\n(요한일서 5:11-13)` },
        { id:246, category: "word", title: "말씀", order: 1, text: `주의 말씀은 내 발에 등이요 내 길에 빛이니이다.\n(시편 119:105)` },
        { id:247, category: "word", title: "말씀", order: 2, text: `하나님의 말씀은 살아 있고 활력이 있어 좌우에 날선 어떤 검보다도 예리하여 혼과 영과 및 관절과 골수를 찔러 쪼개기까지 하며 또 마음의 생각과 뜻을 판단하나니.\n(히브리서 4:12)` },
        { id:248, category: "word", title: "말씀", order: 3, text: `모든 성경은 하나님의 감동으로 된 것으로 교훈과 책망과 바르게 함과 의로 교육하기에 유익하니 이는 하나님의 사람으로 온전하게 하며 모든 선한 일을 행할 능력을 갖추게 하려 함이라.\n(디모데후서 3:16-17)` },
        { id:249, category: "word", title: "말씀", order: 4, text: `이 율법책을 네 입에서 떠나지 말게 하며 주야로 그것을 묵상하여 그 안에 기록된 대로 다 지켜 행하라 그리하면 네 길이 평탄하게 될 것이며 네가 형통하리라.\n(여호수아 1:8)` },
        { id:250, category: "word", title: "말씀", order: 5, text: `비가 하늘로부터 내려서 그리로 되돌아가지 아니하고 땅을 적셔서 소출이 나게 하며 싹이 나게 하여 파종하는 자에게는 종자를 주며 먹는 자에게는 양식을 줌과 같이 내 입에서 나가는 말도 이와 같이 헛되이 내게로 되돌아오지 아니하고 나의 기뻐하는 뜻을 이루며 내가 보낸 일에 형통하리라.\n(이사야 55:10-11)` },
        { id:251, category: "word", title: "말씀", order: 6, text: `너희는 말씀을 행하는 자가 되고 듣기만 하여 자신을 속이는 자가 되지 말라.\n(야고보서 1:22)` },
        { id:252, category: "word", title: "말씀", order: 7, text: `청년이 무엇으로 그의 행실을 깨끗하게 하리이까 주의 말씀만 지킬 따름이니이다.\n(시편 119:9)` },
        { id:253, category: "worship", title: "예배", order: 1, text: `아버지께 참되게 예배하는 자들은 영과 진리로 예배할 때가 오나니 곧 이 때라 아버지께서는 자기에게 이렇게 예배하는 자들을 찾으시느니라 하나님은 영이시니 예배하는 자가 영과 진리로 예배할지니라.\n(요한복음 4:23-24)` },
        { id:254, category: "worship", title: "예배", order: 2, text: `그러므로 형제들아 내가 하나님의 모든 자비하심으로 너희를 권하노니 너희 몸을 하나님이 기뻐하시는 거룩한 산 제물로 드리라 이는 너희가 드릴 영적 예배니라.\n(로마서 12:1)` },
        { id:255, category: "worship", title: "예배", order: 3, text: `오라 우리가 굽혀 경배하며 우리를 지으신 여호와 앞에 무릎을 꿇자 그는 우리의 하나님이시요 우리는 그가 기르시는 백성이며 그의 손이 돌보시는 양이기 때문이라.\n(시편 95:6-7)` },
        { id:256, category: "worship", title: "예배", order: 4, text: `여호와께 그의 이름에 합당한 영광을 돌리며 거룩한 옷을 입고 여호와께 예배할지어다.\n(시편 29:2)` },
        { id:257, category: "worship", title: "예배", order: 5, text: `사무엘이 이르되 여호와께서 번제와 다른 제사를 그의 목소리를 청종하는 것을 좋아하심 같이 좋아하시겠나이까 순종이 제사보다 낫고 듣는 것이 숫양의 기름보다 나으니.\n(사무엘상 15:22)` },
        { id:258, category: "worship", title: "예배", order: 6, text: `그러므로 예물을 제단에 드리려다가 거기서 네 형제에게 원망들을 만한 일이 있는 것이 생각나거든 예물을 제단 앞에 두고 먼저 가서 형제와 화목하고 그 후에 와서 예물을 드리라.\n(마태복음 5:23-24)` },
        { id:259, category: "worship", title: "예배", order: 7, text: `또 무엇을 하든지 말에나 일에나 다 주 예수의 이름으로 하고 그를 힘입어 하나님 아버지께 감사하라.\n(골로새서 3:17)` },
        { id:260, category: "praise", title: "찬양", order: 1, text: `호흡이 있는 자마다 여호와를 찬양할지어다 할렐루야.\n(시편 150:6)` },
        { id:261, category: "praise", title: "찬양", order: 2, text: `이 백성은 내가 나를 위하여 지었나니 나를 찬송하게 하려 함이니라.\n(이사야 43:21)` },
        { id:262, category: "praise", title: "찬양", order: 3, text: `그러므로 우리는 예수로 말미암아 항상 찬송의 제사를 하나님께 드리자 이는 그 이름을 증언하는 입술의 열매니라.\n(히브리서 13:15)` },
        { id:263, category: "praise", title: "찬양", order: 4, text: `시와 찬송과 신령한 노래들로 서로 화답하며 너희의 마음으로 주께 노래하며 찬송하며.\n(에베소서 5:19)` },
        { id:264, category: "praise", title: "찬양", order: 5, text: `내가 여호와를 항상 송축함이여 내 입술로 항상 주를 찬양하리라 내 영혼이 여호와를 자랑하리니 곤고한 자들이 이를 듣고 기뻐하리로다.\n(시편 34:1-3)` },
        { id:265, category: "praise", title: "찬양", order: 6, text: `한밤중에 바울과 실라가 기도하고 하나님을 찬송하매 죄수들이 듣더라 이에 갑자기 큰 지진이 나서 옥터가 움직이고 문이 곧 다 열리며 모든 사람의 매인 것이 다 벗어진지라.\n(사도행전 16:25-26)` },
        { id:266, category: "praise", title: "찬양", order: 7, text: `내 영혼아 여호와를 송축하라 내 속에 있는 것들아 다 그의 거룩한 이름을 송축하라 내 영혼아 여호와를 송축하며 그의 모든 은택을 잊지 말지어다.\n(시편 103:1-2)` },
        { id:267, category: "service", title: "섬김", order: 1, text: `인자가 온 것은 섬김을 받으려 함이 아니라 도리어 섬기려 하고 자기 목숨을 많은 사람의 대속물로 주려 함이니라.\n(마가복음 10:45)` },
        { id:268, category: "service", title: "섬김", order: 2, text: `내가 주와 또는 선생이 되어 너희 발을 씻었으니 너희도 서로 발을 씻어 주는 것이 옳으니라 내가 너희에게 행한 것 같이 너희도 행하게 하려 하여 본을 보였노라.\n(요한복음 13:14-15)` },
        { id:269, category: "service", title: "섬김", order: 3, text: `이스라엘아 네 하나님 여호와께서 네게 요구하시는 것이 무엇이냐 곧 네 하나님 여호와를 경외하여 그의 모든 도를 행하고 그를 사랑하며 마음을 다하고 뜻을 다하여 네 하나님 여호와를 섬기고.\n(신명기 10:12)` },
        { id:270, category: "service", title: "섬김", order: 4, text: `형제들아 너희가 자유를 위하여 부르심을 입었으나 그러나 그 자유로 육체의 기회를 삼지 말고 오직 사랑으로 서로 종 노릇 하라.\n(갈라디아서 5:13)` },
        { id:271, category: "service", title: "섬김", order: 5, text: `각각 은사를 받은 대로 하나님의 여러 가지 은혜를 맡은 선한 청지기 같이 서로 봉사하라 만일 누가 말하려면 하나님의 말씀을 하는 것 같이 하고 누가 봉사하려면 하나님이 공급하시는 힘으로 하는 것 같이 하라.\n(베드로전서 4:10-11)` },
        { id:272, category: "service", title: "섬김", order: 6, text: `오직 유익을 구하지 말고 오직 너희 각 사람이 마음을 다하여 여호와를 섬기며 여호와께서 이스라엘 가운데서 행하신 위대한 일들을 기억하며 마음을 다하고 성품을 다하여 주를 섬기라.\n(여호수아 22:5)` },
        { id:273, category: "service", title: "섬김", order: 7, text: `너희는 오직 여호와를 경외하며 너희를 위하여 행하신 그 큰 일을 생각하여 너희의 마음을 다하여 진실히 섬기라.\n(사무엘상 12:24)` },
        { id:274, category: "humility", title: "겸손", order: 1, text: `교만은 패망의 선봉이요 거만한 마음은 넘어짐의 앞잡이니라 겸손한 자와 함께 하여 마음을 낮추는 것이 교만한 자와 함께 하여 탈취물을 나누는 것보다 나으니라.\n(잠언 16:18-19)` },
        { id:275, category: "humility", title: "겸손", order: 2, text: `아무 일에든지 다툼이나 허영으로 하지 말고 오직 겸손한 마음으로 각각 자기보다 남을 낫게 여기고 각각 자기 일을 돌볼뿐더러 또한 각각 다른 사람들의 일을 돌보아 나의 기쁨을 충만하게 하라.\n(빌립보서 2:3-5)` },
        { id:276, category: "humility", title: "겸손", order: 3, text: `주 앞에서 낮추라 그리하면 주께서 너희를 높이시리라.\n(야고보서 4:10)` },
        { id:277, category: "humility", title: "겸손", order: 4, text: `사람아 주께서 선한 것이 무엇임을 네게 보이셨나니 여호와께서 네게 구하시는 것은 오직 정의를 행하며 인자를 사랑하며 겸손하게 네 하나님과 함께 행하는 것이 아니냐.\n(미가 6:8)` },
        { id:278, category: "humility", title: "겸손", order: 5, text: `사람의 마음의 교만은 멸망의 선봉이요 겸손은 존귀의 길잡이니라.\n(잠언 18:12)` },
        { id:279, category: "humility", title: "겸손", order: 6, text: `젊은 자들아 이와 같이 장로들에게 순종하고 다 서로 겸손으로 허리를 동이라 하나님은 교만한 자를 대적하시되 겸손한 자들에게는 은혜를 주시느니라.\n(베드로전서 5:5-6)` },
        { id:280, category: "humility", title: "겸손", order: 7, text: `온유한 자를 정의로 지도하심이여 겸손한 자에게 그의 도를 가르치시리로다.\n(시편 25:9)` },
        { id:281, category: "ten_commandments", title: "십계명", order: 1, text: `너는 나 외에는 다른 신들을 네게 두지 말라.\n(출애굽기 20:3)` },
        { id:282, category: "ten_commandments", title: "십계명", order: 2, text: `너를 위하여 새긴 우상을 만들지 말고 또 위로 하늘에 있는 것이나 아래로 땅에 있는 것이나 땅 아래 물 속에 있는 것의 어떤 형상도 만들지 말며 그것들에게 절하지 말며 그것들을 섬기지 말라.\n(출애굽기 20:4-5)` },
        { id:283, category: "ten_commandments", title: "십계명", order: 3, text: `너는 네 하나님 여호와의 이름을 망령되게 부르지 말라 여호와는 그의 이름을 망령되게 부르는 자를 죄 없다 하지 아니하리라.\n(출애굽기 20:7)` },
        { id:284, category: "ten_commandments", title: "십계명", order: 4, text: `안식일을 기억하여 거룩하게 지키라 엿새 동안은 힘써 네 모든 일을 행할 것이나 일곱째 날은 네 하나님 여호와의 안식일인즉 아무 일도 하지 말라.\n(출애굽기 20:8-10)` },
        { id:285, category: "ten_commandments", title: "십계명", order: 5, text: `네 부모를 공경하라 그리하면 네 하나님 여호와가 네게 준 땅에서 네 생명이 길리라.\n(출애굽기 20:12)` },
        { id:286, category: "ten_commandments", title: "십계명", order: 6, text: `살인하지 말라.\n(출애굽기 20:13)` },
        { id:287, category: "ten_commandments", title: "십계명", order: 7, text: `간음하지 말라.\n(출애굽기 20:14)` },
        { id:288, category: "ten_commandments", title: "십계명", order: 8, text: `도둑질하지 말라.\n(출애굽기 20:15)` },
        { id:289, category: "ten_commandments", title: "십계명", order: 9, text: `네 이웃에 대하여 거짓 증거하지 말라.\n(출애굽기 20:16)` },
        { id:290, category: "ten_commandments", title: "십계명", order: 10, text: `네 이웃의 집을 탐내지 말라 네 이웃의 아내나 그의 남종이나 그의 여종이나 그의 소나 그의 나귀나 무릇 네 이웃의 소유를 탐내지 말라.\n(출애굽기 20:17)` }
    ];

        // 카테고리별로 일반인용 감성 글귀 자동 매칭 함수
        function getGeneralMessage(category) {
            const messages = {

        document.addEventListener("DOMContentLoaded", () => {
            // 1. 유저 상태 확인 (교회 가입 여부)
            const churchId = localStorage.getItem("yetalkMyChurchId") || localStorage.getItem("currentChurchId");
            const isBeliever = churchId && churchId !== "yetalk" && churchId.trim() !== "";

            // DOM 요소
            const mainCard = document.getElementById("mainCard");
            const welcomeTitle = document.getElementById("welcomeTitle");
            const welcomeText = document.getElementById("welcomeText");
            const todayBtn = document.getElementById("todayBtn");
            const headerImage = document.getElementById("headerImage");

            // ⭐ 2. 상단 배경 이미지 무작위로 뽑기 (0번 ~ 10번, 총 11장)
            const randomImgNum = Math.floor(Math.random() * 11);
            headerImage.style.backgroundImage = `url('images/todayword/${randomImgNum}.jpg')`;

            // 3. 화면 초기 세팅
            if (isBeliever) {
                welcomeTitle.innerHTML = "⛪ 온라인 우리교회와<br>소모임을 만드는<br>예톡에 오신 것을 환영합니다.";
                welcomeText.innerHTML = "🙏 하나님께서 기뻐하시는<br>예배와 기도의 공간이<br>되기를 기도합니다.<br><br>📖 오늘 첫 시간,<br>주시는 말씀을 받아 보세요.";
                todayBtn.innerHTML = "📖 오늘의 말씀 받기";
            } else {
                mainCard.classList.add("general-mode");
                welcomeTitle.innerHTML = "🌱 따뜻한 소통과<br>일상의 나눔이 있는<br>예톡에 오신 것을 환영합니다.";
                welcomeText.innerHTML = "✨ 바쁜 일상 속에서<br>잠시 쉬어갈 수 있는<br>작은 안식처가 되길 바랍니다.<br><br>💌 오늘 하루,<br>당신을 위한 한마디를 받아보세요.";
                todayBtn.innerHTML = "💌 오늘의 한마디 받기";
            }

            // 4. 말씀 뽑기 및 이동 (무작위 러시안 룰렛 로직!)
            todayBtn.addEventListener("click", function() {
                // 버튼 누를 때마다 270개 중 하나를 무작위로 뽑기
                const randomIndex = Math.floor(Math.random() * todayword.length);
                const selectedWord = todayword[randomIndex];

                localStorage.setItem("todayWord", "yes");

                if (isBeliever) {
                    // 성경 구절 분리 저장
                    const lines = selectedWord.text.split('\n');
                    const verseText = lines[0].trim();
                    const verseRef = lines.length > 1 ? lines[1].trim() : selectedWord.title;

                    localStorage.setItem("todayVerse", verseRef);
                    localStorage.setItem("todayText", verseText);
                } else {
                    // 자동 매칭된 일반인용 텍스트 저장
                    const generalMsg = getGeneralMessage(selectedWord.category);
                    localStorage.setItem("todayVerse", generalMsg.title);
                    localStorage.setItem("todayText", generalMsg.text);
                }

                location.href = "index.html";
            });
        });
